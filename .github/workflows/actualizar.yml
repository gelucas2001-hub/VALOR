# Guardar en:  .github/workflows/actualizar.yml
name: Actualizar partidos

on:
  schedule:
    # 09:00 y 15:00 hora Argentina (UTC-3) → 12:00 y 18:00 UTC
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:        # botón para correrlo a mano cuando quieras

permissions:
  contents: write

# Los dos workflows escriben data/ y sus crons coinciden en el minuto
# cero de las 12:00 y las 18:00 UTC. `foto_props.yml` ya se defendia;
# este no, y era el que mas tiene para perder: si la foto pushea entre
# el checkout y el push de aca, este `git push` rebota por
# non-fast-forward y se pierde la corrida entera — seis horas de datos
# hasta la siguiente.
concurrency:
  group: escribe-data
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Traer datos y calcular lambdas
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python actualizar.py

      - name: Guardar cambios
        run: |
          git config user.name  "valor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "sin cambios" && exit 0
          git commit -m "datos: $(date -u '+%Y-%m-%d %H:%M')"
          # La foto horaria puede haber pusheado mientras corriamos.
          git pull --rebase --autostash
          git push
