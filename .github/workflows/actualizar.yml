# Guardar en:  .github/workflows/actualizar.yml
name: Actualizar partidos

on:
  schedule:
    # 09:00 y 15:00 hora Argentina (UTC-3) → 12:00 y 18:00 UTC
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:        # botón para correrlo a mano cuando quieras

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Traer datos y calcular lambdas
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python actualizar.py

      - name: Guardar cambios
        run: |
          git config user.name  "valor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "datos: $(date -u '+%Y-%m-%d %H:%M')"
          git push
