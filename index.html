<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VALOR · Asesor Deportivo Inteligente</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────
   VALOR — Apple Sports & Minimalist-UI Architecture
   ───────────────────────────────────────────────────────── */
:root {
  --bg-app: #000000;
  --bg-group: #161618;
  --bg-card: #1C1C1E;
  --bg-card-hover: #242428;
  --bg-input: #121214;
  --bg-pill: rgba(255, 255, 255, 0.08);
  
  --border: rgba(255, 255, 255, 0.08);
  --border-subtle: rgba(255, 255, 255, 0.05);
  --border-focus: #00D2FF;
  
  --text-main: #FFFFFF;
  --text-muted: #8E8E93;
  --text-subtle: #636366;
  
  --cyan: #00D2FF;
  --cyan-wash: rgba(0, 210, 255, 0.12);
  
  --emerald: #30D158;
  --emerald-wash: rgba(48, 209, 88, 0.12);
  
  --amber: #FF9F0A;
  --coral: #FF453A;
  
  --r-group: 22px;
  --r-card: 16px;
  --r-md: 12px;
  --r-sm: 8px;
  --r-pill: 999px;
  --pad: 16px;
  
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", "Menlo", monospace;
  
  --ease-touch: cubic-bezier(0.16, 1, 0.3, 1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: radial-gradient(120% 60% at 50% 0%, #061122 0%, #000000 70%), #000000;
  background-attachment: fixed;
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  letter-spacing: -0.015em;
  padding-bottom: 96px;
  overscroll-behavior-y: contain;
  -webkit-font-smoothing: antialiased;
  max-width: 560px;
  margin: 0 auto;
  min-height: 100dvh;
  position: relative;
  border-left: 1px solid var(--border-subtle);
  border-right: 1px solid var(--border-subtle);
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { background: none; border: none; padding: 0; cursor: pointer; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow {
  font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  font-weight: 700; color: var(--text-muted);
}

/* ── Encabezado Principal Apple Sports ── */
header.top {
  position: sticky; top: 0; z-index: 40;
  background: rgba(6, 17, 34, 0.85);
  backdrop-filter: blur(24px);
  padding: calc(env(safe-area-inset-top) + 12px) var(--pad) 12px;
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; justify-content: space-between; }
.brand-title { display: flex; align-items: center; gap: 8px; }
.brand h1 {
  margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.04em;
  color: #FFFFFF;
}
.brand-badge {
  font-size: 11.5px; font-weight: 700; padding: 5px 12px; border-radius: var(--r-pill);
  background: var(--bg-pill); color: var(--text-main); border: 1px solid var(--border);
  display: inline-flex; align-items: center; gap: 6px;
}

/* ── Selector de Fechas Apple (Text Switcher) ── */
.date-switcher-apple {
  display: flex; align-items: center; justify-content: center;
  gap: 16px; padding: 12px var(--pad) 14px;
}
.date-tab-apple {
  background: none; border: none; font-size: 14px; font-weight: 600;
  color: var(--text-muted); padding: 6px 14px; border-radius: var(--r-pill);
  transition: all 140ms ease; cursor: pointer;
}
.date-tab-apple:hover { color: #FFFFFF; }
.date-tab-apple.on {
  color: #FFFFFF; font-weight: 700; background: var(--bg-pill);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

/* ── Cartelera de Partidos (Grouped Inset Box) ── */
.wrap { padding: 4px var(--pad) 0; }
.league-section { margin-bottom: 22px; }
.league-section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 6px 10px;
}
.league-section-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-muted);
}
.league-section-count {
  font-size: 11px; font-weight: 600; color: var(--text-subtle);
  text-transform: uppercase; letter-spacing: 0.05em;
}

.match-group-card {
  background: var(--bg-group);
  border: 1px solid var(--border);
  border-radius: var(--r-group);
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

.match-row-apple {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 16px 14px;
  cursor: pointer;
  transition: background-color 140ms ease;
  position: relative;
}
.match-row-apple:hover { background-color: var(--bg-card); }
.match-row-apple:active { background-color: var(--bg-card-hover); }

.team-col-left {
  display: flex; align-items: center; gap: 12px; min-width: 0;
}
.team-col-left .team-name {
  font-size: 15px; font-weight: 700; color: #FFFFFF;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.team-col-left .team-sub {
  font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted);
  font-weight: 500; margin-top: 1px;
}

.match-center-col {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 0 10px; text-align: center; min-width: 90px;
}
.match-time-apple {
  font-family: var(--font-mono); font-size: 13.5px; font-weight: 700;
  color: #FFFFFF; letter-spacing: -0.02em;
}
.match-line-badge {
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 700;
  color: var(--cyan); background: var(--cyan-wash);
  border: 1px solid rgba(0, 210, 255, 0.25);
  padding: 2px 7px; border-radius: var(--r-pill);
  white-space: nowrap;
}
.match-line-badge.green {
  color: var(--emerald); background: var(--emerald-wash);
  border-color: rgba(48, 209, 88, 0.25);
}

.team-col-right {
  display: flex; align-items: center; justify-content: flex-end;
  gap: 12px; text-align: right; min-width: 0;
}
.team-col-right .team-name {
  font-size: 15px; font-weight: 700; color: #FFFFFF;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.team-col-right .team-sub {
  font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted);
  font-weight: 500; margin-top: 1px;
}

.match-divider-apple {
  height: 0.5px; background: var(--border-subtle); margin: 0 14px;
}

.crest { width: 34px; height: 34px; object-fit: contain; flex: 0 0 auto; }
.crest.lg { width: 56px; height: 56px; }
.crest.sm { width: 22px; height: 22px; }
.crest-fallback {
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--text-muted);
  font-family: var(--font-mono); flex: 0 0 auto;
}
.crest-fallback.lg { width: 56px; height: 56px; font-size: 16px; }
.crest-fallback.sm { width: 22px; height: 22px; font-size: 9.5px; }

/* ── Centro de Partido (Match Hub) ── */
.btn-back {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13.5px; font-weight: 600; color: var(--text-muted);
  padding: 6px 0; min-height: 38px; transition: color 120ms ease;
}
.btn-back:hover { color: #FFFFFF; }

.match-billboard {
  padding: 14px var(--pad) 20px; text-align: center;
}
.billboard-comp {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 16px;
}
.billboard-teams {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  gap: 12px; margin-bottom: 12px;
}
.billboard-team {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.billboard-team-name {
  font-size: 16px; font-weight: 800; color: #FFFFFF; line-height: 1.2;
}
.billboard-team-xg {
  font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);
  font-weight: 600;
}
.billboard-time-center {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.billboard-kickoff {
  font-family: var(--font-mono); font-size: 20px; font-weight: 800; color: #FFFFFF;
}

/* ── Golden Verdict Card (La Oportunidad Clave) ── */
.golden-verdict-card {
  margin: 0 var(--pad) 16px;
  background: var(--bg-card);
  border: 1px solid rgba(0, 210, 255, 0.35);
  border-radius: 20px;
  padding: 20px 18px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
  position: relative;
  overflow: hidden;
}
.golden-verdict-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--cyan), var(--emerald));
}
.golden-tag {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: 6px;
}
.golden-pick-title {
  font-size: 22px;
  font-weight: 800;
  color: #FFFFFF;
  line-height: 1.2;
  margin-bottom: 14px;
}
.golden-metrics-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 12px 8px;
  margin-bottom: 14px;
}
.golden-metric { text-align: center; }
.golden-metric small {
  display: block; font-size: 10px; font-weight: 600;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px;
}
.golden-metric b {
  display: block; font-family: var(--font-mono); font-size: 16px; font-weight: 700;
}
.golden-metric b.cyan { color: var(--cyan); }
.golden-metric b.green { color: var(--emerald); }

.golden-argument {
  font-size: 13.5px; line-height: 1.6; color: var(--text-muted); margin: 0 0 14px;
}
.golden-bank-bar {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg-input); border: 1px solid var(--border-subtle);
  border-radius: 12px; padding: 12px 14px;
}

/* ── Pestañas en Detalle ── */
.subtabs-pill-wrap { padding: 4px var(--pad) 0; }
.subtabs-pill {
  display: flex; gap: 4px; background: var(--bg-input); padding: 4px;
  border-radius: var(--r-pill); border: 1px solid var(--border);
}
.subtab-pill {
  flex: 1; padding: 8px 6px; font-size: 12px; font-weight: 700; color: var(--text-muted);
  border-radius: var(--r-pill); text-align: center; transition: all 140ms ease;
  min-height: 38px; display: flex; align-items: center; justify-content: center;
}
.subtab-pill.on {
  background: #FFFFFF; color: #000000; font-weight: 800;
  box-shadow: 0 2px 8px rgba(255, 255, 255, 0.15);
}

/* ── Tablero Deportivo de Mercados (Sleek Betting Board) ── */
.market-block {
  background: var(--bg-group);
  border: 1px solid var(--border);
  border-radius: var(--r-group);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}
.market-block-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
}
.grid-3-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grid-2-col { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

.odds-card-cell {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-md);
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
  transition: border-color 140ms ease, background-color 140ms ease;
}
.odds-card-cell:focus-within {
  border-color: var(--cyan);
  background: var(--bg-card-hover);
}
.odds-card-cell.has-val {
  border-color: rgba(0, 210, 255, 0.4);
  background: linear-gradient(180deg, rgba(0, 210, 255, 0.08), var(--bg-card));
}

.odds-cell-header {
  display: flex; justify-content: space-between; align-items: center;
  gap: 4px; min-height: 24px;
}
.odds-label-name {
  font-size: 13px; font-weight: 700; color: var(--text-main);
  line-height: 1.2; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; flex: 1; text-align: left;
}
.cell-combo-btn {
  font-size: 12px; font-weight: 800; color: var(--text-muted);
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border);
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 120ms ease; cursor: pointer;
}
.cell-combo-btn:active { transform: scale(0.88); }
.cell-combo-btn.on {
  background: var(--cyan); color: #000000; border-color: var(--cyan); font-weight: 800;
}

.odds-cell-metrics {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-mono); font-size: 11px;
}
.odds-prob-badge { color: var(--emerald); font-weight: 700; }
.odds-fair-text { color: var(--text-subtle); }

.odds-target-rule {
  background: rgba(0, 210, 255, 0.08);
  border: 1px solid rgba(0, 210, 255, 0.22);
  border-radius: var(--r-sm);
  padding: 4px 6px; font-size: 11px; color: var(--cyan);
  font-family: var(--font-mono); font-weight: 700; text-align: center;
}

.odds-input-pill {
  width: 100%; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 6px 4px; font-family: var(--font-mono);
  font-size: 13px; font-weight: 700; text-align: center; color: var(--text-main);
  transition: all 120ms ease;
}
.odds-input-pill:focus {
  outline: none; border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(0, 210, 255, 0.25);
}

.btn-card-combo {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--border); color: var(--text-muted);
  font-size: 11px; font-weight: 700; padding: 5px 10px;
  border-radius: var(--r-pill); display: inline-flex;
  align-items: center; gap: 4px; transition: all 120ms ease;
  min-height: 26px; cursor: pointer;
}
.btn-card-combo:active { transform: scale(0.92); }
.btn-card-combo.on {
  background: var(--cyan); color: #03131F; border-color: var(--cyan); font-weight: 800;
}

.filters {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px;
}
.filters::-webkit-scrollbar { display: none; }
.chip {
  padding: 8px 14px; border-radius: var(--r-pill); background: var(--bg-group);
  border: 1px solid var(--border); color: var(--text-muted); font-size: 12.5px;
  font-weight: 700; cursor: pointer; white-space: nowrap; display: inline-flex;
  align-items: center; gap: 6px; transition: all 120ms ease;
}
.chip:active { transform: scale(0.96); }
.chip.on {
  background: #FFFFFF; color: #000000; border-color: #FFFFFF;
  box-shadow: 0 2px 10px rgba(255, 255, 255, 0.15);
}

.badge-ev.pos {
  background: var(--cyan-wash); color: var(--cyan);
  border: 1px solid rgba(0, 210, 255, 0.3);
}
.badge-ev.neg { background: rgba(255, 255, 255, 0.05); color: var(--text-subtle); }

/* ── Tablas de Posiciones & Promedios ── */
.standings-pills {
  display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 12px; scrollbar-width: none;
}
.standings-pill {
  padding: 8px 16px; border-radius: var(--r-pill); border: 1px solid var(--border);
  background: var(--bg-input); font-size: 12px; font-weight: 700; color: var(--text-muted);
  white-space: nowrap; transition: all 120ms ease; min-height: 38px; display: inline-flex; align-items: center;
}
.standings-pill.on { background: #FFFFFF; color: #000000; font-weight: 800; border-color: #FFFFFF; }

.standings-table {
  width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px;
}
.standings-table th {
  text-align: center; padding: 8px 4px; font-size: 10.5px; color: var(--text-muted);
  border-bottom: 1px solid var(--border); text-transform: uppercase;
}
.standings-table th.left, .standings-table td.left { text-align: left; }
.standings-table td {
  padding: 9px 4px; text-align: center; border-bottom: 1px solid var(--border-subtle);
  font-family: var(--font-mono); font-size: 12.5px;
}
.standings-table tr.highlight { background: rgba(0, 210, 255, 0.12); font-weight: 700; }
.standings-table tr.highlight td.team-cell span { color: var(--cyan); font-weight: 700; }

.team-cell {
  display: flex; align-items: center; gap: 8px; font-family: var(--font-sans);
  font-size: 13px; font-weight: 600; text-align: left;
}

/* ── Pestaña de Rendimiento ── */
.tracker-container { padding: 14px var(--pad) 0; }
.perf-header { margin-bottom: 14px; }
.perf-header h2 { margin: 0; font-size: 22px; font-weight: 800; }
.perf-header p { margin: 4px 0 0; font-size: 13px; color: var(--text-muted); }

.perf-card {
  background: var(--bg-group); border: 1px solid var(--border); border-radius: var(--r-group);
  padding: 18px 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); margin-bottom: 16px;
}
.perf-stat-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.perf-big-pct { font-family: var(--font-mono); font-size: 32px; font-weight: 700; color: var(--cyan); }
.perf-boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.perf-box {
  background: var(--bg-input); border: 1px solid var(--border-subtle);
  border-radius: var(--r-md); padding: 10px 8px; text-align: center;
}
.perf-box small { font-size: 9.5px; text-transform: uppercase; color: var(--text-subtle); display: block; font-weight: 600; }
.perf-box b { font-family: var(--font-mono); font-size: 16px; font-weight: 600; display: block; margin-top: 2px; }

/* ── Boleta de Combinadas Limpia ── */
.combo-slip-card {
  background: var(--bg-group); border: 1px solid var(--border); border-radius: var(--r-group);
  padding: 18px 16px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}
.combo-leg-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--bg-card); padding: 10px 12px; border-radius: var(--r-md);
  border: 1px solid var(--border-subtle); margin-bottom: 8px;
}
.market-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--bg-group); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 12px 14px; margin-bottom: 8px; transition: all 120ms ease;
}
.market-row:hover { background: var(--bg-card-hover); }
.btn-add-combo {
  background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border);
  color: var(--text-main); font-size: 12px; font-weight: 700; padding: 6px 12px;
  border-radius: var(--r-pill); cursor: pointer; white-space: nowrap; transition: all 120ms ease;
}
.btn-add-combo:active { transform: scale(0.95); }
.btn-add-combo.on { background: var(--cyan); color: #000000; border-color: var(--cyan); font-weight: 800; }

.btn-primary {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 14px 18px; border-radius: var(--r-pill);
  background: #FFFFFF; color: #000000; font-size: 14.5px; font-weight: 800;
  box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15);
  transition: transform 120ms ease; min-height: 48px;
}
.btn-primary:active { transform: scale(0.98); }
.btn-save-pick {
  background: var(--cyan-wash); border: 1px solid rgba(0, 210, 255, 0.35); color: var(--cyan);
  font-weight: 700; font-size: 12px; padding: 6px 12px; border-radius: var(--r-pill);
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
}
.btn-save-pick:active { transform: scale(0.97); }

/* ── Barra de Navegación Flotante Apple ── */
nav.bottom-nav {
  position: fixed; bottom: calc(env(safe-area-inset-bottom) + 12px);
  left: 50%; transform: translateX(-50%);
  max-width: 520px; width: calc(100% - 24px); z-index: 50;
  background: rgba(18, 18, 20, 0.94);

<script>
/* ═══════════════════════════════════════════════════════════
   VALOR — Motor Cuantitativo & Gestión de Datos
   ═══════════════════════════════════════════════════════════ */

const _mem = {};
const store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k); if(r) return JSON.parse(r.value); } }catch(e){}
    try{ const v = localStorage.getItem("valor:"+k); if(v!=null) return JSON.parse(v); }catch(e){}
    return _mem[k] ?? null;
  },
  async set(k,v){
    _mem[k]=v;
    try{ if(window.storage){ await window.storage.set(k, JSON.stringify(v)); return; } }catch(e){}
    try{ localStorage.setItem("valor:"+k, JSON.stringify(v)); }catch(e){}
  }
};

/* ── Matemática Dixon-Coles ── */
const fact = n => { let r=1; for(let i=2;i<=n;i++) r*=i; return r; };
const pois = (k,l) => Math.exp(-l)*Math.pow(l,k)/fact(k);

function tau(i,j,lh,la,rho){
  if(i===0&&j===0) return 1 - lh*la*rho;
  if(i===0&&j===1) return 1 + lh*rho;
  if(i===1&&j===0) return 1 + la*rho;
  if(i===1&&j===1) return 1 - rho;
  return 1;
}

function matrix(lh,la,rho,max=9){
  const m=[]; let tot=0;
  for(let i=0;i<=max;i++){ m[i]=[];
    for(let j=0;j<=max;j++){ const p=pois(i,lh)*pois(j,la)*tau(i,j,lh,la,rho); m[i][j]=p; tot+=p; }
  }
  for(let i=0;i<=max;i++) for(let j=0;j<=max;j++) m[i][j]/=tot;
  return m;
}
const sumIf = (m,f) => { let s=0; for(let i=0;i<m.length;i++) for(let j=0;j<m.length;j++) if(f(i,j)) s+=m[i][j]; return s; };

/* ── Finanzas y Valor Esperado ── */
const ev            = (p,o) => p*o - 1;
const fair          = p => p>0 ? 1/p : Infinity;
const minTargetOdds = (p, minEv = (S?.minEv||0.05)) => p>0 ? (1 + minEv)/p : Infinity;
const kelly         = (p,o) => { const b=o-1; if(b<=0) return 0; return Math.max(0,(p*b-(1-p))/b); };

function derive(M,cfg){
  const ht = matrix(cfg.lh*0.45, cfg.la*0.45, cfg.rho, 6);
  const out = [];
  const add = (g,label,p,push=0,test=null) => out.push({g,label,p,push,test,id:g+"|"+label});

  add("1X2","Gana local",            sumIf(M,(i,j)=>i>j),  0, (i,j)=>i>j);
  add("1X2","Empate",                sumIf(M,(i,j)=>i===j),0, (i,j)=>i===j);
  add("1X2","Gana visitante",        sumIf(M,(i,j)=>i<j),  0, (i,j)=>i<j);
  add("Doble","Doble oportunidad 1X",sumIf(M,(i,j)=>i>=j), 0, (i,j)=>i>=j);
  add("Doble","Doble oportunidad X2",sumIf(M,(i,j)=>i<=j), 0, (i,j)=>i<=j);
  add("Doble","Doble oportunidad 12",sumIf(M,(i,j)=>i!==j),0, (i,j)=>i!==j);
  [0.5,1.5,2.5,3.5].forEach(n=>{
    add("Goles","Más de "+n+" goles",  sumIf(M,(i,j)=>i+j>n), 0, (i,j)=>i+j>n);
    add("Goles","Menos de "+n+" goles",sumIf(M,(i,j)=>i+j<n), 0, (i,j)=>i+j<n);
  });
  add("Ambos","Ambos marcan — sí",sumIf(M,(i,j)=>i>0&&j>0),   0, (i,j)=>i>0&&j>0);
  add("Ambos","Ambos marcan — no",sumIf(M,(i,j)=>i===0||j===0),0, (i,j)=>i===0||j===0);
  [0.5,1.5,2.5].forEach(n=>{
    add("Equipo","Local más de "+n,    sumIf(M,(i)=>i>n),   0, (i,j)=>i>n);
    add("Equipo","Visitante más de "+n,sumIf(M,(i,j)=>j>n), 0, (i,j)=>j>n);
  });
  add("1T","1T más de 0.5 goles", sumIf(ht,(i,j)=>i+j>0.5));
  add("1T","1T menos de 0.5 goles",sumIf(ht,(i,j)=>i+j<0.5));
  add("1T","1T más de 1.5 goles", sumIf(ht,(i,j)=>i+j>1.5));
  add("1T","Gana local al descanso",sumIf(ht,(i,j)=>i>j));

  const marcador = (mx,cap,grupo) => {
    for(let i=0;i<=cap;i++) for(let j=0;j<=cap;j++) add(grupo, i+"-"+j, mx[i][j]);
  };
  marcador(M,3,"Marcador");

  const dnbH = sumIf(M,(i,j)=>i>j), dnbA = sumIf(M,(i,j)=>i<j), dnbDraw = sumIf(M,(i,j)=>i===j);
  if(dnbH+dnbA>0){
    add("DNB","DNB local",    dnbH/(dnbH+dnbA), dnbDraw);
    add("DNB","DNB visitante",dnbA/(dnbH+dnbA), dnbDraw);
  }
  return out;
}

/* ── Estado Global ── */
let S = { bank:100000, minEv:0.04, maxOdds:4.5, casa:"Bet365", caps:true };
let MATCHES = [];
let ODDS = {};
let LOG = [];
let COMBO = [];
let TABLAS = {};
let ANALISIS = {};
let METHOD_STEP = 0;

let TOAST_TIMER = null;
let LAST_COMBO_BACKUP = null;
let BOOT_ERROR = null;
let IS_BOOTING = true;

function showToast(msg, undoAction = null) {
  const container = document.getElementById("toast-container");
  if (!container) return;
  if (TOAST_TIMER) clearTimeout(TOAST_TIMER);
  
  container.innerHTML = `
    <div class="toast">
      <span>${esc(msg)}</span>
      ${undoAction ? `<button class="toast-undo-btn" id="toast-undo">Deshacer</button>` : ""}
    </div>
  `;
  if (undoAction) {
    const btn = document.getElementById("toast-undo");
    if (btn) {
      btn.onclick = () => {
        undoAction();
        container.innerHTML = "";
      };
    }
  }
  TOAST_TIMER = setTimeout(() => {
    container.innerHTML = "";
  }, 4000);
}

let VIEW = {
  tab:"fecha",
  matchId:null,
  day:null,
  filter:"todos",
  sortBy:"ev",
  subtab:"mercados",
  mktCategory:"populares",
  perfFilter:"todos",
  standingsTab:"auto"
};
const closedComps = new Set();

function kellyFracFor(c){
  if(c>=72) return {f:0.25, name:"1/4 Kelly"};
  if(c>=60) return {f:0.125, name:"1/8 Kelly"};
  if(c>=50) return {f:0.0625, name:"1/16 Kelly"};
  return {f:0.005, name:"Monto fijo 0.5%"};
}

/* Evaluación de mercados con cuota personalizada del usuario */
function evaluate(mkts, S, m){
  const conf = m?.conf ?? 65;
  const kf = kellyFracFor(conf);
  const maxStakePct = 0.04; 

  return mkts.map(x=>{
    const userOdd = ODDS[m?.id+"__"+x.id];
    const isCustom = userOdd && userOdd > 1;
    if(!isCustom){
      return {...x, o:null, isCustom:false, e:null, stake:0, solid:false};
    }
    const o = userOdd;
    const e = x.push ? (x.p*(o-1) - (1-x.p-x.push)) : ev(x.p, o);
    const k = kelly(x.p, o);
    const rawStake = Math.round(S.bank * k * kf.f);
    const maxStake = Math.round(S.bank * maxStakePct);
    const stake = e>=S.minEv ? Math.min(rawStake, maxStake) : 0;
    return {...x, o, isCustom:true, userOdd, e, stake, k, solid: e>=S.minEv};
  });
}

function model(m){
  const rho = /profesional/i.test(m.comp) ? 0.05 : 0.0;
  const M = matrix(m.lh, m.la, rho);
  const raw = derive(M, {lh:m.lh, la:m.la, rho});
  const mkts = evaluate(raw, S, m);
  return {M, mkts, raw};
}

function getTopModelProjections(m, mkts){
  const valid = mkts.filter(x=>x.p>=0.30 && !x.id.startsWith("Marcador|"));
  valid.sort((a,b)=>b.p-a.p);
  return valid.slice(0, 3);
}

function generarArgumento(m, best, topProj){
  const an = ANALISIS[m.id];
  if(an?.veredicto) return an.veredicto;

  if(best && best.e !== null && best.e >= S.minEv) {
    return `Detectamos ventaja de +${Math.round(best.e*100)}% en "${best.label}". El modelo estima ${Math.round(best.p*100)}% de probabilidad (cuota justa @${fair(best.p).toFixed(2)}) frente a tu cuota cargada de @${best.o.toFixed(2)}.`;
  }
  
  if(topProj && topProj.length) {
    const p1 = topProj[0];
    const targetMin = minTargetOdds(p1.p).toFixed(2);
    return `El modelo proyecta a ${m.home} con ${m.lh.toFixed(1)} xG y a ${m.away} con ${m.la.toFixed(1)} xG. La jugada recomendada es "${p1.label}" (${Math.round(p1.p*100)}% de probabilidad). Conviene apostar si en tu casa de apuestas encontrás una cuota de @${targetMin} o superior.`;
  }

  return `Partido por ${m.comp}. Estimamos un promedio de ${m.lh.toFixed(1)} goles para ${m.home} y ${m.la.toFixed(1)} para ${m.away}.`;
}

function getMatchDays() {
  const dates = [...new Set(MATCHES.map(m=>m.date))].sort();
  const hoyIso = new Date().toISOString().slice(0,10);
  if(!dates.length) return [{ iso: hoyIso, label: "Hoy", has: false }];

  const hoyDt = new Date();
  hoyDt.setHours(12,0,0,0);

  return dates.map(iso=>{
    const [y,m,d] = iso.split("-").map(Number);
    const dt = new Date(y, m-1, d, 12, 0, 0);
    const diffDays = Math.round((dt - hoyDt) / (1000 * 60 * 60 * 24));
    
    let label = "";
    if(diffDays === -1) label = "Ayer";
    else if(diffDays === 0) label = "Hoy";
    else if(diffDays === 1) label = "Mañana";
    else {
      const w = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"][dt.getDay()];
      label = `${w} ${d}`;
    }
    return { iso, label, has: true };
  });
}

/* ── VISTAS ── */

/* 1. Vista Cartelera Principal (Apple Sports Scoreboard) */
function viewDay(){
  const days = getMatchDays();
  if(!VIEW.day || !days.some(d=>d.iso===VIEW.day)) {
    VIEW.day = days.find(d=>d.label==="Hoy")?.iso || days[0]?.iso || new Date().toISOString().slice(0,10);
  }

  const todays = MATCHES.filter(m=>m.date===VIEW.day);
  let rows = todays.map(m=>{
    const {mkts}=model(m);
    const best = mkts.find(x=>x.e!==null && x.e>=S.minEv && x.o<=S.maxOdds) || null;
    const topProj = getTopModelProjections(m, mkts);
    return {m, best, topProj, nVal: mkts.filter(x=>x.solid).length};
  });

  const grouped = agruparPorComp(rows);

  return `
  <div class="date-switcher-apple">
    ${days.map(d=>`
      <button class="date-tab-apple ${d.iso===VIEW.day?"on":""}" data-day="${d.iso}">
        ${esc(d.label)}
      </button>
    `).join("")}
  </div>

  <div class="wrap">
    ${rows.length ? grouped.map(g=>`
      <div class="league-section">
        <div class="league-section-header">
          <div class="league-section-title">
            ${crest(g.rows[0].m.compLogo, g.comp, "sm")}
            <span>${esc(g.comp)}</span>
          </div>
          <span class="league-section-count">${g.rows.length} ${g.rows.length===1?"partido":"partidos"}</span>
        </div>

        <div class="match-group-card">
          ${g.rows.map((r, idx)=> `
            ${idx > 0 ? `<div class="match-divider-apple"></div>` : ""}
            ${matchRowApple(r)}
          `).join("")}
        </div>
      </div>
    `).join("") : `
      <div class="empty-state">
        <div class="empty-state-icon">🛡️</div>
        <h3>No hay partidos en esta fecha</h3>
        <p>Seleccioná otra fecha en la barra superior para ver los próximos encuentros programados.</p>
      </div>`}
  </div>`;
}

function matchRowApple({m, best, topProj}){
  const val = best && best.e>=S.minEv;
  const p1 = topProj && topProj[0];
  const p1MinOdd = p1 ? minTargetOdds(p1.p).toFixed(2) : null;
  
  const keyLabel = best ? `${best.label} @${best.o.toFixed(2)}` : p1 ? `${p1.label} ≥ @${p1MinOdd}` : "Analizar";

  return `
  <div class="match-row-apple ${val?"has-val":""}" data-id="${m.id}" role="button" tabindex="0" aria-label="Partido ${esc(m.home)} vs ${esc(m.away)}">
    <!-- Local -->
    <div class="team-col-left">
      ${crest(m.homeLogo, m.home, "md")}
      <div style="min-width:0">
        <div class="team-name" title="${esc(m.home)}">${esc(m.home)}</div>
        <div class="team-sub">xG ${m.lh.toFixed(1)}</div>
      </div>
    </div>

    <!-- Centro: Hora y Línea Cuantitativa -->
    <div class="match-center-col">
      <span class="match-time-apple">${m.hora} hs</span>
      <span class="match-line-badge ${val?"green":""}" title="${val?"Ventaja detectada":"Pronóstico principal"}">
        ${esc(keyLabel)}
      </span>
    </div>

    <!-- Visitante -->
    <div class="team-col-right">
      <div style="min-width:0">
        <div class="team-name" title="${esc(m.away)}">${esc(m.away)}</div>
        <div class="team-sub">xG ${m.la.toFixed(1)}</div>
      </div>
      ${crest(m.awayLogo, m.away, "md")}
    </div>
  </div>`;
}

/* 2. Centro de Partido (Match Hub) */
function viewMatch(id){
  const m = MATCHES.find(x=>x.id===id); if(!m) return "";
  const {M,mkts} = model(m);
  const best = mkts.find(x=>x.e!==null && x.e>=S.minEv && x.o<=S.maxOdds) || null;
  const topProj = getTopModelProjections(m, mkts);
  const val = best !== null;
  const p1 = topProj[0] || null;
  const minOddRecom = p1 ? minTargetOdds(p1.p).toFixed(2) : null;
  const isCombo = p1 && COMBO.some(c=>c.matchId===m.id && c.marketId===p1.id);

  return `
  <div class="match-hub-layout">
    <!-- Botón Volver -->
    <div style="padding:10px var(--pad) 0">
      <button class="btn-back" data-back title="Volver a la lista de partidos (Esc)">← Volver a Partidos</button>
    </div>

    <!-- Billboard Monumental del Partido -->
    <div class="match-billboard">
      <div class="billboard-comp">
        ${crest(m.compLogo, m.comp, "sm")}
        <span>${esc(m.comp)}</span>
      </div>

      <div class="billboard-teams">
        <div class="billboard-team">
          ${crest(m.homeLogo, m.home, "lg")}
          <span class="billboard-team-name">${esc(m.home)}</span>
          <span class="billboard-team-xg">${m.lh.toFixed(1)} xG proyectado</span>
        </div>

        <div class="billboard-time-center">
          <span class="billboard-kickoff">${m.hora} hs</span>
          <span style="font-size:11.5px;color:var(--text-muted)">Hoy</span>
        </div>

function renderOddsCell(m, x, customTitle=null){
  if(!x) return "";
  const isCombo = COMBO.some(c=>c.matchId===m.id && c.marketId===x.id);
  const val = x.e !== null && x.e >= S.minEv;
  const label = customTitle || x.label;
  const minOdd = minTargetOdds(x.p).toFixed(2);
  const fairOdd = fair(x.p).toFixed(2);
  return `
  <div class="odds-card-cell ${val?"has-val":""}">
    <div class="odds-cell-header">
      <span class="odds-label-name" title="${esc(label)}">${esc(label)}</span>
      <button class="cell-combo-btn ${isCombo?"on":""}"
              data-add-combo="${m.id}|${x.id}|${x.label}|${x.o||minOdd}|${x.p}"
              title="${isCombo?"Quitar de combinada":"Sumar a combinada"}"
              aria-label="${isCombo?"Quitar "+esc(label):"Sumar "+esc(label)}">
        ${isCombo?"✓":"+"}
      </button>
    </div>
    <div class="odds-cell-metrics">
      <span class="odds-prob-badge">${Math.round(x.p*100)}%</span>
      <span class="odds-fair-text">Justa @${fairOdd}</span>
    </div>
    <div class="odds-target-rule">
      Entrar: <b>≥ @${minOdd}</b>
    </div>
    <input class="odds-input-pill" type="number" step="0.01" min="1.01" inputmode="decimal"
           placeholder="Tu Cuota" value="${x.userOdd||""}" data-odds="${x.id}" data-m="${m.id}"
           aria-label="Tu cuota para ${esc(label)} en ${esc(m.home)} vs ${esc(m.away)}">
    ${x.e!==null ? `<span class="badge-ev ${x.e>=S.minEv?"pos":"neg"}">${x.e>0?"+":""}${Math.round(x.e*100)}% EV</span>` : ""}
  </div>`;
}

/* 3. Vista de Historial / Rendimiento */
function viewLog(){
  const done = LOG.filter(b=>b.result==="W"||b.result==="L");
  const staked = done.reduce((s,b)=>s+b.stake,0);
  const ret = done.reduce((s,b)=>s+(b.result==="W"?b.stake*b.odds:0),0);
  const prof = ret-staked;
  const roi = staked ? prof/staked : 0;
  const wins = LOG.filter(b=>b.result==="W").length;
  const losses = LOG.filter(b=>b.result==="L").length;
  const total = wins + losses;
  const winRate = total>0 ? Math.round((wins/total)*100) : 0;
  
  const clvs = LOG.filter(b=>b.closing>1).map(b=>b.odds/b.closing-1);
  const clv = clvs.length ? clvs.reduce((a,b)=>a+b,0)/clvs.length : null;

  let cum = 0;
  const pts = done.map(b=>{ cum += b.result==="W"? b.stake*(b.odds-1) : -b.stake; return cum; });
  let spark = "";
  if(pts.length>1){
    const mx = Math.max(...pts, 0), mn = Math.min(...pts, 0), rg = (mx-mn) || 1;
    const d = pts.map((p,i)=>`${(i/(pts.length-1)*100).toFixed(1)},${(48-((p-mn)/rg)*44).toFixed(1)}`).join(" ");
    const zero = (48-((0-mn)/rg)*44).toFixed(1);
    spark = `<svg class="spark-svg" viewBox="0 0 100 52" preserveAspectRatio="none">
      <line x1="0" y1="${zero}" x2="100" y2="${zero}" stroke="rgba(255,255,255,0.15)" stroke-width=".6"/>
      <polyline points="${d}" fill="none" stroke="${prof>=0?"#00D2FF":"#EF4444"}" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
    </svg>`;
  }

  let filteredLog = LOG;
  if(VIEW.perfFilter==="W") filteredLog = LOG.filter(x=>x.result==="W");
  else if(VIEW.perfFilter==="L") filteredLog = LOG.filter(x=>x.result==="L");
  else if(VIEW.perfFilter==="P") filteredLog = LOG.filter(x=>x.result==="P");

  return `
  <div class="tracker-container">
    <div class="perf-header">
      <h2>Tus Pronósticos</h2>
      <p>Seguimiento de tus jugadas y resultados acumulados</p>
    </div>

    <div class="perf-card">
      <div class="perf-stat-row">
        <div>
          <small class="eyebrow">Efectividad</small>
          <div class="perf-big-pct">${winRate}%</div>
        </div>
        <div style="text-align:right">
          <small class="eyebrow">Balance Neto</small>
          <div class="num" style="font-size:22px;font-weight:700;color:${prof>=0?"var(--cyan)":"var(--coral)"}">
            ${prof>=0?"+":""}${mny(prof)}
          </div>
        </div>
      </div>

/* 4. Vista de Combinadas (Boleta Limpia) */
function comboCalc(legs){
  if(!legs.length) return {o:0, p:0, e:0, stake:0, avisos:[]};
  const porPartido = {};
  legs.forEach(l=> (porPartido[l.matchId] = porPartido[l.matchId]||[]).push(l));

  let pConjunta = 1, oTotal = 1, avisos = [];
  Object.entries(porPartido).forEach(([mid, ls])=>{
    const m = MATCHES.find(x=>x.id===mid);
    if(!m) return;
    const {M} = model(m);
    if(ls.length===1){
      pConjunta *= ls[0].p; oTotal *= ls[0].o;
    } else {
      const tests = ls.map(l=>l.test).filter(Boolean);
      if(tests.length === ls.length){
        const pExacta = sumIf(M, (i,j)=> tests.every(t=>t(i,j)));
        pConjunta *= pExacta;
      } else {
        pConjunta *= ls.reduce((acc,x)=>acc*x.p, 1);
      }
      oTotal *= ls.reduce((acc,x)=>acc*x.o, 1);
      avisos.push(`Combinada en ${m.home} vs ${m.away}: Probabilidad calculada exactamente sobre la matriz.`);
    }
  });

  const e = pConjunta * oTotal - 1;
  const k = kelly(pConjunta, oTotal);
  const stake = e>=S.minEv ? Math.round(S.bank * k * 0.125) : 0;
  return {o:oTotal, p:pConjunta, e, stake, avisos};
}

function getTeamLogo(name){
  if(!name) return "";
  const key = name.toLowerCase().trim();
  if(LOGO_MAP[key]) return LOGO_MAP[key];
  const foundKey = Object.keys(LOGO_MAP).find(k => k.includes(key) || key.includes(k));
  return foundKey ? LOGO_MAP[foundKey] : "";
}

const ORDEN_COMP = ["Liga Profesional Argentina","CONMEBOL Libertadores","CONMEBOL Sudamericana","Copa Argentina"];
function agruparPorComp(rows){
  const grupos = {};
  rows.forEach(r=> (grupos[r.m.comp] = grupos[r.m.comp]||[]).push(r));
  const out = [];
  ORDEN_COMP.forEach(c=>{ if(grupos[c]) out.push({comp:c, rows:grupos[c]}); });
  Object.keys(grupos).forEach(c=>{ if(!ORDEN_COMP.includes(c)) out.push({comp:c, rows:grupos[c]}); });
  return out;
}

    VIEW.matchId = null;
    render(); return;
  }
  const dayBtn = e.target.closest("[data-day]");
  if(dayBtn){
    VIEW.day = dayBtn.getAttribute("data-day") || dayBtn.dataset.day;
    render(); return;
  }
  const sortBtn = e.target.closest(".sort-btn");
  if(sortBtn){
    VIEW.sortBy = sortBtn.getAttribute("data-sort") || sortBtn.dataset.sort;
    render(); return;
  }
  const matchRow = e.target.closest(".match-row-apple, .match-card");
  if(matchRow && !e.target.closest("button") && !e.target.closest("input")){
    const mid = matchRow.getAttribute("data-id") || matchRow.dataset.id;
    if(mid) { VIEW.matchId = mid; render(); return; }
  }
  const heroPick = e.target.closest(".hero-pick");
  if(heroPick && !e.target.closest("button")){
    const mid = heroPick.getAttribute("data-id") || heroPick.dataset.id;
    if(mid) { VIEW.matchId = mid; render(); return; }
  }
  const backBtn = e.target.closest("[data-back]");
  if(backBtn){
    VIEW.matchId = null;
    render(); return;
  }
  const subtabBtn = e.target.closest("[data-subtab]");
  if(subtabBtn){
    VIEW.subtab = subtabBtn.getAttribute("data-subtab") || subtabBtn.dataset.subtab;
    render(); return;
  }
  const standingsBtn = e.target.closest("[data-setstand], [data-standingstab]");
  if(standingsBtn){
    VIEW.standingsTab = standingsBtn.getAttribute("data-setstand") || standingsBtn.getAttribute("data-standingstab") || standingsBtn.dataset.setstand;
    render(); return;
  }
  const mktCatBtn = e.target.closest("[data-mktcat]");
  if(mktCatBtn){
    VIEW.mktCategory = mktCatBtn.getAttribute("data-mktcat") || mktCatBtn.dataset.mktcat;
    render(); return;
  }
  const filterBtn = e.target.closest("[data-f]");
  if(filterBtn){
    VIEW.filter = filterBtn.getAttribute("data-f") || filterBtn.dataset.f;
    render(); return;
  }
  const perffBtn = e.target.closest("[data-perff]");
  if(perffBtn){
    VIEW.perfFilter = perffBtn.getAttribute("data-perff") || perffBtn.dataset.perff;
    render(); return;
  }
  const compClose = e.target.closest("[data-compclose]");
  if(compClose){
    const k = compClose.getAttribute("data-compclose") || compClose.dataset.compclose;
    if(closedComps.has(k)) closedComps.delete(k); else closedComps.add(k);
    render(); return;
  }
  const addCombo = e.target.closest("[data-add-combo]");
  if(addCombo){
    const raw = addCombo.getAttribute("data-add-combo") || addCombo.dataset.addCombo || "";
    const [matchId, marketId, label, odds, prob] = raw.split("|");
    const m = MATCHES.find(x=>x.id===matchId);
    const idx = COMBO.findIndex(c=>c.matchId===matchId && c.marketId===marketId);
    if(idx>=0){
      COMBO.splice(idx, 1);
    } else {
      COMBO.push({
        matchId, marketId, label,
        odds: parseFloat(odds)||1.5,
        o: parseFloat(odds)||1.5,
        p: parseFloat(prob)||0.5,
        match: m ? `${m.home} vs ${m.away}` : "Partido"
      });
      showToast(`+ Sumado a la boleta: ${label}`);
    }
    store.set("combo", COMBO);
    render(); return;
  }
  const removeLeg = e.target.closest("[data-remove-leg]");
  if(removeLeg){
    const raw = removeLeg.getAttribute("data-remove-leg") || removeLeg.dataset.removeLeg || "";
    const [mid, mktId] = raw.split("|");
    COMBO = COMBO.filter(c=> !(c.matchId===mid && c.marketId===mktId));
    store.set("combo", COMBO);
    render(); return;
  }
  const comboClear = e.target.closest("[data-combo-clear]");
  if(comboClear){
    if(COMBO.length > 0){
      LAST_COMBO_BACKUP = [...COMBO];
      COMBO = [];
      store.set("combo", COMBO);
      render();
      showToast("Boleta de combinadas vaciada", () => {
        if(LAST_COMBO_BACKUP && LAST_COMBO_BACKUP.length){
          COMBO = [...LAST_COMBO_BACKUP];
          store.set("combo", COMBO);
          render();
          showToast("✓ Boleta restaurada");
        }
      });
    }
    return;
  }
  const nextMethod = e.target.closest("[data-method-next]");
  if(nextMethod){
    if(METHOD_STEP < METODOS.length-1) { METHOD_STEP++; render(); }
    else { VIEW.tab = "fecha"; VIEW.matchId = null; render(); }
    return;
  }
  const prevMethod = e.target.closest("[data-method-prev]");
  if(prevMethod){
    if(METHOD_STEP > 0) { METHOD_STEP--; render(); }
    return;
  }
  const savePick = e.target.closest("[data-savepick]");
  if(savePick){
    const raw = savePick.getAttribute("data-savepick") || savePick.dataset.savepick || "";
    const [mid, mktId, label, odds, stake, evVal] = raw.split("|");
    const m = MATCHES.find(x=>x.id===mid);
    LOG.push({
      id: "bet_" + Date.now(),
      matchId: mid,
      marketId: mktId,
      match: m ? `${m.home} vs ${m.away}` : "Partido",
      label,
      odds: parseFloat(odds),
      stake: parseFloat(stake) || Math.round(S.bank * 0.01),
      ev: parseFloat(evVal) || 0,
      closing: null,
      result: "P",
      date: new Date().toISOString().slice(0,10)
    });
    store.set("log", LOG);
    savePick.innerText = "✓ ¡Guardado!";
    showToast(`✓ Pick guardado en tu Historial (${label})`);
    setTimeout(()=>{ VIEW.tab = "registro"; VIEW.matchId = null; render(); }, 600);
    return;
  }
  const resBtn = e.target.closest("[data-res]");
  if(resBtn){
    const id = resBtn.getAttribute("data-res") || resBtn.dataset.res;
    const v = resBtn.getAttribute("data-v") || resBtn.dataset.v;
    const item = LOG.find(x=>x.id===id);
    if(item){
      item.result = v;
      store.set("log", LOG);
      if(v === "W") {
        const ganancia = Math.round(item.stake * (item.odds - 1));
        showToast(`🎉 ¡Pronóstico Ganado! +${mny(ganancia)} netos`);
      } else if(v === "L") {
        showToast(`📉 Pronóstico registrado como no acertado (-${mny(item.stake)})`);
      } else {
        showToast(`⏳ Pronóstico puesto en juego`);
      }
      render();
    }
    return;
  }
  const saveSetBtn = e.target.closest("#saveSettings");
  if(saveSetBtn){
    const b = parseFloat(document.getElementById("s-bank").value);
    const evTh = parseFloat(document.getElementById("s-ev").value);
    if(!isNaN(b) && b>0) S.bank = b;
    if(!isNaN(evTh)) S.minEv = evTh;
    store.set("settings", S);
    showToast("✓ ¡Ajustes y banca guardados!");
    VIEW.tab = "fecha"; render(); return;
  }
});

document.addEventListener("input", e => {
  const oddsAttr = e.target.getAttribute("data-odds");
  if(oddsAttr){
    const mid = e.target.getAttribute("data-m"), mktId = oddsAttr;
    const v = parseFloat(e.target.value);
    ODDS[mid+"__"+mktId] = (!isNaN(v) && v>1) ? v : null;
    store.set("odds", ODDS);
    
    // Actualización reactiva de la celda individual sin perder foco
    const cell = e.target.closest(".odds-card-cell");
    if(cell){
      const m = MATCHES.find(x=>x.id===mid);
      if(m){
        const {mkts} = model(m);
        const x = mkts.find(k=>k.id===mktId);
        if(x){
          cell.classList.toggle("has-val", x.e !== null && x.e >= S.minEv);
          let evBadge = cell.querySelector(".badge-ev");
          if(x.e !== null){
            if(!evBadge){
              evBadge = document.createElement("span");
              cell.appendChild(evBadge);
            }
            evBadge.className = `badge-ev ${x.e>=S.minEv?"pos":"neg"}`;
            evBadge.textContent = `${x.e>0?"+":""}${Math.round(x.e*100)}% EV`;
          } else if(evBadge){
            evBadge.remove();
          }
        }
      }
    }

    refreshVerdictIfActive();
  }
  const closeAttr = e.target.getAttribute("data-close");
  if(closeAttr){
    const id = closeAttr;
    const v = parseFloat(e.target.value);
    const item = LOG.find(x=>x.id===id);
    if(item){
      item.closing = (!isNaN(v) && v>1) ? v : null;
      store.set("log", LOG);
    }
  }
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && VIEW.matchId){
    VIEW.matchId = null;
    render();
  }
});

/* ── Arranque ── */
async function init(){
  IS_BOOTING = true;
  BOOT_ERROR = null;
  render();

  try{
    S = (await store.get("settings")) || S;
    ODDS = (await store.get("odds")) || {};
    LOG = (await store.get("log")) || [];
    COMBO = (await store.get("combo")) || [];
  }catch(e){}

  try{
    const r = await fetch("data/partidos.json?t="+Date.now());
    if(r.ok){
      const d = await r.json();
      MATCHES = d.partidos || [];
      const hoy = new Date().toISOString().slice(0,10);
      VIEW.day = MATCHES.some(m=>m.date===hoy) ? hoy : (MATCHES[0]?.date || hoy);
    }
  }catch(e){}

  try{
    const r = await fetch("data/tablas.json?t="+Date.now());
    if(r.ok) TABLAS = await r.json();
  }catch(e){}

  try{
    const r = await fetch("data/analisis.json?t="+Date.now());
    if(r.ok) ANALISIS = await r.json();
  }catch(e){}

  buildLogoMap();

  IS_BOOTING = false;
  render();
}

init();
</script>
</body>
</html>
