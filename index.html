     19 líneas ni se habían movido. Queda el instrumento, no la señal. */
  const props = Object.keys(mx.remates || {}).length + Object.keys(mx.al_arco || {}).length;
  const jug = jugadoresDe(m);
  if(!jug.length){
    /* La fuente no trae la serie reciente de todas las ligas: en las
       europeas el plantel viene con totales de temporada y sin el
       partido a partido. Sin serie no hay número de jugador que
       mostrar, aunque Bet365 sí publique las líneas. */
    filas.push({id:"jugadores", nombre:"Mercados de jugador", estado:"SIN DATO",
      motivo: props
        ? `${props} líneas de Bet365 · no tenemos la serie por jugador de estos planteles`
        : "No tenemos la serie por jugador de estos dos planteles"});
  } else if(!props){
    filas.push({id:"jugadores", nombre:"Mercados de jugador", estado:"SIN PRECIO",
      motivo:`${jug.reduce((s,g)=> s + g.jugadores.length, 0)} series cargadas, ninguna con línea publicada.`});
  } else {
    const mala = fiabilidadJugador("remates");
    filas.push({id:"jugadores", nombre:"Mercados de jugador", estado:"NO OPINAMOS",
      baja: !!(mala && mala.nivel === "mal"),
      motivo: mala && mala.nivel === "mal"
        ? `${props} líneas de Bet365 · remates se desvía ${((CAL_JUG.remates||{}).razon||0).toFixed(2)}× lo que explica el azar`
        : `${props} líneas de Bet365 · contra el precio no encontramos ventaja`});
  }

  const oportunidad = filas.find(x=> x.estado === "OPORTUNIDAD") || null;
  return {oportunidad, filas: filas.filter(x=> x !== oportunidad), lec, dir};
}

/* La tarjeta dorada. Es la única pieza con mostaza del partido entero,
   y solo aparece cuando otrosMercados() marcó valor — o sea con
   análisis cargado, dentro de la ventana medida, con piso de cuota y
   fuera de las ligas donde medimos que la regla resta. */
function tarjetaOportunidad(m, f){
  const c = f.cuota;
  const st = stakePct(m, f.op.p, c);
  const fam = f.id === "resultado" ? "Resultado" : f.id === "goles" ? "Goles" : "Ambos marcan";
  return `<div class="oport">
    <div class="oh"><b>Oportunidad detectada</b><span>${esc_(fam)}</span></div>
    <div class="otit">${esc_(f.op.label)}</div>
    <p>${esc_(cuandoCobra(f.op, m))} Le damos <b>${pc(f.op.p)}</b>${
      f.ventaja != null ? `, <b>${Math.round(f.ventaja*100)} puntos</b> más que la línea sin margen` : ""}.</p>
    <div class="ocels">
      <div class="cuota"><small>CUOTA MÍNIMA</small><b>${umbral(f.op.p).toFixed(2)}</b></div>
      <div><small>STAKE</small><b>${st || "—"}</b></div>
      <div class="muestra"><small>PAGAN</small><b>${c ? c.toFixed(2) : "—"}</b></div>
    </div>
    <button class="opie" data-capa="lectura"><span>De dónde sale</span><em>LECTURA ›</em></button>
  </div>`;
}

function filaMercado(m, f){
  const abierto = ABIERTOS.has("mk:" + f.id);
  const cls = f.riesgo ? "emk riesgo" : f.baja ? "emk baja" : "emk";
  return `<button class="${cls}" data-mk="${esc_(f.id)}">
      <div class="en"><b>${esc_(f.nombre)}</b><i>${esc_(f.motivo || "")}</i></div>
      ${f.estado ? `<span class="est">${esc_(f.estado)}</span>` : ""}
      <span class="mas">${abierto ? "−" : "+"}</span>
    </button>${abierto ? cuerpoMercado(m, f) : ""}`;
}

/* El cuerpo desplegado de una familia: el detalle que antes vivía en
   Pronósticos (la escalera de riesgo) o en Estadísticas (la chance de
   pasar la línea). No se recalcula nada — son las mismas funciones. */
function cuerpoMercado(m, f){
  if(f.id === "resultado"){
    const filas = escalera(m).filter(x=> x.op);
    if(!filas.length) return `<div class="emkc"><p>Sin candidatos en ninguna franja de riesgo.</p></div>`;
    return `<div class="emkc"><p>La escalera de riesgo, de lo más probable a lo más arriesgado.
      Solo Resultado: <b>medir_ejes.py</b> midió que en goles el aporte va de −0.9% a +0.4% sobre la
      tasa base, o sea nada.</p>
      <div class="cifras2">${filas.slice(0,3).map(x=>
        `<div><small>${esc_((x.franja.et || x.franja.nombre || "").toUpperCase())}</small>
          <b>${pc(x.op.p)}</b></div>`).join("")}</div>
      <p style="margin-top:9px">${filas.map(x=> esc_(x.op.label)).join(" · ")}</p></div>`;
  }
  if(f.id === "goles" || f.id === "ambos"){
    const lec = lectura(m);
    const ops = mercados(lec.M, m).filter(o=> o.fam === (f.id==="goles" ? "Goles" : "Ambos"));
    return `<div class="emkc"><p>Lo que dice el modelo, sin recomendarlo: en este eje el aporte
      sobre la tasa base está medido y es cero.</p>
      <div class="cifras2">${ops.slice(0, 3).map(o=>
        `<div><small>${esc_(o.label.toUpperCase())}</small><b>${pc(o.p)}</b></div>`).join("")}</div></div>`;
  }
  if(f.id === "jugadores"){
    return `<div class="emkc"><p>Las series están enteras en <b>Datos · Jugadores</b>, con los 18 de
      cada plantel y la titularidad en el renglón. Acá no las recomendamos: contra el precio de Bet365
      se midió el 31/08 y los controles desarmaron la señal.</p></div>`;
  }
  const k = f.id === "remates_eq" ? "remates" : f.id;
  const fi = fiabilidad(k);
  return `<div class="emkc">${bloqueLineasDe(m, k)}
    <p style="margin-top:9px">${fi ? esc_(fi.texto)
      : "Esta métrica todavía no se midió: no sabemos cuánto le erra."}</p></div>`;
}

/* La escalera de líneas de una métrica, sin los botones de la pestaña
   vieja: acá la métrica ya la eligió la fila que se desplegó. */
function bloqueLineasDe(m, k){
  const L = ESTADISTICAS[String(m.homeId)], V = ESTADISTICAS[String(m.awayId)];
  if(!L || !V || !L.esperado || !V.esperado) return "<p>Sin dato de los dos equipos.</p>";
  const P = paramsDe(L, V)[k];
  if(!P || L.esperado[k] == null || V.esperado[k] == null) return "<p>Sin dato de los dos equipos.</p>";
  const mu = L.esperado[k] + V.esperado[k];
  const disp = P.disp_total != null ? P.disp_total : P.disp;
  const celdas = lineasDe(mu).map(Ln=>{
    const q = probMayor(mu, disp, Ln);
    return q == null ? "" : `<div><small>+${Ln.toFixed(1)}</small><b>${Math.round(q*100)}%</b></div>`;
  }).join("");
  return `<p>Chance de que el total del partido termine arriba de cada línea, con la campana
    que le corresponde a esta métrica.</p><div class="cifras2">${celdas}</div>`;
}

function capaVeredicto(m){
  const v = mercadosDeVeredicto(m);
  const total = v.filas.length + (v.oportunidad ? 1 : 0);
  let h = sello2("Veredicto", `${dd(v.oportunidad ? 1 : 0)} DE ${dd(total)} MERCADOS`);

  if(v.oportunidad){
    h += tarjetaOportunidad(m, v.oportunidad);
  } else {
    /* El estado más frecuente, y el que se implementó primero. Con el
       ROI medido en −3.27% ±6.19 —el intervalo cruza el cero— prometer
       valor donde no hay ventaja medida va contra el principio del
       producto. Un día sin nada tiene que verse completo, no roto. */
    h += `<div class="nada"><b>No hay nada acá</b>
      <p>${total} mercado${total===1?"":"s"} mirado${total===1?"":"s"}, ninguno con precio a favor.</p></div>`;
  }

  h += `<div class="sepsec"><span>${v.oportunidad ? "Lo demás que miramos" : "Qué miramos"}</span><i></i></div>
    <div class="emks">${v.filas.map(f=> filaMercado(m, f)).join("")}</div>`;

  /* El porqué común, una vez. La regla de alineación pide una lectura
     que NO salga del modelo: sin análisis cargado no hay contra qué
     alinear, y entonces no se marca nada por más ventaja que muestre
     la cuenta. */
  if(ligaSinValor(m)){
    h += `<p class="notacapa">En esta liga está medido que la regla de valor resta plata
      (−9.2% de ROI walk-forward), así que acá no marcamos ninguna.</p>`;
  } else if(!v.dir){
    /* Dos huecos distintos, y decir el equivocado es peor que callarse:
       un partido puede tener la nota escrita y no declarar dirección,
       que es lo que la regla de alineación necesita. */
    h += `<p class="notacapa">${hayProsa(m.id)
      ? `La lectura de este partido está escrita pero <b>no declara hacia dónde inclina</b>, y sin
         dirección no hay contra qué alinear: por eso no se marca ninguno.`
      : `Ninguno se marca porque este partido todavía no tiene lectura escrita: la marca de valor se
         mide contra una lectura que no sale del modelo, y sin eso sería el modelo dándose la razón a
         sí mismo.`}</p>`;
  }

  h += pieTalon(`CERRADO ${fechaCorta(m.date)}`, "VEREDICTO 01 DE 03");

  /* Herramientas no desapareció: es de esta capa. Cargar la cuota de tu
     casa y anotar en el Registro son actos de apostar, no de explorar,
     y no tienen por qué ocupar un destino de primer nivel. */
  const abierto = ABIERTOS.has("herr");
  h += `<button class="lnkf" data-abrir="herr"><div class="t">
      <small>Tu casa</small><b>Cargá tu cuota y anotá</b></div>
      <span class="fl">${abierto ? "−" : "›"}</span></button>
    ${abierto ? `<div class="tabsec">${tabHerramientas(m)}</div>` : ""}`;

  h += `<button class="lnkf" data-capa="lectura"><div class="t">
      <small>Sigue</small><b>Por qué lo decimos</b></div><span class="fl">›</span></button>`;
  return h;
}

/* ══════════════════════════════════════════════════════════════════
   CAPA 02 · LECTURA

   Cada afirmación con el número que la sostiene en el MISMO bloque. Si
   hay que ir a buscarlo a otra pantalla, es la arquitectura vieja con
   otro nombre: el análisis decía "la defensa está rota" y el número
   estaba tres pestañas más allá.
   ══════════════════════════════════════════════════════════════════ */

/* La barra comparativa. Tinta plena = número MÁS ALTO, no número mejor:
   más faltas no es mejor. Un semáforo acá sería una opinión disfrazada
   de dato. */
function barraComparativa(etiqueta, a, b, suf){
  if(a == null || b == null) return "";
  const may = a >= b, tot = (a + b) || 1;
  const num = v => v.toFixed(1) + (suf || "");
  return `<div class="cbar">
    <div class="cv"><b class="${may?"alto":""}">${num(a)}</b>
      <span>${esc_(etiqueta)}</span>
      <b class="d ${!may?"alto":""}">${num(b)}</b></div>
    <div class="cb"><i class="${may?"alto":""}" style="flex:${(a/tot*100).toFixed(1)}"></i>
      <i class="${!may?"alto":""}" style="flex:${(b/tot*100).toFixed(1)}"></i></div>
  </div>`;
}

function bloqueArgumento(rotulo, parrafo, evidencia, pie){
  return `<div class="arg"><div class="rotarg">${esc_(rotulo)}</div>
    <p>${parrafo}</p>
    ${evidencia ? `<div class="evid">${evidencia}${pie || ""}</div>` : ""}</div>`;
}

function capaLectura(m){
  const lec = lectura(m);
  const a = ANALISIS[m.id] || {};
  const est = ANALISIS_EST[m.id] || {};
  const L = ESTADISTICAS[String(m.homeId)], V = ESTADISTICAS[String(m.awayId)];
  const dir = inclinacionDe(m.id);
  const div = divergen(m);
  const bloques = [];
  let n = 0;
  const rot = t => `${dd(++n)} · ${t}`;

  let h = sello2("Lectura", "POR QUÉ LO DECIMOS");
  h += `<div class="tesis"><b>${esc_(lec.titulo)}</b><p>${esc_(lec.cuerpo)}</p></div>`;

  /* 01 · Dominio. El texto lo escribe la skill del mercado de
     estadísticas cuando está cargado; los números son los del eje. */
  if(L && V && L.esperado && V.esperado){
    const filas = DOMINIO_METRICAS
      .map(([k, et])=> barraComparativa(et, L.esperado[k], V.esperado[k]))
      .filter(Boolean).join("");
    if(filas){
      const eje = ejesDe(m).find(e=> e.eje === "dominio");
      const sinMedir = !eje || eje.confianza === "sin_medir";
      /* Cuando los dos lados muestran el MISMO número no es un error de
         render: es el encogimiento diciendo que no hay muestra propia y
         que lo esperable de los dos es el promedio de la liga. Sin
         decirlo, dos cifras idénticas se leen como un bug. */
      const P = paramsDe(L, V);
      const flojo = DOMINIO_METRICAS.some(([k])=> P[k]
        && (pesoEquipo((L.n||{})[k]||0, P[k].k) < 0.25 || pesoEquipo((V.n||{})[k]||0, P[k].k) < 0.25));
      const texto = est.dominio ? esc_(est.dominio)
        : `Lo que esperamos de cada uno en este cruce, ajustado por el rival y por la localía.
           <b>${esc_(m.home)}</b> contra <b>${esc_(m.away)}</b>.`;
      bloques.push(bloqueArgumento(rot("Dominio"), texto, filas,
        `<div class="epie"><span>${flojo
          ? "Con esta muestra el número es casi todo promedio de la liga: por eso los dos lados dan parecido."
          : sinMedir
          ? "En esta liga la fuente no publica estadísticas por partido: sin medición detrás."
          : "Medido partido a partido: acá le ganamos al promedio de la liga."}</span></div>`));
    }
  }

  /* 02 · La tabla, como evidencia y no como destino. Solo los dos
     equipos del partido: la tabla entera vive en Datos · Referencia. */
  const enTabla = id => (m.tabla || []).find(f=> String(f.id) === String(id));
  const tl = enTabla(m.homeId), tv = enTabla(m.awayId);
  if(tl && tv){
    const pos = f => (m.tabla || []).filter(x=> (x.grupo||"") === (f.grupo||"")).indexOf(f) + 1;
    const fila = (f, nombre)=> `<div class="trow"><span class="ps">${dd(pos(f))}</span>
      <span class="nm">${esc_(nombre)}</span><span class="pt">${f.pts}</span>
      <span class="zn">PTS · ${f.pj} PJ</span></div>`;
    bloques.push(bloqueArgumento(rot("Tabla"),
      `${esc_(m.home)} llega con <b>${tl.pts}</b> puntos en ${tl.pj} partidos y ${esc_(m.away)} con
       <b>${tv.pts}</b> en ${tv.pj}.${tl.pj !== tv.pj
        ? " No llegan con los mismos jugados, así que los puntos no se comparan derecho." : ""}`,
      fila(tl, m.home) + fila(tv, m.away),
      `<div class="epie"><span>La tabla completa está en Datos · Referencia</span></div>`));
  }

  /* 03 · El antecedente. Cuatro cruces y nada más. */
  const h2h = (m.h2h || []).slice(0, 4);
  if(h2h.length){
    bloques.push(bloqueArgumento(rot("Antecedente"), antecedente(m),
      `<div class="h2hc">${h2h.map(x=>
        `<div><b>${esc_(x.s || "—")}</b><span>${esc_((x.d || "").slice(0,5))}</span></div>`).join("")}</div>`));
  }

  /* 04 · Contexto: lo único que no calcula nadie. Lo escribe una
     persona con la skill `valor-analisis-inclinacion`, y por eso el eje
     se declara sin medir hasta que haya una fecha nueva con la skill
     corregida. */
  const prosa = [["local", m.home], ["visitante", m.away]]
    .filter(([k])=> a[k]).map(([k, eq])=>
      `<div class="rotarg" style="margin-top:11px">${esc_(eq)}</div><p>${esc_(a[k])}</p>`).join("");
  if(prosa || a.contexto || a.veredicto){
    bloques.push(`<div class="arg"><div class="rotarg">${rot("Contexto")}</div>
      ${a.contexto ? `<p>${esc_(a.contexto)}</p>` : ""}
      ${prosa}
      ${a.veredicto ? `<p><b>${esc_(a.veredicto)}</b></p>` : ""}
      ${a.actualizado ? `<div class="evid"><div class="epie"><span>Escrito el ${esc_(a.actualizado)}
        · el único eje que no calcula nadie</span></div></div>` : ""}</div>`);
  } else {
    bloques.push(`<div class="arg"><div class="rotarg">${rot("Contexto")}</div>
      <p>Todavía nadie escribió la nota de este partido. Las bajas, el contexto de tabla y a quién
      le sirve el empate se cargan aparte, partido por partido, y este no. Sin eso
      <b>no marcamos precio a favor</b>: no hay contra qué alinear.</p></div>`);
  }

  h += `<div class="args">${bloques.join("")}</div>`;

  /* Los dos bloques de advertencia. La contradicción se muestra: si el
     motor y la lectura no dicen lo mismo, esconderlo sería elegir cuál
     de los dos tiene razón sin tener con qué. */
  if(div){
    const nom = d => d==="E" ? "el empate" : (d==="L" ? m.home : m.away);
    h += `<div class="warn"><b>El motor no dice lo mismo</b>
      <p>El análisis inclina a <b>${esc_(nom(div.dirHumana))}</b> y el modelo ve más probable a
      <b>${esc_(nom(div.dirModelo))}</b>. No lo resolvemos por vos: baja la confianza de todo lo que
      dependa del resultado, y la marca de valor solo puede ir sobre la lectura escrita.</p></div>`;
  }
  const pj = Math.min((L && L.pj) || 0, (V && V.pj) || 0);
  if(pj && pj < 5){
    h += `<div class="warn"><b>Ojo con la muestra</b>
      <p>El split de estos equipos se apoya en ${pj} partido${pj===1?"":"s"}. Con esa muestra el
      número se parece más al promedio de la liga que a este equipo — está dicho métrica por métrica
      en Datos.</p></div>`;
  }
  h += `<div class="warn"><b>El plantel no dice quién falta</b>
    <p>La fuente devuelve a todos los jugadores como activos: lesionados y suspendidos no vienen en
    el dato. Lo que falte de este partido está en el Contexto escrito a mano, o no está.</p></div>`;

  h += pieTalon(a.actualizado ? `ESCRITO ${fechaCorta(a.actualizado)}` : "SIN NOTA CARGADA",
                "LECTURA 02 DE 03");
  h += `<button class="lnkf" data-capa="datos"><div class="t">
      <small>Sigue</small><b>Los datos crudos</b></div><span class="fl">›</span></button>`;
  return h;
}

/* ══════════════════════════════════════════════════════════════════
   CAPA 03 · DATOS

   Exploración libre: sin veredictos y sin dorado. Tres exploradores —
   Equipos, Jugadores, Referencia — y dos reglas que valen para los
   tres:

     · La unidad es el CRUCE, no el promedio. Cada métrica va siempre en
       el par produce / concede: `concede` está medido en las nueve y se
       mostraba en un renglón chico al pie, así que se estaba viendo la
       mitad del dato.
     · Tinta plena = número más alto, NO número mejor. La barra indica
       magnitud, no ventaja. Acá no hay semáforo.
   ══════════════════════════════════════════════════════════════════ */

/* El marcador de señal: cuánto se le cree a una métrica, medido.

   Sale del dato, no de una tabla escrita a mano — `calibracion_lineas`
   para las métricas de equipo y `calibracion_jugadores` para las de
   jugador. Donde no hay medición dice SIN MEDIR, que es la verdad:
   afirmar que una métrica es confiable sin haberla medido es peor que
   callarse. */
function senalDe(k){
  const fi = fiabilidad(k);
  if(!fi) return {clase:"sinmedir", texto:"SIN MEDIR", floja:true};
  if(fi.grave) return {clase:"baja", texto:"SEÑAL BAJA", floja:true};
  if(fi.flojo) return {clase:"media", texto:"SEÑAL MEDIA", floja:false};
  return {clase:"alta", texto:"SEÑAL ALTA", floja:false};
}

function senalJugador(k){
  const f = fiabilidadJugador(k);
  if(!f) return {clase:"sinmedir", texto:"SIN MEDIR", floja:true};
  const c = (CAL_JUG[k] || {}).razon;
  if(f.nivel === "mal") return {clase:"baja", floja:true,
    texto:`SEÑAL BAJA${c ? " · " + c.toFixed(2) + "×" : ""}`};
  if(f.nivel === "regular") return {clase:"media", floja:false,
    texto:`SEÑAL MEDIA${c ? " · " + c.toFixed(2) + "×" : ""}`};
  return {clase:"alta", floja:false, texto:`SEÑAL ALTA${c ? " · " + c.toFixed(2) + "×" : ""}`};
}

/* El lado del split que corresponde al filtro, con la misma regla de
   muestra mínima que ya usaba la comparativa: abajo de MIN_SPLIT el
   total (que duplica la muestra) es más honesto que un promedio de dos
   partidos con un decimal. */
function ladoDe(eq, k, rol){
  if(!eq) return null;
  if(LOCALIA === "todo") return eq;
  const split = eq[rol];
  return usable(split, k) ? split : eq;
}

function datosEquipos(m){
  const L = ESTADISTICAS[String(m.homeId)], V = ESTADISTICAS[String(m.awayId)];
  if(!L || !V) return sello2("Equipos", "SIN DATO") +
    `<div class="nada"><b>Falta el caché de uno de los dos</b>
     <p>Sin los dos equipos no hay cruce que mostrar, y enfrentar un número contra un hueco invita
     a compararlos igual.</p></div>`;

  const pj = Math.min(L.pj || 0, V.pj || 0);
  let h = sello2("Equipos", `${dd(COMPARA.length)} MÉTRICAS · ${pj} PJ`);
  h += `<div class="filtro3">${[["todo","Todo"],["local","Local"],["visita","Visita"]]
    .map(([k,l])=> `<button class="${LOCALIA===k?"on":""}" data-loc="${k}">${l}</button>`).join("")}</div>`;

  h += `<div class="metacs">${COMPARA.map(x=>{
    const A = ladoDe(L, x.k, "local"), B = ladoDe(V, x.k, "visita");
    const val = (eq, r) => { const s = ladoDe(eq, x.k, r); if(!s) return null;
      return x.calc ? x.calc(s) : s[x.k]; };
    const a = val(L, "local"), b = val(V, "visita");
    if(a == null && b == null) return "";
    const se = senalDe(x.k);
    const abierto = ABIERTOS.has("met:" + x.k);
    /* `concede` es lo que le hacen A ese equipo. El cruce que importa
       es produce del local contra concede del visitante: rematar 10 no
       significa lo mismo contra un equipo que concede 6 que contra uno
       que concede 15. */
    const cL = x.cruza === false ? null : (L.concede || {})[x.k];
    const cV = x.cruza === false ? null : (V.concede || {})[x.k];
    return `<div class="metac${se.floja ? " floja" : ""}">
      <button class="mh" data-met="${esc_(x.k)}"><b>${esc_(x.et)}</b>
        <span class="senal ${se.clase}">${esc_(se.texto)}</span>
        <span class="mas">${abierto ? "−" : "+"}</span></button>
      ${abierto ? `<div class="mc">
        <div class="par"><div class="rot2">Produce</div>
          ${barraComparativa(x.et, a, b, x.suf)}</div>
        ${cL != null && cV != null ? `<div class="par"><div class="rot2">Concede</div>
          ${barraComparativa(x.et, cL, cV, x.suf)}</div>` : ""}
        <div class="mpie"><span>${esc_(m.home)}</span><span>${esc_(m.away)}</span></div>
      </div>` : ""}</div>`;
  }).join("")}</div>`;

  h += `<button class="lnkf chica" data-nav="metodo"><div class="t">
      <b>Qué es la señal medida</b></div><span class="dst">MÉTODO ›</span></button>`;
  h += pieTalon(`ESPN · ${pj} PJ`, "DATOS 03 DE 03");
  return h;
}

/* Los 18 de cada plantel, no solo los destacados. El que mira arma sus
   propios candidatos, y para eso hace falta la lista entera: ordenable,
   con la serie a la vista y con la titularidad dicha en el renglón. */
function datosJugadores(m){
  const pool = [];
  [[m.homeId, m.home, "L"], [m.awayId, m.away, "V"]].forEach(([id, equipo, lado])=>{
    (PLANTELES[String(id)] || []).forEach(j=> pool.push(Object.assign({}, j, {equipo, lado})));
  });
  if(!pool.length) return sello2("Jugadores", "SIN DATO") +
    `<div class="nada"><b>Sin planteles</b><p>Todavía no tenemos la serie de estos dos equipos.</p></div>`;

  const clave = (METRICAS.find(x=> x.k === JUG_ORDEN) || METRICAS[0]).k;
  const lista = pool
    .filter(j=> JUG_EQ === "dos" || j.lado === JUG_EQ)
    .filter(j=> j.pj > 0)
    .sort((a,b)=>{
      const va = (a.serie && a.serie.esp && a.serie.esp[clave]);
      const vb = (b.serie && b.serie.esp && b.serie.esp[clave]);
      const ma = va != null ? va : (a.pj > 0 ? (a[clave]||0)/a.pj : 0);
      const mb = vb != null ? vb : (b.pj > 0 ? (b[clave]||0)/b.pj : 0);
      return mb - ma;
    });
  const todos = EXPANDIDAS.has("jug");
  const ver = todos ? lista : lista.slice(0, 12);
  const se = senalJugador(clave);

  let h = sello2("Jugadores", `${dd(pool.length)} EN PLANTEL`);
  h += `<div class="ordmet">${METRICAS.map(x=>
    `<button class="${x.k===clave?"on":""}" data-jugmet="${x.k}">${esc_(x.et)}</button>`).join("")}</div>`;
  h += `<div class="filtro3 suave">${[["dos","Los dos"],["L",m.home],["V",m.away]]
    .map(([k,l])=> `<button class="${JUG_EQ===k?"on":""}" data-jugeq="${esc_(k)}">${esc_(l)}</button>`).join("")}</div>`;
  h += `<div class="jgh"><span class="c1">Jugador <em style="color:var(--tinta3);font-style:normal">·
      <span class="senal ${se.clase}">${esc_(se.texto)}</span></em></span>
    <span class="c2">Serie</span><span class="c3">Med</span></div>`;

  h += `<div class="jglist">${ver.map((j, i)=>{
    const s = (j.serie && j.serie[clave]) || [];
    const tope = Math.max(1, ...s.map(v=> Number(v)||0));
    const tit = (j.serie && j.serie.tit) || 0, spj = (j.serie && j.serie.pj) || 0;
    /* Sin serie no se dibuja una serie vacía: tres barras a cero se
       leen como "no hizo nada" cuando lo que pasa es que la fuente no
       publica el partido a partido en esta liga. */
    const haySerie = s.length > 0;
    /* El que entra desde el banco juega veinte minutos: su serie no se
       compara con la de un titular. Se baja de intensidad y se dice en
       el renglón — pero no se esconde de la lista. */
    const suplente = haySerie && spj > 0 && tit === 0;
    const med = (j.serie && j.serie.esp && j.serie.esp[clave] != null)
      ? j.serie.esp[clave].toFixed(1)
      : (j.pj > 0 ? ((j[clave]||0)/j.pj).toFixed(1) : "—");
    return `<div class="jgrow${suplente ? " supl" : ""}${i < 2 && !suplente ? " destacado" : ""}">
      <div class="c1"><div class="nm">${esc_(j.nombre)}</div>
        <div class="mt">${esc_(j.equipo)} · ${esc_(j.pos || "—")} · ${!haySerie
          ? `${j.pj} PJ · SIN SERIE`
          : suplente ? `SUPLENTE 0/${spj}` : `TITULAR ${tit}/${spj}`}</div></div>
      <div class="spark">${haySerie ? s.map(v=>{
        const n = Number(v) || 0;
        return `<i class="${n?"":"cero"}" style="height:${Math.max(8, n/tope*100)}%"></i>`;
      }).join("") : ""}</div>
      <b class="med">${med}</b></div>`;
  }).join("")}</div>`;

  /* Dos números distintos en la misma columna, dicho una vez: donde
     hay serie, MED es lo que esperamos de ese jugador en ESTE partido
     (encogido hacia su puesto); donde no la hay, es su promedio de la
     temporada. La fuente no publica el partido a partido en todas las
     ligas y taparlo sería inventar. */
  h += `<p class="notacapa">MED es lo que esperamos hoy cuando hay serie reciente, y el promedio de
    la temporada cuando la fuente no la publica — ahí el renglón dice <b>SIN SERIE</b>.</p>`;

  if(lista.length > 12)
    h += `<button class="vermas" data-expandir="jug"><span>${todos
      ? `Ver solo los primeros 12` : `Ver los ${lista.length}`}</span><em>${todos
      ? "MENOS" : `${lista.length - 12} MÁS ›`}</em></button>`;

  h += pieTalon("ESPN · ÚLTIMOS 3", "DATOS 03 DE 03");
  return h;
}

/* Los tres destinos que eran pestañas de primer nivel: Posiciones,
   Historial y Plantel. Se consultan poco y ahora pesan lo que valen. */
function datosReferencia(m){
  let h = sello2("Referencia", "TABLAS · HISTORIAL · PLANTELES");
  h += `<div class="refs">`;

  const bloque = (id, titulo, meta, cuerpo)=>{
    const abierto = ABIERTOS.has("ref:" + id);
    return `<div class="refac"><button class="rh" data-ref="${id}"><b>${esc_(titulo)}</b>
      <em>${esc_(meta)}</em><span class="mas">${abierto ? "−" : "+"}</span></button>
      ${abierto ? `<div class="rc">${cuerpo()}</div>` : ""}</div>`;
  };

  /* ── posiciones ── */
  const tabla = m.tabla || [];
  const grupos = {};
  tabla.forEach(f=> (grupos[f.grupo || ""] = grupos[f.grupo || ""] || []).push(f));
  const claves = Object.keys(grupos);
  h += bloque("pos", "Posiciones", tabla.length ? `${tabla.length} EQUIPOS` : "SIN TABLA", ()=>{
    if(!tabla.length) return `<p style="font-size:12.5px;line-height:1.6;color:var(--gris3);margin:0">
      En las llaves por eliminación no hay tabla que mostrar, y la fuente tampoco la devuelve.</p>`;
    const g = claves.includes(REF_TABLA) ? REF_TABLA : claves[0];
    const mios = new Set([String(m.homeId), String(m.awayId)]);
    const filas = grupos[g];
    /* Los dos equipos del partido, destacados; el resto de la tabla es
       contexto y colapsa en un renglón de puntos suspensivos. */
    const idx = filas.map((f,i)=> ({f, i})).filter(x=> mios.has(String(x.f.id))).map(x=> x.i);
    const cerca = new Set();
    idx.forEach(i=> [i-1, i, i+1].forEach(j=> { if(j>=0 && j<filas.length) cerca.add(j); }));
    if(!idx.length) filas.forEach((f,i)=> { if(i < 6) cerca.add(i); });
    let out = claves.length > 1
      ? `<div class="tablas">${claves.map(k=>
          `<button class="${k===g?"on":""}" data-reftabla="${esc_(k)}">${esc_(grupoEs(k, m.comp) || "Tabla")}</button>`).join("")}</div>`
      : "";
    out += `<div class="stdh"><span class="p">#</span><span class="e">Equipo</span>
      <span class="v">PJ</span><span class="v">GF</span><span class="pts">PTS</span></div>`;
    let saltados = 0;
    filas.forEach((f, i)=>{
      if(!cerca.has(i)){ saltados++; return; }
      if(saltados){ out += `<div class="stdr puntos">···  ${saltados} equipo${saltados===1?"":"s"} más</div>`; saltados = 0; }
      out += `<div class="stdr${mios.has(String(f.id)) ? " mio" : ""}">
        <span class="p">${dd(i+1)}</span><span class="e">${esc_(f.t)}</span>
        <span class="v">${f.pj}</span><span class="v">${f.gf != null ? f.gf : "—"}</span>
        <span class="pts">${f.pts}</span></div>`;
    });
    if(saltados) out += `<div class="stdr puntos">···  ${saltados} equipo${saltados===1?"":"s"} más</div>`;
    const n = quienFalta(m);
    if(n) out += `<p style="font-size:11.5px;line-height:1.6;color:var(--gris3);margin:11px 0 0">${n.texto}</p>`;
    return out;
  });

  /* ── historial ── */
  const h2h = m.h2h || [];
  h += bloque("hist", "Historial", `${h2h.length} CRUCES`, ()=>{
    let out = "";
    if(h2h.length){
      out += `<div class="rsub primero">Cara a cara</div>` + h2h.slice(0, 6).map(x=>
        `<div class="h2hr"><span class="f">${esc_((x.d||"").slice(0,5))}</span>
          <span class="c">${esc_(x.h)} — ${esc_(x.a)}</span>
          <span class="r">${esc_(x.s || "—")}</span></div>`).join("");
    }
    const cinco = (nombre, forma)=>{
      const f = (forma || []).slice().reverse();
      if(!f.length) return "";
      return `<div class="cinco"><span class="e">${esc_(nombre)}</span>
        <span class="cs">${f.map(x=> `<i class="${x.r==="W"?"g":x.r==="D"?"e2":""}"></i>`).join("")}</span></div>`;
    };
    out += `<div class="rsub">Últimos cinco</div>`
      + cinco(m.home, m.formH_general) + cinco(m.away, m.formA_general)
      + `<div class="leyenda"><span><i class="g"></i>Ganó</span><span><i class="e2"></i>Empató</span>
         <span><i></i>Perdió</span></div>`;
    return out;
  });

  /* ── planteles ── */
  const fichas = (PLANTELES[String(m.homeId)] || []).length + (PLANTELES[String(m.awayId)] || []).length;
  h += bloque("pl", "Planteles", `${fichas} FICHAS`, ()=> cancha(m, false));

  h += `</div>`;
  h += `<div class="warn"><b>El plantel no dice quién falta</b>
    <p>La fuente devuelve a todos como activos: lesionados y suspendidos no vienen en el dato. Va acá,
    donde se mira el plantel, y no al final de un análisis.</p></div>`;
  h += pieTalon("ESPN", "DATOS 03 DE 03");
  return h;
}

function capaDatos(m){
  return EXPL === "jugadores" ? datosJugadores(m)
       : EXPL === "referencia" ? datosReferencia(m)
       : datosEquipos(m);
}

function viewPartido(){
  const m = MATCHES.find(x=>x.id===MATCH_ID);
  if(!m) return `<div class="aviso"><b>Ese partido ya no está</b>Puede que el cron lo haya movido. Volvé a la fecha.</div>`;
  const cuerpo = CAPA === "lectura" ? capaLectura(m)
               : CAPA === "datos"   ? capaDatos(m)
               : capaVeredicto(m);
  return cabPartido(m) + conmutador() + cuerpo + aire(26);
}

/* ── 1. Análisis ───────────────────────────────────────────────── */
function tabAnalisis(m){
  const a = ANALISIS[m.id];
  if(!hayProsa(m.id)){
    /* Hoy `analisis.json` está vacío, así que esta rama es la que se ve
       en todos los partidos. No se disimula el hueco: se declara qué
       falta, quién lo carga, y se pone abajo lo que sí sabemos por los
       números — que no es poco. Un cartel de "próximamente" sería
       peor que decir la verdad. */
    const lec = lectura(m);
    const s = sello(lec, m, inclinacionDe(m.id));
    const corto = n => (n||"").length>11 ? n.split(" ")[0] : n;
    return `<div class="banda banda2">Análisis<em>SIN CARGAR</em></div><div class="sec hueco">
      <div class="big">Todavía nadie escribió la nota de este partido</div>
      <p class="sub">Las bajas, el contexto de tabla y a quién le sirve el empate se escriben
        aparte, partido por partido, y este todavía no. Esto es lo que sí sabemos por los números.</p>
      <div class="cifras">
        <div><b>${m.lh.toFixed(2)}</b><small>${esc_(corto(m.home))}</small></div>
        <div><b>${m.la.toFixed(2)}</b><small>${esc_(corto(m.away))}</small></div>
        <div><b>${marcadorTop(lec.M)}</b><small>Más probable</small></div>
      </div>
      <div class="cifras-pie">Goles esperados de cada uno, y el marcador exacto que más
        se repite — que aun así pasa ${Math.round(probMarcadorTop(lec.M)*100)} de cada 100 veces.
      </div>
      <div class="rot"><span>El partido</span></div>
      <p class="prosa">${lec.cuerpo}</p>
      <div class="rot"><span>El antecedente</span></div>
      <p class="prosa">${antecedente(m)}</p>
      <div class="cierre" style="justify-content:flex-end">
        <div class="sellov"><div><div class="a">${esc_(s[0])}</div><div class="b">${esc_(s[1])}</div></div></div>
      </div>
    </div>`;
  }
  let h = `<div class="banda banda2">Análisis<em>NUESTRA NOTA</em></div>
    <div class="sec an"><div class="lbl">Nuestro análisis</div>`;

  /* Una lectura por equipo, cada una bajo el nombre del equipo. El campo
     único de antes no obligaba a nada: un análisis podía enumerar las
     bajas del local y no decir una palabra del rival, y en la pantalla
     no se veía el hueco. Acá sí se ve. Son campos agregados, no un
     reemplazo — los análisis viejos solo tienen `contexto`. */
  const lado = (txt, equipo) => txt
    ? `<div class="rot"><span>${esc_(equipo)}</span></div><p class="prosa">${esc_(txt)}</p>`
    : "";
  h += lado(a.local, m.home) + lado(a.visitante, m.away);
  if((a.local || a.visitante) && a.contexto)
    h += `<div class="rot"><span>El partido</span></div>`;
  if(a.contexto)  h += `<p>${esc_(a.contexto)}</p>`;
  if(a.veredicto) h += `<p class="veredicto">${esc_(a.veredicto)}</p>`;

  /* El desarrollo es el cuerpo de la nota: cómo se va a jugar el partido.
     Es único por partido (no una lectura por equipo) y el campo `senal`
     lo usa la Task 4 — acá solo se muestra el texto. */
  const des = a.desarrollo;
  if(des && des.texto){
    h += `<div class="rot"><span>El desarrollo</span></div><p class="prosa">${esc_(des.texto)}</p>`;
  }

  /* La dirección declarada se muestra, no se esconde: es lo que
     habilita la marca de valor, y el usuario tiene derecho a ver contra
     qué se está alineando la app. Si no hay, se dice también. */
  const dir = inclinacionDe(m.id);
  h += `<div class="rot"><span>Hacia dónde inclina</span></div>
    <p class="prosa">${dir
      ? `Este análisis inclina ${aQuien(dir, m)}. Con eso puesto, no vamos a
         recomendar nada que lo contradiga, y solo marcamos precio a favor sobre esa lectura.`
      : `Este análisis no declara para dónde inclina, así que no marcamos precio a favor en
         este partido. La escalera igual está en Pronósticos.`}</p>`;

  if(a.actualizado) h += `<p class="fuente">Escrito el ${esc_(a.actualizado)}.</p>`;
  return h + `</div></div>`;
}

/* ── 2. Pronósticos ────────────────────────────────────────────── */
function tabPronosticos(m){
  const lec = lectura(m);
  const hay = analizado(m.id);
  const esc = escalera(m);
  const senal = senalDividida(m);

  let h = `<div class="banda banda2">Pronósticos<em>ESCALERA DE RIESGO</em></div>
    <div class="sec"><div class="read">
    <div class="lbl">Nuestra lectura</div>
    <div class="big">${esc_(lec.titulo)}</div>
    <p>${esc_(lec.cuerpo)}</p>
  </div>`;

  /* La razón dominante va primero: si en esta liga no marcamos por
     medición, da igual si hay análisis cargado o no. Y se dice con el
     número, no con una vaguedad — es la misma disciplina que usa
     quienFalta() para los huecos de datos: declarar el hueco en vez de
     esconderlo. Una escalera sin marca y sin explicación se lee como
     "hoy no hubo nada", que es una cosa distinta. */
  if(ligaSinValor(m)){
    h += `<div class="nota">En ${esc_(m.comp)} <b>no marcamos oportunidades</b>, y el
      motivo está medido: sobre 1.789 apuestas históricas contra la cuota de cierre real,
      nuestra regla de valor dio <b>−9,2%</b> de rentabilidad. Probamos 39 formas distintas
      de ajustar el umbral y ninguna dio positivo fuera de muestra. El pronóstico sigue acá
      entero — lo que dejamos de hacer es decirte que hay valor donde medimos que no lo hay.</div>`;
  } else if(!hay){
    h += `<div class="nota">Abajo está la escalera con lo que dice el modelo, para que la veas.
      No vas a encontrar nada marcado como oportunidad: solo señalamos precio a favor en
      partidos que miramos en serio, y este todavía no.</div>`;
  } else {
    const dv = divergen(m);
    if(dv){
      h += `<div class="nota">Los números crudos del modelo dan más chance
        ${aQuien(dv.dirModelo, m)} arriba, pero nuestro análisis vio algo que los
        números solos no ven, y se inclina ${aQuien(dv.dirHumana, m)}. Son dos
        lecturas distintas a propósito — no vas a encontrar nada marcado como oportunidad en
        contra de la del análisis, aunque el modelo diga otra cosa.</div>`;
    }
    if(senal){
      const que = senal.fenom==="goles"
        ? "nuestra lectura del desarrollo dice que va a ser un partido de pocos goles"
        : "nuestra lectura del desarrollo dice que es poco probable que marquen los dos";
      h += `<div class="nota">El modelo ve ventaja en opciones de
        ${senal.fenom==="goles" ? "goles altos" : "ambos marcan"}, pero ${que}.
        Por eso no te las marcamos en dorado: la lectura del desarrollo no
        acompaña, y no recomendamos sobre algo que contradice nuestra propia
        lectura. Quedan acá visibles por si querés decidir con los números y la
        lectura a la vista.</div>`;
    }
  }
  h += `</div>`;   // cierra el .sec de la lectura

  /* Cada escalón es un talón numerado, igual que la tarjeta de portada:
     la app usa el mismo recurso para decir "esto es una de N opciones".
     La barra con escala 0/50/100 está porque un porcentaje suelto no se
     compara con nada — al lado de la escala se ve de un saque si el
     escalón está por encima o por debajo de jugarse una moneda. */
  /* Solo las franjas que tienen algo que ofrecer. Desde que la escalera
     se limita a Resultado con piso de cuota (2026-08-31), en muchos
     partidos hay una o dos opciones y no tres — y mostrar dos talones
     que dicen "sin opción clara" bajo un encabezado que promete "3
     FORMAS" es peor que mostrar las que hay. Si no queda ninguna, se
     dice una sola vez.

     El talón numerado sigue diciendo "Nº 01 DE 02" con el total REAL,
     que es lo que ese recurso siempre significó: una de N opciones. */
  const conOp = esc.filter(x=> x.op);
  const total = String(conOp.length).padStart(2,"0");
  h += `<div class="banda banda2">Escalera de riesgo<em>${
    conOp.length ? conOp.length + (conOp.length === 1 ? " FORMA" : " FORMAS") : "SIN OPCIONES"
  }</em></div><div class="pasos">`;

  if(!conOp.length){
    h += `<div class="nota">Ninguna de las tres franjas de riesgo tiene una opción
      que valga la pena en este partido. Los números de cada mercado están abajo,
      en Otros mercados.</div></div>`;
  }

  conOp.forEach(({franja, op, valor}, i)=>{
    const marcar = op && valor && hay && !(senal && senal.opciones.includes(op.id));
    const n = String(i+1).padStart(2,"0");
    h += `<div class="paso ${marcar?"val":""}">
      <div class="talon">
        <div class="pn">${n}</div>
        <div class="de">DE ${total}</div>
      </div>
      <div class="perf"></div>
      <div class="cuerpo">
        <div class="ph"><span class="franja">${esc_(franja.n.toUpperCase())}</span>
          ${op?`<span class="pp">${Math.round(op.p*100)}<i>%</i></span>`:""}</div>`;
    if(!op){
      h += `<div class="sinop">Sin ninguna opción clara en esta franja para este partido.</div>
        <p class="rsub">${franja.sub}</p></div></div>`;
      return;
    }
    const pct = Math.round(op.p*100);
    const real = cuotaReal(m, op);
    h += `<div class="oplabel">${esc_(op.label)}</div>
      <div class="barra"><i style="width:${pct}%"></i><u style="margin-left:${pct}%"></u></div>
      <div class="escala"><span>0</span><span>50</span><span>100</span></div>
      ${marcar?`<div class="sig">Acá el precio está a favor</div>`:""}
      ${real
        ? `<div class="umb">Bet365 paga <b>${real.toFixed(2)}</b> — conviene si te pagan más de <b>${umbral(op.p).toFixed(2)}</b></div>`
        : `<div class="umb">conviene si te pagan más de <b>${umbral(op.p).toFixed(2)}</b></div>`}
      <div class="cobra">${esc_(cuandoCobra(op,m))}</div>
    </div></div>`;
  });
  h += `</div><div class="sec">`;

  const cmb = combinada(m);
  if(cmb && hay){
    /* La corrección por correlación importa de verdad en pocos casos
       (medido: 4 de 16 combinadas pasan de 2pp, con un máximo de 6pp).
       Cuando no importa, no la anunciamos como si importara. */
    const dif = cmb.p - cmb.ingenua;
    const nota = Math.abs(dif) >= 0.02
      ? `Calculado sobre la matriz del partido. Multiplicar las dos por separado daría ${pc(cmb.ingenua)}, y estaría mal: las dos cosas pasan en el mismo partido y se afectan entre sí.`
      : `Calculado sobre la matriz del partido, teniendo en cuenta que las dos cosas pasan en el mismo partido.`;
    h += `<div class="rot"><span>Las dos juntas</span><em>${cadaCuanto(cmb.p)}</em></div>
      <div class="cmb">
        <div class="l1"><span class="mkt">${esc_(cmb.patas[0].label)} <i>+</i> ${esc_(cmb.patas[1].label)}</span><span class="prob">${pc(cmb.p)}</span></div>
        <div class="umb">conviene si te pagan más de <b>${umbral(cmb.p).toFixed(2)}</b></div>
        <div class="cobra">${nota}</div>
      </div>`;
  }

  /* La escalera elige un mercado por franja, por ventaja — no por
     familia. Si jugás siempre 1X2, o siempre doble oportunidad, tu
     mercado puede no salir nunca ahí aunque el número exista. Acá está
     nuestra lectura de TODOS los mercados elegibles, no solo el que
     ganó arriba, y cada uno se marca en dorado por su cuenta si tiene
     ventaja real — no solo el que ganó su franja en la escalera. */
  const otros = otrosMercados(m);
  const fams = ["Resultado","Goles","Ambos"];
  h += bloqueDominio(m);
  h += bloqueJugadores(m);

  h += `<div class="banda banda2">Otros mercados<em>NUESTRA LECTURA DE CADA UNO</em></div>`;
  fams.forEach(fam=>{
    h += `<div class="grp"><div class="gh">${esc_(fam)}</div>`;
    otros.filter(x=> x.op.fam===fam).forEach(({op, esVal})=>{
      const v = esVal && !(senal && senal.opciones.includes(op.id));
      const real = cuotaReal(m, op);
      h += `<div class="mrow ${v?"val":""}">
        <div class="top2"><span class="mkt">${esc_(op.label)}</span><span class="modelo">${pc(op.p)}</span></div>
        ${real
          ? `<div class="umb">Bet365 paga <b>${real.toFixed(2)}</b> — conviene si te pagan más de <b>${umbral(op.p).toFixed(2)}</b></div>`
          : `<div class="umb">conviene si te pagan más de <b>${umbral(op.p).toFixed(2)}</b></div>`}
      </div>`;
    });
    h += `</div>`;
  });

  h += `<div class="foot">Las tres salen de la misma lectura — elegís vos cuánto arriesgar.
    El umbral ya incluye un margen de seguridad: a la cuota justa pelada la ventaja es cero.
    Donde hay cuota real de Bet365 la mostramos al lado; donde no, solo el umbral teórico.
    Y solo marcamos en dorado cuando además el precio está a favor.</div>`;
  return h + `</div>`;
}

/* ══════════════════════════════════════════════════════════════════
   EL EJE DOMINIO — la primera lectura que se muestra sin recomendar

   Es el primer eje que baja a pantalla desde el contrato (TRASPASO
   §17). Y es a propósito uno que NO se puede marcar: contra plata no
   está medido y no se puede medir hacia atrás, porque football-data no
   publica cuota de córners. Que igual se muestre es la regla nueva —
   vara 1 para mostrar, vara 2 para marcar.

   Los números y el orden salen de `medir_dominio.py` (2026-08-31, test
   temporal en eng y fra): remates +9.9%, al arco +7.3% y córners +4.8%
   sobre la media de la liga. Van en ese orden porque es el orden en que
   sabemos, no el orden en que la casa los cotiza.

   Faltas y tarjetas no están: se midió que no aportan nada sobre el
   promedio de la liga (+1.0% y +0.6%), así que siguen en Estadísticas
   como dato crudo y no acá como lectura.
   ══════════════════════════════════════════════════════════════════ */
const DOMINIO_METRICAS = [
  ["remates",  "Remates"],
  ["al_arco",  "Al arco"],
  ["corners",  "Córners"],
];

/* El slug de la liga. `m.liga` lo escribe `actualizar.py` desde el
   2026-08-31, pero los archivos que ya están publicados no lo tienen —
   y el cron corre dos veces por día, así que hay una ventana donde
   falta. El caché de estadísticas guarda el mismo slug por equipo, y
   sirve de respaldo sin inventar nada: si tampoco está, se devuelve
   null y los ejes se declaran sin medir, que es lo correcto. */
function ligaDe(m, L, V){
  return m.liga || (L && L.liga) || (V && V.liga) || null;
}

/* Solo las tres métricas que `medir_dominio.py` midió, y desde
   `esperado` —el número ajustado por rival y por localía que la app ya
   usa en las líneas— y no desde el promedio crudo. */
function dominioDe(L, V){
  if(!L || !V || !L.esperado || !V.esperado) return null;
  const lado = e => {
    const o = {};
    DOMINIO_METRICAS.forEach(([k]) => { if(e[k] != null) o[k] = e[k]; });
    return Object.keys(o).length ? o : null;
  };
  const a = lado(L.esperado), b = lado(V.esperado);
  return (a && b) ? {local: a, visita: b} : null;
}

/* ── El eje Jugadores ───────────────────────────────────────────
   Las métricas van en el orden en que se les cree, medido contra el
   RUIDO y no contra cero (`medir_jugadores.py`): con 618 predicciones
   un modelo perfecto ya se desvía 3.5 puntos por azar. Hoy goles y
   asistencias dan bien, al arco regular y remates mal. */
const JUG_METRICAS = [
  ["goles",   "Gol"],
  ["al_arco", "Al arco"],
  ["remates", "Remates"],
];

const NIVEL_A_CONFIANZA = {bien: "calibrada", regular: "calibrada",
                           mal: "mal_calibrada"};

function confianzaJugadores(metricas){
  /* El eje vale lo que vale su métrica PEOR. Mostrar goles bien
     calibrado al lado de remates mal calibrado y declarar el conjunto
     "calibrado" sería usar lo bueno para tapar lo malo. */
  let peor = "calibrada";
  metricas.forEach(k => {
    const f = fiabilidadJugador(k);
    const c = f ? (NIVEL_A_CONFIANZA[f.nivel] || "sin_medir") : "sin_medir";
    if(CONFIANZAS.indexOf(c) < CONFIANZAS.indexOf(peor)) peor = c;
  });
  return peor;
}

/* Por línea, y no una lista sola de los más goleadores. Con una lista
   sola la delantera se lleva todos los lugares siempre — que es verdad
   y es inútil: el que mira ya sabe que los delanteros rematan más. Lo
   que no sabe es cuál de los volantes de ESTE partido llega mejor, y
   eso solo se ve comparando adentro de su línea. */
const JUG_LINEAS = [
  ["F", "Delantera"],
  ["M", "Mediocampo"],
  ["D", "Defensa"],
];

function jugadoresDe(m, porLinea = 2){
  const de = id => (PLANTELES[String(id)] || []);
  const pool = [];
  [[m.homeId, m.home], [m.awayId, m.away]].forEach(([id, equipo])=>{
    de(id).forEach(j=>{
      const e = ((j.serie || {}).esp) || {};
      if(e.goles == null) return;
      /* `serie.pj` y NO `j.pj`: el esperado se calcula con la serie
         reciente, no con la temporada entera. Poner "23 partidos"
         debajo de un número que sale de 3 dice que el dato es más
         firme de lo que es — y el que lee no tiene cómo saberlo. */
      pool.push({nombre: j.nombre, equipo: equipo, pos: j.pos,
                 pj: (j.serie || {}).pj || 0, esp: e});
    });
  });
  /* Por chance de gol, que es lo que la gente mira primero y además la
     métrica mejor calibrada de las tres. */
  const out = [];
  JUG_LINEAS.forEach(([pos, etiqueta])=>{
    const linea = pool.filter(j => j.pos === pos)
      .sort((a, b)=> (b.esp.goles || 0) - (a.esp.goles || 0))
      .slice(0, porLinea);
    if(linea.length) out.push({linea: etiqueta, jugadores: linea});
  });
  return out;
}

function ejesDe(m){
  const L = ESTADISTICAS[String(m.homeId)], V = ESTADISTICAS[String(m.awayId)];
  const jug = jugadoresDe(m);
  const mets = JUG_METRICAS.map(([k]) => k);
  return construirEjes({
    liga:     ligaDe(m, L, V),
    probs:    lectura(m).p,
    goles:    {esperados: m.lh + m.la},
    mercado:  m.mercado || null,
    dominio:  dominioDe(L, V),
    contexto: ANALISIS[m.id] || null,
    estadisticas: ANALISIS_EST[m.id] || null,
    jugadores: jug,
    confianzaJugadores: jug.length ? confianzaJugadores(mets) : null,
    calibracionJugadores: mets.reduce((o, k)=>{
      const f = fiabilidadJugador(k);
      if(f) o[k] = {nivel: f.nivel, n: f.n};
      return o;
    }, {}),
  });
}

function bloqueJugadores(m){
  const eje = ejesDe(m).find(e => e.eje === "jugadores");
  if(!eje || !eje.estimacion || !eje.estimacion.length) return "";

  const chip = eje.confianza === "mal_calibrada"
    ? "UNA DE LAS TRES NO ES DE FIAR"
    : "CALIBRADO · NO ES UNA APUESTA";

  let h = `<div class="banda banda2">${esc_(eje.titulo)}<em>${chip}</em></div>
    <div class="sec">${lecturaDeEje(eje)}<div class="grp">`;

  eje.estimacion.forEach(grupo=>{
    h += `<div class="gh">${esc_(grupo.linea)}</div>`;
    grupo.jugadores.forEach(j=>{
      const cifras = JUG_METRICAS.map(([k, etiqueta])=>{
        const f = fiabilidadJugador(k);
        const flojo = f && f.nivel === "mal";
        return `<span class="jm${flojo ? " flojo" : ""}">${esc_(etiqueta)}
          <b>${(j.esp[k] || 0).toFixed(2)}</b></span>`;
      }).join("");
      h += `<div class="mrow">
        <div class="top2"><span class="mkt">${esc_(j.nombre)}</span>
          <span class="modelo">${esc_(j.equipo)}</span></div>
        <div class="jugcifras">${cifras}</div>
        <div class="umb">el número sale de sus últimos
          ${Math.round(j.pj || 0)} partidos</div>
      </div>`;
    });
  });

  /* El hueco declarado, no escondido: decir cuál de las tres no sirve
     es más útil que un promedio de confianza que no significa nada. */
  const malas = JUG_METRICAS.filter(([k])=>{
    const f = fiabilidadJugador(k);
    return f && f.nivel === "mal";
  }).map(([, e]) => e);

  h += `</div><div class="foot">Números esperados para este partido, de la serie
    reciente de cada uno.${malas.length ? ` <b>${esc_(malas.join(" y "))}</b> aparece en gris
    porque está medido que le erra bastante más de lo que explica el azar — lo mostramos
    para comparar jugadores entre sí, no para jugarlo.` : ""}
    Contra el precio de la casa esto todavía no se midió, así que no marcamos nada.</div></div>`;
  return h;
}

/* El texto que escribe la skill del mercado de estadísticas, arriba de
   los números del eje. Va antes y no después a propósito: la frase dice
   qué mirar, y los números sin esa frase son una tabla. Si no hay
   análisis cargado, el bloque queda exactamente como antes. */
function lecturaDeEje(eje){
  if(!eje || !eje.lectura) return "";
  return `<div class="read lectura-eje"><p>${esc_(eje.lectura)}</p></div>`;
}

function bloqueDominio(m){
  const eje = ejesDe(m).find(e => e.eje === "dominio");
  if(!eje) return "";
  const L = eje.estimacion.local, V = eje.estimacion.visita;
  const filas = DOMINIO_METRICAS.filter(([k]) => L[k] != null && V[k] != null);
  if(!filas.length) return "";

  /* El chip dice lo que la medición dice, y nada más. `sin_medir` no es
     un error ni un "todavía no": es el estado real de arg y bra, donde
     la fuente no publica estadísticas por partido. */
  const sinMedir = eje.confianza === "sin_medir";
  const chip = sinMedir ? "SIN MEDIR EN ESTA LIGA" : "CALIBRADO · NO ES UNA APUESTA";

  let h = `<div class="banda banda2">${esc_(eje.titulo)}<em>${chip}</em></div>
    <div class="sec">${lecturaDeEje(eje)}<div class="grp">`;

  filas.forEach(([k, etiqueta])=>{
    const a = L[k], b = V[k], tot = a + b;
    const pct = tot > 0 ? Math.round(a / tot * 100) : 50;
    const ap = (eje.aporte || {})[k];
    h += `<div class="mrow">
      <div class="top2"><span class="mkt">${esc_(etiqueta)}</span>
        <span class="modelo">${a.toFixed(1)} — ${b.toFixed(1)}</span></div>
      <div class="barra2"><i style="width:${pct}%"></i></div>
      <div class="umb">${esc_(m.home)} ${pct}% del total esperado${
        ap != null ? ` · le sacamos <b>${ap.toFixed(1)}%</b> de error al promedio de la liga` : ""
      }</div>
    </div>`;
  });

  h += `</div><div class="foot">${sinMedir
    ? `En esta liga la fuente no publica estadísticas por partido, así que
       <b>no hay medición</b> detrás de estos números: son el promedio de lo poco que
       vimos, y los mostramos como dato, no como lectura.`
    : `Medido partido a partido en las últimas temporadas: acá le ganamos al promedio de
       la liga. <b>No lo marcamos como oportunidad</b> y no es un descuido — contra el
       precio de la casa nunca se midió, y no se puede medir hacia atrás porque no hay
       cuotas históricas de córners. Hasta que las juntemos, esto se lee y no se juega.`
  }</div></div>`;
  return h;
}

/* ── 3. Historial ──────────────────────────────────────────────── */
function tabHistorial(m){
  const bloque = (nombre, logo, forma)=>{
    if(!forma || !forma.length) return `<div class="eqhd">${crest(logo)}<b>${esc_(nombre)}</b></div>
      <div class="vacio" style="padding:8px 0">Sin partidos recientes cargados.</div>`;
    const g = forma.filter(f=>f.r==="W").length, e = forma.filter(f=>f.r==="D").length;
    const p = forma.length - g - e;
    /* En `marcador` el primer número es SIEMPRE el del equipo del que
       es la fila, no el del local. Verificado sobre los 206 partidos
       con resultado de la muestra: 206 de 206 cierran con esta lectura
       y solo 109 con la otra. */
    const goles = f => (f.marcador||"").split("-").map(Number);
    const hechos = forma.reduce((s,f)=> s + (goles(f)[0]||0), 0);
    const recib  = forma.reduce((s,f)=> s + (goles(f)[1]||0), 0);
    /* El escudo del rival se resuelve por nombre contra los equipos que
       ya están en el archivo: no hay un campo de logo en `formH`. */
    return `<div class="fcard">
      <div class="fhd">${crest(logo, 20)}<b>${esc_(nombre)}</b>
        ${tiraForma(forma, "gr")}</div>
      <div class="racha">${g}G ${e}E ${p}P · ${hechos} hechos, ${recib} recibidos en los últimos ${forma.length}</div>
      <!-- Del más viejo al de hoy, igual que la tirita de arriba y que el
           título de la banda. El array viene del más nuevo al más viejo. -->
      <div class="flist">${forma.slice().reverse().map(f=>`
        <div class="frow">
          <span class="r ${f.r}">${f.r==="W"?"G":f.r==="D"?"E":"P"}</span>
          ${crest(logoDe(f.rival), 15)}
          <span class="rival">${esc_(f.rival)}</span>
          <span class="loc">${f.local?"Local":"Visita"}</span>
          <span class="sc">${esc_(f.marcador||"")}</span>
        </div>`).join("")}</div>
    </div>`;
  };
  let h = `<div class="banda banda2">Últimos cinco<em>DEL MÁS VIEJO AL DE HOY</em></div>`;
  h += bloque(m.home, m.homeLogo, m.formH_general);
  h += bloque(m.away, m.awayLogo, m.formA_general);

  h += `<div class="banda banda2">Cruces directos<em>${m.h2h&&m.h2h.length?String(m.h2h.length).padStart(2,"0"):"00"}</em></div>`;
  if(m.h2h && m.h2h.length){
    /* Cada cruce es un talón, con la fecha en el riel y el marcador
       grande en el medio: se lee como el resultado de un programa, no
       como una fila de planilla. */
    h += m.h2h.map(x=>`<div class="h2h">
      <div class="talon"><div class="pn2">${esc_((x.d||"").slice(0,5))}</div>
        <div class="de">${esc_((x.d||"").slice(6))}</div></div>
      <div class="perf"></div>
      <div class="cuerpo">
        <div class="linea">
          <div class="lado">${crest(logoDe(x.h))}<span>${esc_(x.h)}</span></div>
          <div class="marc">${esc_(x.s)}</div>
          <div class="lado der"><span>${esc_(x.a)}</span>${crest(logoDe(x.a))}</div>
        </div>
      </div></div>`).join("");
  } else {
    h += `<div class="sec"><p class="prosa" style="font-size:11.5px;color:var(--gris2)">
      No se cruzaron en el historial que tenemos, así que no hay antecedente directo.</p></div>`;
  }
  return h;
}

/* El escudo de un rival, buscado por nombre entre los equipos que ya
   están en el archivo. No siempre está, y cuando no está el hueco se
   esconde solo — el crest con `ph` ya lo maneja. */
function logoDe(nombre){
  const n = norm(nombre);
  let url = "";
  MATCHES.forEach(m=>{
    if(!url && norm(m.home)===n) url = m.homeLogo;
    if(!url && norm(m.away)===n) url = m.awayLogo;
  });
  return url;
}

/* ── 4. Posiciones ─────────────────────────────────────────────── */
function tabPosiciones(m){
  if(!m.tabla || !m.tabla.length){
    return `<div class="banda">Posiciones</div>
      <div class="sec"><div class="big" style="font-size:20px">Sin tabla para esta competición</div>
      <p class="prosa" style="color:var(--gris)">En las llaves por eliminación no hay tabla que
        mostrar, y la fuente tampoco la devuelve.</p></div>`;
  }
  const mios = new Set([String(m.homeId), String(m.awayId)]);
  const porGrupo = {};
  m.tabla.forEach(f=> (porGrupo[f.grupo||""] = porGrupo[f.grupo||""]||[]).push(f));

  let h = `<div class="banda banda2">${esc_(grupoEs(m.grupo, m.comp) || m.comp)}
    <em>${esc_((COMPS_CORTO[m.comp]||m.comp).toUpperCase())}</em></div><div class="tablawrap">`;

  for(const g in porGrupo){
    if(Object.keys(porGrupo).length > 1 && g)
      h += `<div class="lbl" style="margin-top:14px">${esc_(grupoEs(g, m.comp))}</div>`;
    /* Sin columna de diferencia de gol: la tabla de ESPN trae goles a
       favor pero no en contra, así que DG saldría vacía en todas las
       filas. Va G-E-P, que sí tenemos. */
    h += `<table class="stand">
      <tr><th class="l">#</th><th class="l">Equipo</th><th>Pts</th><th>PJ</th><th>G-E-P</th><th>GF</th></tr>` +
      porGrupo[g].map((f,i)=>{
        const yo = mios.has(String(f.id));
        return `<tr class="${yo?"me":""}">
          <td class="rk">${i+1}</td>
          <td class="l"><div class="wrap">${crest(f.logo)}<span>${esc_(f.t)}</span></div></td>
          <td class="pts">${f.pts}</td><td>${f.pj}</td>
          <td>${f.g}-${f.e}-${f.p}</td>
          <td>${f.gf!=null?f.gf:"—"}</td></tr>`;
      }).join("") + `</table>`;
  }
  h += `</div>`;

  const n = quienFalta(m);
  if(n) h += `<div class="sec"><div class="rot"><span>${esc_(n.rotulo)}</span></div>
    <p class="prosa">${n.texto}</p></div>`;
  return h;
}

/* ══════════════════════════════════════════════════════════════════
   POR QUÉ FALTA UN EQUIPO EN LA TABLA

   Hay DOS motivos distintos y decir el equivocado es peor que callarse.

   Medido sobre los 34 partidos del 2026-08-17: de 24 partidos donde uno
   de los dos equipos no está en la tabla, en 19 el equipo está en otra
   zona o grupo de la misma competición — o sea que la tabla está
   completa y el cruce es entre grupos. Solo en 5 el equipo no aparece
   en ninguna tabla de esa competición: ahí sí falta el dato.

   El handoff de diseño trataba los 24 como hueco de datos, citando
   Flamengo vs Cruzeiro. Verificado: Cruzeiro está en el Grupo D de la
   misma Libertadores, así que ese caso es un cruce de llave y la nota
   habría dicho algo falso. Por eso se parte en dos.
   ══════════════════════════════════════════════════════════════════ */
function quienFalta(m){
  const tabla = m.tabla || [];
  if(!tabla.length) return null;
  const hayLocal = tabla.some(f=> String(f.id)===String(m.homeId));
  const hayVisita = tabla.some(f=> String(f.id)===String(m.awayId));
  if(hayLocal && hayVisita) return null;
  if(!hayLocal && !hayVisita) return null;   // ninguno: no es "su" tabla

  const nombre = hayLocal ? m.away : m.home;
  const id = String(hayLocal ? m.awayId : m.homeId);
  const zona = grupoEs(m.grupo, m.comp) || "esta tabla";

  /* ¿Está en otro grupo de la misma competición? Se busca en las tablas
     del resto de los partidos, que es todo lo que tenemos a mano. */
  let otro = null;
  MATCHES.forEach(x=>{
    if(x.comp !== m.comp || x.grupo === m.grupo) return;
    if((x.tabla||[]).some(f=> String(f.id)===id)) otro = grupoEs(x.grupo, x.comp);
  });

  if(otro) return {
    rotulo: "Juegan cruzado",
    texto: `${esc_(nombre)} no está en esta tabla porque no está en este grupo: juega en
      <b>${esc_(otro)}</b>. La tabla de arriba es la de ${esc_(zona)} y está completa —
      este partido cruza los dos grupos.`,
  };

  return {
    rotulo: "Falta uno",
    texto: `${esc_(nombre)} no aparece: la fuente devolvió estas ${tabla.length} líneas y
      ninguna es suya, y tampoco figura en las otras tablas de la competición. Preferimos
      mostrarte la tabla incompleta y decírtelo, antes que inventarle una posición.`,
  };
}

/* ── 5. Plantel ────────────────────────────────────────────────── */
/* ── Estadísticas ──────────────────────────────────────────────────
   Córners, tarjetas y remates: el mercado que se apuesta por línea.

   Vivía adentro de Plantel, debajo de los jugadores. Nadie que quiera
   apostar córners abre una pestaña que dice "Plantel": estaba
   construido y no se encontraba. Tiene pestaña propia desde el
   2026-08-24. */
function tabEstadisticas(m){
  let h = `<div class="banda banda2">Estadísticas<em>CÓRNERS · TARJETAS · REMATES</em></div><div class="sec">`;
  /* Primero lo que hicieron, después lo que esperamos. Las dos cosas
     hablan de córners y faltas, así que el orden y las etiquetas tienen
     que dejar claro cuál es cuál: una es medición, la otra es
     estimación. Juntas y sin distinguir se leían como el mismo número
     dicho dos veces. */
  h += comparativa(m);
  /* Lo que hicieron, y recién despues la chance de pasar una linea.
     El orden importa: la escalera es una lectura DE esos numeros, y
     puesta antes se leeria como un dato medido mas. */
  h += bloqueLineas(m);
  h += bloqueCornersReales(m);
  h += `<div class="lbl sep">Lo que esperamos acá</div>
    <div class="tstats">
      <div class="t"><span>Córners</span><b>${m.corners!=null?m.corners.toFixed(1):"—"}</b></div>
      <div class="t"><span>Faltas</span><b>${m.fouls!=null?m.fouls.toFixed(1):"—"}</b></div>
      <div class="t"><span>Tarjetas</span><b>${m.cards!=null?m.cards.toFixed(1):"—"}</b></div>
    </div>
    <p class="fuente">Estimación para este partido, sumando a los dos equipos. Los números
      de arriba son lo que cada uno viene haciendo; estos son lo que esperamos hoy.</p>`;
  return h + `</div>`;
}

function tabPlantel(m){
  const stat = (id, tabla)=> (tabla||[]).find(f=>String(f.id)===String(id));
  const bloque = (nombre, id, logo)=>{
    const t = stat(id, m.tabla);
    let h = `<div class="eqblock"><div class="eqhd">${crest(logo)}<b>${esc_(nombre)}</b></div>`;
    if(t){
      h += `<div class="tstats">
        <div class="t"><span>Puntos</span><b>${t.pts}</b></div>
        <div class="t"><span>Jugados</span><b>${t.pj}</b></div>
        <div class="t"><span>Ganados</span><b>${t.g}</b></div>
        <div class="t"><span>Goles a favor</span><b>${t.gf!=null?t.gf:"—"}</b></div>
      </div>`;
    }
    return h + `</div>`;
  };

  /* Cara a cara antes del detalle de cada equipo: es lo primero que uno
     quiere saber cuando abre esta pestaña. */
  const tl = stat(m.homeId, m.tabla), tv = stat(m.awayId, m.tabla);
  let h = `<div class="banda banda2">Plantel<em>ESTILO Y ACTUALIDAD</em></div><div class="sec">`;
  if(tl && tv){
    const fila = (etiqueta, a, b)=>{
      const tope = Math.max(a, b, 1);
      const cls = a>b ? "gana-i" : b>a ? "gana-d" : "";
      return `<div class="fila ${cls}">
        <span class="n">${a}</span>
        <span class="barra izq"><i style="width:${a/tope*100}%"></i></span>
        <span class="q">${etiqueta}</span>
        <span class="barra der"><i style="width:${b/tope*100}%"></i></span>
        <span class="n d">${b}</span></div>`;
    };
    h += `<div class="lbl">Cara a cara en el torneo</div><div class="vs">
      ${fila("Puntos", tl.pts, tv.pts)}
      ${fila("Ganados", tl.g, tv.g)}
      ${fila("Goles", tl.gf!=null?tl.gf:0, tv.gf!=null?tv.gf:0)}
    </div>
    ${/* Los bloques de abajo se sacaron por repetir estos mismos numeros,
          pero traian uno que aca no esta: los partidos jugados. Sin el,
          "30 puntos" contra "41 puntos" se compara mal — en Argentina los
          equipos llegan a la misma fecha con distinta cantidad de partidos.
          Va de pie y no de barra porque quien jugo mas no gana nada. */
      tl.pj || tv.pj
        ? `<p class="fuente">${tl.pj === tv.pj
             ? `Sobre ${tl.pj} partido${tl.pj === 1 ? "" : "s"} de cada uno.`
             : `Sobre ${tl.pj} partido${tl.pj === 1 ? "" : "s"} de ${esc_(m.home)} y
                ${tv.pj} de ${esc_(m.away)} — no llegan con los mismos jugados.`}</p>`
        : ""}`;
  } else {
    /* Sin los dos en la misma tabla no hay comparación posible. Antes
       el bloque simplemente no aparecía y el usuario no sabía si era
       que no había datos o que la app se los guardaba. Se declara. */
    const n = quienFalta(m);
    h += `<div class="lbl">Cara a cara en el torneo</div>
      <p class="blurb" style="color:var(--gris)">${n
        ? n.texto.replace(/La tabla de arriba[^.]*\./, "").trim() +
          " Sin los dos en la misma tabla no hay comparación que hacer."
        : "No tenemos a los dos equipos en una misma tabla, así que no hay comparación que hacer."}</p>`;
  }
  /* Los dos bloques de Puntos/Jugados/Ganados/Goles repetían, en un
     tercer dibujo, los mismos cuatro números que ya están arriba en las
     barras del cara a cara y enteros en la pestaña Posiciones. Se
     muestran solo cuando NO hay cara a cara, que es cuando el dato no
     aparece en ningún otro lado de esta pestaña. */
  if(!(tl && tv)) h += bloque(m.home, m.homeId, m.homeLogo) + bloque(m.away, m.awayId, m.awayLogo);
  h += cancha(m);
  return h + `</div>`;
}

/* Lo que cada equipo hace por partido, uno al lado del otro. Sale del
   mismo /summary que el pipeline ya pedía para los córners del modelo:
   traía 25 métricas por equipo y se guardaban 3.

   Enfrentadas y no en dos listas sueltas porque así es como se leen: la
   pregunta es "quién remata más", no "cuánto remata este". */
/* `cruza:false` en las métricas donde "lo que concede el rival" no
   significa nada. La posesión es complementaria (la de los dos suma
   100, así que "conceder posesión" es literalmente lo mismo que tenerla
   menos), y la precisión de pase y las atajadas describen al equipo que
   las hace, no algo que el rival permita. */
/* ══════════════════════════════════════════════════════════════════
   LA PROBABILIDAD DE UNA LÍNEA

   El mercado no vende promedios, vende líneas: "más de 4.5 córners".
   Un promedio de 4.7 no contesta esa pregunta, y esconde la que sí
   importa — cuánto se mueve ese equipo alrededor de su promedio.

   Dos equipos de 2.0 remates promedio, uno regular y otro errático:
   el errático tiene MÁS chance de pasar 3.5 y MENOS de pasar 1.5. Mismo
   número, apuestas opuestas. Por eso acá no se compara contra la media
   sino que se integra la cola que queda arriba de la línea.

   Qué campana se usa sale de lo que se midió, métrica por métrica, con
   la varianza que tiene cada una alrededor de su media (`disp`, que el
   cron recalcula solo):

     disp > 1  más despatarrada que Poisson (remates: 2.95, córners
               1.75) — binomial negativa, colas gordas
     disp ~ 1  Poisson tal cual
     disp < 1  MÁS regular que Poisson (tarjetas: 0.72) — binomial,
               colas flacas

   Usar Poisson para todo, que es lo que hace casi cualquier planilla,
   subvalúa las colas de remates y sobrevalúa las de tarjetas.
   ══════════════════════════════════════════════════════════════════ */
function probMayor(mu, disp, linea){
  if(mu == null || !isFinite(mu) || mu <= 0) return null;
  if(linea == null || !isFinite(linea)) return null;
  /* Línea 4.5 quiere decir "5 o más". Con líneas enteras el mercado
     devuelve el dinero en el empate; acá se toma el lado estricto. */
  const k0 = Math.floor(linea) + 1;
  if(k0 <= 0) return 1;
  const d = (disp != null && isFinite(disp) && disp > 0) ? disp : 1;
  let acum = 0, t;                       // acum = P(X <= k0-1)
  if(d > 1.05){
    const r = mu / (d - 1), p = 1 / d, q = 1 - p;
    t = Math.pow(p, r);
    for(let k = 0; k < k0; k++){ acum += t; t = t * (k + r) / (k + 1) * q; }
  } else if(d < 0.95){
    /* Menos dispersa que Poisson: ninguna binomial negativa puede
       hacer eso, pero la binomial común sí. Si el ajuste no da una
       binomial válida (o su techo queda debajo de la línea, donde
       daría un cero que no es cierto), se usa Poisson. */
    const n = Math.round(mu / (1 - d));
    const p = n > 0 ? mu / n : 1;
    if(!(n >= k0 && p > 0 && p < 1)) return probMayor(mu, 1, linea);
    t = Math.pow(1 - p, n);
    for(let k = 0; k < k0; k++){ acum += t; t = t * (n - k) / (k + 1) * p / (1 - p); }
  } else {
    t = Math.exp(-mu);
    for(let k = 0; k < k0; k++){ acum += t; t = t * mu / (k + 1); }
  }
  return Math.min(1, Math.max(0, 1 - acum));
}

/* Las métricas que se apuestan por línea. Posesión y pases quedan
   afuera a propósito: no hay mercado de "más de 51.5% de posesión", y
   un porcentaje no es un conteo — la campana de acá no lo describe. */
const LINEAS = [
  {k:"corners",  et:"Córners"},
  {k:"tarjetas", et:"Tarjetas"},
  {k:"remates",  et:"Remates"},
  {k:"al_arco",  et:"Al arco"},
  {k:"faltas",   et:"Faltas"},
];

/* Qué parte de un número es del equipo y qué parte es de la liga.

   No es un adorno: con la muestra de hoy, en remates `k` da 200, o sea
   que la diferencia entre dos equipos es del tamaño del ruido y lo
   esperable para los dos es casi el promedio de la liga. Mostrar el
   número sin decir eso sería aparentar una precisión que no hay. */
function pesoEquipo(n, k){
  if(!n) return 0;
  if(k == null || !isFinite(k)) return 1;
  return n / (n + k);
}

/* Cuatro líneas alrededor de lo esperado, siempre en .5 para que no
   exista el empate (en una línea entera la casa devuelve el dinero y
   la probabilidad de acá no describiría esa apuesta). */
function lineasDe(mu){
  const base = Math.round(mu);
  return [base - 1.5, base - 0.5, base + 0.5, base + 1.5].filter(L => L > 0);
}

/* Qué tan fiable es cada métrica, según lo medido — no según lo que
   nos gustaría.

   Los cinco botones se veían iguales, y no lo son. Medido el 2026-08-24
   sobre 179 partidos: córners le erra 3.5 puntos sin dirección clara,
   pero FALTAS le erra 9.0 y siempre para el mismo lado, y REMATES 6.6
   también siempre para el mismo. Cuando el desvío es casi todo sesgo,
   no es ruido que se compense apostando más: es un error que se paga
   todas las veces.

   Sin el archivo de calibración no se dice nada. Afirmar que una
   métrica es confiable sin haberla medido es peor que callarse. */
/* Lo mismo para las líneas de jugador, con una diferencia que importa:
   acá el veredicto NO se recalcula en el navegador, viene resuelto en
   `data/calibracion_jugadores.json`.

   Es a propósito. El corte no puede ser un desvío fijo, porque el mismo
   desvío significa cosas distintas según cuántos casos haya: con 618
   predicciones, un modelo PERFECTO ya desvía 3.5 puntos por puro azar.
   Lo que decide es desvío/ruido, y el ruido se estima simulando —
   cuenta que vive en medir_jugadores.py y no tiene por qué correr en
   el teléfono de nadie. */
function fiabilidadJugador(k){
  const c = (CAL_JUG || {})[k];
  if(!c || !c.n || !c.nivel || !c.texto) return null;
  return {nivel: c.nivel, texto: c.texto, n: c.n, serie: c.serie || null};
}

function fiabilidad(k){
  const c = CALIBRACION[k];
  if(!c || !c.n) return null;
  const sesgo = c.sesgo, desvio = c.desvio;
  /* Qué proporción del error tiene dirección. Arriba de 0.7 el error es
     sistemático: le erramos siempre para el mismo lado. */
  const dirigido = desvio > 0 ? Math.abs(sesgo)/desvio : 0;
  const grave = desvio >= 6 && dirigido >= 0.7;
  const flojo = desvio >= 6 || (desvio >= 4 && dirigido >= 0.7);
  const lado = sesgo > 0 ? "de más" : "de menos";
  return {
    grave, flojo, n: c.n, desvio, sesgo, dirigido,
    texto: grave
      ? `Le erramos ${Math.abs(sesgo).toFixed(0)} puntos ${lado}, y casi siempre para el mismo lado. Medido sobre ${c.n} predicciones: esto no es ruido, se paga todas las veces.`
      : flojo
      ? `Le erramos ${desvio.toFixed(1)} puntos en promedio, con tendencia a decir ${lado}. Medido sobre ${c.n} predicciones.`
      : `Le erramos ${desvio.toFixed(1)} puntos en promedio, sin dirección clara. Medido sobre ${c.n} predicciones.`,
  };
}

/* Los parametros de la liga del partido, con el pozo global de respaldo.

   Los dos equipos de un partido de liga comparten liga, asi que alcanza
   con mirar uno; en una copa pueden no compartirla, y ahi cae al global
   — que es peor pero no le aplica a un equipo la vara de otro pais. */
function paramsDe(L, V){
  const lg = (L && L.liga) || (V && V.liga);
  if(lg && V && V.liga && L && L.liga && L.liga !== V.liga) return PARAMETROS;
  return (lg && PARAM_LIGA[lg]) || PARAMETROS;
}

function bloqueLineas(m){
  const L = ESTADISTICAS[String(m.homeId)], V = ESTADISTICAS[String(m.awayId)];
  if(!L || !V) return "";
  const PARAMETROS = paramsDe(L, V);
  const hay = LINEAS.filter(x => PARAMETROS[x.k]
    && L.esperado && L.esperado[x.k] != null
    && V.esperado && V.esperado[x.k] != null);
  if(!hay.length) return "";
  const x = hay.find(y => y.k === LIN_MET) || hay[0];
  const p = PARAMETROS[x.k];
  const muL = L.esperado[x.k], muV = V.esperado[x.k];

  const escalon = (titulo, mu, disp, nota, sinMuestra) => {
    const celdas = lineasDe(mu).map(Ln => {
      const q = probMayor(mu, disp, Ln);
      return q == null ? ""
        : `<b>+${Ln.toFixed(1)}<em>${Math.round(q * 100)}%</em></b>`;
    }).join("");
    if(!celdas) return "";
    /* Cuando el número del equipo es casi todo promedio de la liga, los
       dos equipos muestran valores idénticos y parece un error. No lo
       es: es el encogimiento diciendo que no hay muestra. Pero decirlo
       en letra chica debajo de cuatro líneas de apuesta era engañoso en
       la jerarquía aunque fuera honesto en el texto. */
    const aviso = sinMuestra
      ? `<i class="sinmuestra">Sin muestra propia todavía — esto es el promedio de la liga, no una lectura de este equipo</i>`
      : "";
    return `<div class="escf"><span class="escq">${titulo}</span>
      <i class="desv">${mu.toFixed(1)} esperados · ${nota}</i>
      ${aviso}
      <div class="escl">${celdas}</div></div>`;
  };

  const propio = eq => {
    const n = (eq.n && eq.n[x.k]) || 0;
    const w = Math.round(pesoEquipo(n, p.k) * 100);
    return `${w}% de su muestra, ${100 - w}% del promedio de la liga`;
  };

  /* El total NO se calcula sumando dos equipos independientes. Se midió
     aparte y da distinto: en córners un equipo suelto tiene dispersión
     1.75 y el total del partido 1.01, porque son medio suma cero — si
     uno ataca, el otro no. Sumar dos modelos sueltos infla las colas y
     hace ver valor donde no hay. */
  /* Debajo de este peso, el número del equipo es casi todo liga. 0.25
     no es a ojo: con menos de eso los dos equipos dan el MISMO valor y
     la pantalla deja de hablar de este partido. */
  const SIN_MUESTRA = 0.25;
  const pesoDe = eq => pesoEquipo((eq.n && eq.n[x.k]) || 0, p.k);
  const filas = [
    escalon(esc_(m.home), muL, p.disp, propio(L), pesoDe(L) < SIN_MUESTRA),
    escalon(esc_(m.away), muV, p.disp, propio(V), pesoDe(V) < SIN_MUESTRA),
    escalon("Total del partido", muL + muV,
            p.disp_total != null ? p.disp_total : p.disp,
            p.disp_total != null ? "dispersión medida sobre el total"
                                 : "sin medición propia del total",
            false),
  ].join("");

  const botones = hay.map(y =>
    `<button class="met${y.k === x.k ? " on" : ""}" data-linmet="${y.k}">${y.et}</button>`
  ).join("");

  const fi = fiabilidad(x.k);
  const juicio = fi
    ? `<p class="fiab ${fi.grave ? "mal" : fi.flojo ? "regular" : "bien"}">${fi.texto}</p>`
    : `<p class="fiab">Esta métrica todavía no se midió: no sabemos cuánto le erra.</p>`;

  return `<div class="lbl sep">Chance de pasar la línea</div>
    <div class="mets">${botones}</div>
    ${juicio}
    ${filas}
    <p class="fuente">La chance de que el número termine arriba de cada línea, con la
      campana que le corresponde a esta métrica — no todas se reparten igual, y usar
      Poisson para todo subvalúa las colas de remates y sobrevalúa las de tarjetas.
      Cuando un equipo tiene pocos partidos, su número se apoya en el promedio de la
      liga: ahí abajo dice cuánto. No es una cuota ni descuenta el margen de la casa.</p>`;
}

/* ══════════════════════════════════════════════════════════════════
   LO QUE COTIZA BET365 EN CÓRNERS — informativo, sin marca de valor

   A diferencia de "Chance de pasar la línea" (arriba), esto NO es una
   estimación nuestra: es el precio real de Bet365 (odds-api.io), con
   los dos lados y ya sin el margen de la casa (Shin, igual que a
   cualquier mercado de dos vías).

   No se marca como valor a propósito. medir_corners.py midió, el
   2026-08-25, que el córner por equipo le pierde plata al mercado
   (atraso de 0.0205 ±0.0093, ROI negativo en los seis umbrales) — la
   casa ya sabe distinguir equipos y nosotros ahí no le ganamos. Mostrar
   esto en dorado sería prometer una ventaja que se midió que no existe.
   ══════════════════════════════════════════════════════════════════ */
function filaCornerReal(etiqueta, lineas){
  if(!lineas) return "";
  const claves = Object.keys(lineas).sort((a,b)=>parseFloat(a)-parseFloat(b));
  const celdas = claves.map(k=>{
    const p = devigShin(lineas[k]);
    return p ? `<b>+${parseFloat(k).toFixed(1)}<em>${Math.round(p[0]*100)}%</em></b>` : "";
  }).join("");
  return celdas ? `<div class="escf"><span class="escq">${esc_(etiqueta)}</span>
    <div class="escl">${celdas}</div></div>` : "";
}
function bloqueCornersReales(m){
  const c = m.mercadoExtra && m.mercadoExtra.corners;
  if(!c) return "";
  const filas = [
    filaCornerReal("Total del partido", c.total),
    filaCornerReal(m.home, c.local),
    filaCornerReal(m.away, c.visita),
  ].join("");
  if(!filas) return "";
  return `<div class="lbl sep">Lo que cotiza Bet365</div>
    ${filas}
    <p class="fuente">Precio real de la casa, ya sin margen — no nuestra estimación.
      No lo marcamos como valor: medido, el córner por equipo le pierde plata al mercado
      (ver TRASPASO.md).</p>`;
}

const COMPARA = [
  {k:"remates",  et:"Remates"},
  {k:"al_arco",  et:"Al arco"},
  {k:"corners",  et:"Córners"},
  {k:"posesion", et:"Posesión", suf:"%", cruza:false},
  {k:"faltas",   et:"Faltas"},
  {k:"tarjetas", et:"Tarjetas"},
  {k:"offsides", et:"Offsides"},
  {k:"atajadas", et:"Atajadas", cruza:false},
  {k:"tackles",  et:"Quites"},
  /* Los pases dados solos no dicen nada ("380" ¿de cuántos?): lo que
     describe a un equipo es qué proporción le sale bien. */
  {k:"precision", et:"Pases OK", suf:"%", cruza:false,
   calc: e => e.pases != null && e.pases_tot ? (e.pases / e.pases_tot) * 100 : null},
];

/* Cuántos partidos necesita un split (local o visita) para usarse en vez
   del total.

   Medido el 2026-08-23 sobre los datos reales: el caché de resúmenes
   tiene mediana 3 partidos por equipo — es el tope de DISCIPLINA_N, que
   existe para el modelo, no para esto. Al partir esos 3 en local/visita
   quedan 1-2 por lado, y un promedio con un decimal sobre 2 partidos es
   el mismo "muestra chica" que el proyecto le prohíbe al análisis.

   Con 4 el split empieza a decir algo; abajo de eso el total (que
   duplica la muestra) es más honesto aunque mezcle las dos sedes. El
   caché crece solo con cada fecha, así que esto se va a ir habilitando
   con el tiempo sin pedir un request más. */
const MIN_SPLIT = 4;
const usable = (split, k) => split && split.n && (split.n[k]||0) >= MIN_SPLIT;

function comparativa(m){
  const Lt = ESTADISTICAS[String(m.homeId)], Vt = ESTADISTICAS[String(m.awayId)];
  /* Con los datos de uno solo, enfrentar un número contra un hueco
     invita a compararlos igual. Sin los dos no hay comparación. */
