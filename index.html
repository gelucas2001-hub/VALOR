  `<div class="tpie"></div><div class="tlbl"><span>${esc_(izq)}</span><span>${esc_(der)}</span></div>`;
const aire = px => `<div style="height:${px}px"></div>`;

/* ══════════════════════════════════════════════════════════════════
   CAPA 01 · VEREDICTO

   Todas las familias de mercado del partido en una sola escalera,
   ordenadas por lo que sabemos de cada una. Lo que NO se recomienda
   aparece igual, con el motivo: un mercado que no está se lee como un
   mercado que nadie miró, y uno que dice "sin precio" es una respuesta.
   ══════════════════════════════════════════════════════════════════ */

/* Cuánto de la banca dice la cuenta que va acá, en PORCENTAJE y no en
   pesos: el porcentaje no depende de que el usuario haya cargado su
   banca, y esta pantalla tiene que verse igual con banca y sin. La
   fracción de Kelly y el tope del 4% son los mismos que usa
   Herramientas — una sola cuenta en toda la app. */
function stakePct(m, p, c){
  if(!(c > 1)) return null;
  const kf = (m.conf>=72) ? 0.25 : (m.conf>=60) ? 0.125 : (m.conf>=50) ? 0.0625 : 0.005;
  const f = Math.min(kelly(p, c) * kf, 0.04);
  return f > 0 ? (f*100).toFixed(1) + "%" : null;
}

/* La muestra que sostiene los números de estadísticas de este cruce.
   Se declara la más chica de las dos: es la que limita la lectura. */
function muestraDe(m){
  const L = ESTADISTICAS[String(m.homeId)], V = ESTADISTICAS[String(m.awayId)];
  const n = Math.min((L && L.pj) || 0, (V && V.pj) || 0);
  return n ? n + " PJ" : "—";
}

/* Las seis familias del partido, cada una con su estado y su motivo.

   Los estados son cuatro y significan cosas distintas:

     SIN VENTAJA  hay precio, lo miramos, y no está a favor
     SIN PRECIO   no hay línea publicada contra la cual comparar
     SIN DATO     falta el dato de entrada (equipo sin caché, etc.)
     NO OPINAMOS  está medido que acá no sabemos lo suficiente

   El cuarto es el que más cuesta escribir y el más importante: dice
   que la medición existe y que salió mal. Un hueco declarado es
   información; un hueco tapado es una promesa que no vamos a cumplir. */
function mercadosDeVeredicto(m){
  const lec = lectura(m);
  const otros = otrosMercados(m);
  const dir = inclinacionDe(m.id);
  const al = alerta(m);
  const mk = m.mercado || {}, mx = m.mercadoExtra || {};
  const pq = devig(mk);
  const L = ESTADISTICAS[String(m.homeId)], V = ESTADISTICAS[String(m.awayId)];
  const sinValor = ligaSinValor(m), pocos = sinMuestra(m);

  /* Lo mejor de cada familia según NUESTRA lectura. La ventaja y la
     marca salen de otrosMercados(), no se recalculan acá: dos varas
     para lo mismo terminan diciendo cosas distintas el día que una de
     las dos cambie. */
  const mejor = fam => {
    /* En Goles, solo las líneas de la escalera (1.5 · 2.5 · 3.5). Sin
       ese corte "lo mejor" era siempre la línea más lejana —"menos de
       4.5 al 82%"— que tiene ventaja alta por construcción y no dice
       nada del partido: es la misma razón por la que LINEAS_ESCALERA
       existe. */
    const cands = otros.filter(x=> x.op.fam===fam && (!dir || !contradice(x.op, dir))
      && (fam !== "Goles" || LINEAS_ESCALERA.has(x.op.linea)));
    if(!cands.length) return null;
    const conV = cands.filter(x=> x.ventaja != null);
    return conV.length ? conV.slice().sort((a,b)=> b.ventaja - a.ventaja)[0]
                       : cands.slice().sort((a,b)=> b.op.p - a.op.p)[0];
  };

  const deMercado = (id, nombre, fam) => {
    const x = mejor(fam);
    if(!x) return {id, nombre, estado:"SIN DATO",
      motivo:"No tenemos lectura propia de este mercado en este partido."};
    const c = cuotaUsada(x.op, pq, mk, mx);
    const base = {id, nombre, op:x.op, ventaja:x.ventaja, cuota:c};
    /* El motivo dice SIEMPRE la lectura del mercado, y el estado dice
       por qué no se recomienda. Antes el motivo repetía la misma frase
       ("todavía nadie escribió la lectura") en las tres familias, y
       tres renglones idénticos no informan: ocupan. El porqué común va
       una sola vez, al pie de la escalera. */
    const lee = `${x.op.label} al ${pc(x.op.p)}`;
    if(x.esVal) return Object.assign(base, {estado:"OPORTUNIDAD"});
    /* Antes que cualquier otro motivo: si la muestra no da, el
       porcentaje no se publica. Decir "gana al 42%" y en el mismo
       renglón que no lo sabemos es publicarlo igual — el número queda
       en la cabeza del que lee. */
    if(pocos) return Object.assign(base, {estado:"SIN MUESTRA",
      motivo:`${partidosJugados(m)} fecha${partidosJugados(m)===1?"":"s"} jugadas: con eso las
        fuerzas se ajustan sobre nada y todos los equipos salen parecidos.`, op:null});
    if(c == null) return Object.assign(base, {estado:"SIN PRECIO",
      motivo:`${lee} · nadie publica esta línea`});
    if(sinValor) return Object.assign(base, {estado:"NO OPINAMOS",
      motivo:`${lee} · en esta liga la regla de valor resta`});
    /* El porqué es el mismo para las tres familias y se dice una vez al
       pie de la escalera: repetirlo en cada renglón no informa, ocupa. */
    if(!dir) return Object.assign(base, {estado:"NO OPINAMOS",
      motivo:`${lee} · pagan ${c.toFixed(2)}`});
    return Object.assign(base, {estado:"SIN VENTAJA",
      motivo:`${lee} · pagan ${c.toFixed(2)} y la mínima sería ${umbral(x.op.p).toFixed(2)}`});
  };

  const filas = [
    deMercado("resultado", "Resultado 1X2", "Resultado"),
    deMercado("goles", "Total de goles", "Goles"),
    deMercado("ambos", "Ambos marcan", "Ambos"),
  ];

  /* El precio ya está mejor de lo que vemos: eso no es una oportunidad
     al revés, es un aviso. Va con el borde de terracota y sin etiqueta
     de estado — el motivo ya lo dice, y una etiqueta más lo pondría a
     competir con las de al lado, que son otra cosa. */
  if(al){
    const f = filas.find(x=> x.id === "resultado");
    if(f){
      f.riesgo = true;
      f.motivo = `El mercado le da ${Math.round(al.dif*100)} puntos más que nosotros a ${
        al.nombre ? esc_(al.nombre) : "el empate"} — el precio ya está mejor de lo que vemos.`;
      if(f.estado !== "OPORTUNIDAD") f.estado = "";
    }
  }

  /* ── el mercado de estadísticas ────────────────────────────────
     Ninguna de estas familias se marca nunca en dorado, y no es un
     olvido. Contra el precio de la casa está medido que perdemos
     (medir_corners.py: atraso 0.0205 ±0.0093 en córners por equipo) o
     no está medido en absoluto. La calibración dice si el número es
     verdadero; el ROI dice si le gana al precio. Son dos preguntas y
     acá solo tenemos contestada la primera. */
  const hayEst = !!(L && V && L.esperado && V.esperado);
  const estFam = (id, k, nombre) => {
    if(!hayEst || L.esperado[k] == null || V.esperado[k] == null)
      return {id, nombre, estado:"SIN DATO",
        motivo:"La fuente no publica esta métrica por partido en esta liga."};
    const total = L.esperado[k] + V.esperado[k];
    const fi = fiabilidad(k);
    const hayPrecio = k === "corners" && !!(mx.corners);
    const fila = {id, nombre, estado:"NO OPINAMOS",
      motivo: `${total.toFixed(1)} esperados entre los dos · ${hayPrecio
        ? "hay línea real y medimos que ahí perdemos"
        : "medido contra la realidad, nunca contra el precio"}`};
    if(fi && fi.grave){
      fila.baja = true;
      fila.motivo = `${total.toFixed(1)} esperados · le erramos ${Math.abs(fi.sesgo).toFixed(0)} puntos, siempre para el mismo lado`;
    }
    return fila;
  };

  filas.push(estFam("corners", "corners", "Córners"));
  filas.push(estFam("tarjetas", "tarjetas", "Tarjetas"));
  filas.push(estFam("remates_eq", "remates", "Remates de equipo"));

  /* Los mercados de jugador. El CLV se midió el 2026-08-31 y parecía la
     primera señal positiva del proyecto (+4.28% ±2.14 sobre la deriva);
     los controles la desarmaron — un solo partido la sostenía y 11 de
     19 líneas ni se habían movido. Queda el instrumento, no la señal. */
  const props = Object.keys(mx.remates || {}).length + Object.keys(mx.al_arco || {}).length;
  const jug = jugadoresDe(m);
  if(!jug.length){
    /* La fuente no trae la serie reciente de todas las ligas: en las
       europeas el plantel viene con totales de temporada y sin el
       partido a partido. Sin serie no hay número de jugador que
       mostrar, aunque Bet365 sí publique las líneas. */
    filas.push({id:"jugadores", nombre:"Mercados de jugador", estado:"SIN DATO",
      motivo: props
        ? `${props} líneas de Bet365 · no tenemos la serie por jugador de estos planteles`
        : "No tenemos la serie por jugador de estos dos planteles"});
  } else if(!props){
    filas.push({id:"jugadores", nombre:"Mercados de jugador", estado:"SIN PRECIO",
      motivo:`${jug.reduce((s,g)=> s + g.jugadores.length, 0)} series cargadas, ninguna con línea publicada.`});
  } else {
    const mala = fiabilidadJugador("remates");
    filas.push({id:"jugadores", nombre:"Mercados de jugador", estado:"NO OPINAMOS",
      baja: !!(mala && mala.nivel === "mal"),
      motivo: mala && mala.nivel === "mal"
        ? `${props} líneas de Bet365 · remates se desvía ${((CAL_JUG.remates||{}).razon||0).toFixed(2)}× lo que explica el azar`
        : `${props} líneas de Bet365 · contra el precio no encontramos ventaja`});
  }

  /* La combinada del partido: dos patas de familias distintas con la
     probabilidad conjunta EXACTA sobre la matriz. Multiplicar las dos
     por separado da un número más chico y falso — las dos patas del
     mismo partido están correlacionadas. Nunca se marca: es una lectura
     compuesta, y componer dos mercados no crea ventaja donde no la
     había en ninguno de los dos. */
  const cmb = combinada(m);
  if(cmb) filas.push({id:"combinada", nombre:"Combinada del partido", estado:"NO OPINAMOS",
    combi: cmb, motivo:`${cmb.patas.map(x=> x.label).join(" + ")} · ${pc(cmb.p)} juntas`});

  const oportunidad = filas.find(x=> x.estado === "OPORTUNIDAD") || null;
  return {oportunidad, filas: filas.filter(x=> x !== oportunidad), lec, dir};
}

/* La tarjeta dorada. Es la única pieza con mostaza del partido entero,
   y solo aparece cuando otrosMercados() marcó valor — o sea con
   análisis cargado, dentro de la ventana medida, con piso de cuota y
   fuera de las ligas donde medimos que la regla resta. */
function tarjetaOportunidad(m, f){
  const c = f.cuota;
  const st = stakePct(m, f.op.p, c);
  const fam = f.id === "resultado" ? "Resultado" : f.id === "goles" ? "Goles" : "Ambos marcan";
  return `<div class="oport">
    <div class="oh"><b>Oportunidad detectada</b><span>${esc_(fam)}</span></div>
    <div class="otit">${esc_(f.op.label)}</div>
    <p>${esc_(cuandoCobra(f.op, m))} Le damos <b>${pc(f.op.p)}</b>${
      f.ventaja != null ? `, <b>${Math.round(f.ventaja*100)} puntos</b> más que la línea sin margen` : ""}.${
      /* La muestra sobre la que se apoya el cruce. El handoff le daba una
         celda propia; acá va en la frase porque la tercera celda la ocupa
         el precio real, que es contra lo que se compara la mínima. */
      muestraDe(m) !== "—" ? ` Sobre ${muestraDe(m)} de cada uno.` : ""}</p>
    <div class="ocels">
      <div class="cuota"><small>CUOTA MÍNIMA</small><b>${umbral(f.op.p).toFixed(2)}</b></div>
      <div><small>STAKE</small><b>${st || "—"}</b></div>
      <div class="muestra"><small>PAGAN</small><b>${c ? c.toFixed(2) : "—"}</b></div>
    </div>
    <button class="opie" data-capa="lectura"><span>De dónde sale</span><em>LECTURA ›</em></button>
  </div>`;
}

function filaMercado(m, f){
  const abierto = ABIERTOS.has("mk:" + f.id);
  const cls = f.riesgo ? "emk riesgo" : f.baja ? "emk baja" : "emk";
  return `<button class="${cls}" data-mk="${esc_(f.id)}">
      <div class="en"><b>${esc_(f.nombre)}</b><i>${esc_(f.motivo || "")}</i></div>
      <span class="mas">${abierto ? "−" : "+"}</span>
    </button>${abierto ? cuerpoMercado(m, f) : ""}`;
}

/* La escalera, cortada por estado. Ocho renglones que contestan NO
   OPINAMOS son ocho veces la misma respuesta: el estado sube al rótulo
   del grupo y cada fila se queda con lo único que no comparte con sus
   vecinas — su nombre y su motivo.

   Se agrupan solo las CONSECUTIVAS: el orden de la escalera dice algo
   —resultado, goles y ambos primero; después el mercado de
   estadísticas; la combinada al final— y reordenar para juntar
   etiquetas sería perder eso para ganar una línea.

   Las filas de riesgo no llevan estado a propósito, así que quedan
   sueltas y sin rótulo: el borde de terracota ya es la etiqueta. */
function escaleraMercados(m, filas){
  const grupos = [];
  filas.forEach(f=>{
    const ult = grupos[grupos.length - 1];
    if(f.estado && ult && ult.estado === f.estado) ult.filas.push(f);
    else grupos.push({estado: f.estado || "", filas: [f]});
  });
  return `<div class="emks">${grupos.map(g=>
    (g.estado ? `<div class="egr"><b>${esc_(g.estado)}</b><i></i></div>` : "")
    + g.filas.map(f=> filaMercado(m, f)).join("")).join("")}</div>`;
}

/* El cuerpo desplegado de una familia: el detalle que antes vivía en
   Pronósticos (la escalera de riesgo) o en Estadísticas (la chance de
   pasar la línea). No se recalcula nada — son las mismas funciones. */
function cuerpoMercado(m, f){
  if(f.id === "resultado"){
    const filas = escalera(m).filter(x=> x.op);
    if(!filas.length) return `<div class="emkc"><p>Sin candidatos en ninguna franja de riesgo.</p></div>`;
    return `<div class="emkc"><p>La escalera de riesgo, de lo más probable a lo más arriesgado.
      Solo Resultado: <b>medir_ejes.py</b> midió que en goles el aporte va de −0.9% a +0.4% sobre la
      tasa base, o sea nada.</p>
      <div class="cifras2">${filas.slice(0,3).map(x=>
        `<div><small>${esc_((x.franja.et || x.franja.nombre || "").toUpperCase())}</small>
          <b>${pc(x.op.p)}</b></div>`).join("")}</div>
      <p class="sep2">${filas.map(x=> esc_(x.op.label)).join(" · ")}</p></div>`;
  }
  if(f.id === "goles" || f.id === "ambos"){
    const lec = lectura(m);
    const ops = mercados(lec.M, m).filter(o=> o.fam === (f.id==="goles" ? "Goles" : "Ambos"));
    return `<div class="emkc"><p>Lo que dice el modelo, sin recomendarlo: en este eje el aporte
      sobre la tasa base está medido y es cero.</p>
      <div class="cifras2">${ops.slice(0, 3).map(o=>
        `<div><small>${esc_(o.label.toUpperCase())}</small><b>${pc(o.p)}</b></div>`).join("")}</div></div>`;
  }
  if(f.id === "combinada" && f.combi){
    const c = f.combi;
    return `<div class="emkc"><p>Las dos juntas pasan el <b>${pc(c.p)}</b> de las veces, calculado
      sobre la matriz del partido. Multiplicando las dos por separado daría ${pc(c.ingenua)}, que es
      más chico y es falso: las dos patas del mismo partido están correlacionadas.</p>
      <div class="cifras2">${c.patas.map(x=>
        `<div><small>${esc_(x.label.toUpperCase())}</small><b>${pc(x.p)}</b></div>`).join("")}</div>
      <p class="sep2">${esc_(cadaCuanto(c.p))}</p></div>`;
  }
  if(f.id === "jugadores"){
    return `<div class="emkc"><p>Las series están enteras en <b>Datos · Jugadores</b>, con los 18 de
      cada plantel y la titularidad en el renglón. Acá no las recomendamos: contra el precio de Bet365
      se midió el 31/08 y los controles desarmaron la señal.</p></div>`;
  }
  const k = f.id === "remates_eq" ? "remates" : f.id;
  const fi = fiabilidad(k);
  /* En córners hay además precio REAL de Bet365 (odds-api.io), con los
     dos lados y ya sin margen. Va sin marca de valor a propósito:
     medir_corners.py midió que el córner por equipo le pierde plata al
     mercado, y pintarlo de mostaza sería prometer una ventaja que se
     midió que no existe. */
  const reales = k === "corners" ? bloqueCornersReales(m) : "";
  return `<div class="emkc">${bloqueLineasDe(m, k)}
    <p class="sep2">${fi ? esc_(fi.texto)
      : "Esta métrica todavía no se midió: no sabemos cuánto le erra."}</p>
    ${reales}</div>`;
}

/* La escalera de líneas de una métrica: los dos equipos y el total.
   Sin los botones de la pestaña vieja, porque acá la métrica ya la
   eligió la fila que se desplegó.

   El total NO se calcula sumando dos equipos independientes: se midió
   aparte y da distinto (en córners un equipo suelto tiene dispersión
   1.75 y el total del partido 1.01, porque son medio suma cero). Por eso
   la fila del total usa `disp_total` cuando existe. */
function bloqueLineasDe(m, k){
  const L = ESTADISTICAS[String(m.homeId)], V = ESTADISTICAS[String(m.awayId)];
  if(!L || !V || !L.esperado || !V.esperado) return "<p>Sin dato de los dos equipos.</p>";
  const P = paramsDe(L, V)[k];
  if(!P || L.esperado[k] == null || V.esperado[k] == null) return "<p>Sin dato de los dos equipos.</p>";

  const fila = (etiqueta, mu, disp, nota)=>{
    const celdas = lineasDe(mu).map(Ln=>{
      const q = probMayor(mu, disp, Ln);
      return q == null ? "" : `<div><small>+${Ln.toFixed(1)}</small><b>${Math.round(q*100)}%</b></div>`;
    }).join("");
    if(!celdas) return "";
    return `<div class="lin2"><span class="lq">${esc_(etiqueta)}</span>
      <i class="ln2">${mu.toFixed(1)} esperados${nota ? " · " + esc_(nota) : ""}</i>
      <div class="cifras2">${celdas}</div></div>`;
  };
  /* Cuánto del número es del equipo y cuánto es promedio de la liga. Sin
     esto, dos equipos con la misma cifra parecen un error de render
     cuando en realidad es el encogimiento diciendo que no hay muestra. */
  const propio = eq => {
    const w = Math.round(pesoEquipo((eq.n && eq.n[k]) || 0, P.k) * 100);
    return `${w}% suyo, ${100-w}% de la liga`;
  };
  return fila(m.home, L.esperado[k], P.disp, propio(L))
       + fila(m.away, V.esperado[k], P.disp, propio(V))
       + fila("Total del partido", L.esperado[k] + V.esperado[k],
              P.disp_total != null ? P.disp_total : P.disp,
              P.disp_total != null ? "dispersión medida sobre el total" : "sin medición propia del total");
}

/* Lo que sabemos cuando no hay nada que apostar.

   El 90% de los partidos no tiene marca de valor, y hasta hoy en esos
   el Veredicto decía "No hay nada acá" y se terminaba la pantalla. Un
   asesor que no dice nada nueve de cada diez veces no es un asesor,
   aunque tenga razón en callarse.

   Esto NO es una recomendación encubierta y no lleva mostaza: el
   dorado sigue significando "acá el precio está a favor" y nada más.
   Son las tres cosas que sí se pueden afirmar del partido, cada una
   con el número que la sostiene, y la cuarta que dice qué falta para
   poder opinar.

   Todo sale de datos que la app ya calculaba y solo mostraba adentro
   de Datos, a dos toques de distancia — o sea que el que abría un
   partido sin oportunidad no llegaba nunca. */
function loQueSabemos(m, filas){
  const L = ESTADISTICAS[String(m.homeId)], V = ESTADISTICAS[String(m.awayId)];
  const puntos = [];

  /* 0 · Lo más firme del partido.

     Pedido de Lucas: "aunque no haya apuesta ganadora, decime la más
     cercana al acierto — pero acierto en serio, no cualquier cosa". El
     "no cualquier cosa" es la parte difícil y él mismo la nombró: si
     ordenás por probabilidad a secas, arriba de todo queda siempre
     "menos de 7.5 goles al 99%", que es verdad y no dice nada del
     partido.

     Dos filtros lo resuelven, y los dos ya existían con su razón
     escrita: solo las líneas de la escalera (1.5·2.5·3.5), y cuota
     mínima CUOTA_MIN_ESCALERA — abajo de 1.30 no es una afirmación
     sobre el partido, es una obligación.

     Y va SIEMPRE con el número del mercado al lado. Sin eso, decir
     "Flamengo gana al 78%" se lee como opinión nuestra cuando puede
     ser el precio leído en voz alta. Que coincidamos no es un
     fracaso: es información, y es honesto decir cuál de las dos
     cosas está pasando. */
  /* Sin muestra no hay "lo más firme": el número saldría del mismo
     ajuste sobre nada que hace que un gigante y un recién ascendido
     salgan parecidos. Se dice qué falta, que es lo único cierto. */
  if(sinMuestra(m)){
    const n = partidosJugados(m);
    puntos.push(`Todavía no publicamos probabilidades de este partido: se llevan jugadas
      <b>${n} fecha${n===1?"":"s"}</b> y hacen falta ${MIN_PARTIDOS}. Con esa muestra las fuerzas
      se ajustan sobre nada y un grande y un recién ascendido salen parecidos.`);
  }
  const mk = m.mercado || {}, mx = m.mercadoExtra || {}, pq = devig(mk);
  const elegibles = [];
  if(!sinMuestra(m)) otrosMercados(m).forEach(x=>{
    if(x.op.fam === "Goles" && !LINEAS_ESCALERA.has(x.op.linea)) return;
    const c = cuotaUsada(x.op, pq, mk, mx);
    /* El piso de cuota existe para matar "menos de 7.5 goles al 99%",
       que es verdad y no dice nada. NO aplica al 1X2: ahí una cuota
       corta es el dato, no ruido. Lucas lo anticipó — "por ahí Flamengo
       paga poco pero es el candidato"— y sin esta excepción pasaba
       exactamente lo contrario de lo que pidió: en Manchester City vs
       Coventry, City a 1.20 quedaba filtrado y "lo más firme" salía
       Gana Coventry al 30%, por descarte. */
    if(c == null || (!/^1x2_/.test(x.op.id) && c < CUOTA_MIN_ESCALERA)) return;
    elegibles.push({x, c});
  });
  /* Resultado primero, igual que `escalera()`: es el único eje donde
     `medir_ejes.py` midió aporte sobre la tasa base (+2.6% en arg,
     +13.2% en eng) contra −0.9% a +0.4% en goles. Elegir por
     probabilidad entre todos mezclados hace ganar a Goles casi
     siempre, y termina destacando justo el eje donde no sabemos.

     Y dentro de Resultado, solo el 1X2. La doble oportunidad gana el
     ranking por construcción —el empate es ~27%, así que "gana
     alguno" ronda el 73% en TODOS los partidos— y una frase que sale
     igual siempre no describe nada. Es la misma trampa que "menos de
     7.5 goles", del otro lado del tablero. El 1X2 es lo que Lucas
     pidió: quién es el candidato. */
  const res = elegibles.filter(e=> /^1x2_/.test(e.x.op.id));
  const pool = res.length ? res : elegibles;
  const firme = pool.reduce((a, b)=> !a || b.x.op.p > a.x.op.p ? b : a, null);
  if(firme){
    const o = firme.x.op, v = firme.x.ventaja, esRes = o.fam === "Resultado";
    /* La diferencia contra el precio SOLO se llama ventaja en
       Resultado. Afuera de ahí está medido que nuestro número no le
       gana al mercado, así que un "+27 puntos" sobre Menos de 3.5 no
       es un hallazgo: es el error del modelo de goles dibujado como
       si fuera uno. Se muestra igual, con el nombre correcto. */
    const dice = v == null ? ""
      : Math.abs(v) < 0.03
        ? ` El mercado dice ${pc(o.p - v)}: coincidimos, así que acá no estamos aportando una
            lectura propia — la estamos confirmando.`
      : !esRes
        ? ` El mercado dice ${pc(o.p - v)}. La diferencia no es una ventaja: en este eje está
            medido que nuestro número no le gana al precio.`
      : Math.abs(v) > VALOR_MAX
        /* "Arriba de eso el sospechoso es el modelo, no el precio" — es
           la razón escrita de VALOR_MAX, y vale igual acá. Un "+39
           puntos sobre la línea" no es una ventaja enorme: es un número
           roto. Mostrarlo con nombre de ventaja seria mandar a apostar
           una cuota de 5.19 por un error nuestro. */
        /* Y cuando además la muestra es mínima, decimos POR QUÉ el
           sospechoso somos nosotros. Man City vs Coventry, 2026-09-05:
           λ 1.35 contra 1.10 —casi iguales— mientras el mercado paga
           1.20 contra 11.00. Con 2 partidos por equipo el modelo
           empuja a los dos al promedio de la liga y un gigante y un
           ascendido salen parecidos. El número no está mal calculado:
           está calculado sobre nada. */
        ? ` El mercado dice ${pc(o.p - v)}. Nos separan ${Math.abs(Math.round(v*100))} puntos, y
            arriba de ${Math.round(VALOR_MAX*100)} el sospechoso es nuestro número, no el precio:
            no lo tomes como ventaja.${(L && V && Math.min(L.pj||0, V.pj||0) < 4)
              ? ` Acá el motivo se ve: tenemos ${Math.min(L.pj||0, V.pj||0)} partido${
                  Math.min(L.pj||0, V.pj||0)===1?"":"s"} de uno de los dos, y con esa muestra el
                  modelo los empuja a los dos al promedio de la liga.` : ""}`
      : v < 0
        ? ` El mercado le da ${pc(o.p - v)}, ${Math.abs(Math.round(v*100))} puntos más que
            nosotros: el precio ve algo que nuestro número no.`
        : ` Le damos ${Math.round(v*100)} puntos más que la línea sin margen.`;
    puntos.push(`Lo más firme del partido es <b>${esc_(o.label)}</b>: le damos ${pc(o.p)} y
      paga ${firme.c.toFixed(2)}.${dice}`);
  }

  /* 1 · La métrica en la que más se distinguen ESTOS dos equipos, de
     las que están medidas. No la más alta: la que más separa, que es
     la única que dice algo del cruce. Sin señal medida no se dice
     nada — repetir un número que no se sabe si es verdadero es lo que
     esta app no hace. */
  if(L && V){
    let mejor = null;
    COMPARA.forEach(x=>{
      if(senalDe(x.k).clase !== "alta") return;
      const a = ladoDe(L, x.k, "local"), b = ladoDe(V, x.k, "visita");
      if(!a || !b) return;
      const va = x.calc ? x.calc(a) : a[x.k], vb = x.calc ? x.calc(b) : b[x.k];
      if(va == null || vb == null) return;
      const sep = Math.abs(va - vb) / ((va + vb) / 2 || 1);
      if(!mejor || sep > mejor.sep) mejor = {x, va, vb, sep};
    });
    if(mejor && mejor.sep > 0.12){
      const arriba = mejor.va >= mejor.vb;
      puntos.push(`<b>${esc_(mejor.x.et)}</b> es donde más se distinguen, y es de las medidas:
        ${esc_(arriba ? m.home : m.away)} produce ${(arriba?mejor.va:mejor.vb).toFixed(1)}${
        mejor.x.suf||""} contra ${(arriba?mejor.vb:mejor.va).toFixed(1)}${mejor.x.suf||""}.`);
    }
  }

  /* 2 · Cuánto le falta al precio más cerca de encenderse. Es la
     pregunta que el que mira se hace igual —"¿por cuánto no?"— y la
     escalera la contestaba solo con la cuota mínima, que obliga a
     restar de cabeza. */
  const conV = filas.filter(f=> f.ventaja != null && f.op && f.cuota)
    .sort((a,b)=> b.ventaja - a.ventaja);
  if(conV.length && !(firme && conV[0].op && conV[0].op.label === firme.x.op.label)){
    const f = conV[0], v = Math.round(f.ventaja * 100);
    /* En una liga donde la regla está medida perdiendo, decir "le
       faltan N puntos" invita a esperar que los junte — y aunque los
       juntara no la marcaríamos. Ahí la frase honesta es la otra: la
       ventaja existe y aun así no alcanza, porque lo que falla no es
       el umbral sino la regla entera en esa liga. */
    if(ligaSinValor(m) && f.ventaja >= VALOR_MIN)
      puntos.push(`<b>${esc_(f.op.label)}</b> tiene ${v} puntos de ventaja sobre la línea sin
        margen, y aun así no la marcamos: en esta liga está medido que seguir la regla de valor
        <b>resta plata</b>. La ventaja está; lo que no está es la evidencia de que cobrarla sirva.`);
    else if(f.ventaja < VALOR_MIN){
      const falta = Math.round((VALOR_MIN - f.ventaja) * 100);
      puntos.push(`Lo más cerca de encenderse es <b>${esc_(f.op.label)}</b>: le damos ${pc(f.op.p)},
        paga ${f.cuota.toFixed(2)} y le faltan ${falta} punto${falta===1?"":"s"} de ventaja
        para que la marquemos.`);
    }
  }

  /* 3 · Cuando el mercado nos gana de mano, decirlo es más útil que
     callarlo: es la única señal que tenemos de que el precio sabe algo
     que nosotros no. */
  const al = alerta(m);
  if(al) puntos.push(`El mercado le da <b>${Math.round(al.dif*100)} puntos más</b> que nosotros a
    ${esc_(al.nombre || "el empate")}. Cuando pasa eso, el que suele tener razón es el precio.`);

  /* 4 · Lo único que llega DESPUÉS de que la casa puso la línea, y que
     ni el modelo ni la casa tienen todavía. */
  const once = ONCES[String(m.homeId)] || ONCES[String(m.awayId)];
  puntos.push(once
    ? `A la hora del partido, lo que más mueve la línea es el <b>once confirmado</b>. El de los
       últimos partidos está en Datos · Referencia; nadie publica el de hoy hasta una hora antes.`
    : `A la hora del partido, lo que más mueve la línea es el <b>once confirmado</b>, y todavía
       no lo publica nadie.`);

  if(!puntos.length) return "";
  return `<div class="sabemos"><div class="rotarg">Lo que sí sabemos</div>
    ${puntos.map(t=> `<p>${t}</p>`).join("")}</div>`;
}

function capaVeredicto(m){
  /* El mismo objeto que lee la portada, memoizado: si esta pantalla lo
     recalculara por su cuenta, un día el renglón y la tarjeta dirían
     cosas distintas y nadie sabría cuál de las dos está bien. */
  const v = veredictoDe(m);
  const total = v.filas.length + (v.oportunidad ? 1 : 0);
  let h = sello2("Veredicto", `${dd(v.oportunidad ? 1 : 0)} DE ${dd(total)} MERCADOS`);

  if(v.oportunidad){
    h += tarjetaOportunidad(m, v.oportunidad);
  } else {
    /* El estado más frecuente, y el que se implementó primero. Con el
       ROI medido en −3.27% ±6.19 —el intervalo cruza el cero— prometer
       valor donde no hay ventaja medida va contra el principio del
       producto. Un día sin nada tiene que verse completo, no roto. */
    h += `<div class="nada"><b>No hay nada acá</b>
      <p>${total} mercado${total===1?"":"s"} mirado${total===1?"":"s"}, ninguno con precio a favor.</p></div>`;
    h += loQueSabemos(m, v.filas);
  }

  h += `<div class="sepsec"><span>${v.oportunidad ? "Lo demás que miramos" : "Qué miramos"}</span><i></i></div>
    ${escaleraMercados(m, v.filas)}`;

  /* El porqué común, una vez. La regla de alineación pide una lectura
     que NO salga del modelo: sin análisis cargado no hay contra qué
     alinear, y entonces no se marca nada por más ventaja que muestre
     la cuenta. */
  if(ligaSinValor(m)){
    h += `<p class="notacapa">En esta liga está medido que la regla de valor resta plata
      (−9.2% de ROI walk-forward), así que acá no marcamos ninguna.</p>`;
  } else if(!v.dir){
    /* Dos huecos distintos, y decir el equivocado es peor que callarse:
       un partido puede tener la nota escrita y no declarar dirección,
       que es lo que la regla de alineación necesita. */
    h += `<p class="notacapa">${hayProsa(m.id)
      ? `La lectura de este partido está escrita pero <b>no declara hacia dónde inclina</b>, y sin
         dirección no hay contra qué alinear: por eso no se marca ninguno.`
      : `Ninguno se marca porque este partido todavía no tiene lectura escrita: la marca de valor se
         mide contra una lectura que no sale del modelo, y sin eso sería el modelo dándose la razón a
         sí mismo.`}</p>`;
  }

  h += pieTalon(`CERRADO ${fechaCorta(m.date)}`, "VEREDICTO 01 DE 03");

  /* Herramientas no desapareció: es de esta capa. Cargar la cuota de tu
     casa y anotar en el Registro son actos de apostar, no de explorar,
     y no tienen por qué ocupar un destino de primer nivel. */
  const abierto = ABIERTOS.has("herr");
  h += `<button class="lnkf" data-abrir="herr"><div class="t">
      <small>Tu casa</small><b>Cargá tu cuota y anotá</b></div>
      <span class="fl">${abierto ? "−" : "›"}</span></button>
    ${abierto ? `<div class="tabsec">${tabHerramientas(m)}</div>` : ""}`;

  h += `<button class="lnkf" data-capa="lectura"><div class="t">
      <small>Sigue</small><b>Por qué lo decimos</b></div><span class="fl">›</span></button>`;
  return h;
}

/* ══════════════════════════════════════════════════════════════════
   CAPA 02 · LECTURA

   Cada afirmación con el número que la sostiene en el MISMO bloque. Si
   hay que ir a buscarlo a otra pantalla, es la arquitectura vieja con
   otro nombre: el análisis decía "la defensa está rota" y el número
   estaba tres pestañas más allá.
   ══════════════════════════════════════════════════════════════════ */

/* La barra comparativa. Tinta plena = número MÁS ALTO, no número mejor:
   más faltas no es mejor. Un semáforo acá sería una opinión disfrazada
   de dato. */
function barraComparativa(etiqueta, a, b, suf){
  if(a == null || b == null) return "";
  const may = a >= b, tot = (a + b) || 1;
  const num = v => v.toFixed(1) + (suf || "");
  return `<div class="cbar">
    <div class="cv"><b class="${may?"alto":""}">${num(a)}</b>
      <span>${esc_(etiqueta)}</span>
      <b class="d ${!may?"alto":""}">${num(b)}</b></div>
    <div class="cb"><i class="${may?"alto":""}" style="flex:${(a/tot*100).toFixed(1)}"></i>
      <i class="${!may?"alto":""}" style="flex:${(b/tot*100).toFixed(1)}"></i></div>
  </div>`;
}

function bloqueArgumento(rotulo, parrafo, evidencia, pie){
  return `<div class="arg"><div class="rotarg">${esc_(rotulo)}</div>
    <p>${parrafo}</p>
    ${evidencia ? `<div class="evid">${evidencia}${pie || ""}</div>` : ""}</div>`;
}

function capaLectura(m){
  const lec = lectura(m);
  const a = ANALISIS[m.id] || {};
  const est = ANALISIS_EST[m.id] || {};
  const L = ESTADISTICAS[String(m.homeId)], V = ESTADISTICAS[String(m.awayId)];
  const dir = inclinacionDe(m.id);
  const div = divergen(m);
  const bloques = [];
  let n = 0;
  const rot = t => `${dd(++n)} · ${t}`;

  /* El contador del sello dice si hay nota escrita. Un partido sin
     análisis no se disimula: se declara, porque es lo que explica que no
     haya ninguna marca en el Veredicto. */
  let h = sello2("Lectura", hayProsa(m.id) ? "POR QUÉ LO DECIMOS" : "SIN NOTA CARGADA");
  /* El marcador más repetido, con su frecuencia al lado. Solo, "1-0" se
     lee como un pronóstico; con el "12 de cada 100" se lee como lo que
     es — el más probable de una distribución muy chata. */
  /* El marcador más repetido sale de la MISMA matriz que las
     probabilidades, así que cae con ellas: sin muestra no se publica.
     Se escapaba de la frase que ya decía "no publicamos
     probabilidades" y quedaba pegado abajo, contradiciéndola. */
  h += `<div class="tesis"><b>${esc_(lec.titulo)}</b><p>${esc_(lec.cuerpo)}${sinMuestra(m) ? ""
    : ` El marcador que más se repite es <b>${marcadorTop(lec.M)}</b>, y aun así pasa
        ${Math.round(probMarcadorTop(lec.M)*100)} de cada 100 veces.`}</p></div>`;

  /* 01 · Dominio. Solo las métricas donde el número DISTINGUE a estos
     dos equipos.

     Antes se dibujaban las tres siempre, y en Brasil eso daba
     "15.2 REMATES 15.1": dos barras casi iguales que no comparan a
     Flamengo con Mirassol sino al promedio de la liga consigo mismo. El
     motivo está medido — `k` sale de partir la variación entre equipos
     en ruido y señal, y en remates y córners de esa liga da 200, que es
     el techo: con esta muestra los equipos son indistinguibles. Una
     barra que no distingue no es un dato tenue, es un dato que no está,
     y ponerla igual le hace creer al que mira que comparó algo.

     Las que no distinguen no se esconden: se declaran, que es la misma
     regla que el Veredicto aplica a un mercado sin ventaja. */
  if(L && V && L.esperado && V.esperado){
    const P = paramsDe(L, V);
    /* Cuánto del número es del equipo y cuánto es promedio de la liga.
       Manda el más flojo de los dos: si de uno sabemos y del otro no, la
       comparación tampoco vale. El 0.25 es el mismo piso que el proyecto
       ya usaba para decidir si un split se puede mostrar. */
    const peso = (eq, k) => P[k] ? pesoEquipo((eq.n || {})[k] || 0, P[k].k) : 0;
    const propio = k => Math.min(peso(L, k), peso(V, k));
    const distingue = k => propio(k) >= 0.25;

    const bar = ([k, et]) => barraComparativa(et, L.esperado[k], V.esperado[k]);
    const conSenal = DOMINIO_METRICAS.filter(([k])=> L.esperado[k] != null
      && V.esperado[k] != null && distingue(k));
    const sinSenal = DOMINIO_METRICAS.filter(([k])=> L.esperado[k] != null
      && V.esperado[k] != null && !distingue(k));

    if(conSenal.length || sinSenal.length){
      const eje = ejesDe(m).find(e=> e.eje === "dominio");
      const sinMedir = !eje || eje.confianza === "sin_medir";
      const texto = est.dominio ? esc_(est.dominio)
        : `Lo que esperamos de cada uno en este cruce, ajustado por el rival y por la localía.
           <b>${esc_(m.home)}</b> contra <b>${esc_(m.away)}</b>.`;
      const nombres = sinSenal.map(([, et])=> et.toLowerCase()).join(" y ");
      const evidencia = conSenal.map(bar).join("")
        + (sinSenal.length ? `<div class="nodistingue">En ${esc_(nombres)} no distinguimos a
             estos dos equipos: con ${Math.min(L.pj||0, V.pj||0)} partidos de muestra, los dos valen
             el promedio de la liga.</div>` : "");
      bloques.push(bloqueArgumento(rot("Dominio"), texto, evidencia,
        `<div class="epie"><span>${conSenal.length
          ? `Esperado en este partido${sinMedir
             ? " · en esta liga la fuente no publica estadísticas por partido, así que no hay medición detrás"
             : " · medido partido a partido contra el promedio de la liga"}`
          : "Ninguna de las tres métricas distingue a estos dos equipos con esta muestra."}</span></div>`));
    }
  }

  /* 01bis · Fricción. Faltas y tarjetas, que es donde el número SÍ
     distingue en este cruce y además es la métrica mejor calibrada que
     tenemos (`faltas` da "bien" contra el ruido, en 665 casos). Estaba
     escrito por la skill del mercado de estadísticas y no se mostraba en
     ninguna pantalla. */
  if(L && V && L.esperado && V.esperado){
    const P = paramsDe(L, V);
    const propio = k => P[k]
      ? Math.min(pesoEquipo((L.n || {})[k] || 0, P[k].k), pesoEquipo((V.n || {})[k] || 0, P[k].k))
      : 0;
    const filas = FRICCION_METRICAS
      .filter(([k])=> L.esperado[k] != null && V.esperado[k] != null && propio(k) >= 0.25)
      .map(([k, et])=> barraComparativa(et, L.esperado[k], V.esperado[k])).join("");
    if(filas){
      bloques.push(bloqueArgumento(rot("Fricción"),
        est.friccion ? esc_(est.friccion)
        : `Dónde se corta el juego: lo que esperamos de cada uno en este partido.`,
        filas,
        `<div class="epie"><span>Esperado en este partido · las faltas son la métrica que mejor
          le acierta de todas las que medimos</span></div>`));
    }
  }

  /* 02 · La tabla, como evidencia y no como destino. Solo los dos
     equipos del partido: la tabla entera vive en Datos · Referencia. */
  const enTabla = id => (m.tabla || []).find(f=> String(f.id) === String(id));
  const tl = enTabla(m.homeId), tv = enTabla(m.awayId);
  if(tl && tv){
    const pos = f => (m.tabla || []).filter(x=> (x.grupo||"") === (f.grupo||"")).indexOf(f) + 1;
    const fila = (f, nombre, logo)=> `<div class="trow"><span class="ps">${dd(pos(f))}</span>
      <span class="nm">${crest(logo, 13)}<span>${esc_(nombre)}</span></span>
      <span class="pt">${f.pts}</span>
      <span class="zn">PTS · ${f.pj} PJ</span></div>`;
    bloques.push(bloqueArgumento(rot("Tabla"),
      `${esc_(m.home)} llega con <b>${tl.pts}</b> puntos en ${tl.pj} partidos y ${esc_(m.away)} con
       <b>${tv.pts}</b> en ${tv.pj}.${tl.pj !== tv.pj
        ? " No llegan con los mismos jugados, así que los puntos no se comparan derecho." : ""}`,
      fila(tl, m.home, m.homeLogo) + fila(tv, m.away, m.awayLogo),
      `<div class="epie"><span>La tabla completa está en Datos · Referencia</span></div>`));
  }

  /* 03 · El antecedente. Cuatro cruces y nada más. */
  const h2h = (m.h2h || []).slice(0, 4);
  const logoH2H = n => n === m.home ? m.homeLogo : n === m.away ? m.awayLogo : null;
  if(h2h.length){
    bloques.push(bloqueArgumento(rot("Antecedente"), antecedente(m),
      /* La tarjeta decia "1-5" y la fecha, y nada mas. Un marcador sin
         los dos escudos no dice quien puso el 1 y quien el 5: el que
         lee tiene que acordarse de que el orden es local-visitante Y de
         quien jugo de local aquella vez, dos datos que la tarjeta no
         trae. Los escudos van en el mismo orden que los numeros.

         Solo por igualdad exacta: si un cruce viejo trae un nombre que
         no es ninguno de los dos de hoy, va el hueco. Adivinar cual es
         cual pondria el escudo equivocado, y un escudo equivocado no se
         ve como un error -- se ve como el partido al reves. */
      `<div class="h2hc">${h2h.map(x=>
        `<div><span class="ec">${crest(logoH2H(x.h), 13)}${crest(logoH2H(x.a), 13)}</span>
          <b>${esc_(x.s || "—")}</b>
          <span>${esc_((x.d || "").slice(0,5))}</span></div>`).join("")}</div>`));
  }

  /* 04 · Jugadores. El eje que escribe la skill del mercado de
     estadísticas, con el chip de confianza que sale de la métrica PEOR:
     mostrar goles bien calibrado al lado de remates mal calibrado y
     declarar el conjunto "calibrado" sería usar lo bueno para tapar lo
     malo. */
  const ejeJug = ejesDe(m).find(e=> e.eje === "jugadores");
  if(ejeJug && ejeJug.estimacion && ejeJug.estimacion.length){
    const filas = ejeJug.estimacion.map(g=> g.jugadores.map(j=>
      `<div class="trow"><span class="ps">${esc_(j.pos||"—")}</span>
        <span class="nm">${crest(j.logo, 13)}<span>${esc_(j.nombre)}</span></span>
        <span class="pt">${(j.esp.goles||0).toFixed(2)}</span></div>`).join("")).join("");
    const flojas = JUG_METRICAS.filter(([k])=>{
      const f = fiabilidadJugador(k); return f && f.nivel === "mal";
    }).map(([, e])=> e);
    /* La unidad iba repetida en cada renglon: seis veces "GOL ESPERADO"
       no informan seis veces, ocupan el ancho que el nombre necesita
       para no cortarse. Se dice una vez, arriba de la columna. */
    const cabJug = `<div class="trowh"><span>Jugador</span><em>Gol esperado</em></div>`;
    bloques.push(bloqueArgumento(rot("Jugadores"),
      est.jugadores ? esc_(est.jugadores)
        : `Lo que esperamos de los que más pesan en cada línea, de su serie reciente.
           <b>No es una apuesta</b>: contra el precio de la casa esto todavía no se midió.`,
      cabJug + filas,
      `<div class="epie"><span>${flojas.length
        ? `${esc_(flojas.join(" y "))} está medido y le erra bastante más de lo que explica el azar`
        : "Las tres métricas del eje están medidas contra el ruido"}</span>
        <em>DATOS ›</em></div>`));
  }

  /* 05 · Contexto: lo único que no calcula nadie. Lo escribe una
     persona con la skill `valor-analisis-inclinacion`, y por eso el eje
     se declara sin medir hasta que haya una fecha nueva con la skill
     corregida. */
  const prosa = [["local", m.home], ["visitante", m.away]]
    .filter(([k])=> a[k]).map(([k, eq])=>
      `<div class="rotarg sig">${esc_(eq)}</div><p>${esc_(a[k])}</p>`).join("");
  const hayDesarrollo = !!(a.desarrollo && a.desarrollo.texto);
  if(prosa || a.contexto || a.veredicto || hayDesarrollo){
    bloques.push(`<div class="arg"><div class="rotarg">${rot("Contexto")}</div>
      ${a.contexto ? `<p>${esc_(a.contexto)}</p>` : ""}
      ${prosa}
      ${/* El desarrollo es el cuerpo de la nota: cómo se va a jugar el
            partido. Es único por partido, no una lectura por equipo. */""}
      ${a.desarrollo && a.desarrollo.texto
        ? `<div class="rotarg sig">El desarrollo</div>
           <p>${esc_(a.desarrollo.texto)}</p>` : ""}
      ${a.veredicto ? `<p><b>${esc_(a.veredicto)}</b></p>` : ""}
      ${/* La dirección declarada se muestra, no se esconde: es lo que
            habilita la marca de valor, y el que lee tiene derecho a ver
            contra qué se está alineando la app. Si no hay, se dice. */""}
      <p>${dir
        ? `Este análisis inclina ${aQuien(dir, m)}. Con eso puesto, no recomendamos nada que lo
           contradiga, y solo marcamos precio a favor sobre esa lectura.`
        : `Este análisis <b>no declara para dónde inclina</b>, así que no marcamos precio a favor en
           este partido.`}</p>
      ${a.actualizado ? `<div class="evid"><div class="epie"><span>Escrito el ${esc_(a.actualizado)}
        · el único eje que no calcula nadie</span></div></div>` : ""}</div>`);
  } else {
    bloques.push(`<div class="arg"><div class="rotarg">${rot("Contexto")}</div>
      <p>Todavía nadie escribió la nota de este partido. Las bajas, el contexto de tabla y a quién
      le sirve el empate se cargan aparte, partido por partido, y este no. Sin eso
      <b>no marcamos precio a favor</b>: no hay contra qué alinear.</p></div>`);
  }

  h += `<div class="args">${bloques.join("")}</div>`;

  /* Los dos bloques de advertencia. La contradicción se muestra: si el
     motor y la lectura no dicen lo mismo, esconderlo sería elegir cuál
     de los dos tiene razón sin tener con qué. */
  if(div){
    const nom = d => d==="E" ? "el empate" : (d==="L" ? m.home : m.away);
    h += `<div class="warn"><b>El motor no dice lo mismo</b>
      <p>El análisis inclina a <b>${esc_(nom(div.dirHumana))}</b> y el modelo ve más probable a
      <b>${esc_(nom(div.dirModelo))}</b>. No lo resolvemos por vos: baja la confianza de todo lo que
      dependa del resultado, y la marca de valor solo puede ir sobre la lectura escrita.</p></div>`;
  }
  const pj = Math.min((L && L.pj) || 0, (V && V.pj) || 0);
  if(pj && pj < 5){
    h += `<div class="warn"><b>Ojo con la muestra</b>
      <p>El split de estos equipos se apoya en ${pj} partido${pj===1?"":"s"}. Con esa muestra el
      número se parece más al promedio de la liga que a este equipo — está dicho métrica por métrica
      en Datos.</p></div>`;
  }
  h += `<div class="warn"><b>El plantel no dice quién falta</b>
    <p>La fuente devuelve a todos los jugadores como activos: lesionados y suspendidos no vienen en
    el dato. Lo que falte de este partido está en el Contexto escrito a mano, o no está.</p></div>`;

  h += pieTalon(a.actualizado ? `ESCRITO ${fechaCorta(a.actualizado)}` : "SIN NOTA CARGADA",
                "LECTURA 02 DE 03");
  h += `<button class="lnkf" data-capa="datos"><div class="t">
      <small>Sigue</small><b>Los datos crudos</b></div><span class="fl">›</span></button>`;
  return h;
}

/* ══════════════════════════════════════════════════════════════════
   CAPA 03 · DATOS

   Exploración libre: sin veredictos y sin dorado. Tres exploradores —
   Equipos, Jugadores, Referencia — y dos reglas que valen para los
   tres:

     · La unidad es el CRUCE, no el promedio. Cada métrica va siempre en
       el par produce / concede: `concede` está medido en las nueve y se
       mostraba en un renglón chico al pie, así que se estaba viendo la
       mitad del dato.
     · Tinta plena = número más alto, NO número mejor. La barra indica
       magnitud, no ventaja. Acá no hay semáforo.
   ══════════════════════════════════════════════════════════════════ */

/* El marcador de señal: cuánto se le cree a una métrica, medido.

   Sale del dato, no de una tabla escrita a mano — `calibracion_lineas`
   para las métricas de equipo y `calibracion_jugadores` para las de
   jugador. Donde no hay medición dice SIN MEDIR, que es la verdad:
   afirmar que una métrica es confiable sin haberla medido es peor que
   callarse. */
function senalDe(k){
  const fi = fiabilidad(k);
  if(!fi) return {clase:"sinmedir", texto:"SIN MEDIR", floja:true};
  if(fi.grave) return {clase:"baja", texto:"SEÑAL BAJA", floja:true};
  if(fi.flojo) return {clase:"media", texto:"SEÑAL MEDIA", floja:false};
  return {clase:"alta", texto:"SEÑAL ALTA", floja:false};
}

function senalJugador(k){
  const f = fiabilidadJugador(k);
  if(!f) return {clase:"sinmedir", texto:"SIN MEDIR", floja:true};
  const c = (CAL_JUG[k] || {}).razon;
  if(f.nivel === "mal") return {clase:"baja", floja:true,
    texto:`SEÑAL BAJA${c ? " · " + c.toFixed(2) + "×" : ""}`};
  if(f.nivel === "regular") return {clase:"media", floja:false,
    texto:`SEÑAL MEDIA${c ? " · " + c.toFixed(2) + "×" : ""}`};
  return {clase:"alta", floja:false, texto:`SEÑAL ALTA${c ? " · " + c.toFixed(2) + "×" : ""}`};
}

/* Cuántos partidos necesita un split (local o visita) para usarse en vez
   del total.

   Medido el 2026-08-23 sobre los datos reales: el caché de resúmenes
   tiene mediana 3 partidos por equipo — es el tope de DISCIPLINA_N, que
   existe para el modelo, no para esto. Al partir esos 3 en local/visita
   quedan 1-2 por lado, y un promedio con un decimal sobre 2 partidos es
   el mismo "muestra chica" que el proyecto le prohíbe al análisis.

   Con 4 el split empieza a decir algo; abajo de eso el total (que
   duplica la muestra) es más honesto aunque mezcle las dos sedes. El
   caché crece solo con cada fecha, así que esto se va a ir habilitando
   con el tiempo sin pedir un request más. */
const MIN_SPLIT = 4;
const usable = (split, k) => split && split.n && (split.n[k]||0) >= MIN_SPLIT;

/* El lado del split que corresponde al filtro.

   El default no es "el promedio general": es EL CRUCE — el local con su
   promedio DE LOCAL y el visitante con el suyo DE VISITA. Jugar en casa
   o afuera no es lo mismo, y mezclarlos en un promedio general tapa
   justo la diferencia que el partido de hoy pone en juego. Los otros dos
   filtros miran a los dos equipos del mismo lado, para comparar peras
   con peras.

   Con muestra insuficiente se cae al total: abajo de MIN_SPLIT un
   promedio con un decimal sobre dos partidos es el mismo "muestra
   chica" que el proyecto le prohíbe al análisis. */
function ladoDe(eq, k, rol){
  if(!eq) return null;
  const split = eq[LOCALIA === "cruce" ? rol : LOCALIA];
  return usable(split, k) ? split : eq;
}

/* Cuántas de las métricas comparadas cambiaría un filtro, y con cuántos
   partidos por sede cuenta.

   Existe porque el filtro podía no hacer NADA sin decirlo. Con el caché
   en 4 partidos por equipo quedan 2 por sede, abajo de MIN_SPLIT, y
   `ladoDe` cae al total en las tres opciones: tres botones, los mismos
   diez números, y ningún aviso. Un control que no cambia nada es peor
   que un control ausente — el que mira concluye que el equipo juega
   igual de local que de visitante, que es justo lo que el dato no dice.

   Cuenta las métricas donde AL MENOS UN equipo usaría su split, porque
   `ladoDe` decide equipo por equipo: puede pasar que el local tenga
   muestra y el visitante no. */
function alcanceFiltro(L, V, k){
  let cambia = 0, pj = 0;
  COMPARA.forEach(x=>{
    const a = k === "cruce" ? (L || {}).local : (L || {})[k];
    const b = k === "cruce" ? (V || {}).visita : (V || {})[k];
    if(usable(a, x.k) || usable(b, x.k)) cambia++;
    const na = (a && a.n && a.n[x.k]) || 0, nb = (b && b.n && b.n[x.k]) || 0;
    const m = Math.min(na, nb);
    if(m > pj) pj = m;
  });
  return {cambia, pj};
}

/* El par produce, en el renglón cerrado del acordeón. Misma regla que
   la barra grande: tinta plena = número MÁS ALTO, no número mejor. */
function resumenMetrica(a, b, suf){
  if(a == null || b == null) return "";
  const may = a >= b, tot = (a + b) || 1;
  const num = v => v.toFixed(1) + (suf || "");
  return `<div class="mres"><b class="${may?"alto":""}">${num(a)}</b>
    <span class="mb"><i class="${may?"alto":""}" style="flex:${(a/tot*100).toFixed(1)}"></i>
      <i class="${!may?"alto":""}" style="flex:${(b/tot*100).toFixed(1)}"></i></span>
    <b class="d ${!may?"alto":""}">${num(b)}</b></div>`;
}

function datosEquipos(m){
  const L = ESTADISTICAS[String(m.homeId)], V = ESTADISTICAS[String(m.awayId)];
  if(!L || !V) return sello2("Equipos", "SIN DATO") +
    `<div class="nada"><b>Falta el caché de uno de los dos</b>
     <p>Sin los dos equipos no hay cruce que mostrar, y enfrentar un número contra un hueco invita
     a compararlos igual.</p></div>`;

  const pj = Math.min(L.pj || 0, V.pj || 0);
  let h = sello2("Equipos", `${dd(COMPARA.length)} MÉTRICAS · ${pj} PJ`);
  /* "Este cruce" no se apaga nunca: es el default, y su caída al total
     es la lectura correcta cuando no hay muestra por sede. Los otros dos
     sí, porque prometen una comparación que no pueden hacer. */
  const alcance = {};
  ["cruce","local","visita"].forEach(k=> alcance[k] = alcanceFiltro(L, V, k));
  /* El filtro elegido persiste entre partidos: se puede llegar acá con
     "De local" puesto desde un partido que sí tenía muestra. Si en este
     no la tiene, el botón queda apagado y la marca vuelve al default en
     vez de dejar los tres sin marcar. */
  const locVista = (LOCALIA !== "cruce" && !alcance[LOCALIA].cambia) ? "cruce" : LOCALIA;
  h += `<div class="filtro3">${[["cruce","Este cruce"],["local","De local"],["visita","De visita"]]
    .map(([k,l])=>{
      if(k !== "cruce" && !alcance[k].cambia)
        return `<button class="mudo" disabled>${l}<em>${alcance[k].pj} PJ</em></button>`;
      return `<button class="${locVista===k?"on":""}" data-loc="${k}">${l}</button>`;
    }).join("")}</div>`;
  /* Sin cifra en la frase: cada sede tiene la suya y el boton ya la
     dice. Una sola cifra acá contradecia al boton de al lado. */
  if(!alcance[locVista].cambia)
    h += `<p class="avfiltro">Abajo de ${MIN_SPLIT} partidos por sede el split no dice nada:
      las tres opciones muestran el total. Cada botón dice con cuántos cuenta.</p>`;

  h += `<div class="metacs">${COMPARA.map(x=>{
    const A = ladoDe(L, x.k, "local"), B = ladoDe(V, x.k, "visita");
    const val = (eq, r) => { const s = ladoDe(eq, x.k, r); if(!s) return null;
      return x.calc ? x.calc(s) : s[x.k]; };
    const a = val(L, "local"), b = val(V, "visita");
    if(a == null && b == null) return "";
    const se = senalDe(x.k);
    const abierto = ABIERTOS.has("met:" + x.k);
    /* `concede` es lo que le hacen A ese equipo. El cruce que importa
       es produce del local contra concede del visitante: rematar 10 no
       significa lo mismo contra un equipo que concede 6 que contra uno
       que concede 15. */
    const cL = x.cruza === false ? null : (L.concede || {})[x.k];
    const cV = x.cruza === false ? null : (V.concede || {})[x.k];
    return `<div class="metac${se.floja ? " floja" : ""}">
      <button class="mh" data-met="${esc_(x.k)}"><b>${esc_(x.et)}</b>
        <span class="senal ${se.clase}">${esc_(se.texto)}</span>
        <span class="mas">${abierto ? "−" : "+"}</span></button>
      ${abierto ? `<div class="mc">
        <div class="par"><div class="rot2">Produce</div>
          ${barraComparativa(x.et, a, b, x.suf)}</div>
        ${cL != null && cV != null ? `<div class="par"><div class="rot2">Concede</div>
          ${barraComparativa(x.et, cL, cV, x.suf)}</div>` : ""}
        <div class="rtinta">La tinta plena marca el número <b>más alto</b>, no el mejor:
          en <b>Concede</b> el más alto es el que peor viene.</div>
        <div class="mpie"><span>${crest(m.homeLogo, 13)}${esc_(m.home)}${
            LOCALIA==="cruce"?" · de local":""}</span>
          <span>${esc_(m.away)}${LOCALIA==="cruce"?" · de visita":""}${
            crest(m.awayLogo, 13)}</span></div>
      </div>` : resumenMetrica(a, b, x.suf)}</div>`;
  }).join("")}</div>`;

  h += `<button class="lnkf chica" data-nav="metodo"><div class="t">
      <b>Qué es la señal medida</b></div><span class="dst">MÉTODO ›</span></button>`;
  h += pieTalon(`ESPN · ${pj} PJ`, "DATOS 03 DE 03");
  return h;
}

/* Los 18 de cada plantel, no solo los destacados. El que mira arma sus
   propios candidatos, y para eso hace falta la lista entera: ordenable,
   con la serie a la vista y con la titularidad dicha en el renglón. */
function datosJugadores(m){
  const pool = [];
  [[m.homeId, m.home, "L", m.homeLogo], [m.awayId, m.away, "V", m.awayLogo]]
    .forEach(([id, equipo, lado, logo])=>{
      (PLANTELES[String(id)] || []).forEach(j=>
        pool.push(Object.assign({}, j, {equipo, lado, logo})));
    });
  if(!pool.length) return sello2("Jugadores", "SIN DATO") +
    `<div class="nada"><b>Sin planteles</b><p>Todavía no tenemos la serie de estos dos equipos.</p></div>`;

  const clave = (METRICAS.find(x=> x.k === JUG_ORDEN) || METRICAS[0]).k;
  /* Que la fuente publique la serie es una propiedad de la LIGA, no del
     jugador: si algun companero tiene serie, la fuente la publica y el
     que no la tiene es porque no jugo ninguno de los ultimos partidos.
     Se mira por equipo porque un partido puede cruzar dos ligas. */
  const conSerie = {};
  pool.forEach(j=> { if(j.serie) conSerie[j.lado] = true; });
  /* Cuantos partidos mira la serie, para poder decirlo: el companero
     que jugo todos marca el largo de la ventana de ese equipo. */
  const ventana = {};
  pool.forEach(j=> { const n = (j.serie || {}).pj || 0;
    if(n > (ventana[j.lado] || 0)) ventana[j.lado] = n; });

  const lista = pool
    .filter(j=> JUG_EQ === "dos" || j.lado === JUG_EQ)
    .filter(j=> j.pj > 0)
    .sort((a,b)=>{
      /* El que no viene jugando va al fondo, aunque su promedio de
         temporada sea el mas alto de la lista. Los dos numeros no son
         comparables: el esperado esta encogido hacia el puesto y el
         promedio de temporada no, asi que ordenarlos juntos ponia
         primero al que hace ocho fechas no entra — el primer nombre de
         la lista era el que no juega. No se esconde, se ordena. */
      const ha = !!(a.serie && a.serie[clave]), hb = !!(b.serie && b.serie[clave]);
      if(ha !== hb) return ha ? -1 : 1;
      const va = (a.serie && a.serie.esp && a.serie.esp[clave]);
      const vb = (b.serie && b.serie.esp && b.serie.esp[clave]);
      const ma = va != null ? va : (a.pj > 0 ? (a[clave]||0)/a.pj : 0);
      const mb = vb != null ? vb : (b.pj > 0 ? (b[clave]||0)/b.pj : 0);
      return mb - ma;
    });
  const todos = EXPANDIDAS.has("jug");
  const ver = todos ? lista : lista.slice(0, 12);
  const se = senalJugador(clave);

  let h = sello2("Jugadores", `${dd(pool.length)} EN PLANTEL`);
  h += `<div class="ordmet">${METRICAS.map(x=>
    `<button class="${x.k===clave?"on":""}" data-jugmet="${x.k}">${esc_(x.et)}</button>`).join("")}</div>`;
  /* En el filtro va el nombre corto: "Defensa y Justicia" en un tercio
     de 375px se parte en tres renglones y desalinea los tres segmentos.
     El nombre completo está en el renglón de cada jugador. */
  const club = n => { const x = String(n||"").replace(/\s*\(.*$/, "");
    return x.length > 12 ? x.split(" ")[0] : x; };
  h += `<div class="filtro3 suave">${[["dos","Los dos",null],["L",club(m.home),m.homeLogo],
      ["V",club(m.away),m.awayLogo]]
    .map(([k,l,lg])=> `<button class="${JUG_EQ===k?"on":""}" data-jugeq="${esc_(k)}">${
      lg ? crest(lg, 13) : ""}<span>${esc_(l)}</span></button>`).join("")}</div>`;
  h += `<div class="jgh"><span class="c0"></span><span class="c1">Jugador <em>·
      <span class="senal ${se.clase}">${esc_(se.texto)}</span></em></span>
    <span class="c3">Med</span></div>`;

  h += `<div class="jglist">${ver.map((j, i)=>{
    const s = (j.serie && j.serie[clave]) || [];
    const tit = (j.serie && j.serie.tit) || 0, spj = (j.serie && j.serie.pj) || 0;
    const haySerie = s.length > 0;
    /* El que entra desde el banco juega veinte minutos: su serie no se
       compara con la de un titular. Se baja de intensidad y se dice en
       el renglón — pero no se esconde de la lista. */
    const suplente = haySerie && spj > 0 && tit === 0;
    /* Dos causas opuestas se dibujaban con el mismo cartel. SIN SERIE
       decia, y el pie confirmaba, que "la fuente no la publica" — pero
       en el mismo Mirassol diecinueve companeros SI tenian serie. Lo
       que le pasa a este jugador es lo contrario de un hueco de la
       fuente: hace varias fechas que no entra, que es justo el dato que
       importa antes de apostarle. */
    const fuenteMuda = !conSerie[j.lado];
    const frio = !haySerie && !fuenteMuda;
    const estado = haySerie
      ? (suplente ? `SUPLENTE 0/${spj}` : `TITULAR ${tit}/${spj}`)
      : fuenteMuda ? `${j.pj} PJ · SIN SERIE`
      : `${j.pj} PJ · NO VIENE JUGANDO`;
    /* Dos números distintos en la misma columna: el esperado de hoy y el
       promedio de la temporada. Se marca CUÁL es cada uno. */
    const esp = !!(j.serie && j.serie.esp && j.serie.esp[clave] != null);
    const med = esp ? j.serie.esp[clave].toFixed(1)
      : (j.pj > 0 ? ((j[clave]||0)/j.pj).toFixed(1) : "—");
    const apagado = suplente || frio;
    return `<div class="jgrow${apagado ? " supl" : ""}${
        i < 2 && !apagado ? " destacado" : ""}">
      <div class="c0">${crest(j.logo, 13)}</div>
      <div class="c1"><div class="nm">${esc_(j.nombre)}${
        j.dorsal ? `<em>${esc_(j.dorsal)}</em>` : ""}</div>
        <!-- El club solo cuando la lista mezcla los dos: filtrada, ya lo
             dicen el boton de arriba y el escudo del renglon, y el nombre
             repetido partia la linea en dos. -->
        <div class="mt">${JUG_EQ === "dos" ? esc_(j.equipo) + " · " : ""}${esc_(j.pos || "—")} · ${estado}</div>
        ${haySerie ? tiraSerie(s) : ""}</div>
      <b class="med${esp ? "" : " prom"}">${med}</b></div>`;
  }).join("")}</div>`;

  /* Tres cosas que el renglón no puede decir doce veces: qué es la
     serie, qué es MED y por qué hay dos MED distintos. Van una vez, al
     pie, y no en cada fila. */
  const vent = ventana[JUG_EQ === "V" ? "V" : "L"] || ventana.L || ventana.V || 0;
  h += `<p class="notacapa">La <b>serie</b> es lo que hizo en cada uno de sus últimos
    ${vent || "pocos"} partidos, del más viejo al más nuevo — igual que los últimos cinco del
    equipo. <b>MED</b> es lo que esperamos de él hoy. Cuando no tiene serie, MED es el promedio
    de la temporada: va <b>punteado</b>, y el renglón aclara si es porque
    <b>no viene jugando</b> o porque la fuente no publica el partido a partido de esa liga
    (<b>SIN SERIE</b>).</p>`;

  if(lista.length > 12)
    h += `<button class="vermas" data-expandir="jug"><span>${todos
      ? `Ver solo los primeros 12` : `Ver los ${lista.length}`}</span><em>${todos
      ? "MENOS" : `${lista.length - 12} MÁS ›`}</em></button>`;

  h += pieTalon("ESPN · ÚLTIMOS 3", "DATOS 03 DE 03");
  return h;
}

/* Los tres destinos que eran pestañas de primer nivel: Posiciones,
   Historial y Plantel. Se consultan poco y ahora pesan lo que valen. */
function datosReferencia(m){
  let h = sello2("Referencia", "TABLAS · HISTORIAL · PLANTELES");
  h += `<div class="refs">`;

  const bloque = (id, titulo, meta, cuerpo)=>{
    const abierto = ABIERTOS.has("ref:" + id);
    return `<div class="refac"><button class="rh" data-ref="${id}"><b>${esc_(titulo)}</b>
      <em>${esc_(meta)}</em><span class="mas">${abierto ? "−" : "+"}</span></button>
      ${abierto ? `<div class="rc">${cuerpo()}</div>` : ""}</div>`;
  };

  /* ── posiciones ── */
  const tabla = m.tabla || [];
  const grupos = {};
  tabla.forEach(f=> (grupos[f.grupo || ""] = grupos[f.grupo || ""] || []).push(f));
  const claves = Object.keys(grupos);
  /* La zona vive en el PARTIDO (`m.grupo`), no en las filas de la
     tabla. `datosReferencia` agrupaba por `f.grupo`, que no existe, así
     que las 15 filas caían todas en la clave "" y el selector de zonas
     —que necesita más de una— no aparecía nunca.

     El efecto no era cosmético: la Liga Profesional Argentina son DOS
     zonas de 15, y la app mostraba una de las dos sin decirlo. Quien
     mira ve "Argentinos Juniors 1º" y entiende que lidera la liga.
     Encontrado el 2026-09-02 porque en Rosario Central vs Newell's
     —clásico entre zonas— el visitante no aparecía en la tabla. */
  const zona = grupoEs(m.grupo, m.comp);
  h += bloque("pos", "Posiciones",
    tabla.length ? `${zona ? zona.toUpperCase() + " · " : ""}${tabla.length} EQUIPOS` : "SIN TABLA",
    ()=>{
    if(!tabla.length) return `<p class="notaref">En las llaves por eliminación no hay tabla que
      mostrar, y la fuente tampoco la devuelve.</p>`;
    const g = claves.includes(REF_TABLA) ? REF_TABLA : claves[0];
    const mios = new Set([String(m.homeId), String(m.awayId)]);
    const filas = grupos[g];
    /* Los dos equipos del partido, destacados; el resto de la tabla es
       contexto y colapsa en un renglón de puntos suspensivos. */
    const idx = filas.map((f,i)=> ({f, i})).filter(x=> mios.has(String(x.f.id))).map(x=> x.i);
    const cerca = new Set();
    idx.forEach(i=> [i-1, i, i+1].forEach(j=> { if(j>=0 && j<filas.length) cerca.add(j); }));
    if(!idx.length) filas.forEach((f,i)=> { if(i < 6) cerca.add(i); });

    let out = claves.length > 1
      ? `<div class="tablas">${claves.map(k=>
          `<button class="${k===g?"on":""}" data-reftabla="${esc_(k)}">${esc_(grupoEs(k, m.comp) || "Tabla")}</button>`).join("")}</div>`
      : "";
    /* El equipo que falta ya lo explica `quienFalta()` al pie del
       bloque, y mejor: dice en qué zona juega el otro y que ESTA tabla
       está completa. No se repite acá. */
    out += `<div class="stdh"><span class="p">#</span><span class="e">Equipo</span>
      <span class="v">PJ</span><span class="v">GF</span><span class="pts">PTS</span></div>`;
    let saltados = 0;
    filas.forEach((f, i)=>{
      if(!cerca.has(i)){ saltados++; return; }
      if(saltados){ out += `<div class="stdr puntos">···  ${saltados} equipo${saltados===1?"":"s"} más</div>`; saltados = 0; }
      out += `<div class="stdr${mios.has(String(f.id)) ? " mio" : ""}">
        <span class="p">${dd(i+1)}</span>
        <span class="e">${crest(f.logo, 13)}<span>${esc_(f.t)}</span></span>
        <span class="v">${f.pj}</span><span class="v">${f.gf != null ? f.gf : "—"}</span>
        <span class="pts">${f.pts}</span></div>`;
    });
    if(saltados) out += `<div class="stdr puntos">···  ${saltados} equipo${saltados===1?"":"s"} más</div>`;
    const n = quienFalta(m);
    if(n) out += `<p class="notaref sep">${n.texto}</p>`;
    return out;
  });

  /* ── historial ── */
  const h2h = m.h2h || [];
  h += bloque("hist", "Historial", `${h2h.length} CRUCES`, ()=>{
    let out = "";
    if(h2h.length){
      /* El cara a cara nombra a los dos equipos del partido y a nadie
         mas: el escudo sale de ahi, sin tabla de nombres de por medio. */
      const logoDe = n => n === m.home ? m.homeLogo : n === m.away ? m.awayLogo : null;
      out += `<div class="rsub primero">Cara a cara</div>` + h2h.slice(0, 6).map(x=>
        `<div class="h2hr"><span class="f">${esc_((x.d||"").slice(0,5))}</span>
          <span class="c">${crest(logoDe(x.h), 13)}<span>${esc_(x.h)}</span>
            <em>—</em>${crest(logoDe(x.a), 13)}<span>${esc_(x.a)}</span></span>
          <span class="r">${esc_(x.s || "—")}</span></div>`).join("");
    }
    /* La tira es `tiraForma`, la misma que la portada y el Registro:
       antes esta pantalla dibujaba cuadros mudos y la de al lado los
       dibujaba con la letra adentro. */
    const cinco = (nombre, logo, forma)=>{
      if(!(forma || []).length) return "";
      return `<div class="cinco"><span class="e">${crest(logo, 13)}<span>${esc_(nombre)}</span></span>
        ${tiraForma(forma)}</div>`;
    };
    out += `<div class="rsub">Últimos cinco</div>`
      + cinco(m.home, m.homeLogo, m.formH_general)
      + cinco(m.away, m.awayLogo, m.formA_general)
      + `<div class="leyenda"><span><div class="forma"><i class="g">G</i></div>Ganó</span>
         <span><div class="forma"><i class="e">E</i></div>Empató</span>
         <span><div class="forma"><i class="p">P</i></div>Perdió</span></div>`;
    return out;
  });

  /* ── planteles ── */
  const fichas = (PLANTELES[String(m.homeId)] || []).length + (PLANTELES[String(m.awayId)] || []).length;
  h += bloque("pl", "Planteles", `${fichas} FICHAS`, ()=> cancha(m, false));

  h += `</div>`;
  h += `<div class="warn"><b>El plantel no dice quién falta</b>
    <p>La fuente devuelve a todos como activos: lesionados y suspendidos no vienen en el dato. Va acá,
    donde se mira el plantel, y no al final de un análisis.</p></div>`;
  h += pieTalon("ESPN", "DATOS 03 DE 03");
  return h;
}

function capaDatos(m){
  return EXPL === "jugadores" ? datosJugadores(m)
       : EXPL === "referencia" ? datosReferencia(m)
       : datosEquipos(m);
}

function viewPartido(){
  const m = MATCHES.find(x=>x.id===MATCH_ID);
  if(!m) return `<div class="aviso"><b>Ese partido ya no está</b>Puede que el cron lo haya movido. Volvé a la fecha.</div>`;
  const cuerpo = CAPA === "lectura" ? capaLectura(m)
               : CAPA === "datos"   ? capaDatos(m)
               : capaVeredicto(m);
  /* Veredicto/Lectura/Datos cambiaban de golpe: el contenido nuevo
     reemplazaba al viejo sin puente. `.tabsec` ya existe (la usa el
     panel de Herramientas) — es la misma pieza, no una nueva. Pero
     `render()` se llama también por acordeones, orden de métricas y
     filtros dentro de la MISMA capa — ahí PANTALLA_NUEVA es falso, y
     envolver igual haría que esas acciones repitieran el desliz de
     toda la capa en vez de cambiar solo lo que se tocó. */
  const cuerpoEnvuelto = PANTALLA_NUEVA ? `<div class="tabsec">${cuerpo}</div>` : cuerpo;
  return cabPartido(m) + conmutador() + cuerpoEnvuelto + aire(26);
}

/* El slug de la liga. `m.liga` lo escribe `actualizar.py` desde el
   2026-08-31, pero los archivos que ya están publicados no lo tienen —
   y el cron corre dos veces por día, así que hay una ventana donde
   falta. El caché de estadísticas guarda el mismo slug por equipo, y
   sirve de respaldo sin inventar nada: si tampoco está, se devuelve
   null y los ejes se declaran sin medir, que es lo correcto. */
function ligaDe(m, L, V){
  return m.liga || (L && L.liga) || (V && V.liga) || null;
}

/* ══════════════════════════════════════════════════════════════════
   EL EJE DOMINIO — la primera lectura que se muestra sin recomendar

   Es el primer eje que baja a pantalla desde el contrato (TRASPASO
   §17). Y es a propósito uno que NO se puede marcar: contra plata no
   está medido y no se puede medir hacia atrás, porque football-data no
   publica cuota de córners. Que igual se muestre es la regla nueva —
   vara 1 para mostrar, vara 2 para marcar.

   Los números y el orden salen de `medir_dominio.py` (2026-08-31, test
   temporal en eng y fra): remates +9.9%, al arco +7.3% y córners +4.8%
   sobre la media de la liga. Van en ese orden porque es el orden en que
   sabemos, no el orden en que la casa los cotiza.

   Faltas y tarjetas no están: se midió que no aportan nada sobre el
   promedio de la liga (+1.0% y +0.6%), así que siguen en Estadísticas
   como dato crudo y no acá como lectura.
   ══════════════════════════════════════════════════════════════════ */
/* Faltas y tarjetas: el otro eje del partido, y el que mejor se mide.
   No entra en DOMINIO_METRICAS porque `medir_dominio.py` no lo midió
   contra el promedio de la liga — pero `medir_lineas.py` sí midió su
   calibración, y faltas es la que menos le erra de todas. */
const FRICCION_METRICAS = [
  ["faltas",   "Faltas"],
  ["tarjetas", "Tarjetas"],
];

const DOMINIO_METRICAS = [
  ["remates",  "Remates"],
  ["al_arco",  "Al arco"],
  ["corners",  "Córners"],
];

/* Solo las tres métricas que `medir_dominio.py` midió, y desde
   `esperado` —el número ajustado por rival y por localía que la app ya
   usa en las líneas— y no desde el promedio crudo. */
function dominioDe(L, V){
  if(!L || !V || !L.esperado || !V.esperado) return null;
  const lado = e => {
    const o = {};
    DOMINIO_METRICAS.forEach(([k]) => { if(e[k] != null) o[k] = e[k]; });
    return Object.keys(o).length ? o : null;
  };
  const a = lado(L.esperado), b = lado(V.esperado);
  return (a && b) ? {local: a, visita: b} : null;
}

/* ── El eje Jugadores ───────────────────────────────────────────
   Las métricas van en el orden en que se les cree, medido contra el
   RUIDO y no contra cero (`medir_jugadores.py`): con 618 predicciones
   un modelo perfecto ya se desvía 3.5 puntos por azar. Hoy goles y
   asistencias dan bien, al arco regular y remates mal. */
const JUG_METRICAS = [
  ["goles",   "Gol"],
  ["al_arco", "Al arco"],
  ["remates", "Remates"],
];

const NIVEL_A_CONFIANZA = {bien: "calibrada", regular: "calibrada",
                           mal: "mal_calibrada"};

function confianzaJugadores(metricas){
  /* El eje vale lo que vale su métrica PEOR. Mostrar goles bien
     calibrado al lado de remates mal calibrado y declarar el conjunto
     "calibrado" sería usar lo bueno para tapar lo malo. */
  let peor = "calibrada";
  metricas.forEach(k => {
    const f = fiabilidadJugador(k);
    const c = f ? (NIVEL_A_CONFIANZA[f.nivel] || "sin_medir") : "sin_medir";
    if(CONFIANZAS.indexOf(c) < CONFIANZAS.indexOf(peor)) peor = c;
  });
  return peor;
}

/* Por línea, y no una lista sola de los más goleadores. Con una lista
   sola la delantera se lleva todos los lugares siempre — que es verdad
   y es inútil: el que mira ya sabe que los delanteros rematan más. Lo
   que no sabe es cuál de los volantes de ESTE partido llega mejor, y
   eso solo se ve comparando adentro de su línea. */
const JUG_LINEAS = [
  ["F", "Delantera"],
  ["M", "Mediocampo"],
  ["D", "Defensa"],
];

function jugadoresDe(m, porLinea = 2){
  const de = id => (PLANTELES[String(id)] || []);
  const pool = [];
  [[m.homeId, m.home, m.homeLogo], [m.awayId, m.away, m.awayLogo]].forEach(([id, equipo, logo])=>{
    de(id).forEach(j=>{
      const e = ((j.serie || {}).esp) || {};
      if(e.goles == null) return;
      /* `serie.pj` y NO `j.pj`: el esperado se calcula con la serie
         reciente, no con la temporada entera. Poner "23 partidos"
         debajo de un número que sale de 3 dice que el dato es más
         firme de lo que es — y el que lee no tiene cómo saberlo. */
      pool.push({nombre: j.nombre, equipo: equipo, logo: logo, pos: j.pos,
                 pj: (j.serie || {}).pj || 0, esp: e});
    });
  });
  /* Por chance de gol, que es lo que la gente mira primero y además la
     métrica mejor calibrada de las tres. */
  const out = [];
  JUG_LINEAS.forEach(([pos, etiqueta])=>{
    const linea = pool.filter(j => j.pos === pos)
      .sort((a, b)=> (b.esp.goles || 0) - (a.esp.goles || 0))
      .slice(0, porLinea);
    if(linea.length) out.push({linea: etiqueta, jugadores: linea});
  });
  return out;
}

function ejesDe(m){
  const L = ESTADISTICAS[String(m.homeId)], V = ESTADISTICAS[String(m.awayId)];
  const jug = jugadoresDe(m);
  const mets = JUG_METRICAS.map(([k]) => k);
  return construirEjes({
    liga:     ligaDe(m, L, V),
    probs:    lectura(m).p,
    goles:    {esperados: m.lh + m.la},
    mercado:  m.mercado || null,
    dominio:  dominioDe(L, V),
    contexto: ANALISIS[m.id] || null,
    estadisticas: ANALISIS_EST[m.id] || null,
    jugadores: jug,
    confianzaJugadores: jug.length ? confianzaJugadores(mets) : null,
    calibracionJugadores: mets.reduce((o, k)=>{
      const f = fiabilidadJugador(k);
      if(f) o[k] = {nivel: f.nivel, n: f.n};
      return o;
    }, {}),
  });
}

/* ══════════════════════════════════════════════════════════════════
   POR QUÉ FALTA UN EQUIPO EN LA TABLA

   Hay DOS motivos distintos y decir el equivocado es peor que callarse.

   Medido sobre los 34 partidos del 2026-08-17: de 24 partidos donde uno
   de los dos equipos no está en la tabla, en 19 el equipo está en otra
   zona o grupo de la misma competición — o sea que la tabla está
   completa y el cruce es entre grupos. Solo en 5 el equipo no aparece
   en ninguna tabla de esa competición: ahí sí falta el dato.

   El handoff de diseño trataba los 24 como hueco de datos, citando
   Flamengo vs Cruzeiro. Verificado: Cruzeiro está en el Grupo D de la
   misma Libertadores, así que ese caso es un cruce de llave y la nota
   habría dicho algo falso. Por eso se parte en dos.
   ══════════════════════════════════════════════════════════════════ */
function quienFalta(m){
  const tabla = m.tabla || [];
  if(!tabla.length) return null;
  const hayLocal = tabla.some(f=> String(f.id)===String(m.homeId));
  const hayVisita = tabla.some(f=> String(f.id)===String(m.awayId));
  if(hayLocal && hayVisita) return null;
  if(!hayLocal && !hayVisita) return null;   // ninguno: no es "su" tabla

  const nombre = hayLocal ? m.away : m.home;
  const id = String(hayLocal ? m.awayId : m.homeId);
  const zona = grupoEs(m.grupo, m.comp) || "esta tabla";

  /* ¿Está en otro grupo de la misma competición? Se busca en las tablas
     del resto de los partidos, que es todo lo que tenemos a mano. */
  let otro = null;
  MATCHES.forEach(x=>{
    if(x.comp !== m.comp || x.grupo === m.grupo) return;
    if((x.tabla||[]).some(f=> String(f.id)===id)) otro = grupoEs(x.grupo, x.comp);
  });

  if(otro) return {
    rotulo: "Juegan cruzado",
    texto: `${esc_(nombre)} no está en esta tabla porque no está en este grupo: juega en
      <b>${esc_(otro)}</b>. La tabla de arriba es la de ${esc_(zona)} y está completa —
      este partido cruza los dos grupos.`,
  };

  return {
    rotulo: "Falta uno",
    texto: `${esc_(nombre)} no aparece: la fuente devolvió estas ${tabla.length} líneas y
      ninguna es suya, y tampoco figura en las otras tablas de la competición. Preferimos
      mostrarte la tabla incompleta y decírtelo, antes que inventarle una posición.`,
  };
}

/* Lo que cada equipo hace por partido, uno al lado del otro. Sale del
   mismo /summary que el pipeline ya pedía para los córners del modelo:
   traía 25 métricas por equipo y se guardaban 3.

   Enfrentadas y no en dos listas sueltas porque así es como se leen: la
   pregunta es "quién remata más", no "cuánto remata este". */
/* `cruza:false` en las métricas donde "lo que concede el rival" no
   significa nada. La posesión es complementaria (la de los dos suma
   100, así que "conceder posesión" es literalmente lo mismo que tenerla
   menos), y la precisión de pase y las atajadas describen al equipo que
   las hace, no algo que el rival permita. */
/* ══════════════════════════════════════════════════════════════════
   LA PROBABILIDAD DE UNA LÍNEA

   El mercado no vende promedios, vende líneas: "más de 4.5 córners".
   Un promedio de 4.7 no contesta esa pregunta, y esconde la que sí
   importa — cuánto se mueve ese equipo alrededor de su promedio.

   Dos equipos de 2.0 remates promedio, uno regular y otro errático:
   el errático tiene MÁS chance de pasar 3.5 y MENOS de pasar 1.5. Mismo
   número, apuestas opuestas. Por eso acá no se compara contra la media
   sino que se integra la cola que queda arriba de la línea.

   Qué campana se usa sale de lo que se midió, métrica por métrica, con
   la varianza que tiene cada una alrededor de su media (`disp`, que el
   cron recalcula solo):

     disp > 1  más despatarrada que Poisson (remates: 2.95, córners
               1.75) — binomial negativa, colas gordas
     disp ~ 1  Poisson tal cual
     disp < 1  MÁS regular que Poisson (tarjetas: 0.72) — binomial,
               colas flacas

   Usar Poisson para todo, que es lo que hace casi cualquier planilla,
   subvalúa las colas de remates y sobrevalúa las de tarjetas.
   ══════════════════════════════════════════════════════════════════ */
function probMayor(mu, disp, linea){
  if(mu == null || !isFinite(mu) || mu <= 0) return null;
  if(linea == null || !isFinite(linea)) return null;
  /* Línea 4.5 quiere decir "5 o más". Con líneas enteras el mercado
     devuelve el dinero en el empate; acá se toma el lado estricto. */
  const k0 = Math.floor(linea) + 1;
  if(k0 <= 0) return 1;
  const d = (disp != null && isFinite(disp) && disp > 0) ? disp : 1;
  let acum = 0, t;                       // acum = P(X <= k0-1)
  if(d > 1.05){
    const r = mu / (d - 1), p = 1 / d, q = 1 - p;
    t = Math.pow(p, r);
    for(let k = 0; k < k0; k++){ acum += t; t = t * (k + r) / (k + 1) * q; }
  } else if(d < 0.95){
    /* Menos dispersa que Poisson: ninguna binomial negativa puede
       hacer eso, pero la binomial común sí. Si el ajuste no da una
       binomial válida (o su techo queda debajo de la línea, donde
       daría un cero que no es cierto), se usa Poisson. */
    const n = Math.round(mu / (1 - d));
    const p = n > 0 ? mu / n : 1;
    if(!(n >= k0 && p > 0 && p < 1)) return probMayor(mu, 1, linea);
    t = Math.pow(1 - p, n);
    for(let k = 0; k < k0; k++){ acum += t; t = t * (n - k) / (k + 1) * p / (1 - p); }
  } else {
    t = Math.exp(-mu);
    for(let k = 0; k < k0; k++){ acum += t; t = t * mu / (k + 1); }
  }
  return Math.min(1, Math.max(0, 1 - acum));
}

/* Qué parte de un número es del equipo y qué parte es de la liga.
