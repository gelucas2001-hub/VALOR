   No es un adorno: con la muestra de hoy, en remates `k` da 200, o sea
   que la diferencia entre dos equipos es del tamaño del ruido y lo
   esperable para los dos es casi el promedio de la liga. Mostrar el
   número sin decir eso sería aparentar una precisión que no hay. */
function pesoEquipo(n, k){
  if(!n) return 0;
  if(k == null || !isFinite(k)) return 1;
  return n / (n + k);
}

/* Cuatro líneas alrededor de lo esperado, siempre en .5 para que no
   exista el empate (en una línea entera la casa devuelve el dinero y
   la probabilidad de acá no describiría esa apuesta). */
function lineasDe(mu){
  const base = Math.round(mu);
  return [base - 1.5, base - 0.5, base + 0.5, base + 1.5].filter(L => L > 0);
}

/* Qué tan fiable es cada métrica, según lo medido — no según lo que
   nos gustaría.

   Los cinco botones se veían iguales, y no lo son. Medido el 2026-08-24
   sobre 179 partidos: córners le erra 3.5 puntos sin dirección clara,
   pero FALTAS le erra 9.0 y siempre para el mismo lado, y REMATES 6.6
   también siempre para el mismo. Cuando el desvío es casi todo sesgo,
   no es ruido que se compense apostando más: es un error que se paga
   todas las veces.

   Sin el archivo de calibración no se dice nada. Afirmar que una
   métrica es confiable sin haberla medido es peor que callarse. */
/* Lo mismo para las líneas de jugador, con una diferencia que importa:
   acá el veredicto NO se recalcula en el navegador, viene resuelto en
   `data/calibracion_jugadores.json`.

   Es a propósito. El corte no puede ser un desvío fijo, porque el mismo
   desvío significa cosas distintas según cuántos casos haya: con 618
   predicciones, un modelo PERFECTO ya desvía 3.5 puntos por puro azar.
   Lo que decide es desvío/ruido, y el ruido se estima simulando —
   cuenta que vive en medir_jugadores.py y no tiene por qué correr en
   el teléfono de nadie. */
function fiabilidadJugador(k){
  const c = (CAL_JUG || {})[k];
  if(!c || !c.n || !c.nivel || !c.texto) return null;
  return {nivel: c.nivel, texto: c.texto, n: c.n, serie: c.serie || null};
}

function fiabilidad(k){
  const c = CALIBRACION[k];
  if(!c || !c.n) return null;
  const sesgo = c.sesgo, desvio = c.desvio;
  /* Qué proporción del error tiene dirección. Arriba de 0.7 el error es
     sistemático: le erramos siempre para el mismo lado. */
  const dirigido = desvio > 0 ? Math.abs(sesgo)/desvio : 0;
  const grave = desvio >= 6 && dirigido >= 0.7;
  const flojo = desvio >= 6 || (desvio >= 4 && dirigido >= 0.7);
  const lado = sesgo > 0 ? "de más" : "de menos";
  return {
    grave, flojo, n: c.n, desvio, sesgo, dirigido,
    texto: grave
      ? `Le erramos ${Math.abs(sesgo).toFixed(0)} puntos ${lado}, y casi siempre para el mismo lado. Medido sobre ${c.n} predicciones: esto no es ruido, se paga todas las veces.`
      : flojo
      ? `Le erramos ${desvio.toFixed(1)} puntos en promedio, con tendencia a decir ${lado}. Medido sobre ${c.n} predicciones.`
      : `Le erramos ${desvio.toFixed(1)} puntos en promedio, sin dirección clara. Medido sobre ${c.n} predicciones.`,
  };
}

/* Los parametros de la liga del partido, con el pozo global de respaldo.

   Los dos equipos de un partido de liga comparten liga, asi que alcanza
   con mirar uno; en una copa pueden no compartirla, y ahi cae al global
   — que es peor pero no le aplica a un equipo la vara de otro pais. */
function paramsDe(L, V){
  const lg = (L && L.liga) || (V && V.liga);
  if(lg && V && V.liga && L && L.liga && L.liga !== V.liga) return PARAMETROS;
  return (lg && PARAM_LIGA[lg]) || PARAMETROS;
}

/* ══════════════════════════════════════════════════════════════════
   LO QUE COTIZA BET365 EN CÓRNERS — informativo, sin marca de valor

   A diferencia de "Chance de pasar la línea" (arriba), esto NO es una
   estimación nuestra: es el precio real de Bet365 (odds-api.io), con
   los dos lados y ya sin el margen de la casa (Shin, igual que a
   cualquier mercado de dos vías).

   No se marca como valor a propósito. medir_corners.py midió, el
   2026-08-25, que el córner por equipo le pierde plata al mercado
   (atraso de 0.0205 ±0.0093, ROI negativo en los seis umbrales) — la
   casa ya sabe distinguir equipos y nosotros ahí no le ganamos. Mostrar
   esto en dorado sería prometer una ventaja que se midió que no existe.
   ══════════════════════════════════════════════════════════════════ */
function filaCornerReal(etiqueta, lineas){
  if(!lineas) return "";
  const claves = Object.keys(lineas).sort((a,b)=>parseFloat(a)-parseFloat(b));
  const celdas = claves.map(k=>{
    const p = devigShin(lineas[k]);
    return p ? `<b>+${parseFloat(k).toFixed(1)}<em>${Math.round(p[0]*100)}%</em></b>` : "";
  }).join("");
  return celdas ? `<div class="escf"><span class="escq">${esc_(etiqueta)}</span>
    <div class="escl">${celdas}</div></div>` : "";
}
function bloqueCornersReales(m){
  const c = m.mercadoExtra && m.mercadoExtra.corners;
  if(!c) return "";
  const filas = [
    filaCornerReal("Total del partido", c.total),
    filaCornerReal(m.home, c.local),
    filaCornerReal(m.away, c.visita),
  ].join("");
  if(!filas) return "";
  return `<div class="lbl sep">Lo que cotiza Bet365</div>
    ${filas}
    <p class="fuente">Precio real de la casa, ya sin margen — no nuestra estimación.
      No lo marcamos como valor: medido, el córner por equipo le pierde plata al mercado
      (ver TRASPASO.md).</p>`;
}

const COMPARA = [
  {k:"remates",  et:"Remates"},
  {k:"al_arco",  et:"Al arco"},
  {k:"corners",  et:"Córners"},
  {k:"posesion", et:"Posesión", suf:"%", cruza:false},
  {k:"faltas",   et:"Faltas"},
  {k:"tarjetas", et:"Tarjetas"},
  {k:"offsides", et:"Offsides"},
  {k:"atajadas", et:"Atajadas", cruza:false},
  {k:"tackles",  et:"Quites"},
  /* Los pases dados solos no dicen nada ("380" ¿de cuántos?): lo que
     describe a un equipo es qué proporción le sale bien. */
  {k:"precision", et:"Pases OK", suf:"%", cruza:false,
   calc: e => e.pases != null && e.pases_tot ? (e.pases / e.pases_tot) * 100 : null},
];

/* La cancha con el once probable, como la diseñó el prototipo: un
   equipo por vez, elegido con los dos botones de arriba. Debajo, la
   lista completa — la cancha muestra once y la lista es donde se pesa
   una baja, así que hacen falta las dos. */
/* `conLista` existe desde el rediseño de tres capas: en Datos ·
   Referencia la cancha se muestra sola, porque la lista completa de
   jugadores es el explorador de al lado y repetirla acá sería la misma
   pieza dos veces en la misma capa. */
function cancha(m, conLista = true){
  const esH = PL_EQ !== "A";
  const nombre = esH ? m.home : m.away;
  const id = esH ? m.homeId : m.awayId;
  const js = PLANTELES[String(id)] || [];
  const btn = (k, txt, logo) => `<button class="pleq ${(PL_EQ!=="A")===(k==="H")?"on":""}"
    data-pleq="${k}">${crest(logo, 17)}<span>${esc_(txt)}</span></button>`;
  let h = `<div class="lbl sep">Once probable</div>
    <div class="plsel">${btn("H", m.home, m.homeLogo)}${btn("A", m.away, m.awayLogo)}</div>`;

  if(!js.length){
    return h + `<p class="blurb apag">Todavía no tenemos el plantel de este equipo.</p>`;
  }

  /* El once REAL del último partido si el cron lo trajo; si no, el
     inferido de siempre. Un equipo sin `rosters` cargados se ve igual
     que antes de que esto existiera. */
  const ult = ONCES[String(id)];
  const real = onceReal(ult);
  const o = real || onceProbable(js);
  /* column-reverse: el arquero abajo y el ataque arriba, como en el
     prototipo — "ataca hacia arriba" solo se lee si el dibujo lo hace. */
  const filas = o.lineas.map(linea=> `<div class="pllinea">${linea.map(j=>`
      <div class="plj">
        <span class="dorsal">${esc_(real ? (j.dorsal || j.pos || "·") : (j.pos || "·"))}</span>
        <span class="pln">${esc_(cortarNombre(j.nombre))}</span>
      </div>`).join("")}</div>`).join("");

  h += `<div class="plcampo">
      <i class="borde"></i><i class="medio"></i><i class="circulo"></i>
      <i class="area ab"></i><i class="area ar"></i>
      ${filas}
    </div>
    <div class="plpie"><span>${esc_(o.esquema)} · ${real
      ? "ESQUEMA REAL" : "ESQUEMA INFERIDO"}</span><span>ATACA HACIA ARRIBA</span></div>`;
  h += real
    ? `<p class="blurb pie">Es el once que ${esc_(nombre)} puso de arranque el
        ${esc_(fechaCorta(ult.fecha))} ${ult.local ? "contra" : "de visita a"}
        ${esc_(ult.rival || "su rival")}${ult.marcador ? ` (${esc_(ult.marcador)})` : ""},
        con los dorsales de ese día. <b>No es la formación de hoy</b>: nadie publica el equipo
        titular antes del partido. Es el mejor punto de partida que hay, no una confirmación.</p>`
    : `<p class="blurb pie">Este once sale de
        quiénes vienen jugando más, no de una formación confirmada: no tenemos el once del último
        partido de este equipo. Sirve para ver la forma del equipo, no para dar por hecho quién
        entra.</p>`;
  return conLista ? h + jugadores(nombre, id, PL_MET) : h;
}

/* "2026-08-31" adentro de una frase se lee como un número de serie. */
function fechaCorta(iso){
  const p = String(iso || "").slice(0, 10).split("-");
  if(p.length !== 3) return String(iso || "");
  return `${Number(p[2])} de ${MESES[Number(p[1]) - 1] || ""}`;
}

/* Un nombre completo no entra abajo de un dorsal de 26px. Se corta al
   apellido, que es como se nombra a un jugador en una cancha. */
function cortarNombre(n){
  const partes = String(n||"").trim().split(/\s+/);
  return partes.length > 1 ? partes[partes.length-1] : (partes[0]||"");
}

/* El once probable que se dibuja en la cancha.

   El prototipo de Claude Design traía un 4-3-3 fijo, escrito a mano
   como placeholder mientras no hubiera datos ("la cancha se llena
   sola", decía su propia nota). Ahora los datos existen, así que el
   esquema se DERIVA: un equipo que juega con cinco defensores no
   puede dibujarse igual que uno que juega con cuatro.

   Es una inferencia, no un dato: ESPN no publica la formación ni los
   titulares. Se aproxima por partidos jugados, y la pantalla lo dice
   con todas las letras en vez de hacerlo pasar por confirmado. */
function onceProbable(plantel){
  const js = (plantel||[]).slice().sort((a,b)=> b.pj - a.pj);
  const arq = js.filter(j=> j.pos === "G").slice(0,1);
  const campo = js.filter(j=> j.pos !== "G");
  const cupo = 11 - arq.length;

  /* Los cupos por línea existen porque la fuente clasifica mal. Medido
     sobre los 42 equipos del 2026-08-20: 13 daban esquemas que no
     existen, el peor un 7-0-3 — siete defensores y ningún volante. Ese
     equipo no juega así; ESPN etiqueta como defensor a gente que juega
     de volante. Acotar a rangos reales corrige el error de la fuente,
     no le impone una formación al equipo: adentro de esos rangos el
     esquema lo siguen decidiendo los datos (4-4-2, 5-3-2 y 4-3-3 salen
     todos de acá). */
  const tope = {D:5, M:6, F:3}, piso = {D:3, M:2, F:1};
  const tomar = (p, n) => campo.filter(j=> j.pos === p).slice(0, n);
  /* La cuenta sale de los diez que MÁS JUEGAN, no del plantel entero:
     mirar el plantel completo metería en la defensa titular al quinto
     zaguero, que jugó cuatro partidos. */
  const titulares = campo.slice(0, cupo);
  const cuenta = {};
  ["D","F","M"].forEach(p=>{
    const hay = titulares.filter(j=> j.pos === p).length;
    cuenta[p] = Math.min(Math.max(hay, piso[p]), tope[p]);
  });
  /* Los pisos y topes no tienen por qué sumar diez. Se ajusta el
     mediocampo, que es la línea elástica de cualquier esquema. */
  cuenta.M = Math.min(Math.max(cupo - cuenta.D - cuenta.F, piso.M), tope.M);
  cuenta.D = Math.min(Math.max(cupo - cuenta.M - cuenta.F, piso.D), tope.D);

  const def = tomar("D", cuenta.D), del = tomar("F", cuenta.F);
  let med = tomar("M", cuenta.M);
  /* Si no hay volantes de sobra (o ESPN no le puso posición a nadie),
     el hueco lo llenan los mejores que quedaron sin usar. Un dibujo con
     ocho jugadores miente sobre el equipo tanto como uno con cuatro
     delanteros. */
  const usados = new Set([...arq, ...def, ...del, ...med].map(j=> j.id));
  const faltan = cupo - def.length - del.length - med.length;
  if(faltan > 0) med = med.concat(campo.filter(j=> !usados.has(j.id)).slice(0, faltan));

  return {
    lineas: [arq, def, med, del],
    esquema: [def.length, med.length, del.length].join("-"),
    total: arq.length + def.length + med.length + del.length,
  };
}

/* ESPN no dice "D" y "M": dice CD-L, RB, AM-R, LF. Es mas fino que
   nuestras cuatro filas y es justo lo que hace falta para dibujar la
   forma real — un 4-2-3-1 y un 4-5-1 tienen los mismos once y no son el
   mismo equipo.

   Seis filas y no cuatro: el mediocampo se parte en el que sostiene
   (DM), el de en medio y el que ataca (AM*). Es lo que separa el "2"
   del "3" en un 4-2-3-1 y el "1" del "4" en un 4-1-4-1 — con cuatro
   filas los dos caian en "4-5-1". Verificado contra tres partidos
   reales el 2026-09-01: asi el dibujo reproduce el esquema que publica
   ESPN. La fila que queda vacia no se dibuja. */
const LINEA_DE_POS = {
  G:"G", GK:"G",
  D:"D", CB:"D", CD:"D", LB:"D", RB:"D", WB:"D", LWB:"D", RWB:"D",
  /* `SW` no es un libero: ESPN se lo pone al volante que sostiene. Con
     el en la defensa, un 4-1-3-2 se dibujaba 5-3-2 — cinco defensores
     que el equipo no puso. */
  SW:"H", DM:"H", CDM:"H", LDM:"H", RDM:"H",
  M:"M", CM:"M", LM:"M", RM:"M", LCM:"M", RCM:"M",
  /* `CF` va con los de atras y no con el punta, que suena al reves y es
     lo que dice el dato: donde hay un `F` suelto mas `CF-L`/`CF-R`,
     ESPN cuenta 2 y despues 1 (el 3-4-2-1). Y donde los `CF` son los
     dos de arriba, la fila `F` queda vacia y no se dibuja, asi que el
     esquema sale igual. */
  AM:"A", CAM:"A", SS:"A", CF:"A", LCF:"A", RCF:"A",
  F:"F", ST:"F", LF:"F", RF:"F", W:"F", LW:"F", RW:"F",
};
/* Todo lo que no esta en la tabla cae en el mediocampo, que es la linea
   elastica: una etiqueta nueva de ESPN produce un dibujo raro, no un
   equipo con diez jugadores.

   Medido el 2026-09-01 sobre los 82 equipos que tienen once: el dibujo
   reproduce el esquema que publica ESPN en 79. Los tres que quedan son
   ESPN contra si misma —dos equipos con las MISMAS etiquetas y strings
   distintos (3-4-2-1 y 3-4-3), y dos 4-3-1-2 con un solo delantero
   etiquetado—, y ahi manda el dibujo. */
function lineaDePos(pos){
  const base = String(pos || "").toUpperCase().split("-")[0];
  return LINEA_DE_POS[base] || "M";
}

/* El once que el equipo puso de verdad la ultima vez. Reemplaza a la
   inferencia cuando existe. */
function onceReal(once){
  const js = (once && once.jugadores) || [];
  if(js.length !== 11) return null;
  const de = k => js.filter(j=> lineaDePos(j.pos) === k);
  const lineas = [de("G"), de("D"), de("H"), de("M"), de("A"), de("F")].filter(l=> l.length);
  /* El dibujo manda sobre la etiqueta. ESPN publica su propio
     "4-2-3-1" y casi siempre coincide con lo que sale de las
     posiciones, pero si no coincide se rotula lo que se DIBUJA: una
     cancha con cinco volantes abajo de un cartel que dice 2-3 es peor
     que no poner cartel. */
  const dibujado = lineas.slice(1).map(l=> l.length).join("-");
  const esquema = (once.esquema || "") === dibujado ? once.esquema : dibujado;
  return {lineas, esquema};
}

/* La lista de jugadores de un equipo, con los números que permiten pesar
   una ausencia. El peso goleador es el que importa: sin él, "no está
   Rodallega" y "no está el cuarto suplente" se leen igual. Solo se
   muestra a partir de 15%, porque abajo de eso es ruido y llenaría la
   columna de porcentajes irrelevantes. */
/* Lo que se puede mirar por jugador. Son las columnas que el cron ya
   baja en planteles.json — nada acá inventa un campo que no exista, y
   hay un test que lo verifica contra el archivo real.

   Se muestra de a una y la lista se ordena por ella: en 375px no entran
   ocho columnas por fila, y además así es como esto se mira de verdad
   ("quién remata más en este equipo"), no leyendo una grilla. */
const METRICAS = [
  {k:"goles",     et:"Goles"},
  {k:"asist",     et:"Asist."},
  {k:"remates",   et:"Remates"},
  {k:"al_arco",   et:"Al arco"},
  {k:"faltas",    et:"Faltas"},
  {k:"amarillas", et:"Amarillas"},
];

/* Las métricas de jugador que tienen mercado por línea. Atajadas queda
   afuera porque el cron todavía no las baja por partido. */
const LIN_JUG = ["remates", "al_arco", "faltas", "amarillas", "goles", "asist"];

/* La línea que le queda más cerca a lo que se espera del jugador, y la
   chance de pasarla.

   La campana es la de su PUESTO, no la suya: con 3 a 8 partidos, un
   desvío propio es ruido con forma de número. Lo del jugador entra por
   la media — que ya viene encogida hacia su puesto según cuánto se le
   pueda creer (k=3.6 en remates para un delantero: bastante). La serie
   partido por partido se muestra al lado, sin promediarla, porque es
   justo lo que un promedio no puede decir. */
function lineaJugador(j, met, liga){
  if(LIN_JUG.indexOf(met) < 0) return null;
  const s = j && j.serie;
  if(!s || !s.esp || s.esp[met] == null) return null;
  /* La media ya viene encogida hacia el puesto DE SU LIGA desde el cron;
     la dispersión hay que tomarla del mismo lado o se mezclan dos varas. */
  const tabla = (liga && PARAMJUG_LIGA[liga]) || PARAM_JUG;
  const par = tabla[j.pos];
  if(!par || !par[met]) return null;
  const mu = s.esp[met];
  const linea = Math.max(0.5, Math.round(mu) - 0.5);
  const prob = probMayor(mu, par[met].disp, linea);
  return prob == null ? null : {linea: linea, prob: prob};
}

function filaJugador(j, clave, liga){
  /* El peso goleador se muestra cuando se están mirando los goles. En
     las otras métricas competiría con el número de la columna y le come
     el nombre al jugador, que ya venía cortándose.
     Iba flotando en el medio de la fila, empujando las columnas de
     números a posiciones distintas según el jugador; ahora entra en el
     renglón de contexto, que es donde vive todo lo que matiza. */
  const peso = (clave === "goles" || clave === "asist") && j.peso_goles >= 0.15
    ? `<b>${Math.round(j.peso_goles*100)}% de los goles</b>` : "";
  /* Un campo ausente no es un cero medido: mostrar "0" sería afirmar una
     medición que no existe. */
  const hay = j[clave] != null;
  const tot = hay ? j[clave] : "—";
  const media = hay && j.pj > 0 ? (j[clave] / j.pj).toFixed(1) : "—";
  /* La serie de los últimos partidos, tal cual, sin promediar. Es el
     pedido textual: "no es lo mismo un jugador que remató 5 veces en 5
     partidos pero hizo 4 en 1". El promedio los da iguales. */
  const s = j.serie && j.serie[clave];
  const L = lineaJugador(j, clave, liga);
  const serie = tiraSerie(s);

  /* Renglón de contexto. "11 en 5 PJ" en vez de dos columnas mudas: se
     explica solo, así la fila no depende de una cabecera que en la sexta
     fila ya quedó fuera de pantalla. La serie va sin la etiqueta
     "partido a partido" — el pie de la lista lo dice una vez para todas
     en lugar de repetirlo doce veces. */
  const corta = j.pj > 0 && j.pj <= 2;
  const ctx = [
    hay ? `${tot} en ${j.pj} PJ` : `${j.pj} PJ`,
    peso,
    corta ? "muestra corta" : "",
  ].filter(Boolean).join(" · ");

  /* Un promedio de 0.0 en tinta plena atrae el ojo hacia el único
     número que no dice nada. Se apaga, igual que la muestra corta. */
  const cero = !hay || !(j[clave] > 0);
  return `<div class="jrow${corta ? " corta" : ""}${cero ? " cero" : ""}">
      <span class="pos">${esc_(j.pos||"—")}</span>
      <span class="jn">${esc_(j.nombre)}${
        j.dorsal ? `<em class="drs">${esc_(j.dorsal)}</em>` : ""}</span>
      <b class="jprom">${media}</b>
      <span class="jctx">${ctx}</span>
      <span class="jlin">${L ? `+${L.linea.toFixed(1)} → ${Math.round(L.prob*100)}%` : ""}</span>
      ${serie}
    </div>`;
}

function jugadores(nombre, id, met){
  const js = PLANTELES[String(id)] || [];
  const liga = (ESTADISTICAS[String(id)] || {}).liga;
  if(!js.length){
    return `<div class="lbl sep">${esc_(nombre)} — jugadores</div>
      <p class="blurb apag">Todavía no tenemos el plantel de este equipo.</p>`;
  }
  const clave = (METRICAS.find(x=> x.k === met) || METRICAS[0]).k;
  /* Los que no jugaron nunca no aportan nada a la lectura del partido y
     son un tercio del roster. Se ocultan. */
  const activos = js.filter(j=> j.pj > 0);
  const filas = (activos.length ? activos : js)
    .slice().sort((a,b)=> (b[clave]||0) - (a[clave]||0))
    .slice(0, 12).map(j=>{
    /* El peso goleador se muestra cuando se están mirando los goles.
       En las otras métricas competiría con el número de la columna y le
       come el nombre al jugador, que ya venía cortándose. */
    return filaJugador(j, clave, liga);
  }).join("");
  const botones = METRICAS.map(x=>
    `<button class="met${x.k === clave ? " on" : ""}" data-plmet="${x.k}">${x.et}</button>`
  ).join("");
  /* La cabecera ya no rotula cuatro columnas: rotula el único número
     grande de la fila, que es el que se viene a buscar. Lo demás se
     explica en el renglón de contexto y en este pie. */
  const conLinea = /→/.test(filas);
  /* La misma pieza que usa el bloque de equipo, a propósito: hay una
     sola forma en la app de decir "de esto fiate y de esto no".

     Existe porque hasta el 2026-08-24 esta lista mostraba un "+0.5 →
     62%" sin que nadie hubiera comprobado que cuando dice 62% pasa el
     62%. Lucas preguntó si la app servía para el mercado de remates de
     jugador; se midió (medir_jugadores.py) y la respuesta es que
     depende mucho de la métrica: remates le erra el doble de lo que
     explica el azar, y asistencias casi no le erra. Eso tiene que
     estar en la pantalla, no en un informe. */
  const fj = conLinea ? fiabilidadJugador(clave) : null;
  const juicio = !conLinea ? ""
    : fj ? `<p class="fiab ${fj.nivel}">${esc_(fj.texto)} Medido sobre ${fj.n} predicciones${
             fj.serie ? `, con series de ${fj.serie} partido${fj.serie===1?"":"s"}` : ""}.</p>`
    : `<p class="fiab">Esta métrica todavía no se midió: no sabemos cuánto le erra el porcentaje.</p>`;
  return `<div class="lbl sep">${esc_(nombre)} — jugadores</div>
    <div class="mets">${botones}</div>
    ${juicio}
    <div class="jhead"><span>Jugador</span><span>Prom. por partido</span></div>
    <div>${filas}</div>
    <p class="jfuente">Ordenados por total en la temporada. Cada casilla es un partido de los
      últimos que tenemos, y se llena de tinta según lo que hizo ahí — vacía es cero.${conLinea
      ? ` A la derecha, la chance de pasar esa línea.` : ""}
      Donde dice <i>muestra corta</i> hay dos partidos o menos: el promedio no dice mucho
      todavía.</p>`;
}

/* ══════════════════════════════════════════════════════════════════
   LA CUOTA QUE YA TENEMOS — para no volver a tipearla

   Herramientas le pedía al usuario cargar a mano la cuota de SU casa
   para cada mercado, siempre — 1X2 incluido, aunque tuviéramos la
   referencia de DraftKings, porque esa referencia no es apostable acá
   (DraftKings no opera en Argentina). Bet365 es distinto: es la casa
   que el usuario realmente usa, así que su cuota real SÍ es la que él
   necesita cargar. Si ya la tenemos, no hace falta que la tipee.

   Devuelve null cuando no hay cruce o el mercado no tiene esa opción —
   ahí Herramientas sigue pidiendo la carga manual, exactamente como
   antes de que esto existiera. */
function cuotaReal(m, op){
  const mx = m.mercadoExtra || {};
  if(op.linea!=null){
    const gx = mx.goles && mx.goles[String(op.linea)];
    if(gx && gx.length===2){
      const c = op.lado==="over" ? gx[0] : gx[1];
      return c>1 ? c : null;
    }
    return null;
  }
  const uno = mx["1x2"], dc = mx.dc, bt = mx.btts;
  const de = (obj, k) => (obj && obj[k]>1) ? obj[k] : null;
  switch(op.id){
    case "1x2_l": return de(uno, "local");
    case "1x2_e": return de(uno, "empate");
    case "1x2_v": return de(uno, "visitante");
    case "dc_lx": return de(dc, "1X");
    case "dc_x2": return de(dc, "X2");
    case "dc_12": return de(dc, "12");
    case "btts_si": return de(bt, "si");
    case "btts_no": return de(bt, "no");
  }
  return null;
}

/* ── 6. Herramientas ───────────────────────────────────────────── */
function tabHerramientas(m){
  if(!BANCA){
    return `<div class="askbank">
      <b>¿Cuánto separaste para apostar?</b>
      <p>Con eso te decimos cuánto tiene sentido jugar en cada opción — más en las que
        vemos más claras, menos en las otras. Lo podés cambiar cuando quieras.</p>
      <input class="campo" id="banca-in" inputmode="numeric" placeholder="$ 50.000">
      <small>Se guarda en este celular, en ningún lado más.</small>
      <button class="btn" data-banca="1">Listo</button>
    </div>`;
  }
  const lec = lectura(m);
  const ops = mercados(lec.M, m);
  const kf = (m.conf>=72) ? 0.25 : (m.conf>=60) ? 0.125 : (m.conf>=50) ? 0.0625 : 0.005;
  const tope = BANCA * 0.04;
  /* La regla de alineación también rige acá — Método la promete sin
     calificar por pantalla ("nuestra regla es que nada contradiga
     nuestra propia lectura del partido"), y antes esta pestaña la
     ignoraba: calculaba EV/Kelly solo con la cuota cargada, sin mirar
     si el mercado contradice la inclinación humana. Sin análisis
     cargado (`dir` null) sigue funcionando igual que siempre — no hay
     contra qué alinear, y es la mayoría de los partidos de la grilla. */
  const dir = inclinacionDe(m.id);

  let h = `<div class="banda banda2">Herramientas<em>PARA VOS</em></div><div class="sec">
    <p class="expl">Esta pestaña es para vos, no para la gente. Cuando tenemos la cuota real
    de Bet365 te la dejamos cargada — la podés cambiar si te pagan distinto en el momento.
    Donde no la tenemos, cargá la que te da <em>tu</em> casa y te devuelve la ventaja real
    y cuánto jugar contra ese precio.</p>
    <p class="expl">Antes de cargar: el EV de acá sale de nuestra propia estimación, y esa
    estimación todavía no demostró ganarle al mercado — walk-forward contra el cierre real da
    <b>−3,27% de ROI, con un margen de ±6,19</b>. El detalle está en Método. "Jugale $X" es
    lo que dice la cuenta, no una promesa.</p>
    <div class="bankline">Jugás con <b>${plata(BANCA)}</b> separados
      <button data-resetbanca="1">cambiar</button></div>`;

  const fams = ["Resultado","Goles","Ambos"];
  fams.forEach(fam=>{
    h += `<div class="grp"><div class="gh">${fam}</div>`;
    ops.filter(o=>o.fam===fam).forEach(o=>{
      const key = m.id+"__"+o.id;
      const manual = CUOTAS[key]>1;
      const sugerida = !manual ? cuotaReal(m, o) : null;
      const c = manual ? CUOTAS[key] : sugerida;
      const val = c && c>1;
      const e = val ? ev(o.p, c) : null;
      const k = val ? kelly(o.p, c) : 0;
      const sano = val && e<EV_ABSURDO;
      const alineado = !dir || !contradice(o, dir);
      const jugable = val && e>=MIN_EV && c<=MAX_ODDS && sano && alineado;
      const stake = jugable ? Math.min(Math.round(BANCA*k*kf), tope) : 0;
      let out;
      if(!val) out = `<span class="ev">Cargá la cuota</span>`;
      else if(c>MAX_ODDS) out = `<span class="ev neg">Cuota muy alta — no la jugamos</span>`;
      else if(!sano) out = `<span class="ev neg">EV +${(e*100).toFixed(0)}% — revisá la cuota</span>`;
      else if(!alineado) out = `<span class="ev neg">Contradice nuestra lectura (inclinamos ${aQuien(dir, m)}) — no lo marcamos</span>`;
      else if(e<MIN_EV) out = `<span class="ev neg">EV ${(e*100).toFixed(1)}%</span>`;
      else out = `<span class="ev pos">EV +${(e*100).toFixed(1)}%</span>
        <div class="juega"><span>Jugale</span><b>${plata(stake)}</b></div>`;
      h += `<div class="mrow ${jugable?"val":(val&&!sano)?"mal":""}">
        <div class="top2"><span class="mkt">${esc_(o.label)}</span><span class="modelo">modelo ${pc(o.p)}</span></div>
        <div class="inrow">
          <input inputmode="decimal" placeholder="—" value="${val?c:""}" data-cuota="${esc_(key)}">
          ${sugerida ? `<span class="sug">Bet365</span>` : ""}
          <div class="out">${out}</div>
        </div>
        ${jugable ? `<div class="acc"><button class="chip" data-anotar="${esc_(key)}">Anotar en Registro</button></div>` : ""}
        ${val && !sano ? `<div class="expl alerta">Una ventaja así de grande casi nunca es del precio: es nuestra estimación fallando en este partido. Verificá que la cuota esté bien cargada.</div>` : ""}
      </div>`;
    });
    h += `</div>`;
  });
  return h + `</div>`;
}

/* ══════════════════════════════════════════════════════════════════
   PANTALLA: REGISTRO
   ══════════════════════════════════════════════════════════════════ */
function viewRegistro(){
  const n = LOG.length;
  let h = `<header class="masthead titulada">
    <div class="tq">${troquel("REGISTRO","rg")}
      <span class="cuenta">${n} ${n===1?"CARGA":"CARGAS"}</span></div>
    <div class="kicker">Tu bitácora — acá los números van sin traducir</div></header>`;

  if(!n){
    h += `<div class="sec aire2">
      <div class="big">Todavía no anotaste nada</div>
      <p class="prosa capitular">Cuando cargues una cuota en Herramientas y tenga ventaja,
        vas a poder anotarla acá con un toque. Después se resuelve sola: cuando el partido
        se juega, buscamos el resultado y marcamos si entró. No tenés que volver a tocar
        nada, ni acordarte.</p>
      <div class="rot cerrar"><span>Sin movimientos</span></div>
    </div>`;
    return h;
  }

  /* El estado guardado no manda. Se resuelve en cada render contra los
     datos frescos, y lo único que se persiste como verdad es la
     corrección manual. Si guardáramos el resultado, un cruce
     equivocado quedaría fosilizado y ningún dato nuevo lo arreglaría. */
  const hoy = hoyISO();
  const filas = LOG.map((x, idx)=> ({carga:x, idx, r: resolver(x, MATCHES, hoy)}));

  const cerradas = filas.filter(f=> f.r.estado==="ganada" || f.r.estado==="perdida");
  const invertido = cerradas.reduce((s,f)=> s + f.carga.stake, 0);
  const neto = cerradas.reduce((s,f)=> s + (f.r.estado==="ganada" ? f.carga.stake*(f.carga.cuota-1) : -f.carga.stake), 0);
  const roi = invertido ? neto/invertido : 0;
  const aciertos = cerradas.filter(f=> f.r.estado==="ganada").length;
  const tasa = cerradas.length ? aciertos/cerradas.length : 0;

  /* ── el rendimiento, con su incertidumbre al lado ───────────────
     Un ROI sin intervalo es una promesa. Con 20 apuestas el error
     estándar es más grande que casi cualquier ventaja real, y esconderlo
     hace que una racha se lea como un método. El intervalo sale de la
     dispersión de los retornos, no de un número escrito a mano: si un
     día la muestra crece, el intervalo se angosta solo. */
  const retornos = cerradas.map(f=> f.r.estado==="ganada" ? (f.carga.cuota-1) : -1);
  const media = retornos.length ? retornos.reduce((a,b)=>a+b,0)/retornos.length : 0;
  const varia = retornos.length > 1
    ? retornos.reduce((a,b)=> a + (b-media)*(b-media), 0)/(retornos.length-1) : 0;
  const ee = retornos.length ? Math.sqrt(varia/retornos.length) : 0;
  const lo = (roi - 1.96*ee)*100, hi = (roi + 1.96*ee)*100;
  const rango = (hi - lo) || 1;
  /* Las tres marcas —banda, punto y cero— salen de la MISMA escala. En
     la pantalla de honestidad del producto, una barra que contradice sus
     propios números es el peor error posible. */
  const pctCero = Math.max(0, Math.min(100, (0 - lo)/rango*100));
  const pctRoi  = Math.max(0, Math.min(100, (roi*100 - lo)/rango*100));
  const cruza = lo <= 0 && hi >= 0;

  h += `<div class="roi">
    <div class="cif"><b class="${roi>0?"pos":roi<0?"neg":""}">${cerradas.length
      ? (roi>0?"+":"") + (roi*100).toFixed(2) + "%" : "—"}</b>
      <span>${cerradas.length>1 ? "± " + (1.96*ee*100).toFixed(2) : "sin muestra para el margen"}</span></div>
    ${cerradas.length>1 ? `<div class="intv">
      <div class="riel">
        <i class="banda3 ${roi>0?"pos":""}"></i>
        <i class="pt ${roi>0?"pos":""}" style="left:${pctRoi.toFixed(1)}%"></i>
        ${cruza ? `<i class="cero" style="left:${pctCero.toFixed(1)}%"></i>` : ""}
      </div>
      <div class="eje"><span class="iz">${lo.toFixed(1)}%</span>
        ${cruza ? `<span class="ce" style="left:${pctCero.toFixed(1)}%">0</span>` : ""}
        <span class="de">+${hi.toFixed(1)}%</span></div>
    </div>` : ""}
    <p class="notaint">${cerradas.length<2
      ? "Con menos de dos apuestas cerradas no hay margen que calcular."
      : cruza
      ? "El intervalo cruza el cero: con esta muestra no se puede afirmar que el método gane ni que pierda."
      : roi>0
      ? "El intervalo queda entero arriba del cero, y aun así son pocas apuestas: mirá el número de nuevo dentro de cien."
      : "El intervalo queda entero abajo del cero con esta muestra."}</p>
  </div>
  <div class="cel3">
    <div><small>STAKE TOTAL</small><b>${plata(invertido)}</b></div>
    <div><small>RESULTADO</small><b class="${neto<0?"neg":""}">${neto>0?"+":""}${plata(neto)}</b></div>
    <div><small>ACIERTO</small><b>${cerradas.length?pc(tasa):"—"}</b></div>
  </div>`;

  /* ── por familia de mercado ─────────────────────────────────────
     La familia sale del id de la opción, que es lo que quedó guardado
     en la clave: el label es texto para leer y cambia con el nombre del
     equipo. Con menos de cinco cerradas la columna dice `n/d` — un ROI
     de tres apuestas no es un ROI. */
  const familiaDe = key => {
    const id = key.slice(key.indexOf("__")+2);
    return id.startsWith("1x2") ? "Resultado 1X2"
         : id.startsWith("dc")  ? "Doble oportunidad"
         : id.startsWith("btts")? "Ambos marcan"
         : /^(ov|un)/.test(id)  ? "Total de goles" : "Otros";
  };
  const fams = {};
  cerradas.forEach(f=>{
    const k = familiaDe(f.carga.key);
    const a = fams[k] || (fams[k] = {n:0, stake:0, neto:0});
    a.n++; a.stake += f.carga.stake;
    a.neto += f.r.estado==="ganada" ? f.carga.stake*(f.carga.cuota-1) : -f.carga.stake;
  });
  const claves = Object.keys(fams);
  if(claves.length){
    h += `<div class="lbl sep reg">Por familia de mercado</div>
      <div class="famt"><div class="famh"><span class="m">Mercado</span>
        <span class="n">N</span><span class="r">ROI</span></div>
      ${claves.map(k=>{
        const a = fams[k], r = a.stake ? a.neto/a.stake : 0;
        const poco = a.n < 5;
        return `<div class="famr"><span class="m">${esc_(k)}</span>
          <span class="n">${a.n}</span>
          <span class="r ${poco?"nd":r<0?"neg":""}">${poco ? "n/d"
            : (r>0?"+":"") + (r*100).toFixed(1) + "%"}</span></div>`;
      }).join("")}</div>
      <p class="notacapa">Con menos de cinco apuestas cerradas la columna dice <b>n/d</b>: un ROI de
      tres apuestas no es un ROI.</p>`;
  }

  /* De dónde viene cada estado. El cruce por nombre de rival es frágil,
     así que el usuario tiene que poder ver de un vistazo cuánto de su
     registro lo decidió la app sola. */
  const nAuto = cerradas.filter(f=> f.r.auto).length;
  const nEsper = filas.filter(f=> f.r.esperando).length;
  const nManual = filas.filter(f=> !f.r.auto).length;
  const proc = [
    nAuto  ? `${nAuto} ${nAuto===1?"resuelta":"resueltas"} con el resultado` : "",
    nEsper ? `${nEsper} esperando resultado` : "",
    nManual? `${nManual} ${nManual===1?"corregida":"corregidas"} a mano` : "",
  ].filter(Boolean).join(" · ");
  if(proc) h += `<div class="proc">${esc_(proc)}</div>`;

  const cont = e => filas.filter(f=> e==="todas" || f.r.estado===e).length;
  h += `<div class="filters">
    ${[["todas","Todas"],["ganada","Ganadas"],["perdida","Perdidas"],["pendiente","Pendientes"]]
      .map(([k,l])=>`<button class="chip ${FILTRO===k?"on":""}" data-filtro="${k}">${l} ${cont(k)}</button>`).join("")}
  </div><div class="banda banda2">Últimas cargadas<em>DE LA MÁS NUEVA</em></div>`;

  const lista = filas.filter(f=> FILTRO==="todas" || f.r.estado===FILTRO).slice().reverse();
  if(!lista.length) h += `<div class="aviso">Nada con ese filtro.</div>`;
  lista.forEach(f=> h += fichaRegistro(f));
  return h + `<div class="aire16"></div>`;
}

/* Una carga del registro. El sello dice en qué estado quedó y la línea
   de abajo dice por qué — de dónde salió ese estado. */
function fichaRegistro({carga:x, idx, r}){
  const dev = r.estado==="ganada" ? `<span class="dev pos">+${plata(x.stake*(x.cuota-1))}</span>`
            : r.estado==="perdida" ? `<span class="dev neg">−${plata(x.stake)}</span>` : "";

  let sello, detalle;
  if(!r.auto){
    sello = `<span class="sello man">A mano</span>`;
    detalle = "Lo marcaste vos. No lo tocamos.";
  } else if(r.estado==="ganada" || r.estado==="perdida"){
    sello = `<span class="sello ${r.estado==="ganada"?"gan":"per"}">${r.estado==="ganada"?"Ganada":"Perdida"}</span>`;
    detalle = r.res.exacto
      ? "Resuelto con el marcador final del partido."
      : `Cruzado con el historial de ${r.res.fuente}.`;
  } else if(r.esperando){
    sello = `<span class="sello esp">Sin resultado</span>`;
    detalle = "Se jugó, pero el marcador todavía no aparece. Si ya lo sabés, cargalo vos.";
  } else {
    sello = `<span class="sello sin">Sin jugar</span>`;
    detalle = `Se juega el ${cuando(x.fecha)}. Se resuelve solo.`;
  }

  /* Los tres botones no viven en la ficha: aparecen cuando el usuario
     pide corregir, o cuando la app se quedó sin resultado y necesita
     que alguien la ayude. Mostrarlos siempre era la fricción que hacía
     que el registro no se llenara. */
  const abierto = CORRIGIENDO === x.key || (r.auto && r.esperando);
  const botones = abierto ? `<div class="res">
      <button class="w ${r.estado==="ganada"?"on":""}" data-estado="${idx}|ganada">Ganada</button>
      <button class="l ${r.estado==="perdida"?"on":""}" data-estado="${idx}|perdida">Perdida</button>
      <button class="p ${r.estado==="pendiente"?"on":""}" data-estado="${idx}|pendiente">Pendiente</button>
    </div>` : "";

  const enlace = !r.auto
    ? `<button class="lnk" data-auto="${idx}">Volver al automático</button>`
    : (abierto ? "" : `<button class="lnk" data-corregir="${esc_(x.key)}">Corregir a mano</button>`);

  const marcador = r.res ? `<span class="marc">${r.res.i}-${r.res.j}</span>` : "";

  return `<div class="lbet ${r.estado==="perdida"?"perdida":""}">
    <div class="top2"><span class="part">${esc_(x.partido)}</span><span class="stake">${plata(x.stake)}</span></div>
    <div class="mkt">${esc_(x.mercado)}</div>
    <div class="meta">${esc_(x.comp)} · @${x.cuota.toFixed(2)} · EV ${x.ev>0?"+":""}${(x.ev*100).toFixed(1)}%</div>
    <div class="estado">${sello}${marcador}${dev}</div>
    <div class="proced">${esc_(detalle)}</div>
    ${enlace ? `<div class="acc">${enlace}</div>` : ""}
    ${botones}</div>`;
}

/* "MAR 18" — la fecha de un partido que todavía no se jugó. */
function cuando(iso){
  if(!iso) return "—";
  const d = fechaDe(iso);
  return `${DIAS[d.getDay()]} ${d.getDate()}`;
}

/* ══════════════════════════════════════════════════════════════════
   PANTALLA: MÉTODO
   ══════════════════════════════════════════════════════════════════ */
/* Los cuatro pasos, en orden. Es la cadena entera del producto dicha en
   cuatro frases: sin esto, "cuota mínima" y "stake" aparecen en el
   Veredicto sin que nada explique de dónde salen. */
const PASOS = [
  ["Goles esperados", "Cuántos goles esperamos de cada equipo, con todos los partidos de la temporada y pesando más los recientes."],
  ["Probabilidad", "De esos dos números sale la chance de cada resultado posible, con Dixon-Coles: no una promesa, una proporción."],
  ["Cuota mínima", "La cuota justa más un margen de seguridad. Si te pagan más que eso, conviene; si te pagan menos, no."],
  ["Stake", "Cuánto jugar según Kelly, siempre fraccionado y con tope. La cuenta dice el número; la decisión es tuya."],
];

function viewMetodo(){
  /* La señal por métrica sale de `calibracion_jugadores.json`, medida
     contra el RUIDO y no contra cero: con 618 predicciones un modelo
     perfecto ya se desvía 3.5 puntos por azar. El riel va de 0 a 2.00× y
     el tick es el techo (1.00). Arriba del techo el número está medido y
     medido mal — eso no es un disclaimer, es el resultado. */
  const metricas = Object.keys(CAL_JUG || {})
    .filter(k=> (CAL_JUG[k]||{}).razon != null)
    .sort((a,b)=> CAL_JUG[a].razon - CAL_JUG[b].razon);
  const nombreMet = {remates:"Remates", al_arco:"Remates al arco", faltas:"Faltas",
                     amarillas:"Amarillas", goles:"Goles", asist:"Asistencias"};
  const cerradas = LOG.filter(x=> x.estado==="ganada" || x.estado==="perdida").length;

  let h = `<header class="masthead titulada">
    <div class="tq">${troquel("MÉTODO","mt",150)}</div>
    <div class="kicker">Cómo se calcula y cuánto se le cree</div></header>
  <div class="pasos2">${PASOS.map(([t, p], i)=>
    `<div class="paso2"><span class="np">${dd(i+1)}</span>
      <span class="tp"><b>${esc_(t)}</b><p>${esc_(p)}</p></span></div>`).join("")}</div>`;

  if(metricas.length){
    h += `<div class="sepsec"><span>Señal por métrica</span><i></i></div>
      <p class="notacapa">Cuánto se desvía cada línea de jugador comparada con lo que explica el
      azar. Debajo de <b>1.00</b> le creemos el número; arriba, está medido que no.</p>
      <div class="senalbox">${metricas.map(k=>{
        const r = CAL_JUG[k].razon;
        const pct = Math.max(2, Math.min(100, r/2*100));
        const cls = r < 1 ? "" : r <= 1.6 ? "medio" : "alto";
        return `<div class="senalf"><div class="sf"><span>${esc_(nombreMet[k] || k)}</span>
          <b class="${r>1.6?"mal":""}">${r.toFixed(2)}×</b></div>
          <div class="sr"><i class="${cls}" style="width:${pct.toFixed(1)}%"></i>
            <i class="techo"></i></div></div>`;
      }).join("")}
      <div class="senalpie"><i></i><span>techo 1.00</span></div></div>`;
  }

  /* Los límites, dichos donde el usuario los puede usar. Son cuatro y
     ninguno es opinión: los tres primeros son propiedades de la fuente,
     el cuarto es el tamaño de la muestra propia. */
  h += `<div class="sepsec"><span>Límites</span><i></i></div>
    <div class="limites">
      <div class="limite"><b>Cinco partidos por equipo</b><i>El caché de estadísticas es corto:
        abajo de esa muestra el número es casi todo promedio de la liga.</i></div>
      <div class="limite"><b>No hay partes médicos</b><i>La fuente devuelve a todos los jugadores
        como activos. Lesionados y suspendidos no vienen en el dato.</i></div>
      <div class="limite"><b>Una sola casa de cuotas</b><i>La referencia es DraftKings, que ni
        siquiera opera en Argentina. Por eso mostramos umbral y no cuota.</i></div>
      <div class="limite"><b>${cerradas} apuesta${cerradas===1?"":"s"} cerrada${cerradas===1?"":"s"}</b>
        <i>${cerradas
          ? "Con esta muestra el intervalo de tu ROI todavía es más ancho que cualquier ventaja real."
          : "Todavía no anotaste ninguna: sin muestra propia no hay nada que medir de este lado."}</i></div>
    </div>
  <button class="lnkf" data-nav="registro"><div class="t">
      <small>Rendimiento real</small><b>Registro</b></div><span class="fl">›</span></button>
  ${pieTalon(CALJUG_FECHA ? `CALIBRADO ${fechaCorta(CALJUG_FECHA)}` : "SIN CALIBRAR",
             `${metricas.length} MÉTRICAS`)}
  <div class="sepsec"><span>En detalle</span><i></i></div>
  <div class="sec metodo">

    <h3>Qué hacemos</h3>
    <p class="capitular">Estimamos cuántos goles esperamos de cada equipo, y de ahí sale la
      probabilidad de cada resultado posible. La estimación se ajusta con todos los partidos
      de la temporada, pesando más los recientes.</p>

    <h3>Por qué probabilidad y no "va a ganar X"</h3>
    <p>Un 74% no es una promesa: es que de cada 4 partidos así, 3 terminan de esa forma
      y <b>uno no</b>. Si decimos 74% y acertamos las 10 de 10, no somos buenos —
      estamos mal calibrados hacia abajo.</p>

    <h3>Por qué mostramos un umbral y no una cuota</h3>
    <p>Trabajamos con una cuota de referencia de <b>DraftKings</b>, que ni siquiera opera
      en Argentina. Mostrarte "@2.20" sería una trampa: vas a tu casa, encontrás 2.05, y
      no sabés si sigue conviniendo. Por eso te damos el umbral: <b>si te pagan más que
      eso, conviene</b>. Funciona en cualquier casa.</p>
    <p>Y el umbral no es la cuota justa pelada. A la justa exacta la ventaja es
      <b>cero</b> — estaríamos recomendando una apuesta neutra como si fuera buena.
      Le sumamos ${(MIN_EV*100).toFixed(0)}% de margen, que también cubre el error de
      nuestra propia estimación, que no es chico.</p>

    <h3>Por qué a veces no recomendamos nada</h3>
    <p>Porque no siempre hay algo que recomendar. Las apuestas más seguras casi nunca
      tienen valor: el margen de la casa —<span class="dato">7,7% medido</span>— se come
      la ventaja justo en las cuotas bajas. Preferimos quedarnos callados antes que
      inventar una jugada para llenar la pantalla.</p>

    <h3>Por qué solo marcamos valor en partidos analizados</h3>
    <p>Porque nuestra regla es que <b>nada contradiga nuestra propia lectura</b> del
      partido. Si esa lectura la produjera el mismo modelo que después dice dónde hay
      valor, sería el modelo dándose la razón a sí mismo. La lectura tiene que venir de
      donde el modelo no llega: bajas, contexto, a quién le sirve el empate.</p>
    <p>En concreto: el análisis escrito a mano declara <b>hacia dónde inclina</b> el
      partido — local, empate o visitante. Esa dirección es la que filtra las opciones, y
      la ventaja contra el mercado se mide sobre ella, no sobre la preferencia del modelo.
      Podés verla en la pestaña Análisis de cada partido. <b>Un análisis que no declara
      dirección no habilita ninguna marca</b>, por bien escrito que esté: no hay contra qué
      alinear.</p>

    <h3>Valor falso</h3>
    <p>Si un mercado parece dar mucha más ventaja que el resto, lo más probable no es que
      hayas encontrado oro: es que <b>nuestra estimación está mal</b> en ese partido.
      Por eso la marca dorada tiene techo — arriba de
      <span class="dato">${(VALOR_MAX*100).toFixed(0)} puntos</span> de diferencia contra
      la línea limpia dejamos de mostrarla.</p>

    <h3>Cómo nos medimos</h3>
    <p>Contra la cuota de cierre real, que es el mejor predictor público que existe.
      Walk-forward sobre <b>6.270 partidos</b> de Liga Profesional desde 2012 — el
      modelo nunca ve el resultado que está por predecir.</p>
    <p class="dato">tasa base &nbsp;&nbsp;&nbsp;&nbsp;0,652<br>nosotros &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;0,642<br>cuota de cierre &nbsp;0,626</p>
    <p>La vara es la tasa base — cuánto gana el local en la historia, no "un tercio
      para cada uno" — porque contra esa vara falsa cualquier modelo que solo aprenda
      la localía ya parece listo. Contra la vara honesta, capturamos el <b>39%</b> de
      lo que sabe el mercado. Le seguimos perdiendo al cierre. Es la verdad y no la
      escondemos.</p>
    <p>Y el número que más importa, que esto todavía no contesta: si da plata.
      Apostando con nuestra propia regla (EV ≥ 4%, cuota ≤ 4.5) contra el cierre real,
      el resultado es <b>−3,27% de ROI, con un margen de ±6,19</b> — el rango incluye
      el cero. No está demostrado que tengamos ventaja real sobre el precio. Tampoco
      que no la tengamos: hace falta más muestra. Hasta que eso se sepa, esto es una
      lectura con números atrás, no una promesa de ganar.</p>
    <p>Estos números se vuelven a medir con <span class="dato">medir_historico.py</span>
      y se actualizan acá cuando cambian. Si algún día ves un número viejo en esta
      pantalla, es que dejamos de medir — y eso sería peor que perder contra el cierre.</p>

    <h3>Lo que esto no es</h3>
    <p>No es consejo financiero, no es una fuente de ingresos y no hay una jugada segura.
      Es una lectura con números atrás. La decisión, y la plata, son tuyas.</p>

    <div class="aire24"></div>
  </div>`;
  return h;
}

function esqueleto(){
  const fila = `<div class="skel"><div class="b corta"></div><div class="b t"></div>
    <div class="row"><div></div><div></div><div></div></div></div>`;
  return `<header class="masthead portada">${marcaV("s")}
      <div class="nombre"><b>VALOR</b></div>
      <div class="bajada">Buscando la fecha</div></header>
    <div class="aire18"></div>${fila.repeat(3)}`;
}

function render(){
  const app = document.getElementById("app");
  if(CARGANDO){ app.innerHTML = esqueleto(); return; }
  if(BOOT_ERROR){
    app.innerHTML = `<header class="masthead"><div class="wordmark">VALOR</div></header>
      <div class="aviso"><b>No pudimos cargar los datos</b>${esc_(BOOT_ERROR)}</div>`;
    return;
  }
  /* Qué pantalla se está mirando. Cambiar de pantalla arranca arriba;
     abrir un acordeón, elegir una métrica o cambiar un filtro NO — eso
     es la misma pantalla actualizándose, y mandar el scroll al tope en
     cada toque hace que desplegar algo que está abajo lo saque de la
     vista justo cuando lo abriste. */
  const pantalla = [VISTA, MATCH_ID, CAPA, EXPL].join("/");
  const mismaPantalla = pantalla === PANTALLA;
  const scrollAntes = window.scrollY;
  PANTALLA = pantalla;
  PANTALLA_NUEVA = !mismaPantalla;

  app.innerHTML = VISTA==="partido" ? viewPartido()
    : VISTA==="registro" ? viewRegistro()
    : VISTA==="metodo" ? viewMetodo()
    : viewFecha();

  document.querySelectorAll(".nav button").forEach(b=>{
    const activo = b.dataset.nav===VISTA || (VISTA==="partido" && b.dataset.nav==="fecha");
    b.classList.toggle("on", activo);
  });
  /* `instant` a propósito: una vuelta al tope animada mientras el
     contenido ya cambió se ve como un salto doble. */
  if(mismaPantalla){
    /* El documento pudo crecer o encogerse al abrir o cerrar un bloque.
       Se vuelve al mismo punto, y si la página se hizo más corta que
       ese punto, al máximo que ahora existe. */
    const tope = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    window.scrollTo({top: Math.min(scrollAntes, tope), behavior: "instant"});
  } else {
    window.scrollTo({top: 0, behavior: "instant"});
  }
  /* Y si hay un ancla, manda el ancla: la fila que se tocó tiene que
     quedar a la vista, no en el punto donde estaba el scroll. */
  if(ANCLA && mismaPantalla){
    const el = document.querySelector(ANCLA);
    if(el){
      const y = el.getBoundingClientRect().top + window.scrollY - 12;
      window.scrollTo({top: Math.max(0, y), behavior: "instant"});
    }
  }
  ANCLA = null;

  /* El carrusel se centra solo: tocar "sábado" en el borde derecho no
     debería dejarlo pegado al borde, tiene que traerlo al medio como
     hace cualquier selector de fecha con encastre. */
  const diaOn = document.querySelector(".day.on");
  if(diaOn) diaOn.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"});

  /* Lo mismo con las pestañas del partido: son siete y no entran. La
     activa se trae a la vista (si no, tocar Herramientas dejaba el
     subrayado fuera de pantalla) y el degradado del borde derecho se
     apaga cuando ya no hay nada más a la derecha. */
  /* Vale igual para la fila de metricas de Plantel, que se corta en
     "FALT..." por el mismo motivo. `.on` cubre la pestana activa y la
     metrica elegida: las dos usan esa clase. */
  document.querySelectorAll(".mets, .ordmet").forEach(tira => {
    const on = tira.querySelector(".on");
    if(on){
      const meta = on.offsetLeft - (tira.clientWidth - on.offsetWidth) / 2;
      tira.scrollLeft = Math.max(0, meta);
    }
    const fin = ()=> tira.classList.toggle("corte",
      tira.scrollWidth - tira.clientWidth - tira.scrollLeft > 8);
    fin();
    tira.addEventListener("scroll", fin, {passive:true});
  });
}

/* Entrar a un partido, por toque o por hash. Vive en una función sola
   porque los dos caminos tienen que dejar el mismo estado: entrando por
   el link de la portada la capa arrancaba en Veredicto y entrando por
   la URL los acordeones de Referencia quedaban todos cerrados. */
function entrarAPartido(id){
  MATCH_ID = id; CAPA = "veredicto"; EXPANDIDAS.clear();
  /* Referencia arranca con Posiciones e Historial desplegados y
     Planteles cerrado: es lo que se consulta y lo que no. */
  /* Y Datos · Equipos con una métrica desplegada: una pantalla de diez
     acordeones cerrados se ve vacía y obliga a un toque antes de ver un
     solo número. Se abre la primera de SEÑAL ALTA y no la primera de la
     lista: las de señal baja se dibujan atenuadas —es lo que dice la
     medición— y abrir de entrada la más apagada de todas es empezar por
     el número del que menos hay que fiarse. */
  const conSenal = COMPARA.find(x=> senalDe(x.k).clase === "alta") || COMPARA[0];
  ABIERTOS = new Set(["ref:pos", "ref:hist", "met:" + conSenal.k]);
}

function ir(v, extra){
  VISTA = v;
  /* Un partido nuevo entra siempre por Veredicto, con los acordeones
     cerrados: la capa 01 es la que contesta la pregunta con la que uno
     abre un partido, y heredar los desplegables del partido anterior
     haría que dos partidos se vieran distinto sin motivo. */
  if(v==="partido") entrarAPartido(extra);
  location.hash = v==="partido" ? "#p/"+extra : "#"+v;
  render();
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-nav],[data-dia],[data-partido],[data-capa],[data-expl],[data-mk],[data-met],[data-loc],[data-jugmet],[data-jugeq],[data-ref],[data-reftabla],[data-expandir],[data-abrir],[data-liga],[data-pleq],[data-plmet],[data-volver],[data-filtro],[data-estado],[data-banca],[data-resetbanca],[data-anotar],[data-corregir],[data-auto]");
  if(!t) return;
  const d = t.dataset;

  if(d.nav){ ir(d.nav); }
  else if(d.dia){ DIA = d.dia; render(); }
  else if(d.partido){ ir("partido", d.partido); }
  /* ── las tres capas ─────────────────────────────────────────────
     Un toggle y nada más: los acordeones cerrados no montan su cuerpo,
     así que abrir y cerrar es agregar o sacar del Set y volver a
     dibujar. Varios abiertos a la vez está permitido — el gap de 1px
     mantiene la lista leyéndose como una sola pieza. */
  else if(d.capa){ CAPA = d.capa; render(); }
  else if(d.expl){ EXPL = d.expl; render(); }
  else if(d.mk){ alternar("mk:" + d.mk); }
  else if(d.met){ alternar("met:" + d.met); }
  else if(d.ref){ alternar("ref:" + d.ref); }
  else if(d.abrir){ alternar(d.abrir); }
  else if(d.loc){ LOCALIA = d.loc; render(); }
  else if(d.jugmet){ JUG_ORDEN = d.jugmet; render(); }
  else if(d.jugeq){ JUG_EQ = d.jugeq; render(); }
  else if(d.reftabla){ REF_TABLA = d.reftabla; render(); }
  else if(d.expandir){
    if(EXPANDIDAS.has(d.expandir)) EXPANDIDAS.delete(d.expandir); else EXPANDIDAS.add(d.expandir);
    render();
  }
  /* La portada: abrir una liga cierra las demás y suelta el talón. Un
     día con seis competiciones abiertas es una lista de 40 renglones,
     que es justo lo que la portada nueva viene a evitar. */
  else if(d.liga){
    LIGA_ABIERTA = LIGA_ABIERTA === d.liga ? null : d.liga;
    ANCLA = `[data-liga="${CSS.escape(d.liga)}"]`;
    render();
  }
  else if(d.pleq){ PL_EQ = d.pleq; render(); }
  else if(d.plmet){ PL_MET = d.plmet; render(); }
  else if(d.volver){ ir("fecha"); }
  else if(d.filtro){ FILTRO = d.filtro; render(); }
  else if(d.estado){
    /* Marcar a mano desautoriza el cruce para siempre en esa carga.
       Es a propósito: el cruce por nombre de rival es frágil, y si el
       usuario lo corrige es porque sabe algo que la app no sabe. */
    const [i, est] = d.estado.split("|");
    Object.assign(LOG[+i], {estado:est, manual:true});
    CORRIGIENDO = null;
    guardar("log", LOG); render();
  }
  else if(d.corregir){ CORRIGIENDO = d.corregir; render(); }
  else if(d.auto){
    LOG[+d.auto].manual = false;
    CORRIGIENDO = null;
    guardar("log", LOG); render();
  }
  else if(d.banca){
    const v = parseFloat((document.getElementById("banca-in").value||"").replace(/[^\d]/g,""));
    if(v>0){ BANCA = v; guardar("banca", BANCA); render(); }
  }
  else if(d.resetbanca){ BANCA = null; guardar("banca", null); render(); }
  else if(d.anotar){ anotar(d.anotar); }
});

document.addEventListener("change", e=>{
  const inp = e.target.closest("[data-cuota]");
  if(!inp) return;
  /* Se redondea a dos decimales: ninguna casa paga 2.591907, y guardar
     esa precisión hace que el input muestre un número imposible.
     El evento es `change`, no `input`, así que dispara al salir del
     campo — escribir "1.30" no muere en el primer "1". */
  const n = parseFloat((inp.value||"").replace(",","."));
  const v = isFinite(n) ? Math.round(n*100)/100 : NaN;
  if(v>1) CUOTAS[inp.dataset.cuota] = v; else delete CUOTAS[inp.dataset.cuota];
  guardar("cuotas", CUOTAS);
  render();
});

/* Abrir y cerrar un acordeón. Con prefijo por familia ("met:corners")
   para que dos bloques distintos no compartan clave sin querer. */
function alternar(clave){
  if(ABIERTOS.has(clave)) ABIERTOS.delete(clave); else ABIERTOS.add(clave);
  render();
}

function anotar(key){
  const [mid, oid] = [key.slice(0, key.indexOf("__")), key.slice(key.indexOf("__")+2)];
  const m = MATCHES.find(x=>x.id===mid); if(!m) return;
  const lec = lectura(m);
  const op = mercados(lec.M, m).find(x=>x.id===oid); if(!op) return;
  const c = CUOTAS[key]>1 ? CUOTAS[key] : cuotaReal(m, op);
  if(!(c>1)) return;
  if(LOG.some(x=>x.key===key)) return;

  const kf = (m.conf>=72)?0.25:(m.conf>=60)?0.125:(m.conf>=50)?0.0625:0.005;
  const stake = Math.min(Math.round(BANCA*kelly(op.p,c)*kf), BANCA*0.04);
  /* home y away van aparte del texto "X vs Y": son las claves con las
     que después se cruza el resultado contra los historiales, y un
     nombre de equipo puede tener " vs " adentro el día que ESPN
     cambie algo. `p`, `ev` y `cuota` quedan congelados: son el precio
     y la creencia de este momento, y recalcularlos con datos nuevos
     borraría la evidencia de si acertamos. */
  LOG.push({key, partido:`${m.home} vs ${m.away}`, home:m.home, away:m.away,
            mercado:op.label, comp:m.comp,
            cuota:c, p:op.p, ev:ev(op.p,c), stake, estado:"pendiente", manual:false,
            fecha:m.date, matchId:mid});
  guardar("log", LOG);
  ir("registro");
}

function desdeHash(){
  const h = location.hash.slice(1);
  if(h.startsWith("p/")){ VISTA="partido"; entrarAPartido(h.slice(2)); }
  else if(["registro","metodo","fecha"].includes(h)) VISTA=h;
  else VISTA="fecha";
}
window.addEventListener("hashchange", ()=>{ desdeHash(); render(); });

/* ══════════════════════════════════════════════════════════════════
   ARRANQUE
   ══════════════════════════════════════════════════════════════════ */
async function traer(url, def){
  try{
    const r = await fetch(url+"?t="+Date.now());
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  }catch(e){ return def; }
}

(async function init(){
  render();                       // esqueleto mientras baja el JSON
  const p = await traer("data/partidos.json", null);
  CARGANDO = false;
  if(!p){ BOOT_ERROR = "No respondió data/partidos.json. Si estás abriendo el archivo directo desde el disco, hace falta un servidor local."; render(); return; }
  MATCHES = (p.partidos||p||[]).filter(m=> m.lh!=null && m.la!=null);
  ACTUALIZADO = p.actualizado || "";
  if(!MATCHES.length){ BOOT_ERROR = "El archivo de partidos vino vacío."; render(); return; }

  const [an, rs, pl, es, cal, calj, anEst] = await Promise.all([
    traer("data/analisis.json", {}),
    traer("data/resultados.json", {}), traer("data/planteles.json", {}),
    traer("data/estadisticas.json", {}),
    traer("data/calibracion_lineas.json", {}),
    traer("data/calibracion_jugadores.json", {}),
    traer("data/analisis_estadisticas.json", {}),
  ]);
  RESULTADOS = rs || {};
  /* la clave _schema es documentación del formato, no un partido */
  ANALISIS = an || {}; delete ANALISIS._schema;
  PLANTELES = (pl && pl.equipos) || {};
  /* El once del ultimo partido, si el cron lo trajo. Si no esta, la
     cancha se comporta exactamente como antes: dibuja el inferido. */
  ONCES = (pl && pl.once) || {};
  ESTADISTICAS = (es && es.equipos) || {};
  PARAMETROS = (es && es.parametros) || {};
  PARAM_LIGA = (es && es.parametros_liga) || {};
  PARAM_JUG = (es && es.jugadores) || {};
  PARAMJUG_LIGA = (es && es.jugadores_liga) || {};
  CALIBRACION = (cal && cal.metricas) || {};
  CALIBRADO = (cal && cal.actualizado) || "";
  CAL_JUG = (calj && calj.metricas) || {};
  CALJUG_FECHA = (calj && calj.actualizado) || "";
  /* La segunda skill del partido: escribe la lectura de los ejes
     Dominio y Jugadores. Si el archivo no está, los ejes salen sin
     texto y todo lo demás anda igual — es carga manual. */
  ANALISIS_EST = anEst || {};
  /* El veredicto se memoiza por partido, y acá recién termina de entrar
     el dato del que sale. Sin este clear, cualquier cosa que lo pida
     antes —una pantalla dibujada a mitad de la carga, una prueba desde
     la consola— deja cacheado un veredicto calculado sin estadísticas y
     la app lo repite todo el día. */
  _veredictos.clear();

  desdeHash();
  render();
})();
</script>
