<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080C14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VALOR · Asesor Inteligente de Apuestas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────
   VALOR — Sistema de Diseño: Asesor Inteligente de Apuestas
   Alineado con frontend-design, emil-design-eng y copywriting
   ───────────────────────────────────────────────────────── */
:root {
  --bg-dark: #080C14;
  --bg-card: #121927;
  --bg-card-hover: #172133;
  --bg-card-pressed: #1B263B;
  --bg-input: #0B101A;
  
  --border: rgba(255, 255, 255, 0.08);
  --border-soft: rgba(255, 255, 255, 0.04);
  --border-focus: #00E599;
  
  --text-main: #F8FAFC;
  --text-muted: #94A3B8;
  --text-subtle: #64748B;
  
  --mint: #00E599;
  --mint-dark: #00B87A;
  --mint-wash: rgba(0, 229, 153, 0.12);
  --mint-glow: rgba(0, 229, 153, 0.25);
  
  --gold: #F59E0B;
  --gold-dark: #D97706;
  --gold-wash: rgba(245, 158, 11, 0.14);
  --gold-border: rgba(245, 158, 11, 0.4);
  
  --coral: #EF4444;
  --coral-wash: rgba(239, 68, 68, 0.12);
  
  --petrol: #38BDF8;
  --petrol-wash: rgba(56, 189, 248, 0.12);
  
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-pill: 100px;
  --pad: 16px;
  
  --font-sans: "Archivo", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
  
  --shadow-card: 0 4px 20px -4px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  --shadow-float: 0 12px 32px -8px rgba(0, 0, 0, 0.7);
  --ring: 0 0 0 3px rgba(0, 229, 153, 0.35);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg-dark);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-variation-settings: "wdth" 100, "wght" 450;
  font-size: 15px;
  line-height: 1.5;
  padding-bottom: 88px;
  overscroll-behavior-y: contain;
  -webkit-font-smoothing: antialiased;
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { background: none; border: none; padding: 0; cursor: pointer; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.eyebrow {
  font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  font-variation-settings: "wdth" 115, "wght" 700; color: var(--text-subtle);
}
.hide { display: none !important; }

/* ── Encabezado Principal ── */
header.top {
  position: sticky; top: 0; z-index: 40;
  background: rgba(8, 12, 20, 0.92);
  backdrop-filter: blur(16px);
  padding: calc(env(safe-area-inset-top) + 12px) var(--pad) 12px;
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; justify-content: space-between; }
.brand-title { display: flex; align-items: center; gap: 9px; }
.brand-logo-icon {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--mint), var(--mint-dark));
  display: flex; align-items: center; justify-content: center;
  color: #04140D; font-weight: 800; font-size: 16px;
  box-shadow: 0 2px 10px rgba(0, 229, 153, 0.35);
}
.brand h1 { margin: 0; font-size: 20px; letter-spacing: .14em; font-variation-settings: "wdth" 120, "wght" 800; }
.brand h1 span { color: var(--mint); }
.brand-badge {
  font-size: 11px; padding: 4px 10px; border-radius: var(--r-pill);
  background: var(--mint-wash); color: var(--mint); font-weight: 700;
  border: 1px solid rgba(0, 229, 153, 0.25);
}

/* ── Tira de Días ── */
.days { display: flex; gap: 8px; overflow-x: auto; padding: 14px var(--pad) 6px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day {
  flex: 0 0 auto; min-width: 54px; padding: 8px 10px; border-radius: var(--r-md);
  background: var(--bg-card); border: 1px solid var(--border); text-align: center;
  transition: transform 120ms ease, background-color 150ms ease, border-color 150ms ease;
}
.day:active { transform: scale(0.96); }
.day b { display: block; font-family: var(--font-mono); font-size: 15px; font-weight: 600; color: var(--text-main); }
.day i { display: block; font-style: normal; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-top: 2px; }
.day.on {
  background: var(--mint); border-color: var(--mint); color: #04140D;
  box-shadow: 0 4px 14px rgba(0, 229, 153, 0.3);
}
.day.on b, .day.on i { color: #04140D; }
.day.has::after { content: ""; display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--mint); margin: 4px auto 0; }
.day.on.has::after { background: #04140D; }

/* ── Tarjeta Protagonista: "La Jugada Destacada del Día" ── */
.hero-pick {
  margin: 12px var(--pad) 0; padding: 18px 16px; border-radius: var(--r-lg);
  background: linear-gradient(180deg, rgba(245, 158, 11, 0.12) 0%, rgba(18, 25, 39, 0.96) 65%);
  border: 1px solid var(--gold-border);
  box-shadow: var(--shadow-card);
  position: relative; overflow: hidden; cursor: pointer;
  transition: transform 120ms ease;
}
.hero-pick:active { transform: scale(0.985); }
.hero-pick::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.hero-tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: var(--r-pill);
  background: var(--gold-wash); border: 1px solid var(--gold-border);
  color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase;
}
.hero-matchup {
  display: flex; align-items: center; gap: 8px; margin: 12px 0 6px;
  font-size: 15px; font-variation-settings: "wght" 700; color: var(--text-main);
}
.hero-matchup em { font-style: normal; color: var(--text-subtle); font-size: 12px; font-weight: 400; }
.hero-bet-title {
  font-size: 20px; font-variation-settings: "wght" 800; color: var(--text-main);
  line-height: 1.25; margin-bottom: 12px;
}
.hero-stats-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  background: rgba(11, 16, 26, 0.6); padding: 10px; border-radius: var(--r-md);
  border: 1px solid var(--border); margin-bottom: 12px;
}
.hero-stat { text-align: center; }
.hero-stat small { display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); }
.hero-stat b { display: block; font-family: var(--font-mono); font-size: 15px; font-weight: 600; margin-top: 2px; }
.hero-stat b.green { color: var(--mint); }
.hero-stat b.gold { color: var(--gold); }
.hero-desc {
  font-size: 12.5px; line-height: 1.55; color: var(--text-muted);
  border-top: 1px solid var(--border-soft); padding-top: 10px; margin: 0;
}

/* ── Barra Resumen / Métricas Rápidas ── */
.ledger-grid {
  margin: 12px var(--pad) 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
}
.ledger-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 12px 10px; text-align: center; box-shadow: var(--shadow-card);
}
.ledger-card small { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-subtle); display: block; }
.ledger-card b { display: block; font-family: var(--font-mono); font-size: 17px; font-weight: 600; margin-top: 3px; color: var(--text-main); }
.ledger-card b.mint { color: var(--mint); }

/* ── Filtros y Chips ── */
.filters { display: flex; gap: 8px; padding: 14px var(--pad) 4px; flex-wrap: wrap; }
.chip {
  padding: 8px 14px; border-radius: var(--r-pill); border: 1px solid var(--border);
  background: var(--bg-card); font-size: 12.5px; color: var(--text-muted); font-weight: 600;
  min-height: 40px; display: inline-flex; align-items: center; gap: 6px;
  transition: transform 120ms ease, background-color 150ms ease, color 150ms ease;
}
.chip.on {
  background: var(--mint-wash); border-color: rgba(0, 229, 153, 0.4);
  color: var(--mint);
}
.chip:active { transform: scale(0.97); }

/* ── Lista de Partidos ── */
.wrap { padding: 12px var(--pad) 0; }
.comp-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 4px 8px; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-muted); font-variation-settings: "wght" 700; width: 100%; text-align: left;
}
.match-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow-card);
  transition: transform 120ms cubic-bezier(0.16, 1, 0.3, 1), border-color 150ms ease;
  position: relative; cursor: pointer;
}
.match-card:active { transform: scale(0.985); background: var(--bg-card-pressed); }
.match-card.has-val { border-color: rgba(245, 158, 11, 0.4); }

.match-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.match-time { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); font-weight: 500; }
.val-badge {
  font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: var(--r-pill);
  background: var(--gold-wash); color: var(--gold); border: 1px solid var(--gold-border);
  text-transform: uppercase; letter-spacing: .06em;
}
.badge-rec {
  font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: var(--r-pill);
  background: var(--mint-wash); color: var(--mint); border: 1px solid rgba(0, 229, 153, 0.3);
  text-transform: uppercase; letter-spacing: .06em;
}

.match-teams { display: flex; flex-direction: column; gap: 8px; }
.team-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.team-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
.team-name { font-size: 15px; font-variation-settings: "wght" 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team-xg { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-muted); }

.match-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border-soft);
  font-size: 12px;
}
.match-pick-label { font-variation-settings: "wght" 600; color: var(--text-main); }
.match-pick-odds { font-family: var(--font-mono); font-size: 14px; font-weight: 600; color: var(--mint); }

.crest { width: 26px; height: 26px; object-fit: contain; flex: 0 0 auto; }
.crest.lg { width: 48px; height: 48px; }
.crest.sm { width: 18px; height: 18px; }

/* ── Vista Detalle de Partido ── */
.detail-header {
  padding: 10px var(--pad) 14px;
  background: linear-gradient(180deg, rgba(0, 229, 153, 0.06) 0%, transparent 100%);
}
.btn-back {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; color: var(--text-muted); padding: 6px 0;
  margin-bottom: 8px; min-height: 40px;
}
.matchup-hero {
  display: flex; align-items: center; justify-content: space-around;
  padding: 14px 0 6px; text-align: center;
}
.matchup-team { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; }
.matchup-team span { font-size: 15px; font-variation-settings: "wght" 700; line-height: 1.2; }
.matchup-vs {
  font-size: 13px; font-weight: 700; color: var(--text-subtle);
  background: var(--bg-card); width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; border: 1px solid var(--border);
}

/* ── Tarjeta de Diagnóstico / Veredicto ── */
.verdict-card {
  margin: 14px var(--pad) 0; padding: 18px 16px; border-radius: var(--r-lg);
  background: var(--bg-card); border: 1px solid var(--border); box-shadow: var(--shadow-card);
}
.verdict-card.val {
  background: linear-gradient(180deg, rgba(245, 158, 11, 0.12), var(--bg-card) 60%);
  border-color: var(--gold-border);
}
.verdict-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: var(--r-pill);
  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  margin-bottom: 8px;
}
.verdict-pill.gold { background: var(--gold-wash); color: var(--gold); border: 1px solid var(--gold-border); }
.verdict-pill.mint { background: var(--mint-wash); color: var(--mint); border: 1px solid rgba(0, 229, 153, 0.3); }
.verdict-pill.coral { background: var(--coral-wash); color: var(--coral); border: 1px solid rgba(239, 68, 68, 0.3); }
.verdict-pill.neutral { background: rgba(255, 255, 255, 0.08); color: var(--text-muted); }

.verdict-title { font-size: 22px; font-variation-settings: "wght" 800; line-height: 1.2; margin: 4px 0 12px; }
.verdict-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  background: var(--bg-input); padding: 10px 8px; border-radius: var(--r-md);
  border: 1px solid var(--border-soft); margin-bottom: 12px;
}
.verdict-cell { text-align: center; }
.verdict-cell small { font-size: 9.5px; text-transform: uppercase; color: var(--text-subtle); display: block; }
.verdict-cell b { font-family: var(--font-mono); font-size: 14px; font-weight: 600; display: block; margin-top: 2px; }
.verdict-cell b.mint { color: var(--mint); }
.verdict-cell b.gold { color: var(--gold); }
.verdict-cell b.coral { color: var(--coral); }

.argument-box {
  background: rgba(255, 255, 255, 0.03); border-radius: var(--r-md);
  padding: 12px 14px; border-left: 3px solid var(--mint);
  margin-top: 12px;
}
.argument-box.gold { border-left-color: var(--gold); }
.argument-box h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); }
.argument-box p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--text-main); }

/* ── Carga Rápida de Cuotas (1X2 + Principales) ── */
.quick-odds-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin: 12px 0 16px;
}
.quick-odd-box {
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 10px 8px; text-align: center;
}
.quick-odd-box small { font-size: 11px; color: var(--text-muted); display: block; font-weight: 600; margin-bottom: 4px; }
.quick-odd-in {
  width: 100%; background: transparent; border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 8px 4px; font-family: var(--font-mono);
  font-size: 16px; font-weight: 700; text-align: center; color: var(--text-main);
}
.quick-odd-in:focus { outline: none; border-color: var(--mint); box-shadow: var(--ring); }

/* ── Pestañas Segmentadas en Detalle (Pill Style) ── */
.subtabs-pill-wrap { padding: 14px var(--pad) 0; }
.subtabs-pill {
  display: flex; gap: 4px; background: var(--bg-input); padding: 4px;
  border-radius: var(--r-pill); border: 1px solid var(--border);
}
.subtab-pill {
  flex: 1; padding: 8px 12px; font-size: 12.5px; font-weight: 700; color: var(--text-muted);
  border-radius: var(--r-pill); text-align: center; transition: all 150ms ease;
  min-height: 38px; display: flex; align-items: center; justify-content: center;
}
.subtab-pill.on { background: var(--bg-card); color: var(--mint); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

/* ── Mercados por Categorías ── */
.mkt-cat-chips { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0; scrollbar-width: none; }
.mkt-cat-chips::-webkit-scrollbar { display: none; }
.mkt-cat-chip {
  padding: 6px 12px; border-radius: var(--r-pill); border: 1px solid var(--border);
  background: var(--bg-card); font-size: 11.5px; font-weight: 600; color: var(--text-muted);
  white-space: nowrap; transition: all 120ms ease;
}
.mkt-cat-chip.on { background: var(--mint-wash); color: var(--mint); border-color: rgba(0, 229, 153, 0.4); }

.market-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 14px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--r-md); margin-bottom: 8px;
}
.odds-input {
  width: 86px; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 8px 10px; font-family: var(--font-mono);
  font-size: 15px; font-weight: 700; text-align: center; color: var(--text-main);
}
.odds-input:focus { outline: none; border-color: var(--mint); box-shadow: var(--ring); }

/* ── Círculos de Forma Reciente ── */
.form-badge {
  width: 22px; height: 22px; border-radius: 50%; display: inline-flex;
  align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700;
  color: #fff; margin-right: 4px;
}
.form-badge.W { background: #10B981; }
.form-badge.D { background: #F59E0B; }
.form-badge.L { background: #EF4444; }

/* ── Pestaña de Método (Guía Interactiva) ── */
.method-container { padding: 18px var(--pad) 0; }
.method-progress { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.method-dots { display: flex; gap: 6px; }
.method-dot { width: 24px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.15); transition: all .2s; }
.method-dot.active { background: var(--mint); width: 36px; }
.method-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 24px 20px; box-shadow: var(--shadow-card);
}
.method-icon-circle {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--mint-wash); border: 1px solid rgba(0, 229, 153, 0.3);
  display: flex; align-items: center; justify-content: center;
  color: var(--mint); font-size: 24px; margin-bottom: 16px;
}
.method-category { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mint); font-weight: 700; }
.method-h2 { font-size: 24px; font-variation-settings: "wght" 800; line-height: 1.2; margin: 6px 0 14px; }
.method-p { font-size: 14px; line-height: 1.6; color: var(--text-muted); margin: 0 0 18px; }
.method-checklist { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
.method-item {
  display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: var(--text-main);
  background: rgba(255, 255, 255, 0.03); padding: 12px 14px; border-radius: var(--r-md);
  border: 1px solid var(--border-soft);
}
.method-check {
  width: 18px; height: 18px; border-radius: 50%; background: var(--mint-wash);
  color: var(--mint); display: grid; place-items: center; font-size: 11px; font-weight: 800;
  flex: 0 0 auto; margin-top: 2px;
}

/* ── Pestaña de Rendimiento Completa (Con Sparkline + CLV) ── */
.tracker-container { padding: 14px var(--pad) 0; }
.perf-header { margin-bottom: 14px; }
.perf-header h2 { margin: 0; font-size: 22px; font-variation-settings: "wght" 800; }
.perf-header p { margin: 4px 0 0; font-size: 12.5px; color: var(--text-muted); }

.perf-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 18px 16px; box-shadow: var(--shadow-card); margin-bottom: 16px;
}
.perf-stat-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.perf-big-pct { font-family: var(--font-mono); font-size: 32px; font-weight: 700; color: var(--mint); }
.perf-boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.perf-box {
  background: var(--bg-input); border: 1px solid var(--border-soft);
  border-radius: var(--r-md); padding: 10px 8px; text-align: center;
}
.perf-box small { font-size: 9.5px; text-transform: uppercase; color: var(--text-subtle); display: block; }

<body>

    <span>Ajustes</span>

<script>
/* ═══════════════════════════════════════════════════════════
   VALOR — Motor Cuantitativo (Dixon-Coles + EV + Kelly)
   ═══════════════════════════════════════════════════════════ */

const _mem = {};
const store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k); if(r) return JSON.parse(r.value); } }catch(e){}
    try{ const v = localStorage.getItem("valor:"+k); if(v!=null) return JSON.parse(v); }catch(e){}
    return _mem[k] ?? null;
  },
  async set(k,v){
    _mem[k]=v;
    try{ if(window.storage){ await window.storage.set(k, JSON.stringify(v)); return; } }catch(e){}
    try{ localStorage.setItem("valor:"+k, JSON.stringify(v)); }catch(e){}
  }
};

/* ── Matemática Dixon-Coles ── */
const fact = n => { let r=1; for(let i=2;i<=n;i++) r*=i; return r; };
const pois = (k,l) => Math.exp(-l)*Math.pow(l,k)/fact(k);

function tau(i,j,lh,la,rho){
  if(i===0&&j===0) return 1 - lh*la*rho;
  if(i===0&&j===1) return 1 + lh*rho;
  if(i===1&&j===0) return 1 + la*rho;
  if(i===1&&j===1) return 1 - rho;
  return 1;
}

function matrix(lh,la,rho,max=9){
  const m=[]; let tot=0;
  for(let i=0;i<=max;i++){ m[i]=[];
    for(let j=0;j<=max;j++){ const p=pois(i,lh)*pois(j,la)*tau(i,j,lh,la,rho); m[i][j]=p; tot+=p; }
  }
  for(let i=0;i<=max;i++) for(let j=0;j<=max;j++) m[i][j]/=tot;
  return m;
}
const sumIf = (m,f) => { let s=0; for(let i=0;i<m.length;i++) for(let j=0;j<m.length;j++) if(f(i,j)) s+=m[i][j]; return s; };

/* ── Finanzas y Valor Esperado ── */
const ev      = (p,o) => p*o - 1;
const fair    = p => p>0 ? 1/p : Infinity;
const implied = o => o>0 ? 1/o : 0;
const kelly   = (p,o) => { const b=o-1; if(b<=0) return 0; return Math.max(0,(p*b-(1-p))/b); };

function derive(M,cfg){
  const ht = matrix(cfg.lh*0.45, cfg.la*0.45, cfg.rho, 6);
  const out = [];
  const add = (g,label,p,push=0,test=null) => out.push({g,label,p,push,test,odds:null,id:g+"|"+label});

  add("1X2","Gana local",            sumIf(M,(i,j)=>i>j),  0, (i,j)=>i>j);
  add("1X2","Empate",                sumIf(M,(i,j)=>i===j),0, (i,j)=>i===j);
  add("1X2","Gana visitante",        sumIf(M,(i,j)=>i<j),  0, (i,j)=>i<j);
  add("Doble","Doble oportunidad 1X",sumIf(M,(i,j)=>i>=j), 0, (i,j)=>i>=j);
  add("Doble","Doble oportunidad X2",sumIf(M,(i,j)=>i<=j), 0, (i,j)=>i<=j);
  add("Doble","Doble oportunidad 12",sumIf(M,(i,j)=>i!==j),0, (i,j)=>i!==j);
  [0.5,1.5,2.5,3.5].forEach(n=>{
    add("Goles","Más de "+n+" goles",  sumIf(M,(i,j)=>i+j>n), 0, (i,j)=>i+j>n);
    add("Goles","Menos de "+n+" goles",sumIf(M,(i,j)=>i+j<n), 0, (i,j)=>i+j<n);
  });
  add("Ambos","Ambos marcan — sí",sumIf(M,(i,j)=>i>0&&j>0),   0, (i,j)=>i>0&&j>0);
  add("Ambos","Ambos marcan — no",sumIf(M,(i,j)=>i===0||j===0),0, (i,j)=>i===0||j===0);
  [0.5,1.5,2.5].forEach(n=>{
    add("Equipo","Local más de "+n,    sumIf(M,(i)=>i>n),   0, (i,j)=>i>n);
    add("Equipo","Visitante más de "+n,sumIf(M,(i,j)=>j>n), 0, (i,j)=>j>n);
  });
  add("1T","1T más de 0.5 goles", sumIf(ht,(i,j)=>i+j>0.5));
  add("1T","1T menos de 0.5 goles",sumIf(ht,(i,j)=>i+j<0.5));
  add("1T","1T más de 1.5 goles", sumIf(ht,(i,j)=>i+j>1.5));
  add("1T","Gana local al descanso",sumIf(ht,(i,j)=>i>j));

  const marcador = (mx,cap,grupo) => {
    for(let i=0;i<=cap;i++) for(let j=0;j<=cap;j++) add(grupo, i+"-"+j, mx[i][j]);
  };
  marcador(M,3,"Marcador");

  const dnbH = sumIf(M,(i,j)=>i>j), dnbA = sumIf(M,(i,j)=>i<j), dnbDraw = sumIf(M,(i,j)=>i===j);
  if(dnbH+dnbA>0){
    add("DNB","DNB local",    dnbH/(dnbH+dnbA), dnbDraw);
    add("DNB","DNB visitante",dnbA/(dnbH+dnbA), dnbDraw);
  }
  return out;
}

/* ── Estado Global ── */
let S = { bank:100000, minEv:0.04, maxOdds:4.5, casa:"Bet365", caps:true };
let MATCHES = [];
let ODDS = {};
let LOG = [];
let COMBO = [];
let NOTAS = {};
let ANALISIS = {};
let EQUIPOS = {};
let METHOD_STEP = 0;

let VIEW = { tab:"fecha", matchId:null, day:null, filter:"todos", subtab:"mercados", mktCategory:"populares", perfFilter:"todos" };
const closedComps = new Set();

function kellyFracFor(c){
  if(c>=72) return {f:0.25, name:"1/4 Kelly"};
  if(c>=60) return {f:0.125, name:"1/8 Kelly"};
  if(c>=50) return {f:0.0625, name:"1/16 Kelly"};
  return {f:0.005, name:"Monto fijo 0.5%"};
}

function evaluate(mkts, S, m){
  const conf = m?.conf ?? 65;
  const kf = kellyFracFor(conf);
  return mkts.map(x=>{
    const o = ODDS[m?.id+"__"+x.id];
    if(!o || o<=1) return {...x, o:null, e:null, stake:0};
    const e = x.push ? (x.p*(o-1) - (1-x.p-x.push)) : ev(x.p, o);
    const k = kelly(x.p, o);
    const stake = e>=S.minEv ? Math.round(S.bank * k * kf.f) : 0;
    return {...x, o, e, stake, k, solid: e>=S.minEv};
  });
}

function model(m){
  const rho = /profesional/i.test(m.comp) ? 0.05 : 0.0;
  const M = matrix(m.lh, m.la, rho);
  const raw = derive(M, {lh:m.lh, la:m.la, rho});
  const mkts = evaluate(raw, S, m);
  return {M, mkts, raw};
}

/* ── Proyecciones Fuertes del Modelo (Siempre disponibles) ── */
function getTopModelProjections(m, mkts){
  const valid = mkts.filter(x=>x.p>=0.35 && !x.id.startsWith("Marcador|"));
  valid.sort((a,b)=>b.p-a.p);
  return valid.slice(0, 3);
}

/* ── Generador Inteligente de Argumentos ── */
function generarArgumento(m, best, topProj){
  const an = ANALISIS[m.id];
  if(an?.veredicto) return an.veredicto;

  if(best && best.e !== null && best.e >= S.minEv) {
    return `El modelo detecta una ventaja del +${Math.round(best.e*100)}% en "${best.label}". La probabilidad estadística calculada es del ${Math.round(best.p*100)}% frente a una cuota justa de @${fair(best.p).toFixed(2)}, superando lo ofrecido por la casa de apuestas.`;
  }
  
  if(topProj && topProj.length) {
    const p1 = topProj[0];
    return `El modelo proyecta a ${m.home} con un xG de ${m.lh.toFixed(1)} y a ${m.away} con ${m.la.toFixed(1)}. La tendencia más sólida según las probabilidades es "${p1.label}" (${Math.round(p1.p*100)}% de probabilidad estimada · cuota justa @${fair(p1.p).toFixed(2)}).`;
  }

  return `Partido por ${m.comp}. El modelo estima un promedio de ${m.lh.toFixed(1)} goles para ${m.home} y ${m.la.toFixed(1)} para ${m.away}. Ingresá las cuotas para evaluar ventaja.`;
}

/* ── VISTAS ── */

/* 1. Vista Partidos */
function viewDay(){
  const days=[]; const base=new Date((MATCHES[0]?.date||VIEW.day)+"T12:00:00");
  for(let i=0;i<7;i++){
    const d=new Date(base); d.setDate(base.getDate()+i);
    const iso=d.toISOString().slice(0,10);
    days.push({iso, n:d.getDate(),
      w:["dom","lun","mar","mié","jue","vie","sáb"][d.getDay()],
      has: MATCHES.some(m=>m.date===iso)});
  }
  const todays = MATCHES.filter(m=>m.date===VIEW.day);
  const rows = todays.map(m=>{
    const {mkts}=model(m);
    const best = mkts.find(x=>x.e!==null && x.e>=S.minEv && x.o<=S.maxOdds) || null;
    const topProj = getTopModelProjections(m, mkts);
    return {m, best, topProj, nVal: mkts.filter(x=>x.solid).length};
  });
  const withVal = rows.filter(r=>r.best);
  const shown = VIEW.filter==="valor" ? withVal : rows;
  const avg = withVal.length ? withVal.reduce((s,r)=>s+r.best.e,0)/withVal.length : 0;
  const tot = withVal.reduce((s,r)=>s+(r.best.stake||0),0);
  
  // Pick del Día
  const topDelDia = withVal.length ? withVal.slice().sort((a,b)=>b.best.e-a.best.e)[0] : (rows[0]||null);

  return `
  <div class="days">${days.map(d=>`
    <button class="day ${d.iso===VIEW.day?"on":""} ${d.has?"has":""}" data-day="${d.iso}">
      <b>${d.n}</b><i>${d.w}</i>
    </button>`).join("")}</div>

  ${topDelDia?`
  <div class="hero-pick" data-match="${topDelDia.m.id}">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="hero-tag">${topDelDia.best?"✨ Oportunidad de Valor":"🎯 Proyección Destacada"}</div>
      <span class="${topDelDia.best?"val-badge":"badge-rec"}">
        ${topDelDia.best?`+${Math.round(topDelDia.best.e*100)}% Valor`:`${Math.round((topDelDia.topProj[0]?.p||0.5)*100)}% Prob`}
      </span>
    </div>
    <div class="hero-matchup">
      ${crest(topDelDia.m.homeLogo,"sm")} <span>${esc(topDelDia.m.home)}</span>
      <em>vs</em>
      <span>${esc(topDelDia.m.away)}</span> ${crest(topDelDia.m.awayLogo,"sm")}
    </div>
    <div class="hero-bet-title">${esc(topDelDia.best?topDelDia.best.label:topDelDia.topProj[0]?.label||"Cargar cuotas")}</div>
    <div class="hero-stats-grid">
      <div class="hero-stat"><small>Tu Cuota</small><b class="green">${topDelDia.best?`@${topDelDia.best.o.toFixed(2)}`:"—"}</b></div>
      <div class="hero-stat"><small>Cuota Justa</small><b>@${fair(topDelDia.best?topDelDia.best.p:(topDelDia.topProj[0]?.p||0.5)).toFixed(2)}</b></div>
      <div class="hero-stat"><small>Probabilidad</small><b class="gold">${Math.round((topDelDia.best?topDelDia.best.p:(topDelDia.topProj[0]?.p||0.5))*100)}%</b></div>
    </div>
    <p class="hero-desc">${esc(generarArgumento(topDelDia.m, topDelDia.best, topDelDia.topProj))}</p>
  </div>`:""}

  <div class="ledger-grid">
    <div class="ledger-card"><small>Con Valor</small><b class="${withVal.length?"mint":""}">${withVal.length}/${rows.length}</b></div>
    <div class="ledger-card"><small>Ventaja Media</small><b class="${avg>0?"mint":""}">${withVal.length?`+${Math.round(avg*100)}%`:"—"}</b></div>
    <div class="ledger-card"><small>Sugerido Total</small><b>${tot?mny(tot):"—"}</b></div>
  </div>

  <div class="filters">
    <button class="chip ${VIEW.filter==="valor"?"on":""}" data-f="valor">🔥 Solo con valor (${withVal.length})</button>
    <button class="chip ${VIEW.filter==="todos"?"on":""}" data-f="todos">Todos los partidos (${rows.length})</button>
  </div>

  <div class="wrap">
  ${shown.length? agruparPorComp(shown).map(g=>{
    const key = VIEW.day+"|"+g.comp, open = !closedComps.has(key);
    return `
    <div style="margin-bottom:8px">
      <button class="comp-header" data-compclose="${key}">
        <span style="display:flex;align-items:center;gap:8px">${crest(g.rows[0].m.compLogo,"sm")}${esc(g.comp)}</span>
        <span class="eyebrow">${g.rows.length} partidos</span>
      </button>
      ${open? g.rows.map(r=>matchCard(r)).join("") : ""}
    </div>`;
  }).join("") : `
    <div class="empty-state">
      <div class="empty-state-icon">🛡️</div>
      <h3>Sin oportunidades de valor cargadas</h3>
      <p>Tocá cualquier partido para ingresar las cuotas de tu casa y ver si hay ventaja real.</p>
    </div>`}
  </div>`;
}

function matchCard({m,best,topProj}){
  const val = best && best.e>=S.minEv;
  const p1 = topProj && topProj[0];
  return `
  <div class="match-card ${val?"has-val":""}" data-match="${m.id}">
    <div class="match-top">
      <span class="match-time">${m.hora} hs · ${esc(m.comp)}</span>
      ${val ? `<span class="val-badge">+${Math.round(best.e*100)}% Valor</span>` : p1 ? `<span class="badge-rec">${Math.round(p1.p*100)}% ${esc(p1.label)}</span>` : `<span style="font-size:11px;color:var(--text-subtle)">Tocar para analizar</span>`}
    </div>
    <div class="match-teams">
      <div class="team-row">
        <div class="team-info">${crest(m.homeLogo)}${esc(m.home)}</div>
        <span class="team-xg">xG ${m.lh.toFixed(1)}</span>
      </div>
      <div class="team-row">
        <div class="team-info">${crest(m.awayLogo)}${esc(m.away)}</div>
        <span class="team-xg">xG ${m.la.toFixed(1)}</span>
      </div>
    </div>
    <div class="match-footer">
      <span class="match-pick-label">${best ? esc(best.label) : p1 ? `Cuota justa: @${fair(p1.p).toFixed(2)}` : "Cargar cuotas"}</span>
      <span class="match-pick-odds">${best ? `@${best.o.toFixed(2)}` : "Analizar →"}</span>
    </div>
  </div>`;
}

/* 2. Vista Detalle de Partido */
function viewMatch(id){
  const m = MATCHES.find(x=>x.id===id); if(!m) return "";
  const {M,mkts} = model(m);
  const best = mkts.find(x=>x.e!==null && x.e>=S.minEv && x.o<=S.maxOdds) || null;
  const topProj = getTopModelProjections(m, mkts);
  const val = best !== null;

  return `
  <div class="detail-header">
    <button class="btn-back" data-back>← Volver a Partidos</button>
    <div class="matchup-hero">
      <div class="matchup-team">${crest(m.homeLogo,"lg")}<span>${esc(m.home)}</span><small class="num" style="color:var(--text-muted)">xG ${m.lh.toFixed(1)}</small></div>
      <div class="matchup-vs">VS</div>
      <div class="matchup-team">${crest(m.awayLogo,"lg")}<span>${esc(m.away)}</span><small class="num" style="color:var(--text-muted)">xG ${m.la.toFixed(1)}</small></div>
    </div>
  </div>

/* 3. Vista de Rendimiento Completa (Con Sparkline + CLV Tracker) */
function viewLog(){
  const done = LOG.filter(b=>b.result==="W"||b.result==="L");
  const staked = done.reduce((s,b)=>s+b.stake,0);
  const ret = done.reduce((s,b)=>s+(b.result==="W"?b.stake*b.odds:0),0);
  const prof = ret-staked;
  const roi = staked ? prof/staked : 0;
  const wins = LOG.filter(b=>b.result==="W").length;
  const losses = LOG.filter(b=>b.result==="L").length;
  const total = wins + losses;
  const winRate = total>0 ? Math.round((wins/total)*100) : 0;
  
  const clvs = LOG.filter(b=>b.closing>1).map(b=>b.odds/b.closing-1);
  const clv = clvs.length ? clvs.reduce((a,b)=>a+b,0)/clvs.length : null;

  // Gráfica Sparkline
  let cum = 0;
  const pts = done.map(b=>{ cum += b.result==="W"? b.stake*(b.odds-1) : -b.stake; return cum; });
  let spark = "";
  if(pts.length>1){
    const mx = Math.max(...pts, 0), mn = Math.min(...pts, 0), rg = (mx-mn) || 1;
    const d = pts.map((p,i)=>`${(i/(pts.length-1)*100).toFixed(1)},${(48-((p-mn)/rg)*44).toFixed(1)}`).join(" ");
    const zero = (48-((0-mn)/rg)*44).toFixed(1);
    spark = `<svg class="spark-svg" viewBox="0 0 100 52" preserveAspectRatio="none">
      <line x1="0" y1="${zero}" x2="100" y2="${zero}" stroke="rgba(255,255,255,0.15)" stroke-width=".6"/>
      <polyline points="${d}" fill="none" stroke="${prof>=0?"#00E599":"#EF4444"}" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
    </svg>`;
  }

  let filteredLog = LOG;
  if(VIEW.perfFilter==="W") filteredLog = LOG.filter(x=>x.result==="W");
  else if(VIEW.perfFilter==="L") filteredLog = LOG.filter(x=>x.result==="L");
  else if(VIEW.perfFilter==="P") filteredLog = LOG.filter(x=>x.result==="P");

  return `
  <div class="tracker-container">
    <div class="perf-header">
      <h2>Pronósticos Guardados</h2>
      <p>Tus picks, tu historial y tu rendimiento medido</p>
    </div>

    <div class="perf-card">
      <div class="perf-stat-row">
        <div>
          <small class="eyebrow">Efectividad</small>
          <div class="perf-big-pct">${winRate}%</div>
        </div>
        <div style="text-align:right">
          <small class="eyebrow">Balance Neto</small>
          <div class="num" style="font-size:22px;font-weight:700;color:${prof>=0?"var(--mint)":"var(--coral)"}">
            ${prof>=0?"+":""}${mny(prof)}
          </div>
        </div>
      </div>

      ${spark}

      <div class="perf-boxes" style="margin-top:10px">
        <div class="perf-box"><small>ROI</small><b class="${roi>=0?"win":"loss"}">${done.length?`${roi>=0?"+":""}${Math.round(roi*100)}%`:"—"}</b></div>
        <div class="perf-box"><small>Aciertos / Fallos</small><b>${wins} / ${losses}</b></div>
        <div class="perf-box"><small>CLV Medio</small><b class="${clv>0?"gold":""}">${clv!==null?`${clv>0?"+":""}${Math.round(clv*100)}%`:"—"}</b></div>
      </div>
    </div>

    <div class="filters" style="padding:0 0 12px">
      <button class="chip ${VIEW.perfFilter==="todos"?"on":""}" data-perff="todos">Todos (${LOG.length})</button>
      <button class="chip ${VIEW.perfFilter==="P"?"on":""}" data-perff="P">Pendientes</button>
      <button class="chip ${VIEW.perfFilter==="W"?"on":""}" data-perff="W">Acertados</button>
      <button class="chip ${VIEW.perfFilter==="L"?"on":""}" data-perff="L">Fallidos</button>
    </div>

    ${filteredLog.length ? filteredLog.slice().reverse().map(b=>`
    <div class="match-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:14.5px;font-weight:700">${esc(b.label)}</span>
        <span class="num" style="font-size:16px;font-weight:700;color:var(--mint)">@${b.odds.toFixed(2)}</span>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">
        ${esc(b.match)} · Stake: <b>${mny(b.stake)}</b> ${b.ev?`· EV inicial: +${Math.round(b.ev*100)}%`:""}
      </div>

      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <input class="odds-input" style="width:100%;text-align:left;font-size:12px;padding:6px 10px"
               type="number" step="0.01" placeholder="Cuota de cierre (para medir CLV)"
               value="${b.closing||""}" data-close="${b.id}">
      </div>

      <div style="display:flex;gap:6px">
        <button class="chip ${b.result==="W"?"on":""}" style="flex:1;justify-content:center" data-res="${b.id}" data-v="W">✓ Ganada</button>

/* 4. Vista de Combinadas (Combo Builder Interactivo) */
function comboCalc(legs){
  if(!legs.length) return {o:0, p:0, e:0, stake:0, avisos:[]};
  const porPartido = {};
  legs.forEach(l=> (porPartido[l.matchId] = porPartido[l.matchId]||[]).push(l));

  let pConjunta = 1, oTotal = 1, avisos = [];
  Object.entries(porPartido).forEach(([mid, ls])=>{
    const m = MATCHES.find(x=>x.id===mid);
    if(!m) return;
    const {M} = model(m);
    if(ls.length===1){
      pConjunta *= ls[0].p; oTotal *= ls[0].o;
    } else {
      const tests = ls.map(l=>l.test).filter(Boolean);
      if(tests.length === ls.length){
        const pExacta = sumIf(M, (i,j)=> tests.every(t=>t(i,j)));
        pConjunta *= pExacta;
      } else {
        pConjunta *= ls.reduce((acc,x)=>acc*x.p, 1);
      }
      oTotal *= ls.reduce((acc,x)=>acc*x.o, 1);
      avisos.push(`Combinada del mismo partido en ${m.home} vs ${m.away}: Probabilidad conjunta calculada sobre la matriz exacta.`);
    }
  });

  const e = pConjunta * oTotal - 1;
  const k = kelly(pConjunta, oTotal);
  const stake = e>=S.minEv ? Math.round(S.bank * k * 0.125) : 0;
  return {o:oTotal, p:pConjunta, e, stake, avisos};
}

function viewCombo(){
  const allLegs = [];
  MATCHES.forEach(m=>{
    const {mkts} = model(m);
    mkts.filter(x=>x.o && x.o>1).forEach(x=>{
      allLegs.push({matchId:m.id, marketId:x.id, label:x.label, o:x.o, p:x.p, e:x.e, test:x.test, match:`${m.home} vs ${m.away}`});
    });
  });

  const selectedLegs = COMBO.map(c=> allLegs.find(l=>l.matchId===c.matchId && l.marketId===c.marketId)).filter(Boolean);
  const calc = comboCalc(selectedLegs);

  return `
  <div class="wrap">
    <div class="perf-header">
      <h2>Armador de Combinadas</h2>
      <p>Calcula la probabilidad conjunta real sin trampas de correlación</p>

    ${selectedLegs.length ? `
    <div class="verdict-card ${calc.e>=S.minEv?"val":""}" style="margin:0 0 16px">
      <div class="verdict-pill ${calc.e>=S.minEv?"gold":"neutral"}">

        <div class="verdict-cell"><small>Cuota Total</small><b class="green">@${calc.o.toFixed(2)}</b></div>
        <div class="verdict-cell"><small>Probabilidad</small><b class="gold">${Math.round(calc.p*100)}%</b></div>
        <div class="verdict-cell"><small>Ventaja</small><b class="${calc.e>0?"green":"coral"}">${calc.e>0?"+":""}${Math.round(calc.e*100)}%</b></div>
        <div class="verdict-cell"><small>Monto</small><b>${calc.stake?mny(calc.stake):"—"}</b></div>
      </div>
      ${calc.avisos.map(a=>`<div class="argument-box" style="font-size:12px;margin-bottom:8px">💡 ${esc(a)}</div>`).join("")}

      return `

function viewMethod(){
  const s = METODOS[METHOD_STEP];
  return `
  <div class="method-container">
    <div class="method-progress">
      <div class="eyebrow">${s.cat} · ${METHOD_STEP+1}/${METODOS.length}</div>
      <div class="method-dots">
        ${METODOS.map((_,i)=>`<div class="method-dot ${i===METHOD_STEP?"active":""}"></div>`).join("")}
      </div>
    </div>

    <div class="method-card">
      <div class="method-icon-circle">📈</div>
      <div class="method-category">${s.cat}</div>
      <div class="method-h2">${s.title}</div>
      <p class="method-p">${s.p}</p>

      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px">
        ${s.tags.map(t=>`<span class="chip" style="font-size:11px;min-height:auto;padding:5px 10px">${t}</span>`).join("")}
      </div>

      <div class="method-checklist">
        ${s.items.map(it=>`
        <div class="method-item">
          <div class="method-check">✓</div>
          <div>${it}</div>
        </div>`).join("")}
      </div>

      <div style="display:flex;gap:10px">
        ${METHOD_STEP>0?`<button class="btn-ghost" data-method-prev style="flex:1">← Anterior</button>`:""}
        <button class="btn-primary" data-method-next style="flex:2">
          ${METHOD_STEP<METODOS.length-1?"Siguiente →":"¡Comenzar a Analizar!"}
        </button>
      </div>
    </div>
  </div>`;
}

/* 6. Vista de Ajustes */
function viewSettings(){
  return `
  <div class="wrap">
    <div class="perf-header"><h2>Configuración</h2><p>Ajustes de banca y parámetros</p></div>
    <div class="perf-card">
      <div style="margin-bottom:14px">
        <label class="eyebrow" style="display:block;margin-bottom:6px">Tu Banca / Saldo Total ($)</label>
        <input class="odds-input" style="width:100%;text-align:left" type="number" id="s-bank" value="${S.bank}">
      </div>
      <div style="margin-bottom:14px">
        <label class="eyebrow" style="display:block;margin-bottom:6px">Umbral Mínimo de Ventaja (EV)</label>
        <select class="odds-input" style="width:100%;text-align:left" id="s-ev">
          <option value="0.02" ${S.minEv==0.02?"selected":""}>2% (Más oportunidades)</option>
          <option value="0.04" ${S.minEv==0.04?"selected":""}>4% (Recomendado estándar)</option>
          <option value="0.08" ${S.minEv==0.08?"selected":""}>8% (Ultra selectivo)</option>
        </select>
      </div>
      <button class="btn-primary" id="saveSettings">Guardar Cambios</button>
    </div>
  </div>`;
}

/* ── Utilidades ── */
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mny = n => "$" + Math.round(n).toLocaleString("es-AR");
const crest = (url, size="") => url ? `<img class="crest ${size}" src="${url}" alt="" loading="lazy" onerror="this.style.display='none'">` : "";

const ORDEN_COMP = ["Liga Profesional Argentina","CONMEBOL Libertadores","CONMEBOL Sudamericana","Copa Argentina"];
function agruparPorComp(rows){
  const grupos = {};
  rows.forEach(r=> (grupos[r.m.comp] = grupos[r.m.comp]||[]).push(r));
  const out = [];
  ORDEN_COMP.forEach(c=>{ if(grupos[c]) out.push({comp:c, rows:grupos[c]}); });
  Object.keys(grupos).forEach(c=>{ if(!ORDEN_COMP.includes(c)) out.push({comp:c, rows:grupos[c]}); });
  return out;
}

/* ── Render y Navegación ── */
function render(){
  const app = document.getElementById("app");
  if(VIEW.matchId) {
    app.innerHTML = viewMatch(VIEW.matchId);
  } else {
    if(VIEW.tab === "fecha") app.innerHTML = viewDay();
    if(VIEW.tab === "combo") app.innerHTML = viewCombo();
    if(VIEW.tab === "registro") app.innerHTML = viewLog();
    if(VIEW.tab === "metodo") app.innerHTML = viewMethod();
    if(VIEW.tab === "ajustes") app.innerHTML = viewSettings();
  }
  document.querySelectorAll("nav.bottom-nav button").forEach(b=>{
    b.classList.toggle("on", !VIEW.matchId && b.dataset.nav === VIEW.tab);
  });
  window.scrollTo(0,0);
}

/* ── Eventos ── */
document.addEventListener("click", e => {
  const navBtn = e.target.closest("nav.bottom-nav button");
  if(navBtn){
    VIEW.tab = navBtn.dataset.nav;
    VIEW.matchId = null;
    render(); return;
  }
  const dayBtn = e.target.closest("[data-day]");
  if(dayBtn){
    VIEW.day = dayBtn.dataset.day;
    render(); return;
  }
  const matchCard = e.target.closest("[data-match]");
  if(matchCard && !e.target.closest("input")){
    VIEW.matchId = matchCard.dataset.match;
    VIEW.subtab = "mercados";
    render(); return;
  }
  const backBtn = e.target.closest("[data-back]");
  if(backBtn){
    VIEW.matchId = null;
    render(); return;
  }
  const subtabBtn = e.target.closest("[data-subtab]");
  if(subtabBtn){
    VIEW.subtab = subtabBtn.dataset.subtab;
    render(); return;
  }
  const mktCatBtn = e.target.closest("[data-mktcat]");
  if(mktCatBtn){
    VIEW.mktCategory = mktCatBtn.dataset.mktcat;
    render(); return;
  }
  const filterBtn = e.target.closest("[data-f]");
  if(filterBtn){
    VIEW.filter = filterBtn.dataset.f;
    render(); return;
  }
  const perffBtn = e.target.closest("[data-perff]");
  if(perffBtn){
    VIEW.perfFilter = perffBtn.dataset.perff;
    render(); return;
  }
  const compClose = e.target.closest("[data-compclose]");
  if(compClose){
    const k = compClose.dataset.compclose;
    if(closedComps.has(k)) closedComps.delete(k); else closedComps.add(k);
    render(); return;
  }
  const nextMethod = e.target.closest("[data-method-next]");
  if(nextMethod){
    if(METHOD_STEP < METODOS.length-1) { METHOD_STEP++; render(); }
    else { VIEW.tab = "fecha"; VIEW.matchId = null; render(); }
    return;
  }
  const prevMethod = e.target.closest("[data-method-prev]");
  if(prevMethod){
    if(METHOD_STEP > 0) { METHOD_STEP--; render(); }
    return;
  }
  const savePick = e.target.closest("[data-savepick]");
  if(savePick){
    const [mid, mktId, label, odds, stake, evVal] = savePick.dataset.savepick.split("|");
    const m = MATCHES.find(x=>x.id===mid);
    LOG.push({
      id: "bet_" + Date.now(),
      matchId: mid,
      match: m ? `${m.home} vs ${m.away}` : "Partido",
      label,
      odds: parseFloat(odds),
      stake: parseFloat(stake),
      ev: parseFloat(evVal),
      closing: null,
      result: "P",
      date: new Date().toISOString().slice(0,10)
    });
    store.set("log", LOG);
    savePick.innerText = "✓ ¡Guardado en Historial!";
    setTimeout(()=>{ VIEW.tab = "registro"; VIEW.matchId = null; render(); }, 600);
    return;
  }
  const resBtn = e.target.closest("[data-res]");
  if(resBtn){
    const id = resBtn.dataset.res, v = resBtn.dataset.v;
    const item = LOG.find(x=>x.id===id);
    if(item){ item.result = v; store.set("log", LOG); render(); }
    return;
  }
  const legPick = e.target.closest("[data-legpick]");
  if(legPick){
    const [matchId, marketId] = legPick.dataset.legpick.split("|");
    const idx = COMBO.findIndex(c=>c.matchId===matchId && c.marketId===marketId);
    if(idx>=0) COMBO.splice(idx,1);
    else COMBO.push({matchId, marketId});
    store.set("combo", COMBO);
    render(); return;
  }
  const comboClear = e.target.closest("[data-combo-clear]");
  if(comboClear){
    COMBO = []; store.set("combo", COMBO); render(); return;
  }
  const saveSetBtn = e.target.closest("#saveSettings");
  if(saveSetBtn){
    const b = parseFloat(document.getElementById("s-bank").value);
    const evTh = parseFloat(document.getElementById("s-ev").value);
    if(!isNaN(b) && b>0) S.bank = b;
    if(!isNaN(evTh)) S.minEv = evTh;
    store.set("settings", S);
    alert("¡Ajustes guardados correctamente!");
    VIEW.tab = "fecha"; render(); return;
  }
});

document.addEventListener("input", e => {
  if(e.target.dataset.odds){
    const mid = e.target.dataset.m, mktId = e.target.dataset.odds;
    const v = parseFloat(e.target.value);
    ODDS[mid+"__"+mktId] = (!isNaN(v) && v>1) ? v : null;
    store.set("odds", ODDS);
  }
  if(e.target.dataset.close){
    const id = e.target.dataset.close;
    const v = parseFloat(e.target.value);
    const item = LOG.find(x=>x.id===id);
    if(item){
      item.closing = (!isNaN(v) && v>1) ? v : null;
      store.set("log", LOG);
    }
  }
});

/* ── Arranque ── */
(async function init(){
  S = (await store.get("settings")) || S;
  ODDS = (await store.get("odds")) || {};
  LOG = (await store.get("log")) || [];
  COMBO = (await store.get("combo")) || [];

  try{
    const r = await fetch("data/partidos.json?t="+Date.now());
    if(r.ok){
      const d = await r.json();
      MATCHES = d.partidos || [];
      const hoy = new Date().toISOString().slice(0,10);
      VIEW.day = MATCHES.some(m=>m.date===hoy) ? hoy : (MATCHES[0]?.date || hoy);
    }
  }catch(e){}

  try{
    const r = await fetch("data/analisis.json?t="+Date.now());
    if(r.ok) ANALISIS = await r.json();
  }catch(e){}

  try{
    const r = await fetch("data/equipos.json?t="+Date.now());
    if(r.ok) EQUIPOS = await r.json();
  }catch(e){}

  render();
})();
</script>
