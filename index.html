.stdr.puntos{opacity:.5;justify-content:center;letter-spacing:.2em;color:var(--gris3)}
.rsub{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--gris3);margin:14px 0 7px}
.rsub.primero{margin-top:0}
.h2hr{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--hueco)}
.h2hr .f{flex:0 0 44px;font-family:var(--mono);font-size:10.5px;color:var(--gris3)}

<body>
<div class="app" id="app"></div>
<nav class="nav"><div class="in">
  <button data-nav="fecha">Fecha</button>
  <button data-nav="registro">Registro</button>
  <button data-nav="metodo">Método</button>
</div></nav>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════
   MOTOR — copiado del índice verificado (tag motor-verificado).
   No se reescribe: está validado y reescribirlo arriesga errores
   numéricos silenciosos.
   ══════════════════════════════════════════════════════════════════ */
const fact = n => { let r=1; for(let i=2;i<=n;i++) r*=i; return r; };
const pois = (k,l) => Math.exp(-l)*Math.pow(l,k)/fact(k);

function tau(i,j,lh,la,rho){
  if(i===0&&j===0) return 1 - lh*la*rho;
  if(i===0&&j===1) return 1 + lh*rho;
  if(i===1&&j===0) return 1 + la*rho;
  if(i===1&&j===1) return 1 - rho;
  return 1;
}
function matrix(lh,la,rho,max=9){
  const m=[]; let tot=0;
  for(let i=0;i<=max;i++){ m[i]=[];
    for(let j=0;j<=max;j++){ const p=pois(i,lh)*pois(j,la)*tau(i,j,lh,la,rho); m[i][j]=p; tot+=p; }
  }
  for(let i=0;i<=max;i++) for(let j=0;j<=max;j++) m[i][j]/=tot;
  return m;
}
const sumIf = (m,f) => { let s=0; for(let i=0;i<m.length;i++) for(let j=0;j<m.length;j++) if(f(i,j)) s+=m[i][j]; return s; };

const ev    = (p,o) => p*o - 1;
const kelly = (p,o) => { const b=o-1; if(b<=0) return 0; return Math.max(0,(p*b-(1-p))/b); };

/* ══════════════════════════════════════════════════════════════════
   CONSTANTES DE RECOMENDACIÓN

   Todas medidas sobre los partidos reales, no elegidas a ojo.
   Ver docs/superpowers/specs/2026-08-16-rediseno-desde-cero-design.md
   ══════════════════════════════════════════════════════════════════ */
const MIN_EV = 0.04;            // el mismo que rige en toda la app
const MAX_ODDS = 4.5;
/* Control de cordura. La app predica que arriba de +25% de EV lo más
   probable es que nuestro propio λ esté mal, no que hayas encontrado
   oro. Si Herramientas recomendara jugar igual, la app se desmentiría
   a sí misma en dos pantallas distintas. */
const EV_ABSURDO = 0.25;

const FRANJAS = [
  {n:"Lo más probable", lo:0.68, hi:0.93,
   sub:"Paga poco, justamente porque pasa seguido."},
  {n:"Intermedia",      lo:0.45, hi:0.68,
   sub:"Equilibrio entre lo que paga y lo seguido que pasa."},
  {n:"Arriesgada",      lo:0.12, hi:0.45,
   sub:"Paga bien porque se da poco. No es la más probable."},
];

/* La ventaja mínima para ELEGIR dentro de una franja. */
const VENTAJA_MIN = 0.02;

/* La banda donde una diferencia contra el mercado significa algo.
   Piso 6pp, no 3: medimos que el modelo se aparta 9-15pp de la línea
   limpia en promedio, así que 3pp está dentro de nuestro propio error
   y marcaría ruido como si fuera hallazgo. Con 6pp la marca cae de
   32% a 22% de los picks (medido sobre 30 partidos reales).
   Techo 12pp: arriba de eso el sospechoso es el modelo, no el precio. */
const VALOR_MIN = 0.06;
const VALOR_MAX = 0.12;

/* Piso de cuota para la marca dorada — para individual, no para lo
   que entra en una combinada (eso lo sigue eligiendo la escalera por
   franja, sin mirar este piso).

   MAX_ODDS ya frenaba el techo (cuota demasiado alta = sospechar del
   modelo). Nunca hubo un piso, y con solo el 1X2 casi no se notaba —
   pocas veces baja de 1.50. Con más mercados reales (goles extra,
   ambos marcan) empezó a pasar seguido: medido el 2026-08-26, de 14
   franjas marcadas en la grilla del día, la mitad pagaba menos de
   1.50 — la mayoría en "Lo más probable", que por diseño es la que
   menos paga (ver FRANJAS). Con este piso, "Lo más probable" casi
   nunca se marca en dorado — y está bien: nunca prometió ser la
   mejor apuesta, solo la más segura. Se eligió 1.50 después de ver
   que 1.75 apagaba el 79% de las marcas del día. */
const CUOTA_MIN_VAL = 1.50;

/* Piso para que un mercado pueda APARECER en la escalera. Más bajo que
   CUOTA_MIN_VAL (que decide la marca dorada) porque acá no se está
   diciendo "hay valor", se está diciendo "esto es lo que vemos" — pero
   igual tiene piso, porque una cuota de 1.10 no deja nada después del
   margen de 7.7% y la app lo sabe: está escrito en Método desde el
   principio y se mostraba igual.
   1.30 implica 77% de probabilidad. Arriba de eso, el margen se come
   cualquier ventaja posible. */
const CUOTA_MIN_ESCALERA = 1.30;

/* Piso para MOSTRAR una línea de gol en Otros mercados — no para
   marcarla en dorado (eso ya lo frena CUOTA_MIN_VAL, más arriba y más
   alto). mercadoExtra.goles puede traer líneas que Bet365 cotiza de
   verdad pero que nadie apostaría en serio: "menos de 7.5 goles" al
   99%, pagando 1.00. Es la misma frase que ya usa el repo para las
   líneas de 0.5 en la escalera ("pagan 1.05-1.12, son ruido disfrazado
   de apuesta") — acá aparece en el otro extremo. El piso 1.15 queda
   apenas arriba de ese rango documentado, con margen: la línea de 4.5
   real (pagando 1.20 del lado corto) sigue mostrándose. */
const CUOTA_MIN_MOSTRAR = 1.15;

/* Terracota: el mercado le da 10pp más que nosotros a nuestra propia
   lectura. Se enciende en el 8% de los partidos con cuota. */
const ALERTA_MIN = 0.10;

/* ══════════════════════════════════════════════════════════════════
   DÓNDE NO SE MARCA VALOR — medido, no supuesto

   `medir_roi.py` (2026-08-30) midió por primera vez la regla de valor
   contra PLATA, liga por liga, walk-forward sobre el historial
   completo con la cuota de cierre real de Pinnacle:

       arg   1789 apuestas   ROI  −9.17% ±6.44   significativo
       bra   1333 apuestas   ROI  −9.13% ±7.32   significativo
       eng    947 apuestas   ROI  +1.01% ±8.92   ruido
       fra    993 apuestas   ROI  −5.22% ±8.71   ruido

   Los dos primeros no son "indistinguible de cero": el intervalo no
   incluye el cero. Está medido que ahí la marca resta.

   Y no es que el umbral esté mal elegido. `barrido_valor.py` probó
   **39 ventanas de ventaja distintas** en arg con train/test temporal
   (train <2022 elige, test ≥2022 confirma): ninguna da positivo en
   las dos mitades. Producción (0.06–0.12) da −7.53% en train y
   −11.52% en test. La regla no se arregla moviendo constantes.

   Lo que se apaga es la MARCA, no la lectura: el pronóstico, la
   escalera y "Otros mercados" se siguen mostrando enteros. La app
   sigue diciendo qué puede pasar; deja de decir "acá hay valor"
   donde midió que no lo hay.

   Las copas sudamericanas NO están en esta lista y hay que decir por
   qué: no hay cuotas históricas de copas en football-data, así que no
   se pudieron medir. No es evidencia a favor — es ausencia de
   evidencia, y agregarlas acá sería extrapolar, que es justo lo que
   este repo prohíbe. Si algún día hay datos, se miden.
   ══════════════════════════════════════════════════════════════════ */
const LIGAS_SIN_VALOR = [/profesional\s+argentina/i, /brasileir/i];
const ligaSinValor = m => LIGAS_SIN_VALOR.some(re => re.test(m.comp || ""));

/* Cuántos partidos lleva jugados el que menos jugó de los dos.

   Al arranque de una temporada las fuerzas se ajustan sobre nada y
   todos los equipos salen parecidos. Verificado el 2026-09-02 con
   Manchester City vs Coventry: λ 1.35 contra 1.10 —casi iguales—
   mientras el mercado pagaba 1.20 contra 11.00. Los dos equipos
   llevaban 2 fechas. El número no estaba mal calculado: estaba
   calculado sobre nada.

   La tabla es la fuente buena (es el conteo oficial de la
   competición); la forma general es el respaldo para las copas, donde
   no hay tabla. */
function partidosJugados(m){
  const t = m.tabla || [];
  const de = id => { const f = t.find(x=> String(x.id) === String(id));
    return f && f.pj != null ? f.pj : null; };
  const h = de(m.homeId), a = de(m.awayId);
  if(h != null && a != null) return Math.min(h, a);
  return Math.min((m.formH_general || []).length, (m.formA_general || []).length);
}

/* El mismo 4 que `MIN_SPLIT`, y por la misma razón medida: abajo de
   eso el promedio se apoya en una muestra que el propio proyecto le
   prohíbe al análisis. Acá el efecto es peor que un promedio flojo —
   es un 1X2 publicado con cara de lectura. */
const MIN_PARTIDOS = 4;
const sinMuestra = m => partidosJugados(m) < MIN_PARTIDOS;

/* Umbral de cuota, no cuota de referencia. Mostrar "@2.20 en DraftKings"
   es una trampa: el usuario va a Betsson, encuentra 2.05 y no sabe si
   sigue conviniendo. Y la justa pelada tampoco sirve: a la justa exacta
   la ventaja es CERO. Va la justa más el margen de seguridad. */
const umbral = p => p>0 ? (1+MIN_EV)/p : Infinity;

/* ══════════════════════════════════════════════════════════════════
   ESTADO

   (qué está tratando de hacer el que mira), y adentro de Datos un
   explorador. Los dos persisten al moverse entre pantallas, que es lo
   que hace que se sientan una sola cosa y no seis destinos. */
let CAPA="veredicto";     /* veredicto | lectura | datos */

                             "cruce" es el default y significa cada equipo en SU rol
                             de hoy, que es la lectura del partido; los otros dos
                             miran a los dos del mismo lado. */

let JUG_EQ="dos";         /* dos | L | V */
let REF_TABLA=null;       /* qué tabla de Referencia está a la vista */

   "mk:goles", "ref:pos"). Un Set y no un booleano por bloque: los

                             visible para viewPartido(): abrir un
                             acordeón o cambiar un filtro no es cambiar
                             de capa, y no debe re-disparar su entrada */
/* Un elemento al que volver después de dibujar. Lo usa el acordeón de
   ligas de la portada, que es el único que CIERRA a los demás: guardar
   el scroll no alcanza ahí, porque al cerrarse la liga de arriba la

let ANCLA=null;
let ABIERTOS=new Set();
let EXPANDIDAS=new Set(); /* listas truncadas que el usuario abrió */
let LIGA_ABIERTA=null;    /* acordeón de liga en la portada */

   Los dos no entran en un dibujo solo, y apilarlos obliga a scrollear

let PL_EQ="H";
let ESTADISTICAS={};   /* promedios por partido de cada equipo, del cron */
let PARAMETROS={};     /* por metrica: media de la liga, dispersion y k */
let PARAM_LIGA={};     /* lo mismo, pero calculado DENTRO de cada liga.
                          Existe desde el 2026-08-25: con seis competiciones

                          ligas como si fuera diferencia entre equipos, y `k`
                          baja por el motivo equivocado. Ver
                          parametros_por_liga() en actualizar.py. */
/* Cuanto le erra cada metrica del mercado de estadisticas, medido con

let CALIBRACION={}, CALIBRADO="";

let CALJUG_FECHA="";   /* cuándo se midió: lo firma el gráfico de Método */
let ANALISIS_EST={};   /* la skill del mercado de estadísticas */

let PARAMJUG_LIGA={};  /* y por puesto DENTRO de cada liga: un 9 inglés no se
                          encoge hacia el promedio de los 9 argentinos. */
let PL_MET="goles";   /* la estadística que se está mirando en Plantel */
let CORRIGIENDO=null;   // key de la carga con los botones abiertos, efímero
let BOOT_ERROR=null, CARGANDO=true;

const guardar = (k,v)=>{ try{ localStorage.setItem("valor_"+k, JSON.stringify(v)); }catch(e){} };
const leer = (k,def)=>{ try{ const v=localStorage.getItem("valor_"+k); return v?JSON.parse(v):def; }catch(e){ return def; } };

/* ══════════════════════════════════════════════════════════════════
   RESOLUCIÓN AUTOMÁTICA DEL REGISTRO

   El problema: cuando analizamos un partido, todavía no se jugó, así
   que el marcador final no está en partidos.json. La versión anterior
   le pedía al usuario que marcara a mano si había acertado, y un
   registro que depende de esa disciplina no se llena nunca. La app
   terminaba midiendo opiniones en vez de aciertos.

   La solución entra por una puerta lateral: cada partido trae los
   últimos cinco de cada equipo en formH/formA, con rival, localía y
   marcador. Entonces el resultado de lo que anotamos aparece igual,
   un refresco después, en el historial de cualquiera de los dos
   equipos — la próxima vez que alguno vuelva a jugar.

   Esta región está marcada con centinelas porque `test_registro.js`
   la extrae y la corre en Node contra datos reales. Si movés los
   comentarios INICIO/FIN, el test deja de encontrarla.
   ══════════════════════════════════════════════════════════════════ */
/* ==== INICIO RESOLUCION ==== */

/* Marcadores finales que persiste actualizar.py en data/resultados.json,
   como {"espn401841517": "2-1"} en perspectiva local-visitante.

   Esta es la vía EXACTA: cruza por id de partido, así que no puede
   confundirse de partido nunca. El cruce por historial de abajo sigue
   existiendo como respaldo, y hace falta: cubre los partidos anotados
   antes de que este archivo existiera, y cualquier hueco que ESPN deje
   en una temporada vieja. */
let RESULTADOS = {};

/* Los criterios de cobro. mercados() los usa para calcular la
   probabilidad previa y resolver() para verificar el cobro: tiene que
   ser EL MISMO objeto. Si se duplican, tarde o temprano divergen y la
   app miente en una de las dos puntas — promete con un criterio y
   paga con otro. */
const TESTS = {
  "1x2_l":(i,j)=>i>j, "1x2_e":(i,j)=>i===j, "1x2_v":(i,j)=>i<j,
  "dc_lx":(i,j)=>i>=j, "dc_x2":(i,j)=>i<=j, "dc_12":(i,j)=>i!==j,
  "btts_si":(i,j)=>i>0&&j>0, "btts_no":(i,j)=>i===0||j===0,
};
/* 0.5 a 6.5: el rango real que cotiza Bet365 (odds-api.io), verificado
   el 2026-08-26 — de sus 16 líneas de gol solo estas 7 son binarias
   (X.5). Las tres de siempre (1.5/2.5/3.5) están adentro. */
[0.5,1.5,2.5,3.5,4.5,5.5,6.5].forEach(n=>{
  TESTS["ov"+n]=(i,j)=>i+j>n; TESTS["un"+n]=(i,j)=>i+j<n;
});

/* Los nombres vienen de ESPN y se comparan entre historiales
   distintos: acentos y puntuación no son confiables. */
const norm = s => (s||"").toLowerCase().normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");

function hoyISO(){
  const d = new Date(), z = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
}

/* Busca el marcador de H vs A en los historiales, y lo devuelve
   orientado: `i` es siempre del local, `j` del visitante.

   `marcador` viene en la perspectiva del dueño del historial — el
   primer número es del equipo de la fila, no del local. Verificado
   sobre 206 partidos: 206 de 206 cierran así, solo 109 con la otra
   lectura. Por eso el caso visitante invierte (i=b, j=a).

   `desde` es el candado 1. */
function buscarResultado(H, A, matches, desde){
  let mejor = null;
  const mirar = (dueno, forma) => {
    (forma||[]).forEach((f,k)=>{
      if(!f || !f.marcador) return;
      const [a,b] = String(f.marcador).split("-").map(Number);
      if(!isFinite(a) || !isFinite(b)) return;
      let i, j, fuente;
      if(norm(dueno)===norm(H) && norm(f.rival)===norm(A) && f.local===true){ i=a; j=b; fuente=H; }
      else if(norm(dueno)===norm(A) && norm(f.rival)===norm(H) && f.local===false){ i=b; j=a; fuente=A; }
      else return;
      if(!mejor || k < mejor.k) mejor = {i, j, k, fuente};   // k=0 es el más reciente
    });
  };
  (matches||[]).forEach(m=>{
    /* CANDADO 1 — solo historiales posteriores a nuestro partido.
       Un historial cargado antes no puede contenerlo, pero sí puede
       contener el cruce ANTERIOR entre los mismos dos equipos. En
       fase de grupos, con rivales repetidos, ahí es donde la app
       anota como resultado un partido que no es el nuestro. */
    if(desde && m.date && m.date <= desde) return;
    mirar(m.home, m.formH); mirar(m.away, m.formA);
  });
  return mejor;
}

/* Resuelve una carga del registro contra los datos frescos.

   El estado guardado NO manda: se recalcula en cada render. Lo único
   que se persiste como verdad es la corrección manual. Si guardáramos
   el resultado, un cruce equivocado quedaría fosilizado en el
   registro y ya no habría dato fresco que lo arreglara. */
function resolver(b, matches, hoy){
  if(b.manual) return {estado:b.estado, auto:false, res:null, esperando:false};

  /* home/away se agregaron con esta funcionalidad; las cargas
     anotadas antes solo tienen "X vs Y" y no se pueden perder. */
  const H = b.home || (b.partido||"").split(" vs ")[0];
  const A = b.away || (b.partido||"").split(" vs ")[1];

  /* CANDADO 2 — si el partido sigue en la grilla con fecha de hoy o
     posterior, no se jugó. Ni miramos marcadores. */
  const enGrilla = (matches||[]).some(m=> m.id===b.matchId && m.date >= hoy);
  if(enGrilla) return {estado:"pendiente", auto:true, res:null, esperando:false};

  const test = TESTS[(b.key||"").split("__")[1]];

  /* Primero la vía exacta: el marcador guardado por id de partido. No
     necesita los dos candados — no puede traer otro partido, porque la
     clave ES el partido. */
  const exacto = String(RESULTADOS[b.matchId] || "").split("-").map(Number);
  if(exacto.length === 2 && isFinite(exacto[0]) && isFinite(exacto[1]) && test){
    const res = {i:exacto[0], j:exacto[1], k:-1, fuente:null, exacto:true};
    return {estado: test(res.i,res.j) ? "ganada" : "perdida", auto:true, res, esperando:false};
  }

  const res = buscarResultado(H, A, matches, b.fecha);
  if(res && test) return {estado: test(res.i,res.j) ? "ganada" : "perdida", auto:true, res, esperando:false};

  /* Ya se jugó pero el marcador no apareció: ninguno de los dos
     equipos volvió a jugar dentro de la ventana del archivo. Se
     declara en pantalla en vez de esconderlo. */
  return {estado:"pendiente", auto:true, res:null, esperando: !!(b.fecha && b.fecha < hoy)};
}
/* ==== FIN RESOLUCION ==== */

/* ══════════════════════════════════════════════════════════════════
   MERCADOS CORTOS

   Solo lo que la gente juega y entiende. Quedan afuera marcador
   exacto, hándicaps y las líneas de 0.5 goles: pagan 1.05-1.12, son
   ruido disfrazado de apuesta. Si se elige por probabilidad pelada
   sin esta lista, el sistema recomienda siempre "local no pierde por
   2+" al 91% — verdadero e inservible.
   ══════════════════════════════════════════════════════════════════ */
function mercados(M, m){
  const L=m.home, V=m.away, o=[];
  const add = (fam,id,label,p,req,extra) => o.push(Object.assign({fam,id,label,p,req},extra||{}));

  add("Resultado","1x2_l",`Gana ${L}`,          sumIf(M,(i,j)=>i>j),  ["L"]);
  add("Resultado","1x2_e","Empate",             sumIf(M,(i,j)=>i===j),["E"]);
  add("Resultado","1x2_v",`Gana ${V}`,          sumIf(M,(i,j)=>i<j),  ["V"]);
  add("Resultado","dc_lx",`${L} gana o empata`, sumIf(M,(i,j)=>i>=j), ["L","E"]);
  add("Resultado","dc_x2",`${V} gana o empata`, sumIf(M,(i,j)=>i<=j), ["V","E"]);
  add("Resultado","dc_12","Gana alguno (sin empate)", sumIf(M,(i,j)=>i!==j), ["L","V"]);
  /* Las tres de siempre, más las que Bet365 (odds-api.io) cotiza de
     verdad para este partido puntual — así un partido sin cruce o sin
     clave se ve exactamente igual que antes, y uno con cruce muestra
     más franjas, todas con precio real detrás. */
  const lineasGoles = new Set([1.5,2.5,3.5]);
  const golesReales = (m.mercadoExtra && m.mercadoExtra.goles) || {};
  Object.keys(golesReales).forEach(k=>{
    const f = parseFloat(k);
    if(isFinite(f)) lineasGoles.add(f);
  });
  [...lineasGoles].sort((a,b)=>a-b).forEach(n=>{
    add("Goles","ov"+n,`Más de ${n} goles`,  sumIf(M,(i,j)=>i+j>n), null, {linea:n,lado:"over"});
    add("Goles","un"+n,`Menos de ${n} goles`,sumIf(M,(i,j)=>i+j<n), null, {linea:n,lado:"under"});
  });
  add("Ambos","btts_si","Ambos marcan",      sumIf(M,(i,j)=>i>0&&j>0),  null);
  add("Ambos","btts_no","No marcan los dos", sumIf(M,(i,j)=>i===0||j===0), null);

  /* El mismo TESTS que resuelve el registro. Acá sirve para la
     probabilidad conjunta exacta de la combinada; allá para verificar
     el cobro. Un solo objeto, a propósito. */
  o.forEach(x=> x.test = TESTS[x.id]);
  return o;
}

/* En castellano, cuándo se cobra. */
function cuandoCobra(op, m){
  const L=m.home, V=m.away;
  switch(op.id){
    case "1x2_l": return `Se te paga solo si gana ${L}. El empate pierde.`;
    case "1x2_e": return "Se te paga solo si terminan iguales.";
    case "1x2_v": return `Se te paga solo si gana ${V}. El empate pierde.`;
    case "dc_lx": return `Se te paga salvo que gane ${V}.`;
    case "dc_x2": return `Se te paga salvo que gane ${L}.`;
    case "dc_12": return "Se te paga con cualquier ganador. Solo pierde con empate.";
    case "btts_si": return "Se te paga si los dos convierten, sin importar quién gane.";
    case "btts_no": return "Se te paga si alguno de los dos se queda en cero.";
  }
  if(op.lado==="over"){
    const min = Math.ceil(op.linea);
    return `Se te paga con ${min} goles o más entre los dos equipos.`;
  }
  if(op.lado==="under"){
    const max = Math.floor(op.linea);
    return `Se te paga con ${max} ${max===1?"gol":"goles"} o menos en todo el partido.`;
  }
  return "";
}

/* ══════════════════════════════════════════════════════════════════
   MERCADO: la línea sin margen

   La cuota cruda implica probabilidades que suman ~1.077 (margen 7.7%
   medido sobre DraftKings). Compararse contra eso haría ver ventaja
   donde solo hay comisión.

   El margen NO se reparte parejo entre las tres opciones: las casas le
   cargan más a la cuota alta. Sacarlo en partes iguales infla la
   probabilidad implícita del batacazo y desinfla la del favorito, y
   como la ventaja de la app es una resta contra este número, el sesgo
   se traslada entero a la marca dorada.

   Medido el 2026-08-25 sobre 11.854 partidos con cuota de cierre real
   (ver medir_devig.py). Con margen parecido al de DraftKings, el
   proporcional le erra 11.21 unidades de ruido y Shin 6.18: la mitad.
   Y el patrón es el que decide — cuando el margen sube de 3% a 7%, el
   error del proporcional casi se duplica y el de Shin no se mueve.

   Hasta esa fecha la app usaba el proporcional mientras medir_clv.py y
   medir_historico.py ya usaban Shin: se medía el modelo con una vara y
   se marcaba valor con otra.

   Traducción literal de `devig_shin` de medir_clv.py — misma bisección,
   mismas constantes. Si las dos se separan, la app deja de decir lo que
   las mediciones dicen.
   ══════════════════════════════════════════════════════════════════ */
function devigShin(cuotas){
  if(!cuotas || cuotas.some(c=> !c || c<=0)) return null;
  const raw = cuotas.map(c=> 1/c);
  const libro = raw.reduce((a,b)=>a+b, 0);
  // Sin margen, o mercado de dos vías, Shin no tiene nada que corregir.
  if(cuotas.length < 3 || libro <= 1) return raw.map(x=> x/libro);

  const probs = z => z >= 1 ? raw
    : raw.map(r=> (Math.sqrt(z*z + 4*(1-z)*r*r/libro) - z) / (2*(1-z)));

  // f(0) = sqrt(libro) - 1 > 0 y decrece con z: la raíz está en el medio.
  let lo = 0, hi = 0.99;
  for(let i=0; i<200; i++){
    const med = (lo+hi)/2;
    if(probs(med).reduce((a,b)=>a+b, 0) - 1 > 0) lo = med; else hi = med;
    if(hi - lo < 1e-12) break;
  }
  const p = probs((lo+hi)/2);
  const tot = p.reduce((a,b)=>a+b, 0);
  return tot > 0 ? p.map(x=> x/tot) : null;
}
function devig(mk){
  if(!mk || !mk.local) return null;
  const p = devigShin([mk.local, mk.empate, mk.visitante]);
  return p ? {L:p[0], E:p[1], V:p[2]} : null;
}
function pMercado(op, pq, mk, mx){
  if(op.req){
    if(!pq) return null;
    return op.req.reduce((s,k)=>s+pq[k], 0);
  }
  if(op.linea!=null){
    /* Bet365 primero: cubre 0.5 a 6.5, DraftKings solo trae 2.5. Las
       dos son dos lados reales — se les quita el margen con Shin,
       igual que a cualquier mercado de dos vías. */
    const gx = mx && mx.goles && mx.goles[String(op.linea)];
    if(gx && gx.length===2){
      const p = devigShin(gx);
      if(p) return op.lado==="over" ? p[0] : p[1];
    }
    if(mk && mk.totalLinea===op.linea && mk.totalOver && mk.totalUnder){
      const co=1/mk.totalOver, cu=1/mk.totalUnder;
      return (op.lado==="over"?co:cu)/(co+cu);
    }
    return null;
  }
  if(op.id==="btts_si" || op.id==="btts_no"){
    const b = mx && mx.btts;
    if(b && b.si && b.no){
      const p = devigShin([b.si, b.no]);
      if(p) return op.id==="btts_si" ? p[0] : p[1];
    }
  }
  return null;
}

/* La cuota cruda que pMercado() efectivamente usó para esta opción —
   misma fuente, mismo orden. Existe para el piso de cuota
   (CUOTA_MIN_VAL): frenar por cuota baja mirando un precio distinto
   del que se comparó no tendría sentido.

   Doble oportunidad no tiene una cuota propia — pMercado() la deriva
   sumando probabilidades devigadas de 1X2, no de un mercado de dos
   vías. Se aproxima con 1/pm (la implícita de esa combinación, sin
   margen propio): no es exacta, pero esos mercados casi nunca llegan
   a marcarse, así que la aproximación no pesa. */
function cuotaUsada(op, pq, mk, mx){
  if(op.req){
    if(op.req.length===1){
      const k = op.req[0];
      const c = k==="L" ? mk.local : k==="E" ? mk.empate : mk.visitante;
      return c>1 ? c : null;
    }
    const pm = pMercado(op, pq, mk, mx);
    return pm>0 ? 1/pm : null;
  }
  if(op.linea!=null){
    const gx = mx && mx.goles && mx.goles[String(op.linea)];
    if(gx && gx.length===2) return op.lado==="over" ? gx[0] : gx[1];
    if(mk && mk.totalLinea===op.linea && mk.totalOver && mk.totalUnder)
      return op.lado==="over" ? mk.totalOver : mk.totalUnder;
    return null;
  }
  if(op.id==="btts_si") return mx && mx.btts && mx.btts.si>1 ? mx.btts.si : null;
  if(op.id==="btts_no") return mx && mx.btts && mx.btts.no>1 ? mx.btts.no : null;
  return null;
}

/* ══════════════════════════════════════════════════════════════════
   NUESTRA LECTURA — una sola por partido

   Toda la app cuelga de acá. La escalera de riesgo son tres formas de
   jugar LA MISMA lectura, no tres opiniones distintas.
   ══════════════════════════════════════════════════════════════════ */
function lectura(m){
  const M = matrix(m.lh, m.la, m.rho);
  const p = {L:sumIf(M,(i,j)=>i>j), E:sumIf(M,(i,j)=>i===j), V:sumIf(M,(i,j)=>i<j)};
  const lean = ["L","E","V"].reduce((a,b)=> p[a]>=p[b]?a:b);
  const goles = m.lh + m.la;
  const nombre = lean==="L" ? m.home : lean==="V" ? m.away : null;

  let titulo, cuerpo, corto;
  const claro = p[lean] >= 0.50;
  /* Sin muestra, la prosa tampoco publica el número. Se escapaba por
     acá: el Veredicto y la portada ya decían SIN MUESTRA mientras el
     encabezado de Lectura seguía diciendo "es el más probable con 42%"
     — la misma probabilidad, en palabras. Un número dicho en prosa es
     un número publicado.

     Solo se tocan `titulo`/`cuerpo`/`corto`: `p` y `M` siguen igual
     porque los usan `escalera()`, `otrosMercados()` y `alerta()`, y
     cambiarlos acá movería el motor desde la capa de presentación. */
  if(sinMuestra(m)){
    const n = partidosJugados(m);
    return {M, p, lean, nombre, goles,
      titulo: "Todavía no hay con qué leer este partido",
      cuerpo: `Se llevan jugadas ${n} fecha${n===1?"":"s"} y hacen falta ${MIN_PARTIDOS}. Con esa
        muestra las fuerzas se ajustan sobre nada: un grande y un recién ascendido salen
        parecidos, así que no publicamos probabilidades.`,
      corto: `<b>Sin muestra</b> — ${n} fecha${n===1?"":"s"} jugadas, hacen falta ${MIN_PARTIDOS}.`,
      parejo: false, claro: false};
  }
  /* Con el más probable abajo de 40% no hay favorito, aunque uno saque
     algún punto de ventaja. Decir "llega mejor" con un 38% sería vender
     una diferencia que no existe. */
  if(lean==="E" || p[lean] < 0.40){
    titulo = "Partido parejo, sin favorito claro";
    cuerpo = `Ninguno de los dos saca diferencia en los números: le damos ${pc(p.L)} a ${m.home}, ${pc(p.E)} al empate y ${pc(p.V)} a ${m.away}.`;
    corto  = `<b>Partido parejo</b> — ninguno de los tres resultados pasa de ${pc(p[lean])}.`;
  } else if(claro && goles < 2.4){
    titulo = `${nombre} lo controla, pero sin goleada`;
    cuerpo = `Le damos ${pc(p[lean])} de ganar, y esperamos pocos goles: ${goles.toFixed(1)} entre los dos.`;
    corto  = `${esc_(nombre)} lo controla, pero con pocos goles — le damos <b>${pc(p[lean])}</b>.`;
  } else if(claro){
    titulo = `${nombre} es favorito y el partido pinta abierto`;
    cuerpo = `Le damos ${pc(p[lean])} de ganar, con ${goles.toFixed(1)} goles esperados entre los dos.`;
    corto  = `${esc_(nombre)} es favorito y pinta abierto — le damos <b>${pc(p[lean])}</b>.`;
  } else {
    titulo = `${nombre} llega mejor, pero no lo damos por hecho`;
    cuerpo = `Es el más probable con ${pc(p[lean])}, aunque el empate (${pc(p.E)}) sigue muy vivo.`;
    corto  = `${esc_(nombre)} llega mejor, sin darlo por hecho — le damos <b>${pc(p[lean])}</b>.`;
  }
  /* `parejo` y `claro` son las mismas cuatro ramas de arriba, expuestas
     para que el sello de la portada diga exactamente lo mismo que la
     prosa. Si el sello tuviera su propio criterio, un día la tarjeta
     diría "FAVORITO" arriba y "partido parejo" abajo. */
  return {M, p, lean, nombre, goles, titulo, cuerpo, corto,
          parejo: lean==="E" || p[lean] < 0.40, claro};
}

/* La regla de alineación: nada contradice nuestra propia lectura.
   Los mercados de goles no opinan sobre quién gana — nunca contradicen. */
const contradice = (op, lean) => !!op.req && !op.req.includes(lean);

/* ══════════════════════════════════════════════════════════════════
   ESCALERA DE RIESGO

   Un pick por franja. La ventaja se usa para elegir SOLO dentro de la
   banda creíble: una diferencia de +53pp contra la línea no es una
   oportunidad encontrada, es el modelo equivocado, y elegir por ahí
   es elegir justo el pick con más chance de estar mal.
   ══════════════════════════════════════════════════════════════════ */
/* ¿Estos dos mercados pueden pasar los dos en el mismo partido?

   No se calcula con una lista de pares escrita a mano —se recorren los
   marcadores posibles y se busca uno donde los dos tests den verdadero.
   Si no existe ninguno, son incompatibles. Así queda exacto y no hay
   una tabla que se desactualice cuando se agregue un mercado nuevo.

   Existe porque la escalera se contradecía: elegía cada franja por
   separado y terminaba recomendando "Más de 1.5" arriba y "Menos de
   1.5" abajo. Medido sobre los 20 partidos del 2026-08-23: pasaba en
   3 (15%). Recomendar las dos es pedirle al usuario que apueste a que
   algo pasa y a que no pasa. */
function incompatibles(idA, idB){
  const a = TESTS[idA], b = TESTS[idB];
  if(!a || !b || idA === idB) return false;
  /* 9 goles por lado cubre cualquier marcador de fútbol real; la
     matriz del modelo usa el mismo rango. */
  for(let i=0; i<=9; i++)
    for(let j=0; j<=9; j++)
      if(a(i,j) && b(i,j)) return false;   // hay un marcador que cumple los dos
  return true;
}

/* Las líneas de gol que compiten por un lugar en la escalera. Las
   demás (0.5, 4.5, 5.5, 6.5) existen en mercados() para dar cobertura
   real en Otros Mercados y Herramientas, pero acá quedan afuera.

   Por qué: `mercados()` creció de 3 líneas a 7 el 2026-08-26, y eso
   multiplicó los candidatos de Goles a 14 contra 8 de Resultado+Ambos
   juntos. Cuando ninguno es "creíble", el paso de abajo elige el más
   cercano al centro de cada franja ENTRE TODOS mezclados — con 14
   candidatos de un lado, Goles gana casi siempre por cantidad, no por
   calidad. Medido: 115 de 135 franjas eran Goles (85%), y como
   consecuencia combinada() — que necesita una pata de Resultado — dejó
   de generar en 42 de 45 partidos (93%). Restringir acá arregla las
   dos cosas de una vez, sin sacarle cobertura a las otras pantallas. */
const LINEAS_ESCALERA = new Set([1.5, 2.5, 3.5]);

/* La idea que expresa un mercado, para no recomendar la misma dos
   veces con otro número. Un3.5/un2.5/un1.5 son "pocos goles" dicho
   tres formas; ov1.5/ov2.5/ov3.5 son "muchos goles" tres veces. Para
   Resultado, el conjunto de resultados que paga (L, E, V o una
   combinación) es la idea — 1x2_l y dc_lx pagan casi lo mismo. */
const temaDe = o => o.req ? o.fam+":"+[...o.req].sort().join("")
              : o.lado  ? o.fam+":"+o.lado
              : o.fam+":"+o.id;

function escalera(m){
  const lec = lectura(m);
  const mk  = m.mercado || {};
  const mx  = m.mercadoExtra || {};
  const pq  = devig(mk);
  /* SOLO Resultado, y con piso de cuota. Las dos reglas salen de la
     misma queja: "recomienda menos de 1.5 goles en un partido que
     terminó 5-2" y "recomienda cuotas de mierda".

     Solo Resultado porque es el único eje donde el modelo tiene
     información demostrada. `medir_ejes.py`, 10.410 partidos, aporte
     sobre la tasa base de cada mercado:

         Resultado   +2.6% (arg)   +13.2% (eng)
         Goles       −0.9% a +0.4%
         Ambos       −0.4% a +0.6%

     Dixon-Coles modela goles, sí, pero lo que estima bien es la
     RELACIÓN entre los dos λ (quién es mejor), no la SUMA (cuánto se
     va a jugar). La relación es una propiedad estable del equipo; la
     suma depende de si alguien se pone adelante y se cierra, del
     ritmo, de qué se juega cada uno — nada de eso está en el historial
     de goles. Recomendar goles era vender lo que no sabemos.

     El piso de cuota mata las recomendaciones a 1.10, que con 7.7% de
     margen no dejan nada.

     Y las dos juntas arreglan un tercer problema sin tocarlo: con todo
     sobre el mismo eje, más probabilidad implica menos cuota siempre.
     Se acabó el "Arriesgada: gana River, paga 1.61" mientras "Lo más
     probable" pagaba 1.17 — eso pasaba por mezclar ejes con escalas de
     precio distintas, y hacía que la etiqueta de riesgo mintiera.

     Goles y Ambos marcan siguen enteros en "Otros mercados": se pueden
     mirar, no se recomiendan. */
  const ops = mercados(lec.M, m).filter(o=>{
    if(o.fam !== "Resultado") return false;
    const c = cuotaUsada(o, pq, mk, mx);
    return c == null || c >= CUOTA_MIN_ESCALERA;
  });

  /* La dirección contra la que se alinea sale del análisis humano. Si
     todavía no hay análisis cargado se cae al lean del modelo, porque
     la escalera igual se muestra en esos partidos (para que el usuario
     vea lo que dice el modelo) — pero ahí no se marca valor, y eso lo
     decide marcaDeValor(), que exige inclinación. */
  const dir = inclinacionDe(m.id) || lec.lean;

  /* Lo que ya eligieron las franjas de arriba. Las franjas se recorren
     de la más probable a la más arriesgada, así que la que manda es la
     más segura: si ya se recomendó "Más de 1.5", el escalón de abajo no
     puede ofrecer "Menos de 1.5". */
  const yaElegidos = [];
  /* Qué tema (familia+lado) ya ganó una franja anterior de ESTE
     partido. Sin esto, tres líneas de gol del mismo lado (un3.5, un2.5,
     un1.5) pueden dar ventaja real las tres a la vez — cada una cae en
     su propia franja de probabilidad por construcción — y la escalera
     termina recomendando "pocos goles" tres veces con otro número,
     nunca la lectura de Resultado ni Ambos Marcan. Medido: con las tres
     líneas dando ventaja real, pasaba en 24 de 34 partidos. Aplica
     ANTES de separar el camino con ventaja real del de cercanía al
     centro — antes solo protegía al segundo, y el primero es donde
     pasaba el caso real (Sarmiento-Unión: tres "menos de X goles"
     recomendados a la vez). Preferí un tema sin usar si hay una opción
     ahí; recién si no hay, volvé al pool entero — una franja sin
     candidato es peor que repetir tema. */
  const temasUsados = new Set();

  /* UN SOLO mercado de goles por escalera, y es una regla de producto
     con dos motivos medidos detrás.

     1. Sin esto la escalera podía mostrar "más de 1.5" arriba y "menos
        de 2.5" abajo, que juntas significan **exactamente 2 goles** —
        una tesis que nadie eligió, y que salía de que cada franja
        elegía por su cuenta. `incompatibles()` no lo agarra, y hace
        bien: esos dos mercados sí pueden pasar juntos. El problema no
        es la contradicción lógica sino que la combinación no tiene
        sentido como recomendación. Medido sobre la grilla real:
        pasaba en 15 de 49 partidos (31%).

     2. `medir_ejes.py` (6270 partidos de arg, 4140 de eng): sobre la
        tasa base de cada mercado, Goles aporta entre −0.9% y +0.4%
        mientras Resultado aporta +2.6% en arg y +13.2% en eng. **El
        modelo no sabe nada sobre cuántos goles habrá.** Llenar la
        escalera de goles era destacar justo el eje donde menos
        sabemos.

     No se prohíben del todo: un mercado de goles puede ser lo único
     razonable de una franja, y una franja vacía es peor. Se limita a
     uno. */
  let golesUsados = 0;

  const filas = FRANJAS.map(f=>{
    const candTodos = ops.filter(o=> o.p>=f.lo && o.p<f.hi && !contradice(o, dir)
                                && !yaElegidos.some(id=> incompatibles(id, o.id))
                                && !(golesUsados && o.fam==="Goles"));
    const sinRepetir = candTodos.filter(o=> !temasUsados.has(temaDe(o)));
    const cand = sinRepetir.length ? sinRepetir : candTodos;
    if(!cand.length) return {franja:f, op:null};

    const conV = cand.map(o=>{
      const pm = pMercado(o, pq, mk, mx);
      return {o, v: pm==null ? null : o.p - pm};
    });
    const creibles = conV.filter(x=> x.v!=null && x.v>=VENTAJA_MIN && x.v<=VALOR_MAX)
                         .sort((a,b)=> b.v - a.v);
    let elegido, ventaja;
    if(creibles.length){
      elegido = creibles[0].o; ventaja = creibles[0].v;
    } else {
      /* Sin ventaja real que decida, manda DÓNDE SABEMOS. Medido con
         `medir_ejes.py` sobre 10.410 partidos, aporte sobre la tasa
         base de cada mercado:

             Resultado   +2.6% (arg)   +13.2% (eng)
             Goles       −0.9% a +0.4%
             Ambos       −0.4% a +0.6%

         O sea que el modelo sabe quién gana y no sabe cuántos goles
         hay. Elegir por "cercanía al centro de la franja" entre todos
         mezclados hacía que Goles ganara casi siempre —se reparten
         suave por toda la probabilidad— y la escalera terminaba
         destacando justo el eje donde no aportamos, con el 1X2
         relegado a "Otros mercados".

         Esto solo rige en el camino SIN ventaja real: si un mercado de
         goles tiene ventaja medida y el de Resultado no, la ventaja
         sigue mandando (Regla 2, el valor se marca aparte). */
      const centro = (f.lo+f.hi)/2;
      const resultado = cand.filter(o=> o.fam==="Resultado");
      const pool = resultado.length ? resultado : cand;
      elegido = pool.reduce((a,b)=> Math.abs(a.p-centro)<=Math.abs(b.p-centro)?a:b);
      const pm = pMercado(elegido, pq, mk, mx);
      ventaja = pm==null ? null : elegido.p - pm;
    }
    temasUsados.add(temaDe(elegido));
    if(elegido.fam === "Goles") golesUsados++;
    const cuota = cuotaUsada(elegido, pq, mk, mx);
    const valor = !ligaSinValor(m) && !sinMuestra(m)
                  && ventaja!=null && ventaja>=VALOR_MIN && ventaja<=VALOR_MAX
                  && cuota!=null && cuota>=CUOTA_MIN_VAL;
    yaElegidos.push(elegido.id);
    return {franja:f, op:elegido, ventaja, valor};
  });

  /* Una sola marca por partido: la de mayor ventaja. Tres escalones
     dorados no son tres oportunidades, son la señal perdiendo sentido —
     si todo está marcado, marcar no dice nada. */
  const marcables = filas.filter(x=> x.valor).sort((a,b)=> b.ventaja - a.ventaja);
  marcables.slice(1).forEach(x=> x.valor = false);
  return filas;
}

/* ══════════════════════════════════════════════════════════════════
   OTROS MERCADOS

   La escalera elige un mercado por franja de riesgo, por ventaja — no
   por familia. Alguien que juega siempre 1X2, o siempre doble
   oportunidad, puede no ver nunca su mercado ahí aunque el número
   exista. Esta lista muestra TODOS los mercados elegibles con nuestra
   lectura, sin filtrar por franja — pero sin inventar una marca de
   valor nueva: sigue habiendo una sola por partido, la misma que ya
   eligió escalera(). Por eso el gate es el mismo que en el render de
   Pronósticos: hace falta análisis cargado, no alcanza con el lean
   del modelo.
   ══════════════════════════════════════════════════════════════════ */
/* Cuándo avisar que el modelo y el análisis humano no coinciden. Sin
   esto, "Nuestra lectura" de Pronósticos puede nombrar a un equipo y
   "Hacia dónde inclina" de Análisis nombrar al otro — dos lecturas
   separadas a propósito (esa es la regla de alineación), pero nada se
   lo explica al usuario si no hay un aviso puntual para ese caso.
   Devuelve null cuando coinciden o cuando no hay análisis cargado: en
   ese último caso "Nuestra lectura" ya es lo único que hay. */
function divergen(m){
  const dirHumana = inclinacionDe(m.id);
  if(!dirHumana) return null;
  const dirModelo = lectura(m).lean;
  return dirHumana === dirModelo ? null : {dirHumana, dirModelo};
}

/* Cuándo la lectura del DESARROLLO (cómo se va a jugar el partido)
   contradice a los mercados de goles/ambos que la escalera considera.
   A diferencia de divergen(), esto no es dirección: es la señal
   estructural del desarrollo (senal) contra las LÍNEAS de goles y de
   ambos marcan. Devuelve null cuando no hay tensión (sin desarrollo,
   senal incierto/ausente, o senales coherentes). La contradicción NO
   se oculta: el frontend la muestra etiquetada y solo deja de marcar en
   dorado la opción en conflicto. */
function senalDividida(m){
  const a = ANALISIS[m.id];
  const s = a && a.desarrollo && a.desarrollo.senal;
  if(!s) return null;
  let fenom = null, opciones = [];
  /* Mira "Otros mercados", no la escalera: desde el 2026-08-31 la
     escalera es solo de Resultado y ahí no hay goles que contradecir.
     La tensión que esta función detecta sigue existiendo — el análisis
     dice "partido trabado" y el modelo ve valor en goles altos — solo
     que ahora vive en la lista de abajo. */
  const filas = otrosMercados(m).filter(x=> x.esVal).map(x=> x.op);
  if(s.ritmo_goleador === "bajo" || s.estructura === "trabado"){
    const ops = filas.filter(o=> o.fam==="Goles" && o.lado==="over" && o.linea>=2.5);
    if(ops.length){ if(!fenom) fenom = "goles"; opciones.push(...ops.map(o=>o.id)); }
  }
  if(s.ambos_marcan === "poco_probable"){
    const ops = filas.filter(o=> o.id==="btts_si");
    if(ops.length){ if(!fenom) fenom = "ambos"; opciones.push(...ops.map(o=>o.id)); }
  }
  return fenom ? {fenom, dir: fenom==="goles" ? "pocos" : "no", opciones} : null;
}

/* Antes esta función solo repetía el pick de escalera() con otro
   nombre: marcaba UNA fila, la que ya había ganado su franja, y nada
   más — aunque otra fila tuviera ventaja real (goles extra, ambos
   marcan) por su cuenta. Eso tenía sentido cuando casi ningún mercado
   fuera de 1X2 tenía precio real: `ventaja` daba `null` en casi todos
   lados y la restricción no se notaba. Con mercadoExtra ya no es así,
   y el pie de esta pantalla venía prometiendo "marcamos en dorado
   cuando el precio está a favor" para cada fila — una promesa que el
   código no cumplía. Ahora cada fila se evalúa con el mismo criterio
   que usa escalera() (ventana [VENTAJA_MIN, VALOR_MAX], regla de
   alineación, análisis cargado), no solo la que ganó su franja. */
function otrosMercados(m){
  const lec = lectura(m);
  const todos = mercados(lec.M, m);
  const mk  = m.mercado || {};
  const mx  = m.mercadoExtra || {};
  const pq  = devig(mk);
  const dir = inclinacionDe(m.id);
  /* Una línea de gol donde un lado paga casi 1 no es un mercado — ver
     CUOTA_MIN_MOSTRAR. Se descarta la línea ENTERA (los dos lados), no
     solo el lado carísimo: mostrar "más de 7.5 paga 34.00" sin su
     contraparte sería mostrar la mitad de algo que ya se sabe inútil. */
  const lineasRuido = new Set(
    todos.filter(o=> o.fam==="Goles")
         .filter(o=> { const c = cuotaUsada(o, pq, mk, mx); return c!=null && c < CUOTA_MIN_MOSTRAR; })
         .map(o=> o.linea)
  );
  const ops = todos.filter(o=> o.fam!=="Goles" || !lineasRuido.has(o.linea));
  return ops.map(o=>{
    const pm = pMercado(o, pq, mk, mx);
    const ventaja = pm==null ? null : o.p - pm;
    /* VALOR_MIN, no VENTAJA_MIN: acá se decide si SE MARCA en dorado,
       no si un candidato es aceptable para competir dentro de su
       franja — es la misma vara que usa escalera() para su propio
       `valor`. Y el mismo piso de cuota: sin eso, cualquier fila con
       una probabilidad cercana a 100% (típico en líneas de gol lejos
       del promedio) se marca aunque pague centavos. */
    const cuota = cuotaUsada(o, pq, mk, mx);
    const esVal = !ligaSinValor(m) && !sinMuestra(m) && !!dir && !contradice(o, dir)
                  && ventaja!=null && ventaja>=VALOR_MIN && ventaja<=VALOR_MAX
                  && cuota!=null && cuota>=CUOTA_MIN_VAL;
    return {op:o, ventaja, esVal};
  });
}

/* Combinada del partido: dos patas de familias distintas, con la
   probabilidad conjunta EXACTA sobre la matriz. Multiplicar las dos
   probabilidades por separado da un número más chico y falso — las
   dos patas del mismo partido están correlacionadas. */
function combinada(m){
  /* La pata de Resultado sale de la escalera (que ahora es solo de
     Resultado); la segunda, de mercados() directamente. Antes las dos
     salían de la escalera, y eso dejó de funcionar cuando la escalera
     se restringió a un solo eje. Una combinada de dos patas del mismo
     eje no sirve: "gana River" + "River gana o empata" es la misma
     apuesta dos veces. */
  const lec = lectura(m);
  const esc = escalera(m).filter(x=>x.op);
  const res = esc.find(x=> x.op.fam==="Resultado");
  if(!res || res.op.p<0.5) return null;
  const otra = mercados(lec.M, m)
    .filter(o=> o.fam!=="Resultado" && o.p>=0.45 && o.p<=0.80)
    .sort((a,b)=> Math.abs(a.p-0.6) - Math.abs(b.p-0.6))[0];
  if(!otra) return null;
  const pExacta = sumIf(lec.M, (i,j)=> res.op.test(i,j) && otra.test(i,j));
  const pIngenua = res.op.p * otra.p;
  if(pExacta < 0.25) return null;
  return {patas:[res.op, otra], p:pExacta, ingenua:pIngenua};
}

/* Alerta: el mercado le da bastante más que nosotros a nuestra propia
   lectura. Traducido: el precio ya está mejor de lo que vemos justo. */
function alerta(m){
  const lec = lectura(m), pq = devig(m.mercado);
  if(!pq) return null;
  /* "El precio está en contra" es una afirmación sobre NUESTRO número:
     dice que el mercado le da más que nosotros. Sin muestra no hay
     nuestro número, así que tampoco hay alerta — publicarla sería
     publicar la misma probabilidad por la puerta de atrás, y encima
     con cara de aviso. Se vio en Manchester City vs Coventry: la
     portada decía "el precio está en contra" en un partido donde ya
     habíamos decidido no opinar. */
  if(sinMuestra(m)) return null;
  const d = pq[lec.lean] - lec.p[lec.lean];
  return d >= ALERTA_MIN ? {lean:lec.lean, dif:d, nombre:lec.nombre} : null;
}

/* ══════════════════════════════════════════════════════════════════
   REGLA DE ALINEACIÓN, segunda mitad

   Para que "nada contradice nuestra lectura" signifique algo, la
   lectura tiene que venir de donde el modelo NO llega: el análisis
   cualitativo. Si la produjera el propio modelo, filtrar por
   alineación sería circular — el modelo dándose la razón a sí mismo.
   De ahí: solo se marca valor en partidos con análisis cargado.
   ══════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════
   LA LECTURA HUMANA

   Método le promete al usuario que la regla de alineación compara
   contra una lectura que NO sale del modelo: "si esa lectura la
   produjera el mismo modelo que después dice dónde hay valor, sería el
   modelo dándose la razón a sí mismo".

   Eso vive acá. `inclinacion` es la dirección que declara el análisis
   cargado a mano en data/analisis.json — "L", "E" o "V". No es una
   probabilidad: el analista dice para dónde inclina el partido y el
   modelo pone el número.

   Un análisis sin `inclinacion` no sirve para la regla, por más bien
   escrito que esté: no hay contra qué alinear. Por eso `analizado()`
   la exige, y sin ella el partido no marca valor.
   ══════════════════════════════════════════════════════════════════ */
const DIRECCIONES = ["L","E","V"];
function inclinacionDe(id){
  const a = ANALISIS[id];
  return a && DIRECCIONES.includes(a.inclinacion) ? a.inclinacion : null;
}
/* "Analizado" para la app = tiene dirección declarada. Que además haya
   prosa cargada es lo que se muestra en la pestaña Análisis, pero no es
   lo que habilita la marca. */
const analizado = id => inclinacionDe(id) !== null;
/* Hay prosa para mostrar, con o sin dirección. */
/* "a Aldosivi", pero "al empate": la preposición se contrae con el
   artículo. Estaba escrita fija en dos frases distintas y las dos decían
   "a el empate". Vive acá para arreglarse una sola vez. */
const aQuien = (dir, m) =>
  dir === "E" ? "al <b>empate</b>"
  : `a <b>${esc_({L:m.home, V:m.away}[dir] || "")}</b>`;
const hayProsa = id => { const a=ANALISIS[id];
  return !!(a && (a.contexto || a.veredicto || a.local || a.visitante ||
                  (a.desarrollo && a.desarrollo.texto))); };

/* La marca de valor de la portada y de la cabecera del partido: la más
   estricta de la app. Solo la línea 1X2, solo sobre la dirección que
   declaró el análisis humano, solo dentro de la banda, y solo si no hay
   alerta encendida. Devuelve la clave marcada o null.

   Estaba escrita dos veces, en tarjeta() y en viewPartido(), y las dos
   copias calculaban sobre el lean del MODELO. Eso hacía que la app
   marcara valor a favor de su propia opinión — justo lo que Método dice
   que no hace. Una sola función, y sobre la lectura humana. */
function marcaDeValor(m){
  if(ligaSinValor(m)) return null;   // medido que ahí resta — ver LIGAS_SIN_VALOR
  if(sinMuestra(m)) return null;     // el número saldría de 2 fechas — ver MIN_PARTIDOS
  const dir = inclinacionDe(m.id);
  if(!dir) return null;
  const pq = devig(m.mercado || {});
  if(!pq || alerta(m)) return null;
  const dif = lectura(m).p[dir] - pq[dir];
  return (dif >= VALOR_MIN && dif <= VALOR_MAX) ? dir : null;
}

/* ══════════════════════════════════════════════════════════════════
   LECTURA POR EJES — el contrato

   Un partido son varios ejes (quién gana, cuántos goles, quién ataca
   más, cuánto se corta el juego, los jugadores, el contexto) y en cada
   uno sabemos DISTINTO. La app venía midiendo todo con una sola
   pregunta —"¿le gana al precio de cierre?"— que es la vara de una
   recomendación de apuesta y no la de un análisis. Con esa vara se
   cerraron córners, tarjetas y remates por jugador, que pertenecían a
   la otra.

   Acá hay dos varas:

     1. ¿el número es verdadero?   → calibración → se MUESTRA
     2. ¿le gana al precio?        → CLV y ROI   → se MARCA

   Y las dos reglas duras que hacen que eso sea estructura y no
   disciplina (`test_ejes.js` las ata):

     · un eje sin `medido_por` no puede declarar más que `sin_medir`;
     · solo `confianza === "con_plata"` puede llevar `apuesta`, que es
       lo único que después se pinta de mostaza.

   `construirEjes()` es PURO a propósito: recibe los números ya
   calculados en vez de volver a correr el motor. El motor tiene una
   sola implementación —regla de CLAUDE.md— y este contrato no la toca.

   La región está marcada porque `test_ejes.js` la lee tal cual, igual
   que `test_registro.js` con la resolución. Si la movés o le cambiás
   el nombre, la suite deja de encontrarla: es a propósito.
   ══════════════════════════════════════════════════════════════════ */
/* ==== INICIO EJES ==== */
/* De menos a más, y el orden IMPORTA: es lo que permite bajar una
   confianza sin poder subirla.

   `mal_calibrada` se agregó el 2026-08-31 con el eje Jugadores, y llena
   un hueco real: "remates" está medido —618 casos— y el resultado es
   que se desvía 2.09 veces lo que explica el azar. Declararlo
   `sin_medir` sería mentir por omisión (sí se midió) y `calibrada`
   sería mentir a secas. Es su propio estado: sabemos, y lo que sabemos
   es que ese número no es de fiar. */
const CONFIANZAS = ["sin_medir", "mal_calibrada", "calibrada", "con_plata"];

const CONTRATO = ["eje", "titulo", "estimacion", "ancla", "medido_por",
                  "confianza", "aporte", "mercado", "lectura", "apuesta"];

/* Qué sabemos de cada eje, y quién lo midió. Esta tabla es el registro
   honesto del proyecto: si un eje no está acá con su script, la app lo
   declara sin medir sola. `aporte` es el % de Brier que le sacamos a la
   tasa base de ese mismo mercado, por liga y solo donde se midió — un
   número de otra liga NO se hereda. */
const MEDICIONES = {
  resultado: {
    medido_por: "medir_ejes.py",
    confianza:  "calibrada",       // sabe, pero el CLV contra Bet365 es cero
    aporte:     {"arg.1": 2.6, "eng.1": 13.2},
  },
  volumen: {
    medido_por: "medir_ejes.py",
    confianza:  "calibrada",
    // Techo de varianza explicable por λ: 7.2% en eng, 5.5% en arg.
    // El aporte medido va de -0.9% a +0.4%: dentro del ruido.
    aporte:     {"arg.1": -0.9, "eng.1": 0.4},
  },
  dominio: {
    medido_por: "medir_dominio.py",
    confianza:  "calibrada",
    // % de error cuadrático que le sacamos a la media de la liga, en
    // test temporal (2026-08-31). Solo eng y fra: la fuente no trae
    // estadísticas por partido de arg ni bra, así que ahí no hay
    // medición — y `por_liga` hace que la app lo diga sola en vez de
    // heredar el número de Inglaterra.
    por_liga:   true,
    aporte:     {"eng.1": {remates: 9.9, al_arco: 7.3, corners: 4.8},
                 "fra.1": {remates: 7.0, al_arco: 9.1, corners: 2.9}},
  },
  contexto: {
    // El único eje que no calcula nadie: lo escribe la skill
    // `valor-analisis-inclinacion` a mano, en `data/analisis.json`.
    medido_por: "medir_analisis.py",
    // `sin_medir` a propósito, y no es pereza. La última medición
    // encontró que la skill inclinaba al local el 69% de las veces
    // contra el 45% que corresponde. Eso se corrigió el 2026-08-30 y
    // NO se volvió a medir: hace falta una fecha nueva de análisis
    // escritos con la skill corregida. Declarar "calibrada" con la
    // corrección sin verificar sería exactamente el error que este
    // contrato existe para impedir.
    confianza:  "sin_medir",
  },
  jugadores: {
    medido_por: "medir_jugadores.py",
    // El techo del eje. Cuánto vale cada métrica adentro sale de
    // `data/calibracion_jugadores.json`, que lo mide contra el RUIDO y
    // no contra cero: con 618 predicciones un modelo perfecto ya se
    // desvía 3.5 puntos por azar. Hoy: goles y asistencias bien,
    // al arco regular, remates mal (2.09 veces el ruido).
    confianza:  "calibrada",
  },
};

/* El sello. Nadie construye un eje a mano: todos pasan por acá, y acá
   es donde las dos reglas se aplican una sola vez. */
function sellar(id, liga, campos){
  const med = (MEDICIONES || {})[id] || {};
  const declarada = CONFIANZAS.indexOf(med.confianza) >= 0 ? med.confianza : "sin_medir";
  const aporte = (med.aporte && liga && Object.prototype.hasOwnProperty.call(med.aporte, liga))
                 ? med.aporte[liga] : null;
  /* `por_liga` es para las mediciones que NO se hicieron en todas las
     ligas: Dominio se midió en eng y fra porque la fuente solo trae
     estadísticas por partido de esas dos. Sin medición en la liga del
     partido, el eje se declara sin medir en vez de heredar el número de
     otra — es la misma regla que se aprendió a los golpes con
     `parametros_metricas()` mezclando competiciones. */
  const hayLiga = !med.por_liga || aporte !== null;
  let confianza = (med.medido_por && hayLiga) ? declarada : "sin_medir";
  /* El que llama puede BAJAR la confianza, nunca subirla. Lo necesita el
     eje Jugadores: la tabla dice qué se midió, pero cuánto vale depende
     de la métrica que se muestre (goles calibra bien, remates mal), y
     eso solo lo sabe quien arma el eje. Que solo se pueda bajar es lo
     que mantiene la regla en pie: nadie se declara más confiable de lo
     que la medición permite. */
  const pedida = CONFIANZAS.indexOf((campos || {}).confianza);
  if(pedida >= 0 && pedida < CONFIANZAS.indexOf(confianza)) confianza = CONFIANZAS[pedida];
  const c = campos || {};
  return {
    eje:        id,
    titulo:     c.titulo || "",
    estimacion: c.estimacion || null,
    ancla:      c.ancla || null,
    medido_por: med.medido_por || null,
    confianza:  confianza,
    aporte:     aporte,
    mercado:    c.mercado || null,
    lectura:    c.lectura || null,
    // Regla 2, en una línea: sin plata medida no hay apuesta que valga.
    apuesta:    confianza === "con_plata" ? (c.apuesta || null) : null,
  };
}

/* Los ejes de un partido. Hoy dos —los que ya existían, reempaquetados—
   y por eso en pantalla no cambia nada todavía: primero se prueba el
   contrato, después se cuelgan los ejes nuevos. */
function construirEjes(datos){
  const d = datos || {};
  const ejes = [
    sellar("resultado", d.liga, {
      titulo:     "Quién gana",
      estimacion: d.probs || null,
      mercado:    d.mercado || null,
    }),
    sellar("volumen", d.liga, {
      titulo:     "Cuántos goles",
      estimacion: d.goles || null,
      mercado:    d.mercadoGoles || null,
    }),
  ];
  /* Dominio solo si hay estadísticas de los dos equipos. Un eje a medias
     —con el local y sin el visitante— es peor que no mostrarlo: invita a
     comparar contra un hueco. */
  if(d.dominio && d.dominio.local && d.dominio.visita){
    ejes.push(sellar("dominio", d.liga, {
      titulo:     "Quién ataca más",
      estimacion: d.dominio,
      ancla:      d.anclaDominio || null,
      /* La escribe la skill del mercado de estadísticas. Es texto, no
         un número: no puede subir la confianza del eje ni habilitar una
         apuesta — `sellar()` no se lo permitiría de todos modos. */
      lectura:    (d.estadisticas || {}).dominio || null,
    }));
  }
  /* Jugadores baja al peor nivel de las métricas que efectivamente
     muestra: si en pantalla va a estar remates —medido y mal—, el eje
     no puede decirse calibrado. */
  if(d.jugadores && d.jugadores.length){
    ejes.push(sellar("jugadores", d.liga, {
      titulo:     "Quién puede marcar y quién puede rematar",
      estimacion: d.jugadores,
      ancla:      d.calibracionJugadores || null,
      confianza:  d.confianzaJugadores || null,
      lectura:    (d.estadisticas || {}).jugadores || null,
    }));
  }
  /* Contexto es el único eje cuya `lectura` viene llena: los demás la
     dejan en null porque el texto lo compone la pantalla, y acá el
     texto ES el dato — lo escribió una persona con una skill. */
  if(d.contexto && d.contexto.inclinacion){
    ejes.push(sellar("contexto", d.liga, {
      titulo:     "Quién falta, cómo llega, qué se juega cada uno",
      estimacion: {inclinacion: d.contexto.inclinacion,
                   actualizado: d.contexto.actualizado || null},
      lectura:    d.contexto.veredicto || d.contexto.contexto || null,
    }));
  }
  return ejes;
}
/* ==== FIN EJES ==== */

/* ══════════════════════════════════════════════════════════════════
   HELPERS DE PRESENTACIÓN
   ══════════════════════════════════════════════════════════════════ */
const pc = p => Math.round(p*100)+"%";
const esc_ = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plata = n => "$"+Math.round(n).toLocaleString("es-AR");
const DIAS = ["DOM","LUN","MAR","MIÉ","JUE","VIE","SÁB"];
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fechaDe(iso){ const [a,m,d]=iso.split("-").map(Number); return new Date(a,m-1,d); }
/* `px` sobreescribe el tamaño cuando el contexto lo pide (20 en la
   cabecera de un bloque, 15 en una fila). Todo escudo lleva onerror:
   ESPN devuelve 404 para varios equipos chicos y un ícono roto en cada
   fila se ve peor que el hueco. */
function crest(url, px){
  const st = px ? ` style="width:${px}px;height:${px}px;flex-basis:${px}px"` : "";
  return url ? `<img class="crest" src="${esc_(url)}"${st} alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
             : `<span class="crest ph"${st}></span>`;
}
/* ESPN devuelve "Group B" en inglés para todo. En la liga local eso es
   una zona del torneo; en copas es un grupo. */
function grupoEs(g, comp){
  if(!g) return "";
  const letra = (g.match(/Group\s+([A-Z])/i)||[])[1];
  if(!letra) return g;
  return (/profesional/i.test(comp) ? "Zona " : "Grupo ") + letra;
}
/* "se da 3 de cada 4 veces" — la probabilidad dicha como la diría una persona */
function cadaCuanto(p){
  const opciones = [[0.9,"9 de cada 10"],[0.83,"5 de cada 6"],[0.78,"4 de cada 5"],
    [0.72,"3 de cada 4"],[0.64,"2 de cada 3"],[0.57,"3 de cada 5"],[0.47,"1 de cada 2"],
    [0.38,"2 de cada 5"],[0.30,"1 de cada 3"],[0.22,"1 de cada 4"],[0.17,"1 de cada 5"],
    [0.12,"1 de cada 6"],[0,"menos de 1 de cada 8"]];
  const hit = opciones.find(o=> p>=o[0]);
  return "se da "+hit[1];
}

/* ══════════════════════════════════════════════════════════════════
   PANTALLA: FECHA
   ══════════════════════════════════════════════════════════════════ */
function diasDisponibles(){
  const set = [...new Set(MATCHES.map(m=>m.date))].sort();
  return set.map(iso=>{
    const d = fechaDe(iso);
    return {iso, dia:d.getDate(), nombre:DIAS[d.getDay()], n:MATCHES.filter(m=>m.date===iso).length};
  });
}

/* El orden es de casa hacia afuera: primero lo local, después Europa,
   después las copas. Premier y Ligue 1 entraron el 2026-08-25 — son las
   dos únicas ligas donde el mercado de estadísticas de JUGADOR existe y
   además el modelo anda mejor que en Argentina. */
const COMPS_ORDEN = ["Liga Profesional Argentina", "Brasileirão Série A",
  "Premier League", "Ligue 1",
  "CONMEBOL Libertadores", "CONMEBOL Sudamericana"];
const COMPS_CORTO = {"Liga Profesional Argentina":"Liga", "Brasileirão Série A":"Brasil",
  "Premier League":"Premier", "Ligue 1":"Ligue 1",
  "CONMEBOL Libertadores":"Libertadores", "CONMEBOL Sudamericana":"Sudamericana"};

/* ══════════════════════════════════════════════════════════════════
   PORTADA

   La portada NO interpreta. Las etiquetas viejas —"llega mejor",
   "partido parejo"— son lectura, y la lectura vive adentro del partido:
   ponerlas acá obligaba a leer una opinión antes de haber pedido
   ninguna. Cada renglón dice una sola cosa, si hay algo apostable, y la
   franja de arriba cuenta OPORTUNIDADES, no partidos destacados. Si un
   día no hay ninguna, dice cero.
   ══════════════════════════════════════════════════════════════════ */

/* El veredicto de un partido cuesta una matriz de Dixon-Coles y una
   pasada por todos los mercados, y la portada lo necesita para los 17
   partidos del día en cada render. Se memoiza por id: nada de lo que
   entra ahí cambia dentro de una sesión (los datos los trae el cron y
   la cuota manual del usuario no participa de este cálculo). */
const _veredictos = new Map();
function veredictoDe(m){
  if(!_veredictos.has(m.id)) _veredictos.set(m.id, mercadosDeVeredicto(m));
  return _veredictos.get(m.id);
}

/* El estado de un partido en dos palabras, para el renglón de la
   portada. El orden importa: una oportunidad manda sobre un riesgo, y
   un riesgo sobre "no hay precio". */
function estadoDe(m){
  const v = veredictoDe(m);
  /* El motivo NOMBRA el mercado, no repite lo que ya dice la barra
     dorada. El invariante es que la franja del día y la tarjeta de
     oportunidad apunten al mismo lado: si acá dice solo "el precio está
     a favor", hay que entrar al partido para saber a qué. Sale del mismo
     objeto que dibuja la tarjeta, así que no pueden separarse. */
  if(v.oportunidad) return {clase:"oportunidad", corto:["PRECIO","A FAVOR"],
    motivo: v.oportunidad.op ? v.oportunidad.op.label : "el precio está a favor"};
  const riesgo = v.filas.find(f=> f.riesgo);
  /* El motivo de la franja entra en una línea al lado del cruce: es una
     etiqueta, no una frase. El porqué largo está adentro del partido. */
  if(riesgo) return {clase:"riesgo", corto:["PRECIO","EN CONTRA"],
    motivo:"el precio está en contra"};
  /* Los tres motivos por los que un partido no tiene nada apostable son
     distintos y el renglón tiene que decir CUÁL: sin precio publicado,
     con precio pero sin lectura escrita (que es lo que habilita la
     marca), o con las dos cosas y la ventaja no alcanza. Ponerlos todos
     como "SIN PRECIO" era decir algo falso en la mayoría de los
     renglones. */
  if(!v.filas.some(f=> f.cuota != null)) return {clase:"", corto:["SIN","PRECIO"]};
  if(ligaSinValor(m)) return {clase:"", corto:["NO","OPINAMOS"]};
  if(sinMuestra(m)) return {clase:"", corto:["SIN","MUESTRA"]};
  if(!v.dir) return {clase:"", corto:["SIN","LECTURA"]};
  return {clase:"", corto:["SIN","VENTAJA"]};
}

function viewFecha(){
  const dias = diasDisponibles();
  if(!DIA || !dias.some(d=>d.iso===DIA)) DIA = dias.length ? dias[0].iso : null;
  const delDia = MATCHES.filter(m=>m.date===DIA);
  const d = DIA ? fechaDe(DIA) : new Date();
  const estados = new Map(delDia.map(m=> [m.id, estadoDe(m)]));
  const opor = delDia.filter(m=> estados.get(m.id).clase === "oportunidad");
  const riesgos = delDia.filter(m=> estados.get(m.id).clase === "riesgo");

  const n = delDia.length;
  let h = `<header class="masthead portada">
    ${marcaV("f")}
    <div class="nombre"><b>VALOR</b></div>
    <div class="bajada">${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]} ·
      ${n} ${n===1?"partido":"partidos"} ·
      ${opor.length} ${opor.length===1?"oportunidad":"oportunidades"}</div>
  </header>
  <div class="days">${dias.map(x=>`
    <button class="day ${x.iso===DIA?"on":""} ${x.n?"":"vacio"}" data-dia="${x.iso}">
      <b>${x.dia}</b><span>${x.nombre}</span>
    </button>`).join("")}</div>`;

  if(!delDia.length){
    return h + `<div class="aviso"><b>No hay partidos este día</b>Elegí otro en la barra de arriba.</div>`;
  }

  /* La franja del día. Cuenta oportunidades: si no hay ninguna, lo dice
     con todas las letras en vez de rellenar con los partidos más
     "interesantes", que es exactamente la promesa que el producto no
     puede hacer con un ROI de −3.27% ±6.19. */
  const destacados = opor.concat(riesgos).slice(0, 4);
  h += `<div class="vday"><div class="vh"><b>Veredicto del día</b>
      <em>${opor.length ? `${dd(opor.length)} DE ${dd(n)}` : "Sin oportunidades"}</em></div>
    ${destacados.length ? destacados.map(m=>{
      const e = estados.get(m.id);
      return `<button class="vr ${e.clase==="riesgo"?"riesgo":""}" data-partido="${esc_(m.id)}">
        <i class="bl"></i><span class="hr">${esc_(m.hora||"—")}</span>
        <span class="med"><span class="cr">${esc_(m.home)} — ${esc_(m.away)}</span>
          <span class="mo">${esc_(e.motivo || "")}</span></span>
        <span class="lg2">${esc_(COMPS_CORTO[m.comp]||m.comp)}</span></button>`;
    }).join("")
    : `<div class="vacio2">${n === 1
         ? "Miramos el único partido del día y no tiene el precio a favor."
         : `Miramos los ${n} partidos del día y ninguno tiene el precio a favor.`}
       Un día sin nada apostable es el estado más frecuente, no una falla.</div>`}</div>`;

  /* Acordeones por liga. Uno abierto por vez: un día con seis
     competiciones desplegadas son cuarenta renglones, que es justo lo
     que esta portada viene a evitar. */
  const grupos = {};
  delDia.forEach(m=> (grupos[m.comp] = grupos[m.comp]||[]).push(m));
  const comps = Object.keys(grupos)
    .sort((a,b)=> COMPS_ORDEN.indexOf(a) - COMPS_ORDEN.indexOf(b));
  if(!comps.some(c=> c === LIGA_ABIERTA)) LIGA_ABIERTA = comps[0];

  h += `<div class="sepsec"><span>Competiciones</span><i></i></div><div class="ligas">`;
  comps.forEach(comp=>{
    const ms = grupos[comp].slice().sort((a,b)=> (a.hora||"").localeCompare(b.hora||""));
    const abierta = comp === LIGA_ABIERTA;
    const horas = ms.map(m=> m.hora).filter(Boolean);
    const nOp = ms.filter(m=> estados.get(m.id).clase === "oportunidad").length;
    const nRi = ms.filter(m=> estados.get(m.id).clase === "riesgo").length;
    const sub = nOp ? `<b>${nOp} ${nOp===1?"oportunidad":"oportunidades"}</b>`
              : nRi ? `<b class="riesgo">${nRi} ${nRi===1?"riesgo":"riesgos"} no compensado${nRi===1?"":"s"}</b>`
              /* "1 mirado, ninguna" — ¿ninguna qué? La palabra
                 "oportunidad" no aparecia en ningun lado de la franja:
                 estaba en las otras dos ramas y en esta se elidia. */
              : `${ms.length} mirado${ms.length===1?"":"s"}, ninguna oportunidad`;
    h += `<button class="ligarow ${abierta?"on":""}" data-liga="${esc_(comp)}">
      <span class="mas">${abierta?"−":"+"}</span>
      <span class="ln"><b>${esc_(comp)}</b>
        <i>${horas.length ? `${horas[0] === horas[horas.length-1]
            ? esc_(horas[0]) : `${esc_(horas[0])} → ${esc_(horas[horas.length-1])}`} · ` : ""}${sub}</i></span>
      <span class="n">${dd(ms.length)}</span></button>`;
    if(!abierta) return;
    h += `<div class="plins">${ms.map((m, i)=> renglonPartido(m, estados.get(m.id), i)).join("")}</div>`;
  });
  h += `</div>`;

  h += `<div class="fin">Datos actualizados ${esc_((ACTUALIZADO||"").replace("T"," "))} ·
    <button data-nav="metodo">cómo se calcula</button></div>`;
  return h;
}

/* Un renglón de partido. Cuando hay oportunidad se abre al talón: el
   veredicto abreviado, con la entrada por la capa 01. El talón NO es un
   menú de destinos — Lectura y Datos quedan a un toque desde adentro. */
function renglonPartido(m, e, i){
  const delay = `animation-delay:${Math.min(i,7)*38}ms`;
  /* La forma va con `_general` y no con la del torneo: un equipo que en
     copa juega cada tres semanas mostraba una racha de meses atrás
     mientras el archivo ya traía la fresca. Es dato crudo, no lectura:
     ganó, empató o perdió. */
  const img = (logo, nombre) =>
    `<div>${crest(logo, 15)}<span>${esc_(nombre)}</span></div>`;

  if(e.clase !== "oportunidad")
    return `<button class="plin" data-partido="${esc_(m.id)}" style="${delay}">
      <span class="hr">${esc_(m.hora||"—")}</span>
      <span class="eqs">${img(m.homeLogo, m.home)}${img(m.awayLogo, m.away)}</span>
      <span class="sen">${tiraForma(m.formH_general, "mini")}${
        tiraForma(m.formA_general, "mini")}</span>
      <span class="est2">${esc_(e.corto[0])}<br>${esc_(e.corto[1])}</span></button>`;

  const v = veredictoDe(m);
  const f = v.oportunidad;
  const {n, total} = numeroDe(m);
  const st = stakePct(m, f.op.p, f.cuota);
  return `<button class="talonab" data-partido="${esc_(m.id)}" style="${delay}">
    <span class="izq"><span class="n2">Nº ${dd(n)}</span>
      <span class="h2">${esc_(m.hora||"—")}</span>
      <span class="d2">DE ${dd(total)}</span></span>
    <span class="der">
      <span class="eq2">${crest(m.homeLogo, 17)}<b>${esc_(m.home)}</b></span>
      <span class="eq2">${crest(m.awayLogo, 17)}<b>${esc_(m.away)}</b></span>
      <span class="rot3">Veredicto</span>
      <span class="tit3">${esc_(f.op.label)}</span>
      <span class="tes3">Le damos ${pc(f.op.p)}${f.ventaja!=null
        ? `, ${Math.round(f.ventaja*100)} puntos más que la línea sin margen` : ""}.</span>
      <span class="tcels">
        <span class="cuota"><small>MÍNIMA</small><b>${umbral(f.op.p).toFixed(2)}</b></span>
        <span><small>STAKE</small><b>${st||"—"}</b></span>
        <span class="muestra"><small>MERCADOS</small><b>1/${v.filas.length+1}</b></span>
      </span>
      <span class="ent"><span class="t3"><small>Entrás por</small><b>Veredicto</b></span>
        <span class="fl">›</span></span>
    </span></button>`;
}

/* Los últimos cinco, del más viejo al más nuevo — se lee como se lee
   una tabla, hacia la derecha llega el presente. */
function tiraForma(forma, tam){
  const cls = {W:"g", D:"e", L:"p"}, txt = {W:"G", D:"E", L:"P"};
  return `<div class="forma ${tam||""}">${(forma||[]).slice().reverse()
    .map(f=>`<i class="${cls[f.r]||"p"}">${txt[f.r]||"P"}</i>`).join("")}</div>`;
}

/* La serie partido a partido de un jugador. Misma direccion que la
   tira de forma: a la derecha llega el presente. Venia al reves
   —el partido mas nuevo a la izquierda— en las dos pantallas que la
   dibujan, y al lado de una tira que corre para el otro lado eso no se
   nota como un orden distinto, se lee mal y ya.

   Cuatro intensidades y el numero adentro. El 4 y el 9 se pintan igual
   y esta bien: la caja da el golpe de vista y el numero da el dato. La
   barra que habia en Datos se normalizaba contra el maximo DE ESE
   JUGADOR, asi que la barra mas alta de uno y la de otro no valian lo
   mismo y no habia forma de saberlo. */
function tiraSerie(valores){
  const s = (valores || []).slice().reverse();
  if(!s.length) return "";
  const tinta = v => { const n = Number(v)||0;
    return n <= 0 ? "f0" : n === 1 ? "f1" : n <= 3 ? "f2" : "f3"; };
  return `<div class="ser">${s.map(v=>
    `<span class="sq ${tinta(v)}">${Number(v)||0}</span>`).join("")}</div>`;
}

/* El marcador exacto más probable. Se muestra siempre con su
   probabilidad al lado, porque suelta miente: el más probable de un
   partido de fútbol ronda el 10-12%, o sea que casi nunca pasa. */
function marcadorTop(M){
  let best=[0,0], bp=-1;
  for(let i=0;i<6;i++) for(let j=0;j<6;j++) if(M[i][j]>bp){ bp=M[i][j]; best=[i,j]; }
  return best[0]+"-"+best[1];
}
function probMarcadorTop(M){
  let bp=-1;
  for(let i=0;i<6;i++) for(let j=0;j<6;j++) if(M[i][j]>bp) bp=M[i][j];
  return bp;
}

/* El antecedente directo, más el ritmo esperado si lo tenemos. Cuando
   no se cruzaron, se dice — no se rellena con una frase vacía. */
function antecedente(m){
  const h2h = m.h2h || [], u = h2h[0];
  const cruce = h2h.length
    ? `Se cruzaron ${h2h.length===1 ? "una sola vez" : h2h.length+" veces"} en el historial que tenemos; la última, ${esc_(u.h)} ${esc_(u.s)} ${esc_(u.a)} el ${esc_(u.d)}.`
    : "No se cruzaron en el historial que tenemos, así que no hay antecedente directo del que agarrarse.";
  const ritmo = (m.fouls!=null && m.cards!=null)
    ? ` Esperamos ${m.fouls.toFixed(0)} faltas y ${m.cards.toFixed(1).replace(".",",")} tarjetas.` : "";
  return cruce + ritmo;
}

/* El veredicto en dos palabras. Sale de las mismas cuatro ramas que la
   prosa de lectura(), no de un criterio propio: si tuviera el suyo, un
   día el sello diría FAVORITO y el renglón de abajo "partido parejo". */
/* El troquelado: la palabra CALADA en una barra entintada, no dibujada
   encima. La máscara perfora el rect y deja ver el fondo a través de
   las letras, más tres perforaciones por lado — el talón de un cupón.
   Es el recurso para titular secciones; el wordmark de la portada es
   la V (ver DESIGN.md § Marca). */
function troquel(texto, sfx, ancho=176){
  const id = "tq-"+sfx, mitad = ancho/2, der = ancho-6;
  const perf = x => [12,23,34].map(y=>`<circle cx="${x}" cy="${y}" r="1.7" fill="#000"/>`).join("");
  return `<svg viewBox="0 0 ${ancho} 50" class="troquel" aria-label="${esc_(texto)}">
    <defs><mask id="${id}">
      <rect x="0" y="0" width="${ancho}" height="46" fill="#fff"/>
      <text x="${mitad}" y="36" text-anchor="middle" font-family="Anton, Impact, sans-serif"
            font-size="34" letter-spacing="-1.5" fill="#000">${esc_(texto)}</text>
      ${perf(6)}${perf(der)}
    </mask></defs>
    <rect x="0" y="0" width="${ancho}" height="46" fill="#D8CDB4" mask="url(#${id})"/>
    <rect x="0" y="46" width="${ancho}" height="4" fill="#6B7A5E"/>
  </svg>`;
}

/* La marca. `id` único por instancia: si hay dos V en la misma
   pantalla con el mismo id de clip, la segunda hereda el recorte de la

function marcaV(sfx, alto=58){

/* ══════════════════════════════════════════════════════════════════
   PANTALLA: DETALLE DE PARTIDO
   ══════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════
   LAS TRES CAPAS DEL PARTIDO

   Antes eran siete pestañas: Análisis · Pronósticos · Estadísticas ·
   Historial · Posiciones · Plantel · Herramientas. Estaban cortadas por
   ORIGEN del dato —la skill, el motor, el caché de disciplina, ESPN— y
   ninguna correspondía a lo que el que mira está tratando de hacer. De
   ahí salían cuatro defectos concretos:

     · DOS lugares recomendaban (Pronósticos y Estadísticas), así que se
       superponían siempre: era un error de corte, no de criterio.
     · La afirmación y su evidencia vivían en pestañas distintas.
     · Historial, Posiciones y Plantel pesaban lo mismo que una
       recomendación, y eso aplanaba la jerarquía.
     · De los jugadores se veían los destacados; los 18 del plantel
       estaban en el dato y no en la pantalla.

   El corte nuevo es por intención y da tres:

     VEREDICTO  el único lugar del producto donde aparece una
                recomendación. Al haber uno solo, el solapamiento
                desaparece por construcción y no por disciplina.
     LECTURA    la narrativa con el número que la sostiene en el MISMO
                bloque que la frase.
     DATOS      exploración libre. Sin veredictos y sin dorado, nunca.

   Regla dura que cruza las tres: el dorado (--mostaza) vive solo en
   Veredicto. Si el mismo color dijera "acá el precio está a favor" y
   "este número es importante", dejaría de decir la primera — que es la
   única que cuesta plata.
   ══════════════════════════════════════════════════════════════════ */
const CAPAS = [["veredicto","Veredicto"], ["lectura","Lectura"], ["datos","Datos"]];
const EXPLORADORES = [["equipos","Equipos"], ["jugadores","Jugadores"], ["referencia","Referencia"]];
const dd = n => String(n).padStart(2, "0");
function fechaCorta(iso){
  const p = String(iso||"").slice(0,10).split("-");
  return p.length===3 && p[0].length===4 ? `${p[2]}/${p[1]}/${p[0].slice(2)}` : "—";
}

/* El número del partido dentro de su día, el mismo que numera la
   portada: "Nº 06" tiene que querer decir lo mismo en las dos
   pantallas, o no quiere decir nada. */
function numeroDe(m){
  const dia = MATCHES.filter(x=> x.date===m.date)
    .sort((a,b)=> (a.hora||"").localeCompare(b.hora||""));
  return {n: dia.findIndex(x=> x.id===m.id) + 1, total: dia.length};
}

function cabPartido(m){
  const {n, total} = numeroDe(m);
  return `<div class="cab"><button class="back" data-volver="1">←</button>
    <div class="id">
      <div class="cruce">${crest(m.homeLogo, 15)}<span>${esc_(m.home)}</span>
        <em>—</em>${crest(m.awayLogo, 15)}<span>${esc_(m.away)}</span></div>
      <div class="meta">${esc_(COMPS_CORTO[m.comp] || m.comp)} · Nº ${dd(n)} de ${dd(total)}${
        m.hora ? " · " + esc_(m.hora) : ""}</div>
    </div></div>`;
}

/* El conmutador persiste en las tres pantallas: es la misma pieza, no
   tres cabeceras parecidas. Datos cuelga su sub-conmutador abajo y le
   pasa el filete de salvia — los dos niveles son un solo bloque. */
function conmutador(){
  const capas = CAPAS.map(([k,l])=>
    `<button class="${CAPA===k?"on":""}" data-capa="${k}">${esc_(l)}</button>`).join("");
  if(CAPA !== "datos") return `<div class="capas">${capas}</div>`;
  return `<div class="capas pegada">${capas}</div>
    <div class="subcapas">${EXPLORADORES.map(([k,l])=>
      `<button class="${EXPL===k?"on":""}" data-expl="${k}">${esc_(l)}</button>`).join("")}</div>`;
}

const sello2 = (titulo, cuenta) =>
  `<div class="sello2"><b>${esc_(titulo)}</b><em>${esc_(cuenta)}</em></div>`;
const pieTalon = (izq, der) =>
